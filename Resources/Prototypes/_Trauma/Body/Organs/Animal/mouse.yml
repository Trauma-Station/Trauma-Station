- type: entity
  parent: [ OrganBaseChildInternal ]
  id: OrganMouseEggSack
  name: mouse egg sack
  description: This organ is what lets mice asexually reproduce. Its tissues seem... alien, could this really be from nature?
  components:
  - type: Sprite
    sprite: _White/Mobs/Species/Xenomorph/organs.rsi
    state: egg_sack
    scale: 0.25,0.25 # :)
  - type: Organ
    category: EggSack
  - type: ChildOrgan
    parents: [ Torso ]
  - type: OrganActions
    actions:
    - MouseMultiply
  - type: OrganComponents
    onAdd:
    - type: EntityProducerAction
      insufficientSatiationPopup: action-popup-lay-egg-too-hungry
      userPopup: action-popup-lay-egg-user
      othersPopup: action-popup-lay-egg-others
    - type: EntityProducer
      table:
        id: MobMouse
    - type: SatiationProduction
      delay: 60
      delayMax: 120
      satiationUsage: 20
      minimumSatiation: 60
      automaticForPlayers: false

- type: entity
  parent: OrganAnimalStomach
  id: OrganAnimalStomachFast
  components:
  - type: Metabolizer
    updateInterval: 0.1
