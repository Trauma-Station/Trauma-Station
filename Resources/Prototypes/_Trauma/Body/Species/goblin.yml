- type: entity
  parent: AppearanceHuman
  id: AppearanceGoblin
  name: goblin appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Trauma/Mobs/Species/Goblin/displacement.rsi
            state: jumpsuit-female
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Trauma/Mobs/Species/Goblin/displacement.rsi
            state: jumpsuit
      gloves:
        sizeMaps:
          32:
            sprite: _Trauma/Mobs/Species/Goblin/displacement.rsi
            state: hand
      belt:
        sizeMaps:
          32:
            sprite: _Trauma/Mobs/Species/Goblin/displacement.rsi
            state: belt
      shoes:
        sizeMaps:
          32:
            sprite: _Trauma/Mobs/Species/Goblin/displacement.rsi
            state: shoes
  - type: InitialBody
    organs:
      Torso: OrganGoblinTorso
      Head: OrganGoblinHead
      ArmLeft: OrganGoblinArmLeft
      ArmRight: OrganGoblinArmRight
      HandRight: OrganGoblinHandRight
      HandLeft: OrganGoblinHandLeft
      LegLeft: OrganGoblinLegLeft
      LegRight: OrganGoblinLegRight
      FootLeft: OrganGoblinFootLeft
      FootRight: OrganGoblinFootRight
      Brain: OrganGoblinBrain
      Eyes: OrganGoblinEyes
      Tongue: OrganGoblinTongue
      Appendix: OrganGoblinAppendix
      Ears: OrganGoblinEars
      Lungs: OrganGoblinLungs
      Heart: OrganDwarfHeart
      Stomach: OrganDwarfStomach
      Liver: OrganDwarfLiver
      Kidneys: OrganGoblinKidneys
  - type: HumanoidProfile
    species: Goblin

- type: entity
  parent:
  - AppearanceGoblin
  - MobHuman
  id: MobGoblin
  name: Urist McGoblin
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 120
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Vocal
    sounds:
      Male: UnisexDwarf
      Female: FemaleDwarf
      Unsexed: UnisexDwarf

- type: entity
  parent: OrganBaseFleshy
  id: OrganGoblin
  abstract: true
  suffix: Goblin

- type: entity
  id: OrganGoblinMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Human ]

- type: entity
  parent: OrganGoblin
  id: OrganGoblinInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi

- type: entity
  parent: OrganGoblin
  id: OrganGoblinExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Trauma/Mobs/Species/Goblin/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Trauma/Mobs/Species/Goblin/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Goblin

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganGoblinExternal ]
  id: OrganGoblinTorso

- type: entity
