# Misc

- type: entity
  categories: [ HideSpawnMenu ]
  parent: SpawnSupplyEmpty
  id: DropPodPlayer
  name: crew drop pod
  components:
  - type: ContainerContainer
    containers:
      contents: !type:Container
  - type: DropPod
    container: contents

# Cargo
- type: entity
  parent: SpawnPointJobBase
  id: SpawnPointCourier
  name: courier spawn point
  components:
  - type: SpawnPoint
    job_id: Courier
  - type: Sprite
    layers:
    - state: green
    - state: courier
      sprite: _Trauma/Markers/jobs.rsi

# Science

- type: entity
  parent: SpawnPointJobBase
  id: SpawnPointGeneticist
  name: geneticist spawn point
  components:
  - type: SpawnPoint
    job_id: Geneticist
  - type: Sprite
    layers:
    - state: green
    - state: geneticist

# Service

- type: entity
  parent: SpawnPointJobBase
