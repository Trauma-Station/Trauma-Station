# Organs Loot Tables

- type: entityTable
  id: RandomAbductorEyes
  table: !type:GroupSelector
    children:
    - !type:GroupSelector
      weight: 95
      children:
      - id: OrganArachnidEyes
      - id: OrganDionaEyes
      - id: OrganVoxEyes
      - id: OrganAbductorEyes
      - id: OrganPlasmamanEyes
    - !type:GroupSelector
      weight: 5
      children:
      - id: OrganXenomorphEyes
      - id: OrganLaserEyes

- type: entityTable
  id: RandomAbductorLungs
  table: !type:GroupSelector
    children:
    - !type:GroupSelector
      weight: 80
      children:
      - id: OrganVoxLungs
      - id: OrganBananaMenLungs
      - id: OrganSlimePersonLungs
      - id: OrganDecapoidLungs
      - id: OrganAbductorLungs
      - id: OrganHumanLungs
      - id: OrganPlasmamanLungs
    - !type:GroupSelector
      weight: 15
      children:
      - id: OrganCarpLungs
      - id: OrganCyberneticLungs
    - !type:GroupSelector
      weight: 5
      children:
      - id: OrganDragonLungs

- type: entityTable
  id: RandomAbductorStomachs
  table: !type:GroupSelector
    children:
