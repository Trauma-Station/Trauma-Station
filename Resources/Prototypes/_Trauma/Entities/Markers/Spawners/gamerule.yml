- type: entity
  abstract: true
  parent: MarkerBase
  id: BaseConditionalRandomHumanoidSpawner
  name: Centcomm Agent
  components:
  - type: Sprite
    layers:
    - state: blue
    - sprite: Mobs/Species/Human/parts.rsi
      state: full

# Leader if applicable
- type: entity
  parent: BaseConditionalRandomHumanoidSpawner
  id: ErtRandomHumanoidSpawner1
  components:
  - type: GameRuleSpawner
    fallback: SpawnERTLeaderEVA
    toSpawn:
      cburn: SpawnCBURNAgent
      hecu: SpawnHecuSoldier

# Medic spawns with ert security, otherwise use whatever else
- type: entity
