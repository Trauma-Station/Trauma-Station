- type: entity
  id: CigPackBaseSoft
  parent: [ BaseStorageItem, BaseBagOpenClose ]
  name: cigarette soft pack
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: closed
      map: ["closeLayer"]
    - state: open
      map: ["openLayer"]
      visible: false
    - state: cig1
      map: ["cig1"]
      sprite: _Trauma/Objects/Consumable/Smokeables/Cigarettes/Packs/softpack-visualizer.rsi
      visible: false
    - state: cig2
      map: ["cig2"]
      sprite: _Trauma/Objects/Consumable/Smokeables/Cigarettes/Packs/softpack-visualizer.rsi
      visible: false
  - type: Tag
    tags:
    - CigPack
    - Trash
  - type: PhysicalComposition
    materialComposition:
      Steel: 50
  - type: SpaceGarbage
  - type: Item
    size: Tiny
    shape:
    - 0,0,0,1
  - type: Storage
    grid:
    - 0,0,4,1
    whitelist:
      tags:
      - Cigarette
      - Lighter
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: Cigarette
        amount: 10
  - type: ItemCounter
    count:
      tags: [Cigarette]
    composite: true
    layerStates:
    - cig1
    - cig2
  - type: Appearance

- type: entity
  id: CigPackBotany
  parent: CigPackBase
  name: Hydroponic Herbals pack
  description: Nanotrasen decided to let Botany make their own signature blend cigarettes for export, and this is the result.
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Consumable/Smokeables/Cigarettes/Packs/botany.rsi
  - type: Item
    sprite: _Trauma/Objects/Consumable/Smokeables/Cigarettes/Packs/botany.rsi
