- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: BaseSyndicateBug
  name: syndicate bug
  description: A rather conspicious listening device used to spy on important people.
  abstract: true
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _Trauma/Objects/Syndicate/syndicate_bug.rsi
    layers:
    - state: icon
  - type: Anchorable
    delay: 5
  - type: Bug

- type: entity
  parent: BaseSyndicateBug
  id: SyndicateBugCmo
  components:
  - type: Bug
    targetArea: AreaOfficeCmo

- type: entity
  parent: BaseSyndicateBug
  id: SyndicateBugCE
  components:
  - type: Bug
    targetArea: AreaOfficeCE

- type: entity
  parent: BaseSyndicateBug
  id: SyndicateBugHop
  components:
  - type: Bug
    targetArea: AreaOfficeHop

- type: entity
  parent: BaseSyndicateBug
  id: SyndicateBugHos
