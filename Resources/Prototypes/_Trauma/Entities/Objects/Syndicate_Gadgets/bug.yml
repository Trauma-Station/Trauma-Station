  - type: Bug
    targetArea: AreaOfficeHos

- type: entity
  parent: BaseSyndicateBug
  id: SyndicateBugRd
  components:
  - type: Bug
    targetArea: AreaOfficeRd

- type: entity
  parent: BaseSyndicateBug
  id: SyndicateBugQm
  components:
  - type: Bug
    targetArea: AreaOfficeQm

- type: entity
  parent: [ BaseSyndicateContraband, BoxCardboard ]
  id: BaseSyndicateBugBox
  name: syndicate bug kit
  description: A kit containing a bug and a wrench for your spying purposes. Use the wrench to install the bug.
  components:
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,2,1
  - type: Sprite
    layers:
    - state: box_of_doom

- type: entity
  parent: BaseSyndicateBugBox
  id: SyndicateBugBoxCmo
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: SyndicateBugCmo
        - id: Wrench

