- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: BaseSyndicateScanalyzer
  name: syndicate scanalyzer
  description: A fiendish device that reverse engineers the schematics for cutting edge technology.
  abstract: true
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Syndicate/syndicate_scanalyzer.rsi
    layers:
    - state: icon
  - type: Scanalyzer
    scanDuration: 15 #15 seconds

- type: entity
  parent: BaseSyndicateScanalyzer
  id: SyndicateScanalyzerCMOHypospray
  components:
  - type: Scanalyzer
    stealTarget: Hypospray

- type: entity
  parent: BaseSyndicateScanalyzer
  id: SyndicateScanalyzerRDHardsuit
  components:
  - type: Scanalyzer
    stealTarget: ClothingOuterHardsuitRd

- type: entity
  parent: BaseSyndicateScanalyzer
  id: SyndicateScanalyzerHandTeleporter
  components:
  - type: Scanalyzer
    stealTarget: HandTeleporter

- type: entity
  parent: BaseSyndicateScanalyzer
  id: SyndicateScanalyzerMagboots
  components:
  - type: Scanalyzer
    stealTarget: ClothingShoesBootsMagAdv

- type: entity
  parent: BaseSyndicateScanalyzer
  id: SyndicateScanalyzerClipboard
  components:
  - type: Scanalyzer
    stealTarget: BoxFolderQmClipboard

- type: entity
  parent: BaseSyndicateScanalyzer
  id: SyndicateScanalyzerCaptainJetpack
  components:
  - type: Scanalyzer
    stealTarget: JetpackCaptainFilled

- type: entity
  parent: BaseSyndicateScanalyzer
  id: SyndicateScanalyzerCaptainGun
  components:
  - type: Scanalyzer
    stealTarget: WeaponAntiqueLaser

- type: entity
  parent: BaseSyndicateScanalyzer
  id: SyndicateBroadcastDevice
  name: syndicate broadcast device
  description: A device capable of speaking through communications computer. Who will listen?
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Syndicate/syndicate_broadcast_device.rsi
    state: icon
  - type: Scanalyzer
    stealTarget: CommsComputer
  - type: ScanalyzerRequiresPower
  - type: TriggerOnScan
  - type: AddGameRuleOnTrigger
    gameRule: SyndicateBattlecruiserRule
