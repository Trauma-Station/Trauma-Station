- type: entity
  parent: BaseScrewdriver
  id: Screwdriver
  components:
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        screwdriver: Rainbow
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  parent: RCD
  id: RPD
  name: RPD
  description: The rapid piping device allows for the quick placement and removal of atmospheric-related buildings requires compressive matter to use.
  components:
  - type: RCD
    isRpd: true
    availablePrototypes:
    - PipeFourway
    - PipeStraight
    - PipeBend
    - PipeTJunction
    - OutletInjector
    - ManualValve
    - VolumetricPump
    - PressurePump
    - VentScrubber
    - PressureValve
    - DualPortVent
    - VentGas
    - VentPassive
    - MixerGas
    - Radiator
    - RadiatorBend
    - SignalValve
    - CanisterPort
    - FilterGas
    - FilterInline
    - RadiatorInline
    - RadiatorInlineBend
    - Deconstruct
  - type: LimitedCharges
    maxCharges: 90
  - type: Sprite
    sprite: Objects/Tools/rpd.rsi
  - type: Tag
    tags:
    - !Remove RCD # prevent revs trolling
    - DroneUsable
