  id: GeneticsConsoleCircuitboard
  name: genetics computer board
  description: A computer printed circuit board for a genetics console.
  components:
  - type: Sprite
    state: cpu_medical
  - type: ComputerBoard
    prototype: ComputerGeneticsConsoleEmpty # no farming biomass chud

- type: entity
  parent: BaseComputerCircuitboard
