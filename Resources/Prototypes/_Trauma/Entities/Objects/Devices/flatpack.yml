- type: entity
  parent: BaseFlatpack
  id: RotaryPhoneFlatPack
  name: phone flatpack
  description: A flatpack used for constructing a Rotary Phone.
  components:
  - type: Flatpack
    entity: RotaryPhoneStandNoRot
  - type: Item
    size: Normal

- type: entity
  parent: BaseFlatpack
  id: PrintingPressFlatpack
  name: printing press flatpack
  description: A flatpack used for constructing a printing press.
  components:
  - type: Flatpack
    entity: CrewPrintingPress

- type: entity
  parent: [ BaseFlatpack, BaseXenoborgContraband ]
  id: XenoborgChargerFlatpack
  name: xenoborg charger flatpack
  description: A flatpack used for constructing a xenoborg charger.
  components:
  - type: Sprite
    layers:
    - state: base-xenoborg
    - state: overlay
      color: "#452dfa"
    - state: icon-xenoborg-extractor
  - type: Item
    size: Normal
  - type: Flatpack
    entity: BorgChargerXenoborg
  - type: GuideHelp
    guides:
    - Xenoborgs
