- type: entity
  parent: BaseItem
  id: SpeechPro
  name: Speech Pro
  description: A handheld speech assistance device which broadcasts simple messages for easy communication.
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Devices/speech_pro.rsi
    layers:
    - state: closed
      map: [ "enum.ItemToggleVisuals.Layer" ]
  - type: Item
    sprite: _Trauma/Objects/Devices/speech_pro.rsi
    size: Small
    heldPrefix: closed
  - type: Appearance
  - type: ItemToggleVisuals
    heldPrefixOn: open
    heldPrefixOff: closed
  - type: GenericVisualizer
    visuals:
      enum.ItemToggleVisuals.State:
        enum.ItemToggleVisuals.Layer:
          True: { state: icon }
          False: { state: closed }
  - type: ItemToggle
    onUse: false
    verbToggleOn: speech-pro-verb-open
    verbToggleOff: speech-pro-verb-close
    soundDeactivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.125
  - type: ActivatableUI
    key: enum.SpeechProUiKey.Key
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.SpeechProUiKey.Key:
        type: SpeechProBoundUserInterface
  - type: SpeechPro
