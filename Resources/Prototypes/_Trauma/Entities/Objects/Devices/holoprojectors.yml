- type: entity
  parent: [ Holoprojector, BaseMedicalContraband ]
  id: HoloprojectorMedical
  name: holobarrier projector
  description: Creates a solid but fragile holographic barrier.
  components:
  - type: HolosignProjector
    signProto: HolosignMedical
    chargeUse: 90
  - type: Sprite
    sprite: _Trauma/Objects/Devices/Holoprojector/medical.rsi
    state: icon
  - type: StaticPrice
    price: 50

- type: entity
  parent: HoloprojectorSecurity
  id: HoloprojectorSecurityBorg
  suffix: borg
  name: holobarrier projector
  description: A modified holographic barrier projector for use in security cyborgs. Automatically self-charges.
  components:
  - type: Sprite
    sprite: Objects/Devices/Holoprojectors/security.rsi
    state: icon
  - type: HolosignProjector
    chargeUse: 180
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
        disableEject: true
        swap: false
