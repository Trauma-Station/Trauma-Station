- type: entity
  parent: [ Handcuffs, BaseMinorContraband ]
  id: BarbHandcuffs # TODO: Needs to damage on remove attempt
  name: barbed wire handcuffs
  description: Used to detain people you intend to kill.
  components:
  - type: Handcuff
    cuffedRSI: _Trauma/Objects/Misc/cuffs_barbwire.rsi
    bodyIconState: body-overlay
  - type: Sprite
    sprite: _Trauma/Objects/Misc/cuffs_barbwire.rsi
    state: icon
  - type: UseDelay
    delay: 3
  - type: Construction
    graph: BarbCuffs
    node: finish

- type: entity
  name: printed wondercuffs
  description: Made out of a metal more durable than anything Nanotrasen could dream of. Dissolves when removed.
  id: WonderprodCuffs
  parent: [ BaseMajorContraband, Handcuffs ]
  components:
  - type: Handcuff
    cuffTime: 1.5
    uncuffTime: 4.5
    breakoutTime: 30
    stunBonus: 1.0
    cuffedRSI: _Shitmed/Objects/Misc/handcuffs.rsi
    bodyIconState: body-overlay
    breakOnRemove: true
    brokenPrototype: Ash
  - type: Sprite
    sprite: _Shitmed/Objects/Misc/handcuffs.rsi
    state: handcuff
  - type: GuideHelp
    guides:
    - Abductors
  - type: UseDelay
    delay: 1.5
