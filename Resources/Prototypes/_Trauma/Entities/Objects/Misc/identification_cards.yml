- type: entity
  parent: IDCardStandard
  id: GeneticistIDCard
  name: geneticist ID card
  components:
  - type: Sprite
    layers:
    - state: default
    - state: idgeneticist
  - type: PresetIdCard
    job: Geneticist

- type: entity
  parent: IDCardStandard
  id: PhoneMerchantIDCard
  name: phone merchant ID card
  components:
  - type: Sprite
    layers:
    - state: default
    - state: idphonemerchant
      sprite: _Trauma/Objects/Misc/id_cards.rsi
  - type: PresetIdCard
    job: PhoneMerchant

- type: entity
  parent: IDCardStandard
  id: DClassIDCard
  name: d-class ID card
  description: A Cheaply printed ID card for the lowest of low.
  components:
  - type: Sprite
    layers:
    - state: orange
  - type: Item
    heldPrefix: orange
  - type: Access
  - type: IdCard
    jobTitle: job-name-d-class
    jobIcon: JobIconDClass
    canMicrowave: false
  - type: Tag
    tags:
    - DoorBumpOpener
    - WhitelistChameleon
    - WhitelistChameleonIdCard
    - Recyclable
  - type: StaticPrice # MassProduced NT Slop
    price: 0
  - type: AntagCard # D-class? Outside? Can't be.

- type: entity
  parent: AgentIDCard
  id: SpacePolIDCardChameleon
  name: SpacePol ID card
  suffix: Agent
  components:
  - type: IdCard
    jobTitle: job-name-spacepol
    jobIcon: JobIconSpacePol
  - type: Access
    tags:
    - Maintenance
    - SyndicateAgent
    - External
  - type: AntagCard

- type: entity
  parent: IDCardStandard
  id: RancherIDCard
  name: rancher ID card
  components:
  - type: Sprite
    layers:
    - state: default
    - state: idrancher
      sprite: _Trauma/Objects/Misc/id_cards.rsi
  - type: PresetIdCard
    job: Rancher

- type: entity # TODO: more actions?
  parent: [ IDCardStandard, BaseMajorContraband ]
  id: DemonologistIDCard
  name: demonologist ID card
  suffix: Agent
  description: It's pulsating... Is it alive?
  components:
  - type: Sprite
    layers:
    - state: default
    - state: iddemonologist
      sprite: _Trauma/Objects/Misc/id_cards.rsi
  - type: IdCard
    jobTitle: job-name-demonologist
    jobIcon: JobIconDemonologist
  - type: Access
    tags:
    - Maintenance
    - Demonologist
    - External
  - type: AntagCard
  - type: AgentIDCard
  - type: NanoChatCard
    listNumber: false
  - type: TypingIndicator
    proto: guardian
  - type: Speech
    speechVerb: SlaughterDemon
    speechSounds: ShadowDemon
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Eldritch
    understands:
    - TauCetiBasic
    - Eldritch
  - type: GhostRole
    name: ghost-role-information-demonologist-id-card-name
    description: ghost-role-information-demonologist-id-card-description
    rules: ghost-role-information-familiar-rules
    mindRoles:
    - MindRoleGhostRoleFamiliar
  - type: GhostTakeoverAvailable
  - type: CollectiveMind
    defaultChannel: Demonmind
    channels:
    - Demonmind
  - type: ActionGrant
    actions:
    - ActionKnock
    - ActionCursedAccess
