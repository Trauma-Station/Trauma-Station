- type: entity
  parent: [ ProjectileGrenadeBase, BaseRevMajorContraband, TimerGrenadeBase ]
  id: GrenadeShrapnelRev
  name: improvised shrapnel bomb
  description: Releases a deadly spray of shrapnel that causes severe bleeding.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Bombs/ied.rsi
    layers:
    - state: base
      map: ["enum.TriggerVisualLayers.Base"]
    - state: fuel
    - state: wires
  - type: ProjectileGrenade
    fillPrototype: PelletClusterLethalWeak
    capacity: 30
  - type: TimerTrigger
    delay: 5
    examinable: false
    initialBeepDelay: 0
    beepSound:
      path: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
      params:
        volume: 1
  - type: Item
    sprite: Objects/Weapons/Bombs/ied.rsi
  - type: EmitSoundOnTrigger
    sound:
      path: "/Audio/Weapons/Guns/Gunshots/batrifle.ogg"
  - type: StaticPrice
    price: 1500
  - type: Appearance
  - type: AnimationPlayer
  - type: TimerTriggerVisuals
    unprimedSprite: base
  - type: Construction
    deconstructionTarget: null
    graph: RevIED
    node: IED

- type: entity
  name: combustible lemon # YES I KNOW ITS NOT A PROJECTILE GRENADE LET ME KEEP IT HERE
  description: When life gives you lemons, burn life's house down. With the lemons.
  parent: [VolatileGrenadeBase, TimerGrenadeBase, BaseMinorContraband]
  id: LemonGrenade
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Grenades/combustiblelemon.rsi
    state: icon
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Explosive
    explosionType: Default
    maxIntensity: 5 # Just enough to chain.
    intensitySlope: 3
    totalIntensity: 5 # Not primarily explosive.
    canCreateVacuum: false
  - type: SpawnOnTrigger
    keysIn:
    - timer
    proto: MolotovFire
  - type: TimerTrigger
    beepSound:
      path: "/Audio/Effects/beep1.ogg"
      params:
        volume: 5
    initialBeepDelay: 0
    beepInterval: 2
  - type: Construction
    graph: LemonGrenadeGraph
    node: start
    deconstructionTarget: null
  - type: Produce # Technically
