- type: entity
  id: StunbatonBorg
  parent: Stunbaton
  name: borg stun baton
  components:
  - type: Battery
    maxCharge: 150
    startingCharge: 150
  - type: BatterySelfRecharger
    autoRechargeRate: 10

- type: entity
  id: FlashBorg
  parent: BaseItem
  name: borg flash
  description: An ultrabright flashbulb with a trigger, which causes the victim to be dazed and lose their eyesight for a moment. Useless when burnt out.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/flash.rsi
    layers:
    - state: flash
      map: [ "enum.FlashVisualLayers.BaseLayer" ]
    - state: flashing
      map: [ "enum.FlashVisualLayers.LightLayer" ]
      visible: false
      shader: unshaded
  - type: Flash
    flashingTime: 12
  - type: MeleeWeapon
    wideAnimationRotation: 180
    damage:
      types:
        Blunt: 0
    angle: 10
  - type: Item
    size: Small
    sprite: Objects/Weapons/Melee/flash.rsi
  - type: UseDelay
    delay: 12
  - type: UseDelayOnMeleeHit
  - type: StaticPrice
    price: 40
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.FlashVisuals.Burnt:
        enum.FlashVisualLayers.BaseLayer:
          True: {state: burnt}
      enum.FlashVisuals.Flashing:
        enum.FlashVisualLayers.LightLayer:
          True: {visible: true}
          False: {visible: false}
  - type: GuideHelp
    guides:
    - Security
  - type: Tag
    tags:
    - Flash
