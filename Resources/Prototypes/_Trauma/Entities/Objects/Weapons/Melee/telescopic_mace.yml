- type: entity
  id: TelescopicMace
  parent: [BaseItem, BaseMedicalContraband]
  name: Telescopic Mace
  description: A compact personal defense weapon. Perfect for fending off people who want to interrupt your rescue attempts or get in your way.
  components:
    - type: WeaponClass
      class: NonLethal
    - type: Sprite
      sprite: _Trauma/Objects/Weapons/Melee/paramed_telebaton.rsi
      layers:
        - state: icon-off
          map: ["enum.ItemToggleVisuals.Layer"]
    - type: Item
      sprite: _Trauma/Objects/Weapons/Melee/paramed_telebaton.rsi
      size: Small
      storedRotation: -45 # Goobstation
    - type: ItemToggle
      soundActivate:
        path: /Audio/Weapons/telescopicon.ogg
        params:
          volume: -2
      soundDeactivate:
        path: /Audio/Weapons/telescopicoff.ogg
        params:
          volume: -2
    - type: ComponentToggler # Goobstation
      components:
        - type: DisarmMalus
          malus: 0.6
    - type: ItemToggleMeleeWeapon
      activatedSoundOnHit:
        collection: MetalThud
        params:
          variation: 0.250
      activatedDamage:
        types:
          Blunt: 8
        woundSeverityMultipliers: #Goob
          Blunt: 0.5 # Im tired of this shit breaking bones, its meant to be nonlethal
    - type: ItemToggleSize
      activatedSize: Normal
      activatedShape: # Goobstation
        - 0,0,0,3
    - type: UseDelay
      # Goob edit start
      delays:
        default:
          length: 1
        telebaton:
          length: 4
      # Goob edit end
    - type: MeleeThrowOnHit
      distance: 1
      speed: 5
    - type: MeleeWeapon
      wideAnimationRotation: -135
      bluntStaminaDamageFactor: 0.5
      angle: 0 # Goob edit
      damage:
        types:
          Blunt: 1
    - type: Appearance
    - type: ItemToggleVisuals # Goobstation
    - type: GenericVisualizer
      visuals:
        enum.ItemToggleVisuals.State:
          enum.ItemToggleVisuals.Layer:
            True: { state: icon }
            False: { state: icon-off }
    - type: Clothing # Goobstation
      sprite: _Trauma/Objects/Weapons/Melee/paramed_telebaton.rsi
      slots:
        - Belt
    - type: UseDelayBlockMelee # Goobstation
      delays:
        - default
        - telebaton
