- type: entity
  name: nail board
  parent: [BaseItem, BaseMinorContraband, WoodDurability]
  id: NailBoardWeapon
  description: A nasty weapon that also works as a trap.
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Melee/nailboard.rsi
    state: icon
  - type: MeleeWeapon
    animationRotation: -135 # WWDP
    heavyStaminaCost: 15 # goob edit
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 10
        Piercing: 3
    soundHit:
      collection: MetalThud
  - type: Item
    size: Large
    shape:
    - 0,0,0,3
  # - type: Construction
  #   graph: WoodenBat
  #   node: bat
  - type: PhysicalComposition
    materialComposition:
      Wood: 250
      Steel: 50
  - type: Tag
    tags:
    - BaseballBat
    - Recyclable
  - type: UndetectableContraband
  - type: SpawnAfterInteract
    prototype: NailBoardTrap
    doAfter: 0.5
    removeOnInteract: true

- type: entity
  parent: [ BaseItem, BaseRevMinorContraband ]
  name: nail board
  id: NailBoardTrap
  description: A nasty trap, probbaly gonna give your foot an infection.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Melee/nailboard.rsi
    state: floor
  - type: Transform
    anchored: true
  - type: Anchorable
    flags:
    - Anchorable
  - type: CollisionWake
    enabled: false
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        layer:
        - LowImpassable
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 30
        mask:
        - ItemMask
  - type: StepTrigger
    intersectRatio: 0.2
  - type: Slippery
    slipSound:
      path: /Audio/Weapons/bladeslice.ogg
    slipData:
      launchForwardsMultiplier: 0
  - type: TriggerOnStepTrigger
  - type: DamageUserOnTrigger
    damage:
      types:
        Piercing: 15
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 1
            max: 1
          Nail:
            min: 1
            max: 5
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  name: bomb spear
  parent: [BaseItem, BaseMinorContraband, SpearDurabilityWeak, TimerGrenadeBase]
  id: SpearPipebomb
  description: Risky, but deadly.
  components:
  - type: ThrowableBlocked
  - type: UndetectableContraband
  - type: CosmicTransmutable
    transmuteTo: SpearCosmicCult
  - type: DamageOnHit
    damage:
      types:
        Blunt: 1
  - type: EmbeddableProjectile
    offset: -0.15,0.0
  - type: ThrowingAngle
    angle: 225
  - type: LandAtCursor
  - type: Tag
    tags:
    - Spear
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
            - -0.08,-0.06 # Goob edit
            - -0.06,-0.08 # Goob edit
            - 0.40,0.30
            - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sharp
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Melee/spear_pipebomb.rsi
    layers:
    - state: icon
  - type: MeleeWeapon
    canWideSwing: false
    range: 2.2
    attackRate: 0.6
    animationRotation: -135
    wideAnimationRotation: -135
    damage:
      types:
        Piercing: 10 # Trauma - was 12
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 15
  - type: Item
    size: Large
    shape:
    - 0,0,8,0
    storedRotation: 45
  # - type: Construction
  #   graph: Spear
  #   node: spear
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnLand
    damage:
      types:
        Blunt: 4
  - type: UseDelay
  - type: Appearance
  - type: TriggerOnActivate
  - type: TimerTrigger
    delay: 5
    examinable: false
    initialBeepDelay: 0
    beepSound: /Audio/Effects/lightburn.ogg
  - type: RandomTimerTrigger
    min: 1
    max: 5
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Explosive
    explosionType: Default
    totalIntensity: 50
    intensitySlope: 5
    maxIntensity: 6
    canCreateVacuum: false
  - type: Appearance
  - type: TimerTriggerVisuals

- type: entity
  name: bomb spear
  parent: SpearPipebomb
  id: SpearIED
  description: Risky, but deadly.
  components:
