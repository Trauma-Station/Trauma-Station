- type: entity
  parent: [ BaseMajorContraband, BaseGunWieldable, BaseWeaponRifle ]
  id: MakeshiftAK
  name: makeshift assault rifle
  description: A makeshift assault rifle based on the iconic AK design, it lacks select-fire capabilities. Feeds from 7.62x39mm makeshift magazines.
  components:
  - type: Gun
    fireRate: 4
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_Trauma/Weapons/Guns/Gunshots/battle_rifle.ogg
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Guns/Makeshift/makeshift-assault-rifle.rsi
  - type: Clothing
    sprite: _Trauma/Objects/Weapons/Guns/Makeshift/makeshift-assault-rifle.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
       name: Magazine
       startingItem: null
       insertSound: /Audio/Weapons/Guns/MagIn/sfrifle_magin.ogg
       ejectSound: /Audio/Weapons/Guns/MagOut/sfrifle_magout.ogg
       priority: 2
       whitelist:
        tags:
        - MagazineAKMakeshift
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
       name: Chamber
       priority: 1
       whitelist:
        tags:
        - Cartridge739Makeshift
       proto: null
  - type: ContainerContainer
    containers:
     gun_magazine: !type:ContainerSlot
     gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

