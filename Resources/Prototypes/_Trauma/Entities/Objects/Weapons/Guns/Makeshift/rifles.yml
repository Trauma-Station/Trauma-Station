- type: entity
  parent: [ BaseWeaponSniper, BaseGunWieldable, BaseMajorContraband ]
  id: MakeshiftBoltActionRifle
  name: makeshift bolt-action rifle
  description: A makeshift bolt-action rifle cobbled together from bits of wood and an atmospheric pipe. Feeds from 7.62x51mm cartridges.
  components:
  - type: Item
    size: Large
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Guns/Makeshift/makeshift-bolt-action-rifle.rsi
  - type: Clothing
    sprite: _Trauma/Objects/Weapons/Guns/Makeshift/makeshift-bolt-action-rifle.rsi
  - type: BallisticAmmoProvider
    autoCycle: false
    capacity: 5
    proto: null
    whitelist:
      tags:
      - Cartridge751Makeshift
  - type: GunRequiresWield
  - type: Appearance
