- type: entity
  id: MakeshiftRevolver
  parent: [ BaseWeaponRevolver, BaseMajorContraband ]
  name: Handmade revolver
  description: An underpowered revolver cobbled together from pieces of scrap metal that have been ziptied and glued together. It boasts an 8 round cylinder and is chambered in .22 Magnum, at least it won't jam.
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Guns/Makeshift/revolver.rsi
  - type: RevolverAmmoProvider
    whitelist:
      tags:
        - Cartridge22MagnumMakeshift
    proto: null
    capacity: 8
    chambers: [ True, True, True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null, null, null ]
  - type: Gun
    fireRate: 2.6
    soundGunshot:
      path: /Audio/_Trauma/Weapons/Guns/Gunshots/revolver_bang.ogg

- type: entity
  parent: [ BaseWeaponShotgun, BaseMajorContraband ]
  id: MakeshiftEOKAPistol
  name: Decroded pistol
  description: An extremely decroded handcannon made from an atmospheric pipe ziptied to a crude wooden handle, it has been fitted for 12 gauge shells, extremely unreliable.
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Guns/Makeshift/eoka_pistol.rsi
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
    storedOffset: 0,-5
  - type: Gun # TODO: if possible make gun firetime from trigger pull random, like pipe bomb fuse time. Should use a lit match to fire, rather than a traditional press Z to pull trigger.
    fireRate: 1
  - type: BallisticAmmoProvider
    capacity: 1
    proto: null
  - type: GunSpreadModifier
    spread: 2.4
