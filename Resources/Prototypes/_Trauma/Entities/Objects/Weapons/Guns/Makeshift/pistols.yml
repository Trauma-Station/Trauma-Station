- type: entity
  id: MakeshiftRevolver
  parent: [ BaseWeaponRevolver, BaseMajorContraband ]
  name: Handmade revolver
  description: An underpowered revolver cobbled together from pieces of scrap metal, tied together with cables. At the very least it won't jam up on you.
  components:
  - type: Sprite
    sprite: Textures/_Trauma/Objects/Weapons/Guns/Makeshift/revolver.rsi
  - type: RevolverAmmoProvider
    whitelist:
      tags:
        - Cartridge22MagnumMakeshift
    proto: Cartridge22MagnumMakeshift
    capacity: 8
    chambers: [ True, True, True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null, null, null ]
  - type: Gun
    fireRate: 2
    soundGunshot:
      path: /Audio/_Trauma/Weapons/Guns/Gunshots/revolver_bang.ogg

- type: entity
  parent: [ BaseWeaponRevolver, BaseMajorContraband ]
  id: MakeshiftEOKAPistol
  name: Decroded pistol
  description: An extremely decroded handcannon made from an atmospheric pipe tied with electrical cables to a crude wooden handle. Definitely unreliable.
  components:
  - type: Sprite
    sprite: Textures/_Trauma/Objects/Weapons/Guns/Makeshift/revolver.rsi
  - type: RevolverAmmoProvider
    whitelist:
      tags:
        - Cartridge22MagnumMakeshift
    proto: Cartridge22MagnumMakeshift
    capacity: 8
    chambers: [ True, True, True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null, null, null ]
  - type: Gun
    fireRate: 2
    soundGunshot:
      path: /Audio/_Trauma/Weapons/Guns/Gunshots/revolver_bang.ogg
