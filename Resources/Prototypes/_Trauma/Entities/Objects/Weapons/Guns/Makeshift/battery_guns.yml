- type: entity
  id: MakeshiftLaserPistolLethal
  parent: [ BaseWeaponBatterySmall, BaseMajorContraband ]
  name: prototype laser pistol
  description: A prototype pistol that has been assembled from welded plasteel and phoron. Although powerful it is unreliable and overheats easily, this one has been configured to fire lethal shots.
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Guns/Makeshift/makeshift-laser-pistol.rsi
  - type: Item
    sprite: _Trauma/Objects/Weapons/Guns/Makeshift/makeshift-laser-pistol.rsi
  - type: Battery
    maxCharge: 750
    startingCharge: 750
  - type: BatteryAmmoProvider
    proto: BulletMakeshiftLaser
    fireCost: 62.5
  - type: Gun
    fireRate: 2
    soundGunshot:
      path: /Audio/_Trauma/Weapons/Guns/Gunshots/laser2.ogg

- type: entity
  id: MakeshiftLaserPistolDisabler
  parent: [ BaseWeaponBatterySmall, BaseMajorContraband ]
  name: prototype laser pistol
  description: A prototype pistol that has been assembled from welded plasteel and phoron, this one has been configured to fire disabler bolts. It lacks the correct fittings and power to shoot proper disabler bolts resulting in weaker shots and less internal battery capacity.
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Guns/Makeshift/makeshift-laser-pistol.rsi
  - type: Item
    sprite: _Trauma/Objects/Weapons/Guns/Makeshift/makeshift-laser-pistol.rsi
  - type: Battery
    maxCharge: 750
    startingCharge: 750
  - type: BatteryAmmoProvider
    proto: BulletMakeshiftDisabler
    fireCost: 62.5
  - type: PacifismAllowedGun
  - type: KnowledgeGrantOnWear
    blocked:
      MartialArtCorporateJudo: true
  - type: Gun
    fireRate: 2
    soundGunshot:
      path: /Audio/_Trauma/Weapons/Guns/Gunshots/laser2.ogg
