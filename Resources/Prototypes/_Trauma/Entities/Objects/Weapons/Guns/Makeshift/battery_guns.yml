- type: entity
  id: MakeshiftLaserPistolLethal
  parent: [ BaseWeaponBatterySmall, BaseMajorContraband ]
  name: prototype laser pistol
  description: A prototype pistol that has been assembled from welded plasteel and phoron. Although powerful it is unreliable and overheats easily, this one has been configured to fire lethal shots.
  components:
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    fireRate: 2 # TODO: add an overheating system for this gun, similar to jamming for ballistics; rather than racking a ballistic gun to clear the jam you have to wait for the gun to cool down.
    soundGunshot:
      path: /Audio/_Trauma/Weapons/Guns/Gunshots/laser2.ogg
  - type: Appearance
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Guns/Makeshift/makeshift-laser-pistol.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Item
  - type: BatteryAmmoProvider
    proto: BulletMakeshiftLaser
    fireCost: 62.5
  - type: Tag
    tags:
    - Sidearm
  - type: Battery
    maxCharge: 600
    startingCharge: 600
