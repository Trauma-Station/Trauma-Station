- type: entity
  id: WeaponRocketLauncherXenoborgStructural
  name: XOR-3 Missile Rack
  description: Launches structural breaching missiles designed to explode only when striking a sturdy target, and unefficent against organic targets. Intended to be mounted on a Xenoborg.
  parent: [ BaseWeaponBattery, BaseMajorContraband ]
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Guns/Launchers/xenoborg_aprocket_launcher.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-2
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Gun
    minAngle: 0
    maxAngle: 0
    fireRate: 0.2
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rpgfire.ogg
  - type: Appearance
  - type: BatteryAmmoProvider
    proto: BulletRocketAntiStructural
    fireCost: 100
  - type: BatterySelfRecharger
    autoRechargeRate: 5
  - type: Battery
    maxCharge: 200
    startingCharge: 200
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: true
