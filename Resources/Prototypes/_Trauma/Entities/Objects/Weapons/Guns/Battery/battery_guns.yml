- type: entity
  name: phaser
  parent: [ BaseWeaponBatterySmall, BaseSecurityContraband ]
  id: WeaponLaserSidearm
  description: A trusty sidearm used by most space cops. Can be set to disable for wrangling criminals, and lethal for when the going gets tough.
  components:
  - type: Appearance
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/disabler.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-unshaded-4
        map: ["enum.GunVisualLayers.MagUnshaded"]
        shader: unshaded
  - type: Item
    storedOffset: -1,-5
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/disabler.rsi
    quickEquip: false
    slots:
      - suitStorage
      - Belt
  - type: AmmoSelectorMagazineVisuals
    zeroVisible: true
    magSteps: 5
    magStates:
      BulletDisablerSidearm: mag
      BulletLethalSidearm: mag-lethal
  - type: BatteryAmmoProvider
    proto: SidearmDisable
    fireCost: 80
  - type: Tag
    tags:
    - Taser
    - Sidearm
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: AmmoSelector
    prototypes:
    - BulletDisablerSidearm
    - BulletLethalSidearm
  - type: UserInterface
    interfaces:
      enum.AmmoSelectorUiKey.Key:
        type: AmmoSelectorMenuBoundUserInterface
  - type: ActivatableUI
    inHandsOnly: true
    key: enum.AmmoSelectorUiKey.Key
  - type: GuideHelp
    guides:
    - Security
    - Antagonists

- type: entity # It's effectively a laser version of the Cobra.
  name: silenced xenoborg laser pistol
  parent: [BaseWeaponBatterySmall, BaseSecurityContraband]
  id: WeaponPistolSilencedXenoborgLaserPistol
  description: A silenced laser pistol designed for silicon use.
  components:
  - type: Item
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Guns/Battery/silenced_xenoborg_pistol.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-1
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: _Trauma/Objects/Weapons/Guns/Battery/silenced_xenoborg_pistol.rsi
  - type: Gun
    fireRate: 4
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/silenced.ogg
      params:
        volume: -14
    availableModes:
    - SemiAuto
  - type: BatteryAmmoProvider
    proto: BulletBlueLaserMedium
    fireCost: 25
  - type: Battery
    maxCharge: 300
    startingCharge: 300
  - type: BatterySelfRecharger
    autoRechargeRate: 2 # make it count.
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 63
  - type: Tag
    tags:
    - Sidearm
    - LaserWeapon
