- type: entity
  name: laser sidearm
  parent: [ WeaponDisablerPractice, BaseSecurityContraband ]
  id: WeaponLaserSidearm
  description: A repurposed disabler used by mall cops all across nanotrasens stations, has lethal and nonlethal modes.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/disabler.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-unshaded-0
        map: ["enum.GunVisualLayers.MagUnshaded"]
        shader: unshaded
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/disabler.rsi
    quickEquip: false
    slots:
      - suitStorage
      - Belt
  - type: Battery
    maxCharge: 500
    startingCharge: 500
  - type: AmmoSelector
    prototypes:
    - BulletDisablerSidearm
    - BulletLethalSidearm
  - type: UserInterface
    interfaces:
      enum.AmmoSelectorUiKey.Key:
        type: AmmoSelectorMenuBoundUserInterface
  - type: ActivatableUI
    inHandsOnly: true
    key: enum.AmmoSelectorUiKey.Key
  - type: ItemToggle
    activated: true
    onActivate: false
    onUse: false
    wieldToggle: false
  - type: ItemToggleColor
  - type: GuideHelp
    guides:
    - Security
    - Antagonists

- type: entity
  id: BaseWeaponProprietaryCell
  parent: BaseItem
  abstract: true
  components:
  - type: Item
    size: Large
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/laser_gun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/laser_gun.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: AmmoCounter
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: HitscanBatteryAmmoProvider
    proto: RedLaser
    fireCost: 64
  - type: ItemSlots
    slots:
      cell_slot:
        name: Magazine
        startingItem: HighCapacityLaserGunCell # Make PowerCellHigh if making a worse BaseWeaponBattery
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - GunPowerCell
            # - PowerCell
            # - PowerCellSmall
# Decomment PowerCell and PowerCellSmall and comment GunPowerCell to make it a worse BaseWeaponBattery, no you can't make it refrence that instead. I tried. I can't move it either or it fucks itself. So for now you get this with the proprietary cells.
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: Appearance
  - type: StaticPrice
    price: 420
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: Cautery
    speed: 0.9
  - type: SurgeryTool
    endSound:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: AlwaysHot
  - type: MeleeWeapon
    damage:
      types:
       Blunt: 12
    angle: 0
    wideAnimationRotation: 90 # -90 if it takes bayonets (hits with muzzle) 90 if not (hits with butt)
    soundHit:
      collection: MetalThud
  - type: Multishot
    missChance: 0.4
    spreadMultiplier: 3
    spreadAddition: 40
  - type: BatteryDrinkerSource
    maxAmount: 180

