- type: entity
  id: Cartridge22MagnumMakeshift
  parent: [ BaseCartridge, BaseMajorContraband ]
  name: makeshift cartridge (.22 Magnum)
  description: An old makeshift cartridge that was often used in rifles and pistols.
  components:
  - type: Tag
    tags:
    - Cartridge22Magnum
  - type: CartridgeAmmo
    proto: Bullet22MagnumMakeshift
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Guns/Ammunition/Casings/makeshift_casing.rsi
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Appearance
  - type: SpentAmmoVisuals

