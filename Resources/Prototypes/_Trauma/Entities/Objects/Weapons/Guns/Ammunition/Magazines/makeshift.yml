- type: entity
  parent: [ BaseItem, BaseMajorContraband ]
  id: MagazineCustomSMG
  name: "makeshift box magazine (7.62x25mm Tokarev)"
  description: A makeshift box magazine that holds 32 rounds of 7.62x25mm Tokarev.
  components:
  - type: Tag
    tags:
      - MagazineCustomSMG
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge725Makeshift
    capacity: 32
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Trauma\Objects\Weapons\Guns\Ammunition\Magazine\Makeshift\custom_smg_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

