- type: entity
  id: MagFedLaserBase
  name: laser
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        mask:
        - Opaque
  - type: Reflective
    reflective:
    - Energy
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Guns/Projectiles/laser.rsi
    layers:
    - state: laser
      color: "#ff4242"
  - type: Projectile
    impactEffect: BulletImpactEffectOrangeDisabler
    damage:
      types:
        Heat: 8
  - type: BlurOnCollide
    blurTime: 3

- type: entity
  id: RevolverBullet
  name: laser
  parent: MagFedLaserBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    impactEffect: BulletImpactEffectOrangeDisabler
    damage:
      types:
        Heat: 10
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Guns/Projectiles/laser.rsi
    layers:
    - state: laser
      color: "#ff4242"
