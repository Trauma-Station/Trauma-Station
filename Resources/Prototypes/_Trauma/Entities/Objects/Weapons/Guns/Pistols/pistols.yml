- type: entity
  parent: [ AppraisalTool, WeaponPistolViper ]
  id: WeaponPistolViperAppraisal
  name: appraisal tool
  description: A beancounter's best friend, with a quantum connection to the galactic market and the ability to appraise even the toughest items. It will also tell you if a crate contains a completed bounty.
  suffix: Gun
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Weapons/Guns/Pistols/appraisal-gun.rsi
  - type: Gun
    showExamineText: false
    soundGunshot:
      path: /Audio/Items/appraiser.ogg
  - type: UseDelay
    delay: 1

- type: entity
  name: mk 58 ROW
  parent: BaseItem
  id: WeaponPistolMk58C
  description: A Mk58 for use by cyborgs. Creates .35 pistol ammo on the fly from an internal ammo fabricator, which slowly self-charges.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Pistols/mk58.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Small
  - type: Gun
    minAngle: 2
    maxAngle: 17
    angleIncrease: 2
    angleDecay: 14
    fireRate: 5
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mk58.ogg
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgePistol
    capacity: 12
    proto: CartridgePistol
    cycleable: false
  - type: BallisticAmmoSelfRefiller
    autoRefillRate: 5s
    affectedByEmp: true
  - type: AmmoCounter
