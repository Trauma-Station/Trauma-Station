- type: entity
  parent: BaseItem
  id: StabilizedBSCrystal
  name: stabilized bluespace crystal
  description: A glowing bluespace crystal, not much is known about how they work. It looks very delicate.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Materials/materials.rsi
    state: bluespace_crystal
    layers:
    - state: bluespace_crystal
      map: ["base"]
  - type: Appearance
  - type: Item
    size: Tiny
    heldPrefix: bluespace_crystal
  - type: LinkedEntityContainer
  - type: EntityEffectOnUse
    effectsToUsed:
    - !type:SpawnLinkedEntity
    - !type:ChangeEntityEffectOnUse
      effectsToUser:
      - !type:PlaySoundEffect
        sound:
          path: /Audio/Effects/teleport_departure.ogg
      - !type:Sparks
      - !type:ToLinkedEntityTeleport
        spawnPortal: BluespaceRiftPortal3Seconds
      - !type:PlaySoundEffect
        sound:
          path: /Audio/Effects/teleport_arrival.ogg
      - !type:Sparks
      effectsToUsed:
      - !type:DeleteEntity
  # interferes with bluespace portals. does nothing inside containers etc for simplicity and not being annoying
  - type: PortalTransitEffects
    effects:
    - !type:Explosion
      explosionType: Cryo
      maxIntensity: 3
    - !type:Delete
      queued: true
    sourceEffects: &deleteEffects
    - !type:Delete
      conditions:
      - !type:WhitelistCondition
        blacklist:
          components:
          - PocketDimension # dont delete the dimension pot one
    destEffects: *deleteEffects
  - type: Solution
    solution:
      reagents:
      - ReagentId: BluespaceMelange
        Quantity: 30
