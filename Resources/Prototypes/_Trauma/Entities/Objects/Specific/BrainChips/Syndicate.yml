- type: entity
  parent: BaseBrainChip
  id: SkillChipSniper
  name: skill chip sniper
  description: A sterilized microchip assembly that can directly interface with the brain. This one can rewrite the brain as if you had learned some skills years ago.
  components:
  - type: Cybernetics
    disableChance: 0.01 # extra hardening
  - type: KnowledgeGrantOnWear
    # will be like 40tcish so you can buy or buy the means to get a weapon, maybe like 60-80tc for nukies
    # gives 90 so as to give master but not give max skills immediately
    skills:
    ShootingKnowledge: 90
    
