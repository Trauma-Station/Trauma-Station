# Arming Sword

- type: entity
  parent: BaseSword
  id: BaseForgeArmingsword
  abstract: true
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Forging/Unfinished/sword_blade.rsi
  - type: Item
    sprite: _Trauma/Objects/Specific/Forging/Unfinished/sword_blade.rsi
    storedRotation: -45
    shape:
    - 0,0,0,4
  - type: MeleeWeapon
    damage:
      types:
        Slash: 18
      woundSeverityMultipliers:
        Slash: 2
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: DisarmMalus
  - type: Parry
    maxParries: 1
    maxReflects: 0
    parryMinSkill: 50
    soundOnParry:
      path: /Audio/_Goobstation/Heretic/parry.ogg
      params:
        variation: 0.2
        volume: -11

- type: entity
  parent: [BaseForgeArmingsword, BaseForgedBrassCrossGuard]
  id: BrassForgeArmingsword
  name: brass arming sword
  components:
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95
  - type: MeleeWeapon
    attackRate: 0.9
    damage:
      types:
        Slash: 18
      woundSeverityMultipliers:
        Slash: 2
  - type: Parry
    maxParries: 2

- type: entity
  parent: [BaseForgeArmingsword, BaseForgedSteelCrossguard]
  id: SteelForgeArmingsword
  name: steel arming sword

- type: entity
  parent: [BaseForgeArmingsword, BaseForgedPlasteelCrossguard]
  id: PlasteelForgeArmingsword
  name: plasteel arming sword
  components:
  - type: MeleeWeapon
    damage:
      types:
        Slash: 22.5
      woundSeverityMultipliers:
        Slash: 2

