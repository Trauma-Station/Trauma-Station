# Base

- type: entity
  parent: BaseItem
  abstract: true
  id: BaseForgedBrass
  components:
  - type: Sprite
    layers:
    - state: icon
      color: "#e79962"
    - state: handle
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#e79962"
      right:
