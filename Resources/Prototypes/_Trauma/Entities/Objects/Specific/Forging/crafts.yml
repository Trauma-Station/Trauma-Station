# Knife

- type: entity
  parent: BaseKnife
  id: BaseForgeKnife
  abstract: true
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Forging/Unfinished/knifeblade.rsi
  - type: Item
    sprite: _Trauma/Objects/Specific/Forging/Unfinished/knifeblade.rsi
    storedOffset: -1,1
    storedRotation: -45
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
    offset: -0.15,0.0
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 10
  - type: ThrowingAngle
    angle: 225
  - type: MeleeWeapon
    animationRotation: -135
    wideAnimationRotation: -135

- type: entity
  parent: [BaseForgeKnife, BaseForgedBrass]
  id: BrassForgeKnife
  name: brass knife
  components:
  - type: MeleeWeapon
    attackRate: 0.9
    damage:
      types:
        Slash: 10
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95

- type: entity
  parent: [BaseForgeKnife, BaseForgedSteel]
  id: SteelForgeKnife
  name: steel knife
  components:
  - type: MeleeWeapon
    damage:
      types:
        Slash: 10

- type: entity
  parent: [BaseForgeKnife, BaseForgedPlasteel]
  id: PlasteelForgeKnife
  name: plasteel knife
  components:
  - type: MeleeWeapon
    damage:
      types:
        Slash: 12.5
