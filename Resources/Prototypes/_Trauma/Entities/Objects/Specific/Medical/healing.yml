- type: entity
  name: empty blood pack
  description: Can be filled with blood for transfusions.
  parent: BaseHealingItem
  id: BloodpackEmpty
  components:
  - type: Item
    heldPrefix: emptybloodpack
  - type: Tag
    tags:
    - Bloodpack
  - type: Sprite
    state: bloodpack-empty
  - type: Healing
    damageContainers:
      - Biological
    damage:
      types:
        Bloodloss: 0 #What are you replenishing? it's empty!
  - type: Stack
    stackType: BloodpackEmpty
    count: 15

- type: entity
  parent: BloodpackEmpty
  id: BloodpackEmpty1
  suffix: Single
  components:
  - type: Stack
    stackType: BloodpackEmpty
    count: 1

# keep entry weight in RandomSafePillTable synced with number of items here
- type: entityTable
  id: RandomSafePillTrauma
  table: !type:GroupSelector
    children:
    - id: PillTramadol
    - id: PillOxycodone
    - id: PillIbuprofen

# keep entry weight in RandomSafeSyringeTable synced with number of items here
- type: entityTable
  id: RandomSafeSyringeTrauma
  table: !type:GroupSelector
    children:
    - id: SyringeTramadol
    - id: SyringeOxycodone
    - id: SyringeIbuprofen

- type: entity
  parent: PillCanister
  id: PillCanisterSpaceDrugs
  suffix: Space Mirage 15u, 15
  components:
  - type: Label
    currentLabel: space mirage 15u
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: PillSpaceDrugs
        amount: 15
