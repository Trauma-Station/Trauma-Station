# Security cyborg

- type: entity
  parent: CyborgEndoskeleton
  id: SecCyborgEndoskeleton
  name: security cyborg endoskeleton
  description: A frame that security cyborgs are built on. Do not jumpscare me, endoskeleton!
  components:
  - type: ItemMapper
    sprite: _Trauma/Objects/Specific/Robotics/cyborg_parts.rsi
    mapLayers:
      security_l_arm+o:
        whitelist:
          tags:
          - SecBorgLArm
      security_r_arm+o:
        whitelist:
          tags:
          - SecBorgRArm
      security_l_leg+o:
        whitelist:
          tags:
          - SecBorgLLeg
      security_r_leg+o:
        whitelist:
          tags:
          - SecBorgRLeg
      security_head+o:
        whitelist:
          tags:
          - SecBorgHead
      security_chest+o:
        whitelist:
          tags:
          - SecBorgTorso
  - type: PartAssembly
    parts:
      generic:
      - SecBorgLArm
      - SecBorgRArm
      - SecBorgLLeg
      - SecBorgRLeg
      - SecBorgHead
      - SecBorgTorso

- type: entity
  parent: PartSilicon
  id: LeftArmSecBorg
  name: security cyborg left arm
  components:
  - type: Sprite
