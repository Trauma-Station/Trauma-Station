    - state: icon-syndicate
  - type: ItemBorgModule
    hands:
    - item: DartGun
    - item: Syringe
      hand:
        emptyLabel: borg-slot-injector-dropper-empty
        emptyRepresentative: Syringe
        whitelist:
          tags:
          - Dropper
          - Syringe
    - item: ChemistryEmptyBottle01
      hand: &small_container_hand
        emptyLabel: borg-slot-small-containers-empty
        emptyRepresentative: ChemistryEmptyBottle01
