# Base Modules

- type: entity
  parent: BaseBorgModule
  id: BaseXenoborgModuleRocketeer
  abstract: true
  components:
  - type: BorgModule
    borgFitTypes:
    - xenoborg-type-rocketeer
  - type: Tag
    tags:
    - XenoborgModuleRocketeer
  - type: Item
    inhandVisuals:
      left:
      - state: base-icon-inhand-left
        color: "#6E9EE0"
      - state: base-module-inhand-left
        color: "#337dd6"
      - state: base-part-inhand-left
      - state: base-stripes-inhand-left
        color: "#ff8800"
      right:
      - state: base-icon-inhand-right
        color: "#6E9EE0"
      - state: base-module-inhand-right
        color: "#337dd6"
      - state: base-part-inhand-right
      - state: base-stripes-inhand-right
        color: "#ff8800"

# Placeholders

- type: entity
  parent: BaseItem
  id: BorgModulePKAPlaceholder
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
    state: icon

# Xenoborgs

- type: entity
  parent: [ BaseXenoborgModuleStealth, BaseProviderBorgModule, BaseXenoborgContraband ]
  id: XenoborgModuleDisruptor
  name: disruptor xenoborg module
  description: Module used to disrupt backlines.
  components:
  - type: Sprite
    layers:
    - state: xenoborg_stealth
    - state: icon-xenoborg-disruptor
      sprite: _Trauma/Objects/Specific/Robotics/borgmodule.rsi
  - type: ItemBorgModule
    hands:
    - item: WeaponPistolSilencedXenoborgLaserPistol
    - item: XenoborgKnife
    - item: XenoborgRadioJammer
    - item: AccessBreaker
  - type: BorgModuleIcon
    icon: { sprite: _Trauma/Interface/Actions/actions_borg.rsi, state: xenoborg-silenced-laser-module }

- type: entity
  parent: [ BaseXenoborgModuleRocketeer, BaseProviderBorgModule, BaseXenoborgContraband ]
  id: XenoborgModuleRocketeer
  name: rocketeer xenoborg module
  description: Module used to shoot rockets.
  components:
  - type: Sprite
    layers:
    - state: xenoborg_rocketeer
      sprite: _Trauma/Objects/Specific/Robotics/borgmodule.rsi
    - state: icon-xenoborg-rocketeer
      sprite: _Trauma/Objects/Specific/Robotics/borgmodule.rsi
  - type: ItemBorgModule
    hands:
    - item: WeaponRocketLauncherXenoborgStructural
    - item: XenoborgKnife
  - type: BorgModuleIcon
    icon: { sprite: _Trauma/Interface/Actions/actions_borg.rsi, state: xenoborg-silenced-laser-module }
