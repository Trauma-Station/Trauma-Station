# shared by mutators and enzyme incubator
- type: entity
  abstract: true
  parent: BaseItem
  id: BaseGeneticsInjector
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: medipen
      map: [ enum.MutatorVisuals.Layer ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MutatorVisuals.Spent:
        enum.MutatorVisuals.Layer:
          True: { state: medipen_empty }
          False: { state: medipen }

- type: entity
  parent: BaseGeneticsInjector
  id: GeneticsMutator
  name: mutator
  suffix: Empty
  description: A single-use injector of a mutagen designed to replicate a specific gene throughout the body.
  components:
  - type: Mutator

- type: entity
  parent: GeneticsMutator
  id: GeneticsActivator
  name: activator
  description: A single-use injector of a mutagen which can activate a dormant mutation without increasing instability.
  components:
  - type: Mutator
    activator: true

- type: entity
  parent: GeneticsMutator
  id: GeneticsCleanser
  name: cleanser
  description: A single-use injector of a mutagen designed to remove and de-express a specific gene from the body.
  components:
  - type: Mutator
    remove: true

- type: entity
  parent: BaseGeneticsInjector
  id: GeneticsEnzymeIncubator
  name: enzyme incubator
  description: A injector of a person's Unique Enzymes, the specific genes that control your outward appearance. However, the process is somewhat painful.
  components:
  - type: EnzymeIncubator
