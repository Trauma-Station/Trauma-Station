- type: entity
  parent: ClothingOuterArmorReactiveBase
  id: ClothingOuterArmorReactiveStealth # shadow
  name: reactive stealth armor
  description: An experimental suit of armor that renders the wearer invisible on detection of imminent harm. You can't fight what you can't see.
  components:
  - type: ReactiveArmor
    effects:
    - !type:PlaySoundEffect
        sound: *deparure_sound
    - !type:GrantTemporatyComponentEffect # why it refuses to work on client whyyyyy
      components:
      - type: Stealth
        lastVisibility: -1.5
        maxVisibility: -1.5
      lifeSpan: 5
    activationDelay: 10
    # emp_message = span_warning("The reactive stealth armor's threat assessment system crashes...")
  - type: Construction
    graph: ArmorReactive
    deconstructionTarget: null
    node: stealth

- type: entity
  parent: ClothingOuterArmorReactiveBase
  id: ClothingOuterArmorReactiveTable # tech
  name: reactive table armor
  description: An experimental suit of armor that... does something really wierd. Eh, science am i right? # TG desc (it was admem) = If you can't beat the memes, embrace them.
  components:
  - type: ReactiveArmor
    effects:
    - !type:PlaySoundEffect
        sound: *deparure_sound
    - !type:Sparks
    - !type:RandomTeleport
      radius:
        min: 6.0
        max: 8.0
    - !type:PlaySoundEffect
        sound: *arrival_sound
    - !type:Sparks
    - !type:SpawnRandomEntities
      entity: TableBase
      number: 1
    - !type:TableSlam
    activationDelay: 10
    # emp_message = span_danger("The reactive table armor's fabricators click and whirr ominously for a moment...")
  - type: Construction
    graph: ArmorReactive
    deconstructionTarget: null
    node: table

