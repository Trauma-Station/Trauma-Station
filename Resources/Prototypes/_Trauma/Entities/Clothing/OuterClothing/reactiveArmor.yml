- type: entity
  abstract: true
  parent: [ ClothingOuterArmorBase, BaseScienceContraband ]
  id: ClothingOuterArmorReactiveBase
  components:
  - type: Sprite
    sprite: _Trauma/Clothing/Armor/reactive.rsi
  - type: Clothing
    sprite: _Trauma/Clothing/Armor/reactive.rsi
  - type: PhysicalComposition
    materialComposition:
      Steel: 250
      Plastic: 75
      Glass: 25
      Plasma: 125
      Gold: 125
  - type: StaticPrice
    price: 1000
  - type: Tag
    tags:
    - WhitelistChameleon

- type: entity
  parent: [ ClothingOuterArmorReactiveBase, BaseGrandTheftContraband ]
  id: ClothingOuterArmorReactiveRD
  name: reactive teleport armor
  suffix: RD
  description: Someone separated our Research Director from his own head!
  components:
  - type: StealTarget
    stealGroup: TeleportArmor
  - type: ReactiveArmor
    effects:
    - !type:PlaySoundEffect
        sound: &deparure_sound
          path: /Audio/Effects/teleport_departure.ogg
    - !type:Sparks
    - !type:RandomTeleport
      radius:
        min: 6.0
        max: 10.0
    - !type:PlaySoundEffect
        sound: &arrival_sound
          path: /Audio/Effects/teleport_arrival.ogg
    - !type:Sparks
    activationDelay: 10
  # emp_message = span_warning("The reactive armor's teleportation calculations begin spewing errors!")


- type: entity
  parent: ClothingOuterArmorBase
  id: ClothingOuterArmorReactiveUnfinished
  name: reactive armor shell
  suffix: empty
  description: An experimental suit of armor, awaiting installation of an anomaly core.
  components:
  - type: Sprite
    sprite: _Trauma/Clothing/Armor/reactiveoff.rsi
  - type: Clothing
    sprite: _Trauma/Clothing/Armor/reactiveoff.rsi
  - type: Construction
    graph: ArmorReactive
    defaultTarget: teleport
    deconstructionTarget: null
    node: start

- type: entity
  parent: ClothingOuterArmorReactiveBase
  id: ClothingOuterArmorReactiveTeleport
  name: reactive teleport armor
  description: Doesn't seem to do much for some reason.
  components:
  - type: StealTarget
    stealGroup: TeleportArmor
  - type: ReactiveArmor
    effects:
    - !type:PlaySoundEffect
        sound: *deparure_sound
    - !type:Sparks
    - !type:RandomTeleport
      radius:
        min: 6.0
        max: 10.0
    - !type:PlaySoundEffect
        sound: *arrival_sound
    - !type:Sparks
    activationDelay: 10
  - type: Construction
    graph: ArmorReactive
    deconstructionTarget: null
    node: teleport
  # emp_message = span_warning("The reactive armor's teleportation calculations begin spewing errors!")

- type: entity
  parent: ClothingOuterArmorReactiveBase
  id: ClothingOuterArmorReactiveTesla # electricity
  name: reactive tesla armor
  description: An experimental suit of armor with sensitive detectors hooked up to a huge capacitor grid, with emitters strutting out of it. Zap.
  components:
  - type: ReactiveArmor
    effects:
    - !type:Sparks
    - !type:ShootRandomLightnings
      lightningRange: 8.0
    activationDelay: 10
  - type: Construction
    graph: ArmorReactive
    deconstructionTarget: null
    node: tesla
  # emp_message = span_warning("The tesla capacitors beep ominously for a moment.")

