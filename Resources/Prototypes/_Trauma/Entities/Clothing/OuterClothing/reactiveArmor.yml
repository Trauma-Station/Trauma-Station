- type: entity
  parent: ClothingOuterArmorReactiveBase
  id: ClothingOuterArmorReactiveCryogenic # ice core
  name: reactive cryogenic armor
  description: An experimental suit of armor. # WRITE SOMETHING
  components:
  - type: ReactiveArmor
    effects:
    - !type:PlaySoundEffect
      sound: /Audio/_Goobstation/Wraith/flameswoosh.ogg
    - !type:Sparks
    - !type:IceBrickInRange
      seachRange: 6.0
      breakFreeDelay: 5
    activationDelay: 10
  - type: Construction
    graph: ArmorReactive
    deconstructionTarget: null
    node: cryogenic

- type: entity
