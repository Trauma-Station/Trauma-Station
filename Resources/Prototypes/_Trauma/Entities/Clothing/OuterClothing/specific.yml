- type: entity
  parent: ClothingOuterChameleon
  id: ClothingOuterChameleonArmor
  name: vest
  description: A thick vest with a rubbery, water-resistant shell.
  suffix: Chameleon, Armor
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Ballistic: 0.65
        Heat: 0.65
    showArmorOnExamine: true
  - type: StaminaResistance
    damageCoefficient: 0.5

- type: entity
  parent: [ ClothingOuterHardsuitEVA, BaseChameleon ]
  id: ClothingOuterHardsuitEVAChameleon
  name: EVA suit
  description: A lightweight space suit with the basic ability to protect the wearer from the vacuum of space.
  suffix: Chameleon
  components:
  - type: ChameleonClothing
    slot: [outerClothing]
    default: ClothingOuterHardsuitEVA
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9

- type: entity
  parent: [ ClothingHeadHelmetEVA, BaseChameleon ]
  id: ClothingHeadHelmetEVAChameleon
  name: EVA helmet
  description: An old-but-gold helmet designed for extravehicular activites. Infamous for making security officers paranoid.
  suffix: Chameleon
  components:
  - type: ChameleonClothing
    slot: [HEAD]
    default: ClothingHeadHelmetEVA
