- type: entity
  parent: [ClothingOuterBaseMedium, AllowSuitStorageClothing, BaseSyndicateContraband]
  id: ClothingOuterArmorMonarchCoat
  name: monarch coat
  description: Straight from the wardrobe of Gorlex Entertainment's star performer, this replica of their most iconic outfit utilizes reflective technology to shrug off energy blasts, while remaining flimsy against real damage.
  components:
  - type: Sprite
    sprite: _Trauma/Clothing/OuterClothing/Coats/monarchcoat.rsi
  - type: Clothing
    sprite: _Trauma/Clothing/OuterClothing/Coats/monarchcoat.rsi
  - type: Armor
    coverage:
    - Torso
    - Arm
    - Leg
    - Tail
    modifiers:
      coefficients:
        Blunt: 0.75
        Slash: 0.75
        Piercing: 0.75
        Heat: 0.25
  - type: Reflect
    reflectProb: 0.8
    reflects:
    - Energy
    reflectingInHands: false
  - type: ModifyDelayedKnockdown
    delayDelta: 3
    knockdownTimeDelta: -3
  - type: StaminaResistance
    damageCoefficient: 0.5

- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterSuitCsij
  name: CSIJ biosuit
  description: A suit of writhing flesh that- wait no that's foam.
  components:
  - type: Sprite
    sprite: _Trauma/Clothing/OuterClothing/Misc/csijlevelv.rsi
  - type: Clothing
    sprite: _Trauma/Clothing/OuterClothing/Misc/csijlevelv.rsi
  - type: HideClothingLayerClothing
    hiddenSlots:
    - jumpsuit
  - type: IdentityBlocker
  - type: IngestionBlocker
  - type: NoirOverlay
  - type: Viewcone
    baseConeAngle: 180
  - type: ViewconeModifier
    angleModifier: 0.5
