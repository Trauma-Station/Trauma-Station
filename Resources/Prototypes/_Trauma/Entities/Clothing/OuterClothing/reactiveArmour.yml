- type: entity
  abstract: true
  parent: ClothingOuterArmorBase
  id: ClothingOuterArmorReactiveBase
  components:
  - type: Sprite
    sprite: _Trauma/Clothing/Armor/reactive.rsi
  - type: Clothing
    sprite: _Trauma/Clothing/Armor/reactive.rsi

- type: entity
  parent: ClothingOuterArmorBase
  id: ClothingOuterArmorReactiveUnfinished
  name: unfinished reactive armour
  suffix: empty
  description: This one needs an anomaly core.
  components:
  - type: Sprite
    sprite: _Trauma/Clothing/Armor/reactiveoff.rsi
  - type: Clothing
    sprite: _Trauma/Clothing/Armor/reactiveoff.rsi

- type: entity
  parent: [ ClothingOuterArmorReactiveBase, BaseGrandTheftContraband ]
  id: ClothingOuterArmorReactiveRD
  name: reactive teleport armour
  suffix: RD
  description: Someone separated our Research Director from his own head!
  components:
  - type: StealTarget
    stealGroup: TeleportArmourStealObjective
  - type: ClothingGrantComponent
    component:
    - type: OnHitTriggerWithCooldown
      activationDelay: 5
    - type: RandomTeleportOnTrigger


- type: entity
  parent: ClothingOuterArmorReactiveBase
  id: ClothingOuterArmorReactiveTeleport
  name: reactive teleport armour
  description: Reactive armour with bluespace core in it.
  components:
  - type: OnHitTriggerWithCooldown
    activationDelay: 5
  - type: RandomTeleportOnTrigger

- type: entity
  parent: ClothingOuterArmorReactiveBase
  id: ClothingOuterArmorReactiveTesla
  name: reactive tesla armour
  description: Reactive armour with tesla core in it.
  components:
  - type: OnHitTriggerWithCooldown
    activationDelay: 5
