  - type: Sprite
    sprite: _Trauma/Clothing/Head/Helmets/revflamearmor.rsi
  - type: Clothing
    sprite: _Trauma/Clothing/Head/Helmets/revflamearmor.rsi
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.1
  - type: ExplosionResistance
    damageCoefficient: 0.4
  - type: FireProtection
    reduction: 1
  - type: FaceHuggerBlocker

