- type: entity
  abstract: true
  id: ClothingHeadHatArmoredBeret
  components:
  - type: ArmorPointBlank
    range: 1.5
    resistancePenalty: 0
  - type: Armor
    coverage:
    - Head
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.8

- type: entity
