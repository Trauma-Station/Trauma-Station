- type: entity
  parent: [BaseItem, BaseSecurityContraband]
  id: Wandsky
  name: commander beepsky
  description: A technological marvel used for directing securitrons.
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Tools/commanderwandsky.rsi
    state: icon
  - type: StaminaDamageOnCollide
    damage: 25
    overtime: 40
    sound: /Audio/Weapons/egloves.ogg
  - type: MeleeWeapon
    hidden: true
    animation: WeaponArcThrust
    damage:
      types:
        Blunt: 1
  - type: Stunbaton
    energyPerUse: 50
  - type: StaminaDamageOnHit
  - type: LandAtCursor
  - type: Item
    size: Normal
  - type: Clothing
    sprite: _Trauma/Objects/Tools/commanderwandsky.rsi
    quickEquip: false
    slots:
    - Belt
  - type: DisarmMalus
    malus: 0.225
  - type: Appearance
  - type: Commander
    waypointEntityUid: SecuritronWaypoint
  - type: ActionsContainer
  - type: ActionGrant
    actions:
    - ActionTogglePatrol
    - ActionCRWaypoint
    - ActionClearWaypoints
  - type: ItemActionGrant
    actions:
    - ActionTogglePatrol
    - ActionCRWaypoint
    - ActionClearWaypoints

- type: entity
  id: SecuritronWaypoint
  name: securitron waypoint
  categories: [ DoNotMap ]
  components:
  - type: Transform
    anchored: true
  - type: Sprite # Sprite data is dynamically set in Client.HolopadSystem
  - type: Appearance
  - type: HolopadHologram
    rsiPath: _Trauma/Mobs/Silicon/Bots/beepsky.rsi
    rsiState: secbot
    shaderName: Hologram
    color1: "#65b8e2"
    color2: "#3a6981"
    alpha: 0.9
    intensity: 2
    scrollRate: 0.125
  - type: Waypoint
  - type: Clickable
