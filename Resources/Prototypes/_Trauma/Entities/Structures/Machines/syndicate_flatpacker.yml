- type: entity
  id: MachineSyndicateFlatpacker
  parent: [ BaseMachinePowered, ConstructibleMachine, BaseConstructibleMachineDestructible, BaseSyndicateContraband ]
  name: Syndicate Technician's Flatpacker
  suffix: Detected
  description: turns normal items into their syndicate versions or more dangerous versions at the cost of a longer flatpacking duration, power, a stack of plasma, and alerting the station.
  components:
  - type: Sprite
    sprite: _Trauma/Structures/Machines/syndie_flatpack.rsi
    snapCardinals: true
    layers:
    - state: base
    - state: screen
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: packing
      map: ["anim"]
      visible: false
    - state: inserting
      visible: false
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.SyndicateConverterVisuals.Packing:
        anim:
          True: { visible: true }
          False: { visible: false }
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Machine
    board: SyndicateFlatpackerMachineCircuitboard
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: OreSiloClient
  - type: AmbientSound
    enabled: false
    volume: 5
    range: 3
    sound:
      path: /Audio/Items/rped.ogg
  - type: WiresPanel
  - type: WiresVisuals
  - type: Appearance
  - type: ActivatableUI
    key: enum.SyndicateConverterUIKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.SyndicateConverterUIKey.Key:
        type: SyndicateConverterBoundUserInterface
  - type: ItemSlots
    slots:
      item_slot:
        name: syndicate-flatpacker-item-slot-name
        blacklist:
          tags:
          - Sheet
          - RawMaterial
          - Ingot
  - type: AutomationSlots
    slots:
    - !type:AutomatedItemSlot
      input: AutomationSlotBoard
      output: AutomationSlotBoard
      slotId: item_slot
    - !type:AutomatedMaterialStorage
      input: AutomationSlotMaterials
      output: null # no automatic silo stealer...
    - !type:AutomatedPorts
      sinks:
      - On
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      item_slot: !type:ContainerSlot
  - type: Construction
    graph: SyndicateFlatpacker
    node: machine
    containers:
    - machine_parts
    - machine_board
    - item_slot
  - type: NavMapBeacon
    color: "#ff0000"
    text: syndicate crafting device
    enabled: false
  - type: SyndicateConverter
    alertness: 10
    basePowerLoad: 1500
    activePowerLoad: 7500
    conversionCategoryList:
    - MechanicalLow:
      Plasma: 1500
      Plasteel: 1000
    - MechanicalHigh:
      Plasma: 2000
      Plasteel: 150
    - ElectronicsLow:
      Plasma: 1500
      Gold: 500
      Uranium: 500
    - ElectronicsHigh:
      Plasma: 1500
      Gold: 1500
      Uranium: 1000
    - EnergyWeaponLow:
      Plasma: 1500
      Plasteel: 500
      Gold: 500
      Uranium: 500
    - EnergyWeaponHigh:
      Plasma: 2000
      Plasteel: 1000
      Gold: 1000
      Uranium: 10000
      Gold: 1000
    - KineticWeaponLow:
    - KineticWeaponHigh:
    - ArmorLow:
    - ArmorHigh:
    - Explosive:
    - Medical:
    - Fun:
      Plasma: 500
    - Exchange:
      Plasma: 500
    - Misc:
      Plasma: 500

- type: entity
  id: MachineSyndicateFlatpackerUndetected
  parent: MachineSyndicateFlatpacker
  suffix: Undetected
  description: turns normal items into their syndicate versions or more dangerous versions at the cost of a longer flatpacking duration, power, a stack of plasma, and alerting the station.
  components:
  - type: SyndicateConverter
    alertness: 0

- type: entity
  parent: [ BaseFlatpack, BaseSyndicateContraband ]
  id: MachineSyndicateFlatpackerFlatpack
  name: syndicate technician's flatpacker flatpack
  description: A flatpack used for constructing a syndicate technician's flatpacker.
  components:
  - type: Flatpack
    entity: MachineSyndicateFlatpackerUndetected
