# TODO: BRUH DO THIS WITH CODE

- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseBloomery
  name: unlit bloomery
  components:
  - type: Sprite
    sprite: _Trauma/Structures/Forging/bloomery.rsi
    state: cold
  - type: Animateable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageModifierSet: StructuralMetallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Construction
    graph: BloomeryCold
    node: bloomery

- type: entity
  abstract: true
  parent: BaseBloomery
  id: BaseBloomeryLit
  name: lit bloomery
  components:
  - type: Sprite
    state: burning
  - type: DamageOverTime
    damage:
      types:
        Slash: 1000
    interval: 1
  - type: Damageable
    damageModifierSet: NormalMode
  - type: PointLight
    radius: 2
    energy: 3
    color: "#ff8227"

- type: entity
  abstract: true
  parent: BaseBloomery
  id: BaseBloomeryComplete
  name: smoking bloomery
  description: Looks ready, smash it open.
  components:
  - type: Sprite
    state: complete

# Unloaded

- type: entity
  parent: BaseBloomery
  id: BloomeryCold
  name: unlit bloomery
  description: Needs to be loaded with charcoal and metal scraps before firing.
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          Brick1:
            min: 13
            max: 15

# Loaded

- type: entity
  parent: BaseBloomery
