- type: entity
  parent: BaseStructure
  id: SpiderEggs
  name: egg sac
  description: A bundle of spider eggs, you see squirming within.
  components:
  - type: Sprite
    sprite: _Trauma/Structures/spiders.rsi
    drawdepth: SmallObjects
    snapCardinals: true
    state: icon
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        density: 7
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - MidImpassable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: desecration
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          Eggshells:
            min: 11
            max: 12
      - !type:SpillBehavior
        solution: egg
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: desecration
  - type: InteractionOutline
  - type: Damageable
  - type: Injurable
  - type: TimedDespawn
    lifetime: 121
  - type: TimedSpawner
    prototypes:
    - MobBabySpider
    intervalSeconds: 120
    minimumEntitiesSpawned: 12
    maximumEntitiesSpawned: 12
  - type: Solution
    solution:
      maxVol: 150
      reagents:
      - ReagentId: Egg
        Quantity: 150
    id: egg
