- type: entity
  abstract: true
  id: BaseGiantMushroom
  parent: BaseStructure
  components:
    - type: Sprite
      noRot: true
      drawdepth: Mobs # Needs to be drawn above tables
    - type: Transform
      anchored: false
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.2
          density: 60
          mask:
            - MachineMask
          layer:
            - MidImpassable
            - LowImpassable
    - type: Damageable
    - type: Injurable
      damageContainer: Biological
    - type: AtmosDevice
      requireAnchored: false

- type: entity
  id: MomMushroom
  parent: BaseGiantMushroom
  name: mom mushroom
  description: An enormous mushroom releasing spores into the air. How did this fit inside a vent?
  components:
    - type: Sprite
      sprite: _Trauma/Structures/Plants/GiantMushroom/mom_mushroom.rsi
      layers:
        - state: base
        - state: top
          shader: unshaded
    - type: TimedSpawner
      prototypes:
        - GiantSpore
      intervalSeconds: 40
      minimumEntitiesSpawned: 2
      maximumEntitiesSpawned: 5
    - type: GasMiner
      maxExternalPressure: 200
      spawnAmount: 0.40
      spawnGas: Fungalin
      showExamineText: false
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 150
          behaviors:
            - !type:SpawnGasBehavior
              gasMixture:
                volume: 1000
                moles:
                  Fungalin: 50
                temperature: 373.15
            - !type:DoActsBehavior
              acts: [ "Destruction" ]

- type: entity
  id: GiantMushroom
  parent: BaseGiantMushroom
  name: giant mushroom
  description: A giant mushroom, you really shouldn't be breathing close to it.
  components:
    - type: Sprite
      sprite: _Trauma/Structures/Plants/GiantMushroom/medium_mushroom.rsi
      layers:
        - state: base
        - state: top1
          map: ["random"]
          shader: unshaded
    - type: RandomSprite
      available:
        - random:
            top1: Rainbow
            top2: Rainbow
            top3: Rainbow
            top4: Rainbow
    - type: GasMiner
      maxExternalPressure: 200
      spawnAmount: 0.25
      spawnGas: Fungalin
      showExamineText: false
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 50
          behaviors:
            - !type:SpawnGasBehavior
              gasMixture:
                volume: 1000
                moles:
                  Fungalin: 25
                temperature: 373.15
            - !type:DoActsBehavior
              acts: [ "Destruction" ]

- type: entity
  id: LesserMushroom
  parent: BaseGiantMushroom
  name: lesser mushroom
  description: A lesser giant mushroom, you really shouldn't be breathing close to it.
  components:
    - type: Sprite
      sprite: _Trauma/Structures/Plants/GiantMushroom/small_mushroom.rsi
      layers:
        - state: base
        - state: top1
          map: ["random"]
          shader: unshaded
    - type: RandomSprite
      available:
        - random:
            top1: Rainbow
            top2: Rainbow
            top3: Rainbow
    - type: GasMiner
      maxExternalPressure: 200
      spawnAmount: 0.10
      spawnGas: Fungalin
      showExamineText: false
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 25
          behaviors:
            - !type:SpawnGasBehavior
              gasMixture:
                volume: 1000
                moles:
                  Fungalin: 15
                temperature: 373.15
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
