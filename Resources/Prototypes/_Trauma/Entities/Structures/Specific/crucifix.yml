- type: entity
  parent: BaseStructure
  id: Crucifix
  name: wooden cross
  description: A sturdy wooden cross. You could probably nail someone onto it...
  components:
  - type: Sprite
    noRot: true
    sprite: _Trauma/Structures/crucifix.rsi
    layers:
    - state: icon
      # TODO: when crucifying a monkey hide the monkey and use monkey state
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Strap
    position: Stand
    buckleOffset: "0,0.1"
    selfUnBuckleDelay: 10 # only works before you get nailed onto it
  - type: StrapLock
  - type: Construction
    graph: Crucifix
    node: cross
