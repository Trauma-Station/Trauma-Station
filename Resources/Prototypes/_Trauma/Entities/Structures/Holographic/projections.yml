- type: entity
  parent: HolosignWetFloor
  id: HolosignMedical
  name: holographic barrier
  description: A barrier of hard light that blocks movement, but is pretty weak to damage.
  components:
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Sprite
    sprite: _Trauma/Structures/Holo/medical.rsi
    state: icon
  - type: Fixtures
    fixtures:
    fix1:
    shape: !type:PhysShapeAabb
    bounds: "-0.3,-0.3,0.3,0.3"
    mask:
    - TableMask
    layer:
    - TableLayer
  - type: TimedDespawn
    lifetime: 180
  - type: PointLight
    enabled: true
    radius: 3
    color: "#57b8f0"
  - type: Climbable
