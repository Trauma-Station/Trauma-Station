- type: entity
  id: FluidPipeBroken
  parent: FluidPipeBase
  name: broken pipe
  description: It used to hold gas.
  components:
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/pipe.rsi
    drawdepth: ThinPipe
    state: pipeBroken
    layers:
      - state: pipeBroken
        map: [ "enum.PipeVisualLayers.Pipe" ]
  - type: AtmosPipeLayers
    numberOfPipeLayers: 1
  - type: Construction
    graph: FluidPipe
    node: broken
  - type: Item
    size: Small
  - type: Destructible
    thresholds: # override parent to avoid recursive destruction
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: GuideHelp
    guides:
    - Pipes
    - PipeNetworks

- type: entity
  parent: FluidPipeSansLayers
  id: FluidPipeManifold
  name: fluid pipe manifold
  description: Allows gas pipes of different configurations to be connected together.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/manifold.rsi
    layers:
    - state: pipeManifold
      map: [ "enum.PipeVisualLayers.Pipe" ]
  - type: AtmosPipeLayers
    pipeLayersLocked: true
  - type: PipeAppearance
    sprite:
    - { sprite: Structures/Piping/Atmospherics/manifold.rsi, state: pipeConnector }
    - { sprite: Structures/Piping/Atmospherics/manifold.rsi, state: pipeConnector_alt1 }
    - { sprite: Structures/Piping/Atmospherics/manifold.rsi, state: pipeConnector_alt2 }
  - type: Construction
    graph: FluidPipe
    node: manifold
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    storedSprite:
      sprite: Structures/Piping/Atmospherics/manifold.rsi
      state: storageManifold
  - type: NodeContainer
    nodes:
      south0:
        !type:PlumbingNode
        nodeGroupID: Fluid
        pipeDirection: South
        pipeLayer: 0
        volume: 50
      south1:
        !type:PlumbingNode
        nodeGroupID: Fluid
        pipeDirection: South
        pipeLayer: 1
        volume: 50
      south2:
        !type:PlumbingNode
        nodeGroupID: Fluid
        pipeDirection: South
        pipeLayer: 2
        volume: 50
      north0:
        !type:PlumbingNode
        nodeGroupID: Fluid
        pipeDirection: North
        pipeLayer: 0
        volume: 50
      north1:
        !type:PlumbingNode
        nodeGroupID: Fluid
        pipeDirection: North
        pipeLayer: 1
        volume: 50
      north2:
        !type:PlumbingNode
        nodeGroupID: Fluid
        pipeDirection: North
        pipeLayer: 2
        volume: 50
  - type: GasPipeManifold # This shit is weird
  - type: AtmosMonitoringConsoleDevice
    navMapBlip: GasPipeManifold
    showAbsentConnections: false
  - type: AtmosDevice
  - type: Tag
    tags:
    - Unstackable
