- type: entity
  parent: FluidPipeBase
  abstract: true
  id: FluidUnaryBase
  placement:
    mode: SnapgridCenter
  components:
    - type: PlumbingDevice
    - type: Tag
      tags:
        - Unstackable
    - type: SubFloorHide
      blockInteractions: false
      blockAmbience: false
    - type: NodeContainer
      nodes:
        fluid:
          !type:PlumbingNode
          nodeGroupID: Fluid
          pipeDirection: South
          expectedConnections: 1
    - type: CollideOnAnchor

- type: entity
  parent: [FluidUnaryBase, AirSensorBase]
  id: FluidVentPump
  name: fluid vent
  description: Has a valve and a pump attached to it.
  placement:
    mode: SnapgridCenter
  components:
    - type: VentCrawlerTube  # Goobstation - ventcrawl
      containerId: VentCrawlerTube
    - type: VentCrawlerEntry
    - type: ContainerContainer # Goobstation - ventcrawl
      containers:
        VentCrawlerTube: !type:Container
    - type: ApcPowerReceiver
    - type: ExtensionCableReceiver
    - type: DeviceNetwork
      prefix: device-address-prefix-vent
    - type: Tag
      tags:
        - GasVent
        - Unstackable
    - type: SubFloorHide
      visibleLayers:
      - enum.SubfloorLayers.FirstLayer
    - type: Sprite
      drawdepth: FloorObjects
      sprite: Structures/Piping/Atmospherics/vent.rsi
      noRot: true
      layers:
        - sprite: Structures/Piping/Atmospherics/pipe.rsi
          state: pipeUnaryConnectors
          map: [ "enum.PipeVisualLayers.Pipe" ]
        - state: vent_off
          map: [ "enabled", "enum.SubfloorLayers.FirstLayer" ]
    - type: Appearance
    - type: PipeColorVisuals
    - type: GenericVisualizer
      visuals:
        enum.VentPumpVisuals.State:
          enabled:
            Off: { state: vent_off }
            In: { state: vent_in }
            Out: { state: vent_out }
            Welded: { state: vent_welded }
            Lockout: { state: vent_lockout }
    - type: FluidVentPump
      MaxPushPressure: 60
    - type: Construction
      graph: FluidUnary
      node: ventpump
    - type: VentCritterSpawnLocation
    - type: AmbientSound
      enabled: true
      volume: -12
      range: 5
      sound:
        path: /Audio/Ambience/Objects/gas_vent.ogg
    - type: Weldable
    - type: AtmosMonitoringConsoleDevice
      navMapBlip: GasVentOpening
    - type: GuideHelp
      guides:
      - AirVent
      - DeviceMonitoringAndControl

- type: entity
  parent: FluidUnaryBase
  id: FluidPassiveVent
  name: passive vent
  description: It's an open vent.
  placement:
    mode: SnapgridCenter
  components:
    - type: SubFloorHide
      visibleLayers:
      - enum.SubfloorLayers.FirstLayer
    - type: Sprite
      drawdepth: FloorObjects
      sprite: Structures/Piping/Atmospherics/vent.rsi
      noRot: true
      layers:
        - sprite: Structures/Piping/Atmospherics/pipe.rsi
          state: pipeUnaryConnectors
          map: [ "enum.PipeVisualLayers.Pipe" ]
        - state: vent_passive
          map: [ "enum.SubfloorLayers.FirstLayer" ]
    - type: Appearance
    - type: PipeColorVisuals
    - type: FluidPassiveVent
    - type: Construction
      graph: FluidUnary
      node: passivevent
    - type: AtmosMonitoringConsoleDevice
      navMapBlip: FluidVentOpening
    - type: GuideHelp
      guides:
      - PassiveVent
    - type: VentCrawlerEntry # Goobstation - ventcrawl
    - type: VentCrawlerTube # Goobstation - ventcrawl
      containerId: VentCrawlerTube
    - type: ContainerContainer # Goobstation - ventcrawl
      containers:
        VentCrawlerTube: !type:Container
    - type: Weldable  # Goobstation - ventcrawl
      time: 3

- type: entity
  id: FluidTank
  parent: BaseStructure
  name: fluid storage tank
  description: A large tank for storing liquids. It has a manual access port on top.
  placement:
    mode: SnapgridCenter
  components:
  - type: SolutionContainerManager
    solutions:
      tank_buffer:
        maxVol: 1000
  - type: NodeContainer
    nodes:
      fluid:
        !type:PlumbingNode
        nodeGroupID: Fluid
        maxVolume: 0
        pipeDirection: South
        expectedConnections: 1
  - type: FluidTank
  - type: InjectableSolution
    solution: tank_buffer
  - type: DrawableSolution
    solution: tank_buffer
  - type: Sprite
    sprite: Objects/Misc/skub.rsi
    # sprite: Structures/Piping/Plumbing/tank.rsi
    # state: tank_base
  - type: Appearance
  # - type: SolutionContainerVisuals
  #   solutionName: tank_buffer # Tells the visualizer which solution to track
  - type: Transform
    anchored: true
  - type: Anchorable
