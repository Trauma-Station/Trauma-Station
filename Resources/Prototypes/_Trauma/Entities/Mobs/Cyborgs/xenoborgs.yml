# T2 Chassis types

- type: entity
  parent: [ BaseXenoborgChassis, BaseXenoborgTransponder ]
  id: XenoborgRocketeer
  name: rocketeer xenoborg
  suffix: with brain
  description: A man-machine hybrid that aims to replicate itself. They love extracting brains to insert into fresh Xenoborg chassis to grow their army. This is a rocketeer type, specialized in structural damage.
  components:
  - type: BorgTransponder
    name: rocketeer xenoborg
    sprite:
      sprite: _Trauma/Mobs/Silicon/Xenoborgs/rocketeer.rsi
      state: rocketeer
  - type: Sprite
    sprite: _Trauma/Mobs/Silicon/Xenoborgs/rocketeer.rsi
    layers:
      - state: rocketeer
      - state: rocketeer_e
        map: ["enum.BorgVisualLayers.Light"]
        shader: unshaded
        visible: false
      - state: rocketeer_l
        shader: unshaded
        map: ["light"]
        visible: false
  - type: MovementAlwaysTouching # it flies in space with sheer will.
  - type: FlashImmunity
  - type: BorgChassis
    maxModules: 4
    hasMindState: rocketeer_e
    noMindState: rocketeer_e_r
    moduleWhitelist:
      tags:
      - XenoborgModuleGeneric
      - XenoborgModuleRocketeer
  - type: ContainerFill
    containers:
      borg_brain:
      - MMIFilled
      borg_module:
      - XenoborgModuleBasic
      - XenoborgModuleTool
      - XenoborgModuleRocketeer
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh

- type: entity
  parent: [ BaseXenoborgChassis, BaseXenoborgTransponder ]
  id: XenoborgTripod
  name: tripod xenoborg
  suffix: with brain
  description: A man-machine hybrid that aims to replicate itself. They love extracting brains to insert into fresh Xenoborg chassis to grow their army. This is a tripod type, specialized in supressing fire.
  components:
  - type: BorgTransponder
    name: tripod xenoborg
    sprite:
      sprite: _Trauma/Mobs/Silicon/Xenoborgs/tripod.rsi
      state: tripod
  - type: Sprite
    sprite: _Trauma/Mobs/Silicon/Xenoborgs/tripod.rsi
    layers:
      - state: tripod
      - state: tripod_e
        map: ["enum.BorgVisualLayers.Light"]
        shader: unshaded
        visible: false
      - state: tripod_l
        shader: unshaded
        map: ["light"]
        visible: false
  - type: MovementAlwaysTouching # it flies in space with sheer will.
  - type: FootstepModifier # sounds cool
    footstepSoundCollection:
      collection: FootstepHeavySuit
  - type: FlashImmunity
  - type: BorgChassis
    maxModules: 4
    hasMindState: tripod_e
    noMindState: tripod_e_r
    moduleWhitelist:
      tags:
      - XenoborgModuleGeneric
      - XenoborgModuleTripod
  - type: MovementSpeedModifier # Slower then a scout, faster then an average xorg.
    baseWalkSpeed : 2.3
    baseSprintSpeed : 5.3
  - type: MobThresholds # Little bit more squishy.
    thresholds:
      0: Alive
      80: Critical
      180: Dead
    stateAlertDict:
      Alive: BorgHealth
      Critical: BorgCrit
      Dead: BorgDead
    showOverlays: false
    allowRevives: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Machines/warning_buzzer_xenoborg.ogg
          params:
            volume: 5
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          PinpointerMothershipPiece: # drop a piece of core pinpointer upon being destructed (4 pieces to make a core pinpointer)
            min: 1
            max: 1
      - !type:EmptyContainersBehaviour
        containers:
        - borg_brain
        - borg_module
        - cell_slot
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ContainerFill
    containers:
      borg_brain:
      - MMIFilled
      borg_module:
      - XenoborgModuleBasic
      - XenoborgModuleTool
      - XenoborgModuleTripod
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
