# T2 Chassis types

- type: entity
  parent: [ BaseXenoborgChassis, BaseXenoborgTransponder ]
  id: XenoborgScout
  name: rocketeer xenoborg
  suffix: with brain
  description: A man-machine hybrid that aims to replicate itself. They love extracting brains to insert into fresh Xenoborg chassis to grow their army. This is a rocketeer type, its rockets should be avoided at all costs.
  components:
  - type: BorgTransponder
    name: rocketeer xenoborg
    sprite:
      sprite:  _Traumastation/Mobs/Silicon/Xenoborgs/rocketeer.rsi
      state: rocketeer
  - type: Sprite
    sprite: _Traumastation/Mobs/Silicon/Xenoborgs/rocketeer.rsi
    layers:
      - state: rocketeer
      - state: rocketeer_e
        map: ["enum.BorgVisualLayers.Light"]
        shader: unshaded
        visible: false
      - state: rocketeer_l
        shader: unshaded
        map: ["light"]
        visible: false
  - type: FootstepModifier # it flies instead of walking
    footstepSoundCollection:
      collection: FootstepHoverXenoborg
  - type: MovementAlwaysTouching # it flies in space with tiny thrusters
  - type: FlashImmunity
  - type: BorgChassis
    maxModules: 4
    hasMindState: scout_e
    noMindState: scout_e_r
    moduleWhitelist:
      tags:
      - XenoborgModuleGeneric
      - XenoborgModuleScout
  - type: ContainerFill
    containers:
      borg_brain:
      - MMIFilled
      borg_module:
      - XenoborgModuleBasic
      - XenoborgModuleTool
      - XenoborgModuleSword
      - XenoborgModuleSpaceMovement
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
