- type: entity
  abstract: true
  parent: MobGuardianBase
  id: BaseHoloParasite
  components:
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghost-role-information-holoparasite-name
    description: ghost-role-information-holoparasite-description
    rules: ghost-role-information-familiar-rules
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: NameIdentifier
    group: Holoparasite
  - type: TypingIndicator
    proto: holo
  - type: HTN
    rootTask:
      task: SimpleHumanoidHostileCompound
  - type: Guardian
    damageShare: 0.4
    distanceAllowed: 10

- type: entity
  name: Holoparasite Anchor
  id: HoloParasiteStandard
  parent: BaseHoloParasite
  description: A well-balanced hard-light defender, keyed to its owner's life to sustain itself.
  components:
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        tech_base: ""
      enum.DamageStateVisualLayers.BaseUnshaded:
        tech_flare: Sixteen
  - type: Sprite
    layers:
    - state: tech_base
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: tech_flare
      map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      color: "#40a7d7"
      shader: unshaded
  - type: MeleeWeapon
    attackRate: 1.5
    resistanceBypass: true
    damage:
      types:
        Blunt: 24
        Structural: 100

- type: entity
  name: Holoparasite Wraith
  id: HoloParasiteAssassin
  parent: BaseHoloParasite
  description: A shadowy, toxin-laced apparition that slips between the cracks of your enemies' awareness.
  components:
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        magic_base: ""
      enum.DamageStateVisualLayers.BaseUnshaded:
        magic_flare: Sixteen
  - type: Sprite
    layers:
    - state: magic_base
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: magic_flare
      map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      color: "#7b4dff"
      shader: unshaded
  - type: Stealth
    lastVisibility: 0.3
    examineThreshold: 0.5
  - type: StealthOnMove
    passiveVisibilityRate: -0.35
    movementVisibilityRate: 0.5
  - type: Guardian
    damageShare: 0.5
    distanceAllowed: 10
  - type: MeleeWeapon
    attackRate: 1.6
    damage:
      types:
        Blunt: 25
        Poison: 25

- type: entity
  name: Holoparasite Dart
  id: HoloParasiteCharger
  parent: BaseHoloParasite
  description: A blisteringly fast presence that barrages across the battlefield and bowls over anything in its path.
  components:
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        miner_base: ""
      enum.DamageStateVisualLayers.BaseUnshaded:
        miner_flare: Sixteen
  - type: Sprite
    layers:
    - state: miner_base
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: miner_flare
      map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      color: "#5ec7ff"
      shader: unshaded
  - type: ActionGrant
    actions:
    - ActionSelfToggleGuardian
    - ActionGravityJump
  - type: MovementSpeedModifier
    baseWalkSpeed: 7
    baseSprintSpeed: 9
  - type: JumpAbility
    canCollide: true
    collideKnockdown: 2
    jumpDistance: 5
  - type: Guardian
    damageShare: 0.5
    distanceAllowed: 10
  - type: MeleeWeapon
    attackRate: 2.5
    damage:
      types:
        Blunt: 12
        Structural: 20

- type: entity
  name: Holoparasite Torch
  id: HoloParasiteBrawler
  parent: BaseHoloParasite
  description: A searing manifestation of raw fury whose every blow leaves its victims ablaze.
  components:
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        magic_base: ""
      enum.DamageStateVisualLayers.BaseUnshaded:
        magic_flare: Sixteen
  - type: Sprite
    layers:
    - state: magic_base
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: magic_flare
      map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      color: "#ff5a36"
      shader: unshaded
  - type: IgniteOnMeleeHit
    fireStacks: 2
  - type: Guardian
    damageShare: 0.6
    distanceAllowed: 10
  - type: MeleeWeapon
    attackRate: 1.3
    resistanceBypass: true
    damage:
      types:
        Heat: 18
        Structural: 20

- type: entity
  name: Holoparasite Drift
  id: HoloParasiteIcicle
  parent: BaseHoloParasite
  description: A frost-warded presence of living shards that leeches strength with each biting strike.
  components:
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        magic_base: ""
      enum.DamageStateVisualLayers.BaseUnshaded:
        magic_flare: Sixteen
  - type: Sprite
    layers:
    - state: magic_base
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: magic_flare
      map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      color: "#8fd8ff"
      shader: unshaded
  - type: StaminaDamageOnHit
    damage: 25
  - type: Guardian
    damageShare: 0.5
    distanceAllowed: 10
  - type: MeleeWeapon
    attackRate: 1.4
    damage:
      types:
        Cold: 30
        Structural: 20

- type: entity
  name: Holoparasite Aegis
  id: HoloParasiteProtector
  parent: BaseHoloParasite
  description: A ponderous bulwark of hard-light that anchors itself to its owner and soaks up harm.
  components:
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        miner_base: ""
      enum.DamageStateVisualLayers.BaseUnshaded:
        miner_flare: Sixteen
  - type: Sprite
    layers:
    - state: miner_base
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: miner_flare
      map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      color: "#5ee06f"
      shader: unshaded
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 4.5
  - type: Guardian
    damageShare: 0.3
    distanceAllowed: 15
  - type: MeleeWeapon
    attackRate: 1.2
    resistanceBypass: true
    damage:
      types:
        Blunt: 18
        Structural: 20
