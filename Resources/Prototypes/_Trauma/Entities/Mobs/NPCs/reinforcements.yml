- type: entity
  parent: MobHuman
  id: BaseReinforcement
  categories: [ HideSpawnMenu ]
  abstract: true
  components:
  - type: RandomMetadata
    nameSegments:
    - NamesFirst
    - NamesLast
    nameFormat: name-format-standard
  - type: RandomHumanoidAppearance
    randomizeName: true

# Sec Reinforcements

- type: entity
  parent: BaseReinforcement
  id: SecurityReinforcement
  name: reinforcement security officer
  categories: [ HideSpawnMenu ]
  components:
  - type: Loadout
    prototypes: [ReinforcementOfficer]
    roleLoadout: [ RoleSurvivalSecurity ]

- type: entity
