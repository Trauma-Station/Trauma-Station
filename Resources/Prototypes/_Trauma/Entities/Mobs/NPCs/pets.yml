- type: entity
  parent: MobPig
  id: MobPigPinecone
  name: pinecone
  description: Pinecone pig. Oink!

- type: entity
  parent: MobMonkeyPunpun
  id: MobMonkeyPunpunPrisoner
  suffix: Prisoner
  components:
  - type: GhostRole
    rules: ghost-role-information-animal-rules
    mindRoles:
    - MindRoleGhostRoleAnimal
  - type: Loadout
    prototypes: [ PunpunPrisoner ]

- type: startingGear
  parent: MobMonkeyGear # what an amazing name for pun pun's starting gear
  id: PunpunPrisoner
  equipment:
    jumpsuit: ClothingUniformJumpsuitPrisoner
    mask: CigaretteSpent
    id: DClassIDCard # fuck you

- type: entity
  parent: [ SolutionWeapon, SolutionTiny ]
  id: SolutionShivaSpider
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: HeartbreakerToxin
        Quantity: 30
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: HeartbreakerToxin
        Quantity: 1

- type: entity
  parent: MobGorilla
  id: MobWhiteGorilla
  name: white gorilla
  description: He's not a bad guy at heart. He just likes stirring the pot, and has occasional bouts of psychosis.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: crawling
      sprite: _Trauma/Mobs/Animals/Glacier/white_gorilla.rsi
  - type: TemperatureDamage
    coldDamageThreshold: 0
    coldDamage:
      types:
        Cold: 0
    heatDamage:
      types:
        Heat: 2
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 25
        Cold: 10
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatFrostRaw
      amount: 3
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Critical
      300: Dead
