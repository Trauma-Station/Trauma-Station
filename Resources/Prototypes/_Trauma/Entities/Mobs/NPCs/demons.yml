- type: entity
  name: demon
  parent: [ MobSpaceBasic, MobCombat ]
  id: BaseDemon
  abstract: true
  description: It came from hell.
  components:
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: NpcFactionMember
    factions:
      - SimpleHostile
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 4.5
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
  - type: FootstepModifier
  - type: Physics
    bodyType: KinematicController
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Dead
  - type: PassiveDamage
    allowedStates:
      - Alive
    damage:
      types:
        Heat: -3
        Blunt: -1
        Slash: -1
        Piercing: -1
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Sulfur
        Quantity: 100
    bleedReductionAmount: 1
  - type: Prying
    speedModifier: 5
    pryPowered: true
    useSound: /Audio/Machines/airlock_creaking.ogg
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Eldritch
    understands:
    - TauCetiBasic
    - Eldritch
  - type: ThermalVision
  - type: Stamina
    baseCritThreshold: 9999
  - type: FlashImmunity
  - type: Puller
    needsHands: false
  - type: GhostRole
    name: ghost-role-information-demon-name
    description: ghost-role-information-demon-desc
    rules: ghost-role-information-familliar-rules
    mindRoles:
    - MindRoleGhostRoleSoloAntagonist
    raffle:
      settings: short
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
  - type: GhostTakeoverAvailable
  - type: AlwaysTakeHoly
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: Targeting

- type: entity
  id: ControlledDemon
  abstract: true
  components:
  - type: GhostRole
    name: ghost-role-information-demon-name
    description: ghost-role-information-demon-desc
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleGhostRoleSoloAntagonist
    raffle:
      settings: short

# Minor Demons

- type: entity
  name: demon
  parent: BaseDemon
  id: MinorDemonGuy
  description: It came from hell.
  components:
  - type: Sprite
    sprite: _Trauma/Mobs/Monsters/Demons/guy.rsi
  - type: MeleeWeapon
    range: 1
    soundHit:
      path: /Audio/Effects/demon_attack1.ogg
    damage:
      types:
        Slash: 10
    altDisarm: false
    canWideSwing: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:GibBehavior
        recursive: false
      - !type:SpawnEntitiesBehavior
        spawn:
          BaseDemonSoulFragment:
            min: 0
            max: 1

- type: entity
  parent: [MinorDemonGuy, ControlledDemon]
  id: MinorDemonGuyControlled
  suffix: Controlled

