- type: entity
  abstract: true
  parent: [ MobSpaceBasic, MobCombat ]
  id: BaseDemon
  name: demon
  description: It came from hell.
  components:
  - type: KnowledgeHolder
  - type: KnowledgeContainer # no skills lol
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 4.5
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
  - type: FootstepModifier
  - type: Physics
    bodyType: KinematicController
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Dead
  - type: PassiveDamage
    allowedStates:
    - Alive
    damage:
      types:
        Heat: -1
        Blunt: -1
        Slash: -1
        Piercing: -1
        Ballistic: -1
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Sulfur
        Quantity: 100
    bleedReductionAmount: 1
  - type: ZombieImmune # gibs on death so its not possible to become a zombie
  - type: Prying
    speedModifier: 5
    pryPowered: true
    useSound: /Audio/Machines/airlock_creaking.ogg
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Eldritch
    understands:
    - TauCetiBasic
    - Eldritch
  - type: ThermalVision
  - type: Stamina
    baseCritThreshold: 9999
  - type: FlashImmunity
    showInExamine: false
  - type: Puller
    needsHands: false
  - type: GhostRole
    name: ghost-role-information-demon-name
    description: ghost-role-information-demon-desc
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleGhostRoleSoloAntagonist
    raffle:
      settings: short
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
  - type: GhostTakeoverAvailable
  - type: AlwaysTakeHoly
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: Targeting
  - type: Mutatable
    defaultMutations:
      MutationInternalMartyrdom: 0.1
      MutationSpatialInstability: 0.1
      MutationAntiGlow: 0.1
      MutationTelekinesis: 0.1
      MutationLaserEyes: 0.1
      MutationOrk: 0.05
      MutationFierySweat: 0.1
      MutationSpastic: 0.1
      MutationTwoLeftFeet: 0.1
      MutationAntenna: 0.1
      MutationAdrenalineRush: 0.1
      MutationDwarfism: 0.1
      MutationAcromegaly: 0.1
      MutationGigantism: 0.1
      MutationInsulated: 0.5
  - type: WarpPoint
  - type: PointLight
    radius: 0
    energy: 0

- type: entity
  parent: BaseBullet
  id: DemonAcid
  name: demonic acid spit
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Caustic: 15
        Structural: 20
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/xeno_toxic.rsi
    layers:
    - state: xeno_toxic
  - type: Ammo
    muzzleFlash: null

# Minor Demons

- type: entity
  parent: BaseDemon
  id: MinorDemonGuy
  name: twisted clown
  description: What happens when a clown pies one too many chaplains. Actions have consequences.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: WaddleAnimation
  - type: Speech
    speechSounds: BikeHorn
  - type: Sprite
    sprite: _Trauma/Mobs/Monsters/Demons/guy.rsi
  - type: MeleeWeapon
    range: 1
    soundHit:
      path: /Audio/Effects/demon_attack1.ogg
    damage:
      types:
        Slash: 5
    animation: WeaponArcFist
    altDisarm: true
    canWideSwing: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:GibBehavior
        recursive: false
      - !type:SpawnEntitiesBehavior
        spawn:
          DemonSoulFragment:
            min: 0
            max: 1
  - type: Solution
    id: melee
    solution:
      maxVol: 5
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Honk
        Quantity: 7
  - type: MeleeChemicalInjector
    transferAmount: 7
    solution: melee

