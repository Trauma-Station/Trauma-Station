# Toxic Reagent Slimes

- type: entity
  parent: ReagentSlime
  id: ReagentSlimeCocaine
  suffix: Cocaine
  components:
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Cocaine
        Quantity: 100
  - type: PointLight
    color: "#fcf7f9"
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Aliens/elemental.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
      color: "#fcf7f9"

