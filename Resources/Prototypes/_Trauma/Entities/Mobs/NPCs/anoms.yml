- type: entity
  name: anomaly
  parent: [ SimpleSpaceMobBase, MobCombat ]
  id: MobMeatBallEvil
  description: What is this thing?
  components:
  - type: HTN
    rootTask:
     task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: Sprite
    drawdepth: Mobs
    sprite: _Trauma/Mobs/Anoms/meatball.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: alive
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Critical:
        Base: dead
  - type: MovementSpeedModifier
    baseWalkSpeed : 1
    baseSprintSpeed : 1
  - type: MobThresholds
    thresholds:
      0: Alive
      800: Critical
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Slash: 50
        Structural: 50
  - type: NoSlip
  - type: SlowOnDamage
    speedModifierThresholds:
      0: 1
      300: 6
      500: 30
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 2000
    bleedReductionAmount: 0.5
  - type: ZombieImmune
  - type: PassiveDamage
    allowedStates:
    - Alive
    - Critical
    damageCap: 9999
    damage:
      types:
        Poison: -10
        Genetic: -10
        Radiation: -10
      groups:
        Brute: -5
        Burn: -5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 99999999
      behaviors:
      - !type:GibBehavior
        recursive: false
  - type: ResearchPointSource # Goobstation
    pointspersecond: 200
    active: true
