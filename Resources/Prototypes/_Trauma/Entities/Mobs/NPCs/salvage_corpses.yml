- type: entity
  parent: MobAbductor
  suffix: Dead
  save: false
  id: SalvageAbductorCorpse
  name: &salvageCorpseName unidentified corpse
  description: &salvageCorpseDescription I think they're dead.
  components: &salvageCorpseComponents
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: DefaultBodyDamage
    damage:
      types:
        Bloodloss: 49
        Asphyxiation: 76
        Slash: 56
        Blunt: 19
  - type: PartialAbsorbable

