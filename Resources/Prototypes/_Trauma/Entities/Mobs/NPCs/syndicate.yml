# SPDX-License-Identifier: AGPL-3.0-or-later

- type: entity
  abstract: true
  id: BaseNukieAnimal
  components:
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    rules: ghost-role-information-syndicate-reinforcement-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
  - type: GhostTakeoverAvailable
  # fake hardsuit
  - type: Insulated
  - type: Damageable
    damageModifierSet: NukieSpider
  - type: PointLight
    radius: 3.0
    energy: 2.3
    offset: 0, -2
    color: green
  # evil
  - type: ShowSyndicateIcons
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - Syndicate
  - type: ActiveRadio
    channels:
    - Syndicate
  - type: MobPrice
    price: 250

- type: entity
  abstract: true
  parent: BaseNukieAnimal
  id: BaseNukieAnimalSpaceproof # for mobs that would die in space otherwise
  components:
  - type: Respirator
    minSaturation: 5.0
  - type: TemperatureDamage
    heatDamageThreshold: 423
    coldDamageThreshold: 0
  - type: PermanentStatusEffects
    statusEffects:
    - StatusEffectPressureImmunity

- type: entity
  parent: [ BaseNukieAnimalSpaceproof, MobMouse ]
  id: MobNukieMouse
  name: nuclear operative mouse
  description: A Nuclear Operative... MOUSE?!
  suffix: Syndicate
  components:
  - type: GhostRole
    name: ghost-role-information-nukie-mouse-name
    description: ghost-role-information-nukie-mouse-description
  - type: RandomMetadata
    nameSegments: [ NamesMouseDeathCommando ]
  - type: PointLight
    radius: 1.5
    offset: 0, -1
  - type: Sprite
    sprite: _Trauma/Mobs/Animals/Syndicate/nukiemouse.rsi
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Slash: 5
        Piercing: 5
        Structural: 15
  - type: Tag
    tags:
    - FootstepSound
  - type: MobThresholds
    thresholds:
      0: Alive
      15: Critical
      30: Dead

- type: entity
  parent: [ BaseNukieAnimalSpaceproof, MobGiantSpiderAngry ]
  id: MobNukieSpider
  name: nuclear operative tarantula
  description: A spider? A NUKIE SPIDER?!
  suffix: Syndicate
  components:
  - type: GhostRole
    name: ghost-role-information-nukie-spider-name
    description: ghost-role-information-nukie-spider-description
  - type: RandomMetadata
    nameFormat: name-format-nukie-operator
    nameSegments: [ NamesNukieSpider ]
  - type: NpcFactionMember
    factions:
    - Syndicate
    - Xeno # no spider war
  - type: Sprite
    drawdepth: Mobs
    sprite: _Trauma/Mobs/Animals/Syndicate/nukiespider.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base", "movement" ]
      state: syndicate-spider
  - type: SpriteMovement
    movementLayers:
      movement:
        state: syndicate-spider-moving
    noMovementLayers:
      movement:
        state: syndicate-spider
  - type: MobThresholds
    thresholds:
      0: Alive
      90: Critical
      150: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: syndicate-spider
      Critical:
        Base: syndicate-spider-dead
      Dead:
        Base: syndicate-spider-dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 4.9
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Slash: 4
        Piercing: 4
        Structural: 25
  - type: SolutionManager
    solutions:
    - SolutionVenomSpiderNukie
  - type: MeleeChemicalInjector
    transferAmount: 0.5
    solution: melee
  - type: Access
    tags:
    - NuclearOperative
    - SyndicateAgent
  - type: Tag
    tags:
    - FootstepSound
    - DoorBumpOpener

- type: entity
  parent: [ SolutionWeapon, SolutionTiny ]
  id: SolutionVenomSpiderNukie
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Lexorin
        Quantity: 30
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Lexorin
        Quantity: 1

- type: entity
  parent: [ BaseNukieAnimal, BaseMobCarp ]
  id: MobNukieCarp
  name: nuclear operative carp
  suffix: Syndicate # no shit?
  description: A blood-red carp trained in carp-to-carp combat.
  components:
  - type: GhostRole
    name: ghost-role-information-nukie-carp-name
    description: ghost-role-information-nukie-carp-description
  - type: RandomMetadata
    nameFormat: name-format-nukie-operator
    nameSegments: [ NamesNukieCarp ]
  - type: Sprite
    drawdepth: Mobs
    sprite: _Trauma/Mobs/Animals/Syndicate/nukiecarp.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: mouth
      shader: unshaded
  - type: Access
    tags:
    - NuclearOperative
    - SyndicateAgent
  - type: Tag
    tags:
    - Carp
    - DoorBumpOpener
  - type: ExplosionResistance
    damageCoefficient: 0.2
  - type: SolutionManager
    solutions:
    - SolutionVenomSyndicarp
  - type: MeleeChemicalInjector
    solution: melee
    transferAmount: 1
  - type: Damageable
    damageModifierSet: NukieSpider
  - type: MobThresholds
    thresholds:
      0: Alive
      25: Critical
      50: Dead

- type: entity
  parent: [ SolutionWeapon, SolutionTiny ]
  id: SolutionVenomSyndicarp
  categories: [ HideSpawnMenu ]
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: CarpoToxin
        Quantity: 30
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: CarpoToxin
        Quantity: 1

- type: entity
  parent: [ BaseNukieAnimal, BaseMobBehonker ]
  id: MobNukieBehonker
  name: nuclear operative behonker
  description: Gorlex thought it would be funny to have a behonker. It was.
  suffix: Syndicate
  components:
  - type: RandomMetadata
    nameFormat: name-format-nukie-operator
    nameSegments: [ NamesNukieBehonker ]
  - type: Sprite
    sprite: _Trauma/Mobs/Monsters/Demons/syndie_behonker.rsi
  - type: Access
    tags:
    - NuclearOperative
    - SyndicateAgent
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: LanguageSpeaker
    speaks:
    - Universal
    understands:
    - Universal
  - type: MovementIgnoreGravity
  - type: ThermalVision
    useShader: false
    color: "#BF40BF"
    activateSound: null
    deactivateSound: null
  - type: BatteryAmmoProvider
    proto: XrayCannonBullet
    fireCost: 62.5

- type: entity
  parent: [ BaseMobAsteroid, FlyingMobBase ]
  id: MobSyndieViscerator
  name: viscerator
  description: A small, twin-bladed machine capable of inflicting very deadly lacerations.
  components:
  - type: Sprite
    sprite: _Trauma/Mobs/Animals/viscerator.rsi
    layers:
    - state: viscerator
      map: ["movement"]
    - state: viscerator_l
      shader: unshaded
      map: ["light"]
      visible: true
  - type: SpriteMovement
    movementLayers:
      movement:
        state: viscerator_moving
    noMovementLayers:
      movement:
        state: viscerator
  - type: MovementSpeedModifier
    baseWalkSpeed : 5.0
    baseSprintSpeed : 5.0
  - type: MobThresholds
    thresholds:
      0: Alive
      15: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    angle: 0
    attackRate: 1
    range: 0.5
    animation: WeaponArcSlash
    damage:
      types:
        Slash: 6
      armorPenetration: -2 # it should not be as dangerous to armored targets
      woundSeverityMultipliers:
        Slash: 2.5
  - type: NpcFactionMember
    factions:
    - SimpleHostile
    - Syndicate
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard: # highly aggressive
      VisionRadius: !type:Single
        15
      AggroVisionRadius: !type:Single
        15
