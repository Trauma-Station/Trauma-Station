- type: entity
  abstract: true
  parent: BaseTraitorObjective
  id: BaseSideJob
  components:
  - type: Objective
    difficulty: 1
  - type: SideJob

# minor
- type: entity
  abstract: true
  parent: BaseSideJob
  id: BaseMinorSideJob
  components:
  - type: SideJob
    reputationGain: 100
  - type: LevelRestrictedSideJob
    level: 0
  - type: GenerateSideJobReward
    rewardTable: MinorSideJobRewards

# minor - bug area
- type: entity
  abstract: true
  parent: BaseMinorSideJob
  id: BaseBugAreaSideJob
  components:
  - type: BugAreaCondition
    objectiveName: bug-objective-name
    objectiveDescription: bug-objective-description
    iconEntity: SyndicateBugCmo # use the cmo bug for all of them because all the bugs look the same

- type: entity
  parent: BaseBugAreaSideJob
  id: BugAreaSideJobCmo
  components:
  - type: BugAreaCondition
    targetArea: AreaOfficeCmo
  - type: SideJob
    tool: SyndicateBugBoxCmo

- type: entity
  parent: BaseBugAreaSideJob
  id: BugAreaSideJobCE
  components:
  - type: BugAreaCondition
    targetArea: AreaOfficeCE
  - type: SideJob
    tool: SyndicateBugBoxCE

- type: entity
  parent: BaseBugAreaSideJob
  id: BugAreaSideJobHop
  components:
  - type: BugAreaCondition
    targetArea: AreaOfficeHop
  - type: SideJob
    tool: SyndicateBugBoxHop

- type: entity
  parent: BaseBugAreaSideJob
  id: BugAreaSideJobHos
  components:
  - type: BugAreaCondition
    targetArea: AreaOfficeHos
  - type: SideJob
    tool: SyndicateBugBoxHos

- type: entity
  parent: BaseBugAreaSideJob
  id: BugAreaSideJobRd
  components:
  - type: BugAreaCondition
    targetArea: AreaOfficeRd
  - type: SideJob
