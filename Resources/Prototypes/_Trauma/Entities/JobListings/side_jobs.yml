# major
- type: entity
  abstract: true
  parent: BaseSideJob
  id: BaseMajorSideJob
  components:
  - type: SideJob
    reputationGain: 200
  - type: LevelRestrictedSideJob
    level: 1
  - type: GenerateSideJobReward
    rewardTable: MajorSideJobRewards

# major - grant theft
- type: entity
  abstract: true
  parent: BaseMajorSideJob
  id: BaseStealSideJob
  components:
  - type: StealCondition
    objectiveNoOwnerText: side-job-steal-title-no-owner
    objectiveText: side-job-steal-title
    descriptionText: side-job-steal-description
  - type: StealConditionRequireScan

- type: entity
  parent: [ BaseStealSideJob, CMOHyposprayStealObjective ]
  id: CMOHyposprayStealSideJob
  components:
  - type: SideJob
    tool: SyndicateScanalyzerCMOHypospray

- type: entity
  parent: [ BaseStealSideJob, RDHardsuitStealObjective ]
  id: RDHardsuitStealSideJob
  components:
  - type: SideJob
    tool: SyndicateScanalyzerRDHardsuit

- type: entity
  parent: [ BaseStealSideJob, HandTeleporterStealObjective]
  id: HandTeleporterStealSideJob
  components:
  - type: SideJob
    tool: SyndicateScanalyzerHandTeleporter

- type: entity
  parent: [ BaseStealSideJob, MagbootsStealObjective]
  id: MagbootsStealSideJob
  components:
  - type: SideJob
    tool: SyndicateScanalyzerMagboots

- type: entity
  parent: [ BaseStealSideJob, ClipboardStealObjective]
  id: ClipboardStealSideJob
  components:
  - type: SideJob
    tool: SyndicateScanalyzerClipboard

- type: entity
  parent: [ BaseStealSideJob, CaptainJetpackStealObjective ]
  id: CaptainJetpackStealSideJob
  components:
  - type: SideJob
    tool: SyndicateScanalyzerCaptainJetpack

- type: entity
  parent: [ BaseStealSideJob, CaptainGunStealObjective ]
  id: CaptainGunStealSideJob
  components:
  - type: SideJob
    tool: SyndicateScanalyzerCaptainGun

# major - kill
- type: entity
  parent: [ BaseMajorSideJob, BaseKillObjective ]
  id: KillSideJob
  description: Someone wants someone dead. Kill them, then claim your reward. We don't care what happens to them afterwards.
  components:
  - type: SideJob
    repeatable: true
  - type: TargetObjective
    title: side-job-kill-title
  - type: KillPersonCondition
    requireDead: true
  - type: PickRandomPerson

# extreme
- type: entity
  abstract: true
  parent: BaseSideJob
  id: BaseExtremeSideJob
  components:
  - type: SideJob
    reputationGain: 500
  - type: LevelRestrictedSideJob
    level: 2
  - type: GenerateSideJobReward
    rewardTable: ExtremeSideJobRewards

# extreme - kill head
- type: entity
  parent: [ BaseExtremeSideJob, BaseKillObjective ]
  id: KillHeadSideJob
  description: This is no longer about contract killing - we need to make Nanotrasen afraid. Kill one of them. Kill a head of staff.
  components:
  - type: SideJob
    repeatable: true
  - type: TargetObjective
    title: side-job-kill-title
  - type: KillPersonCondition
    requireDead: true
  - type: PickRandomPerson
    filters:
    - !type:BodyMindFilter
      whitelist:
        components:
        - CommandStaff

# final
- type: entity
  abstract: true
  parent: BaseSideJob
  id: BaseFinalSideJob
  components:
  - type: SideJob
    reputationGain: 10000
    reward: SyndicateFinalReward
  - type: LevelRestrictedSideJob
    level: 3

# final - battlecruiser
- type: entity
  parent: BaseFinalSideJob
  id: BattlecruiserSideJob
  components:
  - type: Objective
    icon:
      sprite: _Trauma/Objects/Syndicate/syndicate_final_reward.rsi
      state: icon
  - type: SideJob
    tool: SyndicateBroadcastDevice
  - type: StealCondition
    objectiveText: side-job-hack-comms-computer-name
    objectiveNoOwnerText: side-job-hack-comms-computer-name
    descriptionText: side-job-hack-comms-computer-description
    descriptionMultiplyText: side-job-hack-comms-computer-description
    stealGroup: CommsComputer
  - type: StealConditionRequireScan
