- type: entity
  abstract: true
  parent: BaseTraitorObjective
  id: BaseSideJob
  components:
  - type: SideJob

# medium
- type: entity
  abstract: true
  parent: BaseSideJob
  id: BaseMediumSideJob
  components:
  - type: SideJob
    reputationGain: 200
  - type: GenerateSideJobReward
    rewardTable: MediumSideJobRewards

# medium - grant theft
- type: entity
  abstract: true
  parent: BaseMediumSideJob
  id: BaseStealSideJob
  components:
  - type: StealCondition
    objectiveNoOwnerText: side-job-steal-title-no-owner
    objectiveText: side-job-steal-title
    descriptionText: side-job-steal-description
    requireScan: true

- type: entity
  parent: [BaseStealSideJob, CMOHyposprayStealObjective]
  id: CMOHyposprayStealSideJob

- type: entity
  parent: [BaseStealSideJob, RDHardsuitStealObjective]
  id: RDHardsuitStealSideJob

- type: entity
  parent: [BaseStealSideJob, HandTeleporterStealObjective]
  id: HandTeleporterStealSideJob

- type: entity
  parent: [BaseStealSideJob, MagbootsStealObjective]
  id: MagbootsStealSideJob

- type: entity
  parent: [BaseStealSideJob, ClipboardStealObjective]
  id: ClipboardStealSideJob

- type: entity
  parent: [BaseStealSideJob, CaptainJetpackStealObjective]
  id: CaptainJetpackStealSideJob

- type: entity
  parent: [BaseStealSideJob, CaptainGunStealObjective]
  id: CaptainGunStealSideJob
