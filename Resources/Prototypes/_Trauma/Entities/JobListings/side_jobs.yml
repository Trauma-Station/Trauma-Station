# major - kill
- type: entity
  parent: [ BaseMajorSideJob, BaseKillObjective ]
  id: KillSideJob
  description: You have been hired to end someone's life. Kill them, then claim your reward. We don't care what happens to them afterwards.
  components:
  - type: SideJob
    repeatable: true
  - type: TargetObjective
    title: side-job-kill-title
  - type: KillPersonCondition
    requireDead: true
  - type: PickRandomPerson
    conditions:
    - !type:BodyWhitelistCondition
      blacklist:
        components:
        - NukeOperative


# extreme
- type: entity
  abstract: true
  parent: BaseSideJob
  id: BaseExtremeSideJob
  components:
  - type: SideJob
    reputationGain: 500
  - type: LevelRestrictedSideJob
    level: 2
  - type: GenerateSideJobReward
    currencyReward: Telecrystal15
    currencyName: 15 tc
    currencyChance: 0.66
    uplinkRewards:
    - UplinkExperimentalSyndicateTeleporter
    - UplinkSingularityGrenade
    - UplinkAccessBreaker
    - UplinkEmag
    - UplinkDisposableTurret

# extreme - kill head
- type: entity
  parent: [ BaseExtremeSideJob, BaseKillObjective ]
  id: KillHeadSideJob
  description: This is no longer about contract killing - we need to make Nanotrasen afraid. Kill one of them. Kill a head of staff.
  components:
  - type: SideJob
    repeatable: true
  - type: TargetObjective
    title: side-job-kill-title
  - type: KillPersonCondition
    requireDead: true
  - type: PickRandomPerson
    conditions:
    - !type:BodyWhitelistCondition
      blacklist:
        components:
        - NukeOperative
      whitelist:
        components:
        - CommandStaff

