- type: entity
  parent: BasePhysicalKnowledge
  id: AthleticsKnowledge
  name: Athletics
  components:
  - type: Skill
    experienceCost: 12
  - type: StaminaSkill
    # no debuff at lvl 0, 37% damage reduction at lvl 100
    # you are in good shape not insulated from batong
    curve: !type:QuadraticSkillCurve
      skillScale: 0.6
      skillOffset: -2.8
      curveScale: 0.05
      curveOffset: 0.6

- type: entity
  parent: BasePhysicalKnowledge
  id: ThrowingKnowledge
  name: Throwing
  components:
  - type: Skill
    experienceCost: 5
  - type: ThrowInsertSkill # being better at throwing lets you slam dunk easier
    curve: !type:QuadraticSkillCurve
