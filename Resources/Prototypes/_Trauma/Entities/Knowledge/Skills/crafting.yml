- type: entity
  parent: BaseCraftingKnowledge
  id: ConstructionKnowledge
  name: Construction
  description: Infrastructure? Doors? Airlocks? If it's a brick you know how to work it.
  components:
  - type: Skill
    experienceCost: 15
    cost: 1

- type: entity
  parent: BaseCraftingKnowledge
  id: WeaponsKnowledge
  name: Weaponsmith
  description: Blades? Weaponry is a bit more complicated than just bare manufacturing.

- type: entity
  parent: BaseCraftingKnowledge
  id: GunsmithKnowledge
  name: Gunsmith
  description: Guns? Weaponry is a bit more complicated than just bare manufacturing.

- type: entity
  parent: BaseCraftingKnowledge
  id: ArmorKnowledge
  name: Armorsmith
  description: Armor's a bit more complicated. All the layers and the curves are complicated enough to warrant it's own skill.

- type: entity
  parent: BaseCraftingKnowledge
  id: ManufacturingKnowledge
  name: Manufacturing
  description: Metallurgy? Know what material does what? When it comes to factories and fabrication, you know what to do.

- type: entity
  parent: BaseCraftingKnowledge
  id: ElectronicsKnowledge
  name: Electronics
  description: If it runs electricity, you've heard of it.

- type: entity
  parent: BaseCraftingKnowledge
  id: SurvivalKnowledge
  name: Survival
  description: Carving? Tailoring? Detail work? Look no further.

- type: entity
  parent: BaseCraftingKnowledge
  id: MechanicsKnowledge
  name: Mechanics
  description: If it's got gears and whistles, you'll need this.

- type: entity
  parent: BaseCraftingKnowledge
  id: ScienceKnowledge
  name: Science
  description: What the fuck is that?

