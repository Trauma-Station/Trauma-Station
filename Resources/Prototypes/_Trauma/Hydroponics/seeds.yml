- type: entity
  parent: LemonPlants
  id: LemonadePlants
  name: lemonade tree
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Hydroponics/lemonade.rsi
  - type: PlantData
    name: seeds-lemonade-name
    packetPrototype: LemonadeSeeds
    productPrototypes: [ FoodLemonade ]
    mutationPrototypes: [ LimePlants ] # mutated backwards idiot
  - type: PlantChemicals
    chemicals:
      WeldingFuel:
        min: 1
        max: 5
        potencyDivisor: 20
      Napalm:
        min: 1
        max: 4
        potencyDivisor: 25
      ChlorineTrifluoride:
        min: 2
        max: 3
        potencyDivisor: 100

- type: entity
  parent: BasePlant
  id: CocaPlants
  name: coca plant
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Hydroponics/coca_plant.rsi
  - type: PlantData
    name: seeds-cocaplant-name
    packetPrototype: CocaSeeds
    productPrototypes: [ LeavesCoca ]
  - type: PlantHarvest
    harvestRepeat: Repeat
  - type: Plant
    lifespan: 75
    maturation: 5
    production: 5
    yield: 2
    potency: 10
    growthStages: 3
  - type: PlantGrowth
    waterConsumption: 0.40
  - type: PlantChemicals
    chemicals:
      CocaSlurry:
        min: 1
        max: 10
        potencyDivisor: 10

- type: entity
  parent: BasePlant
  id: CoconutPlants
  name: coconut tree
  components:
  - type: Sprite
    sprite: _Trauma/Objects/Specific/Hydroponics/coconut.rsi
  - type: PlantData
    name: seeds-coconut-name
    packetPrototype: CoconutSeeds
    productPrototypes: [ FoodCoconut ]
  - type: PlantHarvest
    harvestRepeat: SelfHarvest # bear in mind, this is the equivalent of space bear pelt for botany
  - type: Plant
    lifespan: 80
    maturation: 12 # takes a while
    production: 1 # lol
    yield: 8 # higher than cocoa because rare
    potency: 25
  - type: PlantGrowth
    waterConsumption: 1 # they need a lotta wata
    nutrientConsumption: 1
  - type: PlantChemicals
    chemicals:
      Nutriment:
        min: 1
        max: 20
        potencyDivisor: 2
      Vitamin:
        min: 1
        max: 10
        potencyDivisor: 2
      CoconutWater:
        min: 1
        max: 10
        potencyDivisor: 2

