- type: polymorph
  id: MutationMonkey
  configuration:
    entity: MobMonkey
    transferName: true
    forced: true
    revertOnCrit: false
    revertOnDeath: false
    revertOnDelete: false
    inventory: Transfer
    polymorphSound: /Audio/Animals/monkey_scream.ogg

- type: polymorph
  id: MutationMouse
  configuration:
    entity: MobMouse
    transferName: true
    forced: true
    revertOnCrit: false
    revertOnDeath: false
    revertOnDelete: false
    inventory: Drop
    polymorphSound: /Audio/Animals/mouse_squeak.ogg

- type: polymorph
  id: TongueSpike
  configuration:
    entity: TongueSpike
    forced: true
    polymorphPopup: null
    exitPolymorphPopup: MutationTongueSpike-popup-revert

- type: polymorph
  id: TongueSpikeChem
  configuration:
    entity: TongueSpikeChem
    forced: true
    polymorphPopup: null
    exitPolymorphPopup: MutationTongueSpike-popup-revert
