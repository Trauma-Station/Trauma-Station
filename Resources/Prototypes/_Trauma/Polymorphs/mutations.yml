- type: polymorph
  id: MutationMonkey
  configuration:
    entity: MobMonkey
    transferName: true
    copiedComponents: [] # no language chud
    forced: true
    revertOnCrit: false
    revertOnDeath: false
    revertOnDelete: false
    inventory: Transfer
    polymorphSound: /Audio/Animals/monkey_scream.ogg

- type: polymorph
  id: MutationMouse
  configuration:
