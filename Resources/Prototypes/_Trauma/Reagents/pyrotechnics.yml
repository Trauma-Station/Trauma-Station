- type: reagent
  id: Methanol
  name: reagent-name-methanol
  group: Pyrotechnic
  desc: reagent-desc-methanol
  physicalDesc: reagent-physical-desc-pungent
  color: "#c4f5ff"
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types: # methanol is bad for your health
            Poison: 3

- type: reagent
  id: Hexamine
  name: reagent-name-hexamine
  group: Pyrotechnic
  desc: reagent-desc-hexamine
  flavor: sweet
  physicalDesc: reagent-physical-desc-crystalline
  contrabandSeverity: Major # not explosive, but it's only use is for explosives
  color: white

- type: reagent
  id: Cyclonite
  name: reagent-name-cyclonite
  group: Pyrotechnic
  desc: reagent-desc-cyclonite
  flavor: nothing
  physicalDesc: reagent-physical-desc-crystalline
  contrabandSeverity: Major # you probably aren't making this or the other explosives with permission from HOS
  color: "#e0c009"
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types: # do not eat/shoot up C4
            Poison: 3

- type: reagent
  id: AmmoniumNitrateFuelOil
  name: reagent-name-ammonium-nitrate-fuel-oil
  group: Pyrotechnic
  desc: reagent-desc-ammonium-nitrate-fuel-oil
  flavor: nothing
  physicalDesc: reagent-physical-desc-odorless
  contrabandSeverity: Major
  color: white
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types: # Oil is not good
            Poison: 1

- type: reagent
  id: Octogen
  name: reagent-name-octogen
  group: Pyrotechnic
  desc: reagent-desc-octogen
  flavor: nothing
  physicalDesc: reagent-physical-desc-crystalline
  contrabandSeverity: Major
  color: white
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types: # do not eat C4's bigger brother
            Poison: 2

- type: reagent
  id: HolyChlorineTrifluoride
  parent: ChlorineTrifluoride
  name: reagent-name-holy-chlorine-trifluoride
  group: Pyrotechnic
  desc: reagent-desc-holy-chlorine-trifluoride
  physicalDesc: reagent-physical-desc-blazing
  flavor: holy
  color: blue
  tileReactions:
  - !type:CreateEntityTileReaction
    entity: MolotovHolyFire
    maxOnTileWhitelist:
      tags: [ TraumaFire ]
  - !type:SpillTileReaction
  reactiveEffects:
    Acidic:
      methods: [ Touch ]
      effects:
      - !type:HolyIgnite
        stacks: 6
        conditions:
    Flammable: # have to reset this because apparently it reset? idk either
      methods: [ Touch ]
      effects:
      - !type:Flammable
        multiplier: 0.3
      - !type:Ignite
      - !type:Emote
        emote: Scream
        probability: 0.2
      - !type:PopupMessage
        messages: [ "clf3-it-burns", "clf3-get-away" ]
        visualType: MediumCaution
        probability: 0.3
        type: Local

- type: reagent
  id: Burnite
  name: reagent-name-burnite
  group: Pyrotechnic
  desc: reagent-desc-burnite
  physicalDesc: reagent-physical-desc-blazing
  contrabandSeverity: Major
  color: "#621800"
  tileReactions:
  - !type:CreateEntityTileReaction
    entity: MolotovHellFire
    maxOnTileWhitelist:
      tags: [ TraumaFire ]
  - !type:FlammableTileReaction
    temperatureMultiplier: 5
  - !type:SpillTileReaction
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Heat: 4
            Poison: 1 # mildly poisonous
      - !type:Flammable
        multiplier: 0.5
      - !type:AdjustTemperature
        amount: 8000
  reactiveEffects:
    Flammable:
      methods: [ Touch ]
      effects:
      - !type:Flammable
        multiplier: 0.6
      - !type:Ignite
      - !type:Emote
        emote: Scream
        probability: 0.3
      - !type:PopupMessage
        messages: [ "clf3-it-burns", "clf3-get-away" ]
        visualType: MediumCaution
        probability: 0.4
        type: Local

- type: reagent
  id: UnknownReagent
  name: reagent-name-unknown-reagent
  group: Pyrotechnic
  desc: reagent-desc-unknown-reagent
  physicalDesc: reagent-physical-desc-blazing
  contrabandSeverity: Major
  color: "#ff00ff"
  tileReactions:
  - !type:CreateEntityTileReaction
    entity: MolotovGlitchFire
    maxOnTileWhitelist:
      tags: [ TraumaFire ]
  - !type:FlammableTileReaction
    temperatureMultiplier: 5
  - !type:SpillTileReaction
  plantMetabolism:
  - !type:PlantMutateChemicals
    randomPickBotanyReagent: UnknownReagentFillSolution
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Cellular: 1
  reactiveEffects:
    Flammable:
      methods: [ Touch ]
      effects:
      - !type:Flammable
        multiplier: 0.3
      - !type:Ignite
      - !type:Emote
        emote: Scream
        probability: 0.2
      - !type:PopupMessage
        messages: [ "clf3-it-burns", "clf3-get-away" ]
        visualType: MediumCaution
        probability: 0.2
        type: Local
