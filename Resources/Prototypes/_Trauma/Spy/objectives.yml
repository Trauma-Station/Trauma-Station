- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseSpyObjective
  components:
  - type: Objective
    difficulty: 1
    icon:
      sprite: _ShitChap/Objects/Weapons/Nullrod/atheist.rsi
      state: icon
    issuer: TheSyndicate
  - type: RoleRequirement
    roles:
    - SpyRole

- type: entity
  parent: BaseSpyObjective
  id: SpyRandomObjective
  name: Do something
  description: Don't fail.
  components:
  - type: Objective
    unique: false
  - type: RoleplayObjective
  - type: RandomObjective
    nameFormats: SpyObjectives
    nameSegments:
    - SpyStealables
    - SpyDepartment
    - SpyAffected
    - SpyLocation
    - SpyEscape
    - SpyRivals
    - SpyHappenings

- type: entity
  parent: [BaseSpyObjective, BaseSurviveObjective]
  id: SpySurviveObjective
  name: Survive
  description: Stay alive. You don't have to go to CentCom.

- type: entity
  parent: [BaseSpyObjective, EscapeShuttleObjective]
  id: SpyEscapeShuttleObjective

- type: entity
  parent: BaseSpyObjective
  id: SpyDieObjective
  name: Die a glorious death
  description: Die.
  components:
  - type: ObjectiveBlacklistRequirement
    blacklist:
      components:
      - EscapeShuttleCondition
      - StealCondition
  - type: DieCondition

- type: entity
  parent: [BaseSpyObjective, HijackShuttleObjective]
  id: SpyHijackShuttleObjective
  name: Hijack emergency shuttle
  description: Leave on the shuttle free and clear of the loyal Nanotrasen crew on board. Use ANY methods available to you. Syndicate agents, Nanotrasen enemies, and handcuffed hostages may remain alive on the shuttle. Ignore assistance from anyone other than a support agent.
