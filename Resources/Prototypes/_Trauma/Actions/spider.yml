- type: entity
  parent: BaseAction
  id: SpiderMultiply
  name: Multiply
  description: Uses hunger to multiply.
  components:
  - type: Action
    icon:
      sprite: _Trauma/Structures/spiders.rsi
      state: icon
    useDelay: 1
    sound: !type:SoundPathSpecifier
      path: /Audio/Effects/pop.ogg
  - type: InstantAction
    event: !type:EggLayInstantActionEvent
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 5
        layer:
        - DoorPassable
  - type: InteractionOutline

- type: entity
  parent: BaseAction
  id: ActionSpiderCall
  name: Spidercall
  description: Call nearby spiders to your location.
  components:
  - type: Action
    icon:
      sprite: _Goobstation/Actions/call.rsi
      state: icon
    useDelay: 0.1
  - type: InstantAction
    event: !type:MobCallActionEvent
