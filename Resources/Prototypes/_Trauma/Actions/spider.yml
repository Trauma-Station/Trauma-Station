- type: entity
  parent: BaseAction
  id: SpiderMultiply
  name: Multiply
  description: Uses hunger to multiply.
  components:
  - type: Sprite
    sprite: _Trauma/Structures/spiders.rsi
    layers:
    - state: icon
  - type: Action
    useDelay: 1
    sound: !type:SoundPathSpecifier
      path: /Audio/Effects/pop.ogg
  - type: InstantAction
    event: !type:EggLayInstantActionEvent

- type: entity
  parent: ActionMouseCall
  id: ActionSpiderCall
  name: Spidercall
  description: Call nearby spiders to your location.
