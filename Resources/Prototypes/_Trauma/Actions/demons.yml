# Trauma Demons

- type: entity
  parent: ActionBlink
  id: ActionDemonRift
  name: Demon Blink
  description: Click somewhere to teleport to it.
  components:
  - type: Sprite
    sprite: _Trauma/Actions/demon.rsi
    layers:
    - state: rift
  - type: Action
    useDelay: 20
    raiseOnAction: false
    sound: !type:SoundPathSpecifier
      path: /Audio/Effects/burning.ogg
  - type: EffectAction
    onPerformed: true
    effects:
    - !type:SpawnParticles
      particleProto: DemonPassage

- type: entity
  parent: ActionSanguineStrike
  id: ActionDemonBlade
  name: Butcher's Strike
  description: Use your unholy blade consume a portion of your enemies' soul, dealing more damage and healing yourself.
  components:
  - type: Sprite
    sprite: _Trauma/Actions/demon.rsi
    layers:
    - state: blade
  - type: Action
    useDelay: 15
    raiseOnAction: false
    sound: !type:SoundPathSpecifier
      path: /Audio/_Trauma/Mobs/Biowepon/clang.ogg
  - type: Magic
    requiresClothes: false
    requiresSpeech: true
    school: Evocation

- type: entity
  parent: ActionRepulseNoRobes
  id: ActionDemonRepulse
  name: Demonic Pulse
  description: Release a pulse of raw demonic energy, pushing everyone away from you.
  components:
  - type: Sprite
    sprite: _Trauma/Actions/demon.rsi
    layers:
    - state: repulse
  - type: Action
    useDelay: 25
    raiseOnAction: false
    sound: !type:SoundPathSpecifier
      path: /Audio/_Goobstation/Heretic/disintegrate.ogg


# Goobstation heretic

- type: entity
  id: ActionDemonGaze
  name: Demon Gaze
  description: Generates a massive death beam that eradicates everything in it's path. Has it's own gravitational pull, sucking in new victims.
  components:
  - type: Sprite
    sprite: _Goobstation/Heretic/abilities_heretic.rsi
    layers:
    - state: gazer_beam_charge
  - type: Action
    checkCanInteract: false
    useDelay: 30
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:StarGazeEvent
