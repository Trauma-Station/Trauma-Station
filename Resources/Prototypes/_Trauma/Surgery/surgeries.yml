- type: surgery
  id: OpenIncision
  tool: 
  - type: Scalpel
  surgeryEffects:
  - !type:AddComponents
    components:
    - type: OpenIncision
    - type: BleedingWound
  forbidden:
  - type: OpenIncision
  duration: 2
  complexity: -15

- type: surgery
  id: StopBloodFlow
  tool: 
  - type: Hemostat
  surgeryEffects:
  - !type:RemoveComponents
    components:
    - type: BleedingWound
  required:
  - type: BleedingWound
  duration: 4

- type: surgery
  id: RetractSkin
  tool:
  - type: Retractor
  surgeryEffects:
  - !type:AddComponents
    components:
    - type: RetractedSkin
  required:
  - type: OpenIncision
  forbidden:
  - type: RetractedSkin


- type: surgery
  id: CloseIncision
  tool: 
  - type: Cautery
  surgeryEffects:
  - !type:RemoveComponents
    components:
    - type: OpenIncision
    - type: BleedingWound
    - type: RetractedSkin
  required:
  - type: OpenIncision
  duration: 3

- type: surgery
  id: Amputate
  tool:
  - type: BoneSaw
  surgeryEffects:
  - !type:DetachOrgan
  required:
  - type: OpenIncision
  - type: BreakBone
  - type: RetractedSkin
  duration: 6

- type: surgery
  id: AddPart
  tool:
  - type: Organ
  surgeryEffects:
  - !type:AddBodyPart
  required:
  - type: OpenIncision
  - type: BreakBone
  - type: RetractedSkin
  duration: 6

- type: surgery
  id: RemovePart
  tool:
  - type: Scalpel
  surgeryEffects:
  - !type:RemoveBodyPart
  required:
  - type: OpenIncision
  - type: BreakBone
  - type: RetractedSkin
  duration: 6

- type: surgery
  id: HealBrute
  tool:
  - type: Stitches
  surgeryEffects:
  - !type:HealBodyPart
  required:
  - type: OpenIncision
  duration: 3

- type: surgery
  id: HealBurn
  tool:
  - type: Tending
  surgeryEffects:
  - !type:HealBodyPart
    damageGroup: Burn
  required:
  - type: OpenIncision
  duration: 3

- type: surgery
  id: SawBones
  tool:
  - type: BoneSaw
  surgeryEffects:
  - !type:AddComponents
    components:
    - type: BreakBone
  required:
  - type: OpenIncision
  forbidden:
  - type: BreakBone
  duration: 10

- type: surgery
  id: MendBones
  tool:
  - type: BoneGel
  surgeryEffects:
  - !type:RemoveComponents
    components:
    - type: BreakBone
  required:
  - type: OpenIncision
  - type: BreakBone
  duration: 10

- type: surgery
  id: Lobotomy
  tool:
  - type: Drill
  surgeryEffects:
  - !type:AddComponents
    components:
    - type: OhioAccent
    - type: RatvarianLanguage
    - type: Clumsy
  required:
  - type: OpenIncision
  - type: BreakBone
  - type: Brain
  duration: 10

- type: surgery
  id: FixLobotomy
  tool:
  - type: Hemostat
  surgeryEffects:
  - !type:RemoveComponents
    components:
    - type: OhioAccent
    - type: RatvarianLanguage
    - type: Clumsy
  required:
  - type: OpenIncision
  - type: BreakBone
  - type: Brain
  duration: 10

- type: surgery
  id: UnscrewPanel
  tool:
  - type: Screwdriver
  surgeryEffects:
  - !type:AddComponents
    components:
    - type: PanelOpen
  required:
  - type: Cybernetics
  forbidden:
  - type: PanelOpen
  - type: Brain

- type: surgery
  id: ScrewPanel
  tool:
  - type: Screwdriver
  surgeryEffects:
  - !type:RemoveComponents
    components:
    - type: PanelOpen
  required:
  - type: Cybernetics
  - type: PanelOpen
  - type: Brain
