- type: surgery
  id: OpenIncision
  tool:
  - type: Scalpel
  surgeryEffects:
  - !type:AddWounds
    wounds:
    - OpenIncision
  forbidden:
  - OpenIncision
  duration: 2
  complexity: -15

- type: surgery
  id: StopBloodFlow
  tool:
  - type: Hemostat
  surgeryEffects:
  - !type:AddWounds
    wounds:
    - ClampVeins
  required:
  - OpenIncision
  forbidden:
  - ClampVeins
  duration: 4

- type: surgery
  id: RetractSkin
  tool:
  - type: Retractor
  surgeryEffects:
  - !type:AddWounds
    wounds:
    - RetractedSkin
  required:
  - OpenIncision
  forbidden:
  - RetractedSkin

- type: surgery
  id: CloseIncision
  tool:
  - type: Cautery
  surgeryEffects:
  - !type:RemoveWounds
    wounds:
    - OpenIncision
    - ClampVeins
    - RetractedSkin
  required:
  - OpenIncision
  duration: 3

- type: surgery
  id: Amputate
  tool:
  - type: BoneSaw
  surgeryEffects:
  - !type:DetachOrgan
  required:
  - OpenIncision
  - SawedBones
  - RetractedSkin
  duration: 6

- type: surgery
  id: AddPart
  tool:
  - type: Organ
  surgeryEffects:
  - !type:AddBodyPart
  required:
  - OpenIncision
  - SawedBones
  - RetractedSkin
  duration: 6

- type: surgery
  id: RemovePart
  tool:
  - type: Scalpel
  surgeryEffects:
  - !type:RemoveBodyPart
  required:
  - OpenIncision
  - SawedBones
  - RetractedSkin
  duration: 6

- type: surgery
  id: HealBrute
  tool:
  - type: Stitches
  surgeryEffects:
  - !type:HealBodyPart
  required:
  - OpenIncision
  duration: 3
  repeat: true

- type: surgery
  id: HealBurn
  tool:
  - type: Tending
  surgeryEffects:
  - !type:HealBodyPart
    damageGroup: Burn
  required:
  - OpenIncision
  duration: 3
  repeat: true

- type: surgery
  id: SawBones
  tool:
  - type: BoneSaw
  surgeryEffects:
  - !type:AddWounds
    wounds:
    - SawedBones
  required:
  - OpenIncision
  forbidden:
  - SawedBones
  duration: 10

- type: surgery
  id: MendBones
  tool:
  - type: BoneGel
  surgeryEffects:
  - !type:RemoveWounds
    wounds:
    - SawedBones
  required:
  - OpenIncision
  - SawedBones
  duration: 10

