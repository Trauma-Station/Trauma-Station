# Leg sweep

- type: combo
  id: CQCLegSweep
  attacks:
  - Harm
  userConditions:
  - !type:StandingCondition
    inverted: true # user must be downed
    failMessage: martial-arts-fail-standing
  conditions:
  - !type:StandingCondition
    failMessage: martial-arts-fail-target-down
  userEffects:
  - !type:PlaySoundEffect
    sound: /Audio/Weapons/genhit1.ogg
  - !type:PopupMessage
    messages:
    - cqc-leg-sweep
  opponentEffects:
  - !type:LegSweep
    time: 5

# Neck snap

- type: combo
  abstract: true
  id: BaseCQCHeadCombo
  userConditions:
  - !type:TargetingCondition
    target: Head
  conditions:
  # no fail popups since its a single intent
  - !type:HasOrgan
    organCategory: Head
  - !type:PulledByUser
  - !type:StaminaCritical

- type: combo
  abstract: true # TODO: enable if finished
  parent: BaseCQCHeadCombo
  id: CQCNeckSnap
  attacks:
  - Harm
  # TODO: break neck, damage head until dead
  levelRequired: 60

