# Slam

- type: combo
  id: CQCSlam
  attacks:
  - Grab
  - Harm
  userEffects:
  - !type:PlaySoundEffect
    sound: /Audio/Weapons/genhit2.ogg
  - !type:PopupMessage
    messages:
    - cqc-slam
  opponentEffects:
  - !type:TakeStaminaDamage
    amount: 25
  - !type:HealthChange
    targetPart: Chest
    damage:
      types:
        Blunt: 12
  - !type:ModifyKnockdown
    time: 5
    drop: true

# Kick

- type: combo
  id: CQCKick
  attacks:
  - Harm
  - Harm
  # cant kick without legs
  userConditions:
  - !type:HasOrgan
    organCategory: LegLeft
  - !type:HasOrgan
    organCategory: LegRight
  userEffects:
  - !type:PlaySoundEffect
    sound: /Audio/Weapons/genhit2.ogg
  - !type:PopupMessage
    messages:
    - cqc-kick
  opponentEffects:
  - !type:StopPull
  - !type:GrabThrow
  - !type:IfElse
    condition: !type:StandingCondition
      inverted: true
    trueEffects: # kicking someone on the ground is much stronger
    - !type:TakeStaminaDamage
      amount: 55
    - !type:HealthChange
      targetPart: Head
      damage:
        types:
          Blunt: 20
    - !type:ModifyStatusEffect
      effectProto: StatusEffectForcedSleeping
      time: 12
      conditions:
      - !type:StaminaCritical
    falseEffects:
    - !type:TakeStaminaDamage
      amount: 25

