- type: combo
  id: PushKick
  attacks:
  - Grab
  - Harm
  - Harm
  userConditions:
  - !type:StandingCondition
  userEffects:
  - !type:PlaySoundEffect
    sound: /Audio/Weapons/genhit3.ogg
  - !type:TakeStaminaDamage
    amount: -30
    scaling: false
  opponentEffects:
  - !type:ModifyKnockdown
    time: 2
  - !type:HealthChange
    targetPart: Chest
    damage:
      types:
        Blunt: 5
  - !type:ModifyStatusEffect
    effectProto: PushKickVulnerabilityStatusEffect
    type: Update
    time: 2
  - !type:GrabThrow
    speed: 5
    dropItems: true
  levelRequired: 10

