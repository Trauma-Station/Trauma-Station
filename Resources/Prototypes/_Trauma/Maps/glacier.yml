- type: gameMap
  id: Glacier
  mapName: Glacier
  mapPath: /Maps/_Trauma/glacier.yml
  maxRandomOffset: 0
  randomRotation: false
  minPlayers: 15
  maxPlayers: 70
  stations:
    Glacier:
      stationProto: StandardNanotrasenStation
      components:
      - type: StationNameSetup
        mapNameTemplate: '{0} Glacier Station {1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: 'NY'
      - type: StationEmergencyShuttle
        emergencyShuttlePath: /Maps/Shuttles/emergency_box.yml
      - type: StationBiome
        biome: Glacier
        mapLightColor: Orange
      - type: StationEffects
        effects:
        - !type:ModifyStatusEffect
          effectProto: WeatherSchedulerGlacier # Permanent snowstorms
          time: null
      - type: StationJobs
        availableJobs:
          Captain: [ 1, 1 ]
