- type: entity
  parent: BaseItem
  id: LeshySkull
  name: Leshy Skull
  description: The skull of Leshy!
  components:
  - type: Sprite
    sprite: _Trauma/Glacier/artifacts.rsi
    state: wendigo_skull

- type: entity
  parent: BaseItem
  id: LeshyHorn
  name: Leshy Skull
  description: The horn of Leshy!
  components:
  - type: Sprite
    sprite: _Trauma/Glacier/artifacts.rsi
    state: wendigo_horn

- type: entity
  parent: BaseDemonBottle
  id: LeshyBlood
  name: Leshy Blood
  description: A vial containing ominous blood...
  components:
  - type: Sprite
    state: vial
  - type: Edible
    edible: Drink
    solution: drink
  - type: Solution
    id: drink
    solution:
      reagents:
      - ReagentId: LeshyBlood
        Quantity: 5

- type: entity
  parent: BaseItem
  id: ResurrectionCrystal
  name: Resurrection Crystal
  description: Use in-hand to absorb. Once absorbed, you will teleport to a random safe tile in the station when you die. There's a cost, however...
  components:
  - type: Sprite
    sprite: _Lavaland/Objects/Specific/Lavaland/loot.rsi
    state: crystal
  - type: EntityEffectOnUse
    effects:
    - !type:Delete
      queued: true
    userEffects:
    - !type:PopupMessage
      messages: [ resurrection-crystal-done ]
      type: Local
      method: PopupEntity
      visualType: LargeCaution
    - !type:AddComponents
      components:
      - type: ResurrectionCrystal
        polymorph: CrystalShadowPolymorph # this is evil ngl

- type: entity
  parent: [ MiningDrillDiamond, BaseMagicalContraband ]
  id: DemonicJackhammer
  name: Demonic Jackhammer
  description: This jackhammer instantly dusts any rock that it comes into contact with. Has knockback, and heals you for every attack.
  components:
  # Knockback effects for normal targets
  - type: MeleeThrowOnHit
    distance: 3
    speed: 2.5
  # User healing on hit
  - type: EffectsOnMeleeHit
    userEffects:
    - !type:HealthChange
      damage:
        types:
          Blunt: -6
          Slash: -6
          Piercing: -6
          Ballistic: -6
          Heat: -6
          Cold: -6
          Shock: -6
          Caustic: -6
    # Instantly destroy rocks only, and spawn ash
    targetConditions:
    - !type:WhitelistCondition
      whitelist:
        components:
        - MiningScannerViewable
    targetEffects:
    - !type:SpawnEntity
      entity: Ash
    - !type:HealthChange
      damage:
        types:
          Structural: 999 # ensures we destroy it
