- type: entity
  id: MobWendigo
  name: wendigo
  description: A chud.
  components:
  # Basic stuff
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.6,0.35,0.6"
        density: 10000 # 10 tons. Can't really push this thing
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: _Trauma/Glacier/Bosses/wendigo.rsi
    state: wendigo
  - type: Clickable
  - type: InteractionOutline
  - type: InputMover
  - type: Input
    context: "human"
  - type: LagCompensation
  - type: MobMover
  - type: Actions
  - type: Appearance
  - type: RotationVisuals
    defaultRotation: 0
    horizontalRotation: 0
  - type: DoAfter
  - type: Examiner
  - type: Eye
  - type: ContentEye
  - type: RequireProjectileTarget
    active: False
  - type: CombatMode
  - type: MobState
  - type: Damageable
    damageModifierSet: Hierophant
  - type: Injurable
    damageContainer: Inorganic
  - type: NoSlip
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.5
    baseSprintSpeed: 1.5
  - type: MobThresholds
    thresholds:
      0: Alive
      2500: Dead
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    animation: WeaponArcSlash
    damage:
      types:
        Blunt: 40
  - type: Tag
    tags:
    - CannotSuicide
  # HTN chaser
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  # Actual boss from here
  - type: ActionGrant
    actions:
    - ActionWendigoTeleport
    - ActionWendigoHeavyStomp
  - type: Fauna
  - type: Anger
    totalHp: 2500
  - type: Aggressive
    forgiveRange: 25
  - type: MobPhases
    phaseThresholds:
      0:    1
      1250: 2
  - type: BossMusic
    soundId: Hierophant # todo change
  - type: TileMovement
 # - type: DamageSquareImmunity
  - type: SpawnLootOnDeath
    table: !type:AllSelector
      children:
      - id: LavalandHierophantClub # todo change (wendigo skull)
      - id: CrusherUpgradeMainMarker # todo change (wendigo bottle)
    deleteOnDeath: true
  - type: MegafaunaAi
    actionDelay: 0.5
    selector:
      id: Wendigo
  - type: AngerPlayerScaling
    angerScale: 1.1
    hpScale: 1.2
  - type: MegafaunaAnchor
  - type: MegafaunaGodmode
  - type: MegafaunaRejuvenate

- type: megafaunaSelector
  id: Wendigo
  selector: !type:AllMegafaunaSelector
    children:
    - id: PickTargetSimple
    - id: WendigoActions

# Actions
- type: megafaunaSelector
  id: WendigoActions
  selector: !type:GroupMegafaunaSelector
    children:
    - id: ActionWendigoTeleport
    - id: ActionWendigoHeavyStomp

- type: megafaunaSelector
  id: ActionWendigoTeleport
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 0.1,0.5
      inverse: true
    actionId: ActionWendigoTeleport
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionWendigoTeleport
    # todo: check if we are in a middle of a doafter here so it doesn't cancel

- type: megafaunaSelector
  id: ActionWendigoHeavyStomp
  selector: !type:PerformActionSelector
    delay: !type:AngerNumberSelector
      range: 1.0,4.0
      inverse: true
    actionId: ActionWendigoHeavyStomp
    conditions:
    - !type:ActionAvailableCondition
      actionId: ActionWendigoHeavyStomp
    # todo: check if we are in a middle of a doafter here so it doesn't cancel
