- type: entity
  parent: BaseAction
  id: ActionWendigoHeavyStomp
  name: Heavy Stomp (Phase I)
  description: You stomp the ground, sending out a shockwave that knocks people back.
  components:
  - type: Action
    useDelay: 10
    raiseOnAction: true
  - type: Sprite
  - type: EntityTargetAction
    event: !type:HandleTargetActionEvent
  - type: TargetAction
    range: 30
  - type: DoAfterArgs
    delay: 5
  - type: ActionRequirements
    effects:
      Performer:
      - !type:RelayNearby
        compName: StatusEffects
        range: 5
        effect: !type:NestedEffect
          proto: WendigoStomp
      - !type:SpawnParticles
        particleProto: VampireStompShockwave # todo replace

- type: entity
  parent: BaseAction
  id: ActionWendigoTeleport
  name: Teleport
  description: You teleport to a random tile from your target.
  components:
  - type: Action
    useDelay: 10
    raiseOnAction: true
    itemIconStyle: BigAction
    checkCanInteract: false
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/blink.ogg # todo replace
  - type: Sprite
    sprite: _Goobstation/Wizard/actions.rsi # todo replace
    layers:
    - state: blink
  - type: TargetAction
    interactOnMiss: false
    range: 2
  - type: EntityTargetAction
    event: !type:HandleTargetActionEvent
    whitelist:
      components:
      - Body
  - type: ActionRequirements
    effects:
      Performer:
      - !type:RandomTeleport
        radius:
          min: 4.0
          max: 4.0

# Projectile Variants
- type: entity
  parent: BaseAction
  id: ActionWendigoProjectileSpread
  name: Projectile Spread (360)
  components:
  - type: Action
    useDelay: 0
    raiseOnAction: true
    itemIconStyle: BigAction
    checkCanInteract: false
  - type: TargetAction
    interactOnMiss: false
    range: 30
  - type: Sprite
    sprite: _Goobstation/Wizard/actions.rsi # todo replace
    layers:
    - state: blink
  - type: EntityTargetAction
    event: !type:HandleTargetActionEvent
  - type: ActionRequirements
    effects:
      Performer:
      - !type:ShootProjectileAdvanced
        projectile: ProjectileLeshyDeathBolt
        amount: 10
        speed: 10
        spread: true
        fullAngle: 360

- type: entity
  parent: ActionWendigoProjectileSpread
  id: ActionWendigoProjectileSpreadShotgun
  name: Projectile Spread (Shotgun)
  components:
  - type: EntityTargetAction
    event: !type:HandleTargetActionEvent
  - type: ActionRequirements
    effects:
      Performer:
      - !type:ShootProjectileAdvanced
        projectile: ProjectileLeshyDeathBolt
        amount: 10
        spreadAngles:
          min: 1
          max: 2
        speed: 15

# Phase II abilities
- type: entity
  parent: ActionWendigoHeavyStomp
  id: ActionWendigoHeavyStompII
  name: Heavy Stomp (Phase II)
  components:
  - type: ActionRequirements
    effects:
      Performer:
      - !type:RelayNearby
        compName: StatusEffects
        range: 10
        effect: !type:NestedEffect
          proto: WendigoStomp
      - !type:SpawnParticles
        particleProto: VampireStomp # doesn't matter

# Polymorph to Polar Bear
- type: entity
  parent: BaseActionPolymorph
  id: ActionPolymorphPolarBear
  name: Polar Bear Polymorph
  description: Polymorphs you into a Polar bear.
  components:
  - type: Sprite
    sprite: Mobs/Animals/bear.rsi
    state: bear
  - type: InstantAction
    event: !type:PolymorphActionEvent
      protoId: PolarBearPolymorph

- type: polymorph
  id: PolarBearPolymorph
  configuration:
    entity: MobBearSpace
    transferName: true
    inventory: None
    revertOnDeath: true
    revertOnCrit: true
