- type: entity
  abstract: true
  parent: BaseAction
  id: BaseFrostMinerAction
  components:
  - type: Action
    useDelay: 8
    raiseOnAction: true
    checkCanInteract: false
  - type: EntityTargetAction
    event: !type:ActionProjectileAdvancedEvent
  - type: TargetAction
    range: 30
    interactOnMiss: false

# First we bullet, then we hell. This is... bullet hell!
- type: entity
  parent: BaseFrostMinerAction
  id: ActionFrostOrbsEasy
  name: Frost Orbs (Easy)
  description: Shoots out eight frost orbs that home in after a second, and detonate after ten seconds, exploding into five ice blast projectiles.
  components:
  - type: ActionProjectileAdvanced
    projectilePatterns:
    - projProto: ProjectileFrostMinerOrb
      angle: 360
      amount: 6
      speed: 0.5

- type: entity
  parent: BaseFrostMinerAction
  id: ActionFrostOrbsHard
  name: Frost Orbs (Hard)
  description: Shoots out sixteen frost orbs that home in after a second, and detonate after ten seconds, exploding into five ice blast projectiles.
  components:
  - type: ActionProjectileAdvanced
    projectilePatterns:
    - projProto: ProjectileFrostMinerOrb
      angle: 360
      amount: 16
      speed: 0.5

