- type: entity
  abstract: true
  parent: BaseBullet
  id: ProjectileFrostMiner
  components:
  - type: Sprite
    sprite: _Trauma/Glacier/Entities/projectiles.rsi
  - type: PointLight
    color: Blue
    radius: 2.0
    energy: 5.0
  - type: Projectile
    ignoreResistances: true
    soundHit:
      collection: GlassBreak

- type: entity
  parent: ProjectileFrostMiner
  id: ProjectileFrostMinerOrb
  name: frost orb
  components:
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
        Heat: 20
  - type: Sprite
    layers:
    - state: ice_1
      shader: unshaded
  - type: TimedDespawn
    lifetime: 10
  - type: SpawnOnDespawn
    prototype: IceBlastsOnSpawn

- type: entity
  parent: ProjectileFrostMiner
  id: ProjectileIceBlast
  name: ice blast
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 15
  - type: Sprite
    layers:
    - state: ice_2
      shader: unshaded

# Low damage Ice blast
- type: entity
  parent: ProjectileIceBlast
  id: ProjectileIceBlastLow
  name: ice blast
  components:
  - type: Projectile
    damage:
      types:
        Blunt: 5

# Larp
- type: entity
  id: IceBlastsOnSpawn
  name: huh?
  components:
  - type: TriggerOnSpawn
  - type: EntityEffectOnTrigger
    effects:
    - !type:ShootProjectileAdvanced
      projectile: ProjectileIceBlastLow
      amount: 5
      speed: 15
      spread: true
      fullAngle: 360
    - !type:Delete
