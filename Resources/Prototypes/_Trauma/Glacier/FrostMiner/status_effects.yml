- type: entity
  parent: MobStatusEffectBase
  id: FrostMinerPhase4
  components:
  # Rotate a lot
  - type: StatusEffectEffects
    updateDelay: 0.1
    effects:
    - !type:Rotate
      angle: 90
      force: true
      type: Adjust
  - type: StatusEffectEffectsApply
    effectsOnApply:
    # Godmode so salvs don't abuse this
    - !type:AddComponents
      components:
      - type: Godmode
    - !type:RemoveComponents
      components:
      - type: HTN
        rootTask:
          task: SimpleHostileCompound
      - type: NpcFactionMember
        factions:
        - SimpleHostile
    effectsOnRemoval:
    # Good luck!
    - !type:SpawnAttached
      entity: FrostMinerPhase4Effect
    - !type:MovementSpeedModifier
      walkSpeedModifier: 2.0
      sprintSpeedModifier: 2.0
      time: null
    - !type:MegafaunaActionDelay
      actionDelay: 1.0
    - !type:RemoveComponents
      components:
      - type: Godmode
    - !type:AddComponents
      components:
      - type: HTN
        rootTask:
          task: SimpleHostileCompound
      - type: NpcFactionMember
        factions:
        - SimpleHostile

# Scale status effect
- type: entity
  parent: StatusEffectBase
  id: FrostMinerPhase4Scale
  components:
  - type: StatusEffectEffects
    updateDelay: 0.01
    effects:
    - !type:Scale
      multiplier: 1.05, 1.05

# Status effect for players fighting the boss (added/removed by arena teleporter)
- type: entity
  parent: StatusEffectSpeed
  id: FrostMinerSpeedStatusEffect
  components:
  - type: MovementModStatusEffect
    sprintSpeedModifier: 1.8
    walkSpeedModifier: 1.8

# I'm evil
- type: entity
  id: FrostMinerPhase4Effect
  components:
  - type: FadingTimedDespawn
    lifetime: 0.8
    fadeOutTime: 0.6
  - type: Sprite
    noRot: true
    drawdepth: Effects
    sprite: _Trauma/Glacier/Bosses/demonic_miner.rsi
    state: demonic_miner_phase2
  - type: PermanentStatusEffects
    statusEffects:
    - FrostMinerPhase4Scale

# I'm evil 2
- type: entity
  parent: StatusEffectBase
  id: IceTrailStatusEffect
  components:
  - type: StatusEffectEffects
    updateDelay: 0.1
    effects:
    - !type:SpawnSnappedToGrid
      conditions:
      - !type:AnyNearbyCondition # don't spawn on same tile
        whitelist:
          tags:
          - DemonicIceCrust
        inverted: true
        compName: TileFrictionModifier
        range: 0.5
      entity: DemonicIceCrust
      predicted: false
