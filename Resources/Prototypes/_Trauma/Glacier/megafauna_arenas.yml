- type: entity
  abstract: true
  id: LeshyArenaTeleporter
  components:
  - type: TeleportToArena
    arenaPath: /Maps/_Trauma/Glacier/leshy_arena.yml

- type: entity
  parent: StairStageWood
  id: FrostMinerArenaTeleporter
  components:
  - type: TeleportToArena
    arenaPath: /Maps/_Trauma/Glacier/frost_miner_arena.yml
    effectsOnEnter:
    - !type:ModifyStatusEffect
      effectProto: FrostMinerSpeedStatusEffect
      time: null
      type: Add
    effectsOnExit:
    - !type:ModifyStatusEffect
      effectProto: FrostMinerSpeedStatusEffect
      time: null
      type: Remove
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 666666 # no trolling

- type: entity
  parent: [ BaseStructure, LeshyArenaTeleporter ]
  id: LeshySomething
  name: test
  description: test
  components:
  - type: Sprite
    sprite: Structures/Furniture/chairs.rsi
    state: chair
