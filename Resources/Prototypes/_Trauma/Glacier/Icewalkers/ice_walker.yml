- type: entity
  save: false
  parent: [ AppearanceIceWalker, MobReptilian ]
  id: MobIceWalker
  name: Urissst McAishh
  description: A frozen lizard.
  components:
  - type: HumanoidProfile
    species: IceWalker
  - type: KnowledgeGrant
    skills:
      MeleeKnowledge: 26
      CarvingKnowledge: 50
      FabricationKnowledge: 50
      WeaponsKnowledge: 75
      ArmorKnowledge: 50
  - type: LanguageKnowledge
    languageId: Draconic
  - type: LanguageSpeaker
    speaks:      [ Draconic ]
    understands: [ Draconic ]
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 8
  - type: NightVision
    action: ActionToggleNightVision
    lightingColor: white
  - type: TemperatureDamage
    coldDamageThreshold: 0   # Some kind of ice... walkers?
    coldDamage:
      types:
        Cold: 0
    heatDamage:
      types:
        Heat: 2
  - type: MovementSpeedModifier
    baseWalkSpeed : 0.95
    baseSprintSpeed : 0.95
  - type: PermanentStatusEffects
    statusEffects:  [ StatusEffectClumsyAll ]

- type: entity
  parent: MobIceWalker
  id: IceWalker
  name: ice walker
  components:
  - type: Loadout
    prototypes: [ IceWalkerGear ]
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: RandomMetadata
    nameSegments: [ NamesReptilianMale ]

- type: entity
  id: SpawnPointGhostIceWalker
  name: ice walker spawn point
  suffix: ice walker
  parent: MarkerBase
  components:
  - type: GhostRole
    name: ghost-role-information-ice-walker-name
    description: ghost-role-information-ice-walker-description
    rules: ghost-role-information-ice-walker-rules
    raffle:
      settings: default
  - type: GhostRoleMobSpawner
    prototype: IceWalker
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green
    - sprite: _Trauma/Glacier/Icewalkers/icewalker_egg.rsi
      state: large-egg
