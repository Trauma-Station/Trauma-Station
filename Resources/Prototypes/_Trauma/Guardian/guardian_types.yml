# Standard
- type: entity
  id: MobHoloparasiteGuardianStandard
  parent: MobHoloparasiteGuardian
  components:
  - type: Sprite
    layers:
    - state: tech_base
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: tech_flare
      map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      color: "#15ffa1"
      shader: unshaded
  - type: Guardian
    damageShare: 0.4
  - type: MeleeWeapon
    resistanceBypass: true
    damage:
      types:
        Blunt: 20
        Structural: 100
  - type: MeleeSpeech
    Battlecry: ORA
    MaxBattlecryLength: 8
  - type: GuardianFearAura
    radius: 2

- type: entity
  parent: StatusEffectSlowdown
  id: GuardianFearSlowdownStatusEffect
  name: guardian fear slowdown

# Assassin
- type: entity
  id: MobHoloparasiteGuardianAssassin
  parent: MobHoloparasiteGuardian
  description: A shard of razor-sharp hard-light, perpetually flickering at the edge of visibility. It hunts, tuning into its owner's life to sustain itself.
  components:
  - type: Sprite
    layers:
    - state: tech_base
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: tech_flare
      map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      color: "#a11616"
      shader: unshaded
  - type: Guardian
    damageShare: 1.0
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 30
        Poison: 5
  - type: GuardianAssassin
  - type: ActionGrant
    actions:
    - ActionGuardianAssassinStealth

- type: entity
  parent: BaseAction
  id: ActionGuardianAssassinStealth
  name: guardian-assassin-stealth-action-name
  description: guardian-assassin-stealth-action-description
  components:
  - type: Action
    icon:
      sprite: _Goobstation/Wizard/actions.rsi
      state: jaunt
    useDelay: 12
    itemIconStyle: BigAction
  - type: InstantAction
    event: !type:GuardianStealthToggleEvent

- type: entity
  parent: ForcedStealthStatusEffect
  id: ForcedStealthStatusEffectAssassin
  name: stealth
  description: You are completely invisible.
  components:
  - type: ForcedStealthStatusEffect
    visibility: 0.08
    revealOnAttack: true
    revealOnDamage: true

# Lightning
- type: entity
  id: MobHoloparasiteGuardianLightning
  parent: MobHoloparasiteGuardian
  description: A coiled serpent of crackling hard-light, snapping with static discharge. It weaves, tuning into its owner's life to sustain itself.
  components:
  - type: Sprite
    layers:
    - state: tech_base
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: tech_flare
      map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      color: "#38bdf8"
      shader: unshaded
  - type: Guardian
    damageShare: 0.6
  - type: MeleeWeapon
    damage:
      types:
        Heat: 15
  - type: GuardianLightning
  - type: ActionGrant
    actions:
    - ActionGuardianLightningBolt

- type: entity
  parent: BaseAction
  id: ActionGuardianLightningBolt
  name: Lightning Bolt
  description: Zap a target with a bolt of lightning, stunning it and chaining to nearby enemies. People with electricity resistance cannot be targeted.
  components:
  - type: Action
    icon:
      sprite: _Trauma/Actions/mutations.rsi
      state: zap
    useDelay: 5
    itemIconStyle: BigAction
  - type: TargetAction
    interactOnMiss: false
    range: 7
  - type: EntityTargetAction
    whitelist:
      components:
      - MobState
    canTargetSelf: false
    event: !type:GuardianLightningBoltEvent

- type: entity
  name: guardian lightning
  id: GuardianLightning
  parent: ChargedLightning
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: "blue_lightning"
      color: "#facc15"
      shader: unshaded
  - type: PointLight
    color: "#facc15"
  - type: Electrified
    shockTime: 5
    requirePower: false
    shockDamage: 0
    ignoreInsulation: true
  - type: Lightning
    canArc: true

- type: entity
  name: guardian lightning discharge
  id: GuardianLightningPassive
  parent: ChargedLightning
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: "blue_lightning"
      color: "#7dd3fc"
      shader: unshaded
  - type: PointLight
    color: "#7dd3fc"
  - type: Electrified
    shockTime: 0
    requirePower: false
    shockDamage: 0
    ignoreInsulation: false
  - type: Lightning
    canArc: true

