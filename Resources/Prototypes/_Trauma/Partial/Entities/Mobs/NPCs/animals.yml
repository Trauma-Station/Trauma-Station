- type: entity
  id: MobGiantSpiderAngry
  components:
  - type: MobSpam
  - type: Tag
    tags:
    - Spider
  - type: ActionGrant
    actions:
    - ActionSpiderCall
  - type: MobCallSource
    whitelist:
      tags:
      - Spider
  - type: MobCallable
  - type: HTN
    constantlyReplan: false
    rootTask:
      task: SpiderCompound
  - type: ShadowCocoonMaker
    cocoonDelay: 15
    shadowCocoon: SpiderEggsHuman
    verbText: "Infest victim"
  - type: EntityProducerAction
    insufficientSatiationPopup: action-popup-lay-egg-too-hungry
    userPopup: action-popup-lay-egg-user
    othersPopup: action-popup-lay-egg-others
  - type: SatiationProduction
    delay: 60
    delayMax: 120
    satiationUsage: 140
    minimumSatiation: 140
    automaticForPlayers: false
  - type: EntityProducer
    table:
      id: SpiderEggs
  - type: ActionGrant
    actions:
    - SpiderMultiply
  - type: Satiation
    satiations:
      Hunger:
        prototype: SpiderHunger
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Dead
  # - type: Hands # TODO - Make spiders only able to hold webs
  - type: Puller
    needsHands: false
  - type: Inventory
    templateId: xenomorph
  - type: ComplexInteraction
  # </Trauma>

