    skinnedSprite: _Trauma/Mobs/Animals/skinnedmonkey.rsi
    unskinnedSprite: Mobs/Animals/monkey.rsi
  - type: Mutatable
    defaultMutations:
      MutationMonkified: 1.0 # always monkey...
    dormant:
    - MutationMonkified
  - type: KnowledgeHolder
