- type: entity
  parent:
  - !Remove BaseMobAnimal
  - BaseMobMouse
  - BaseAnimalGhostRole
  id: MobMouse
  components:
  - type: Penetratable
    penetrateDamage: 3 # 3-5 kills per bullet
  - type: ZombieImmune
  - type: VentCrawler
    enterDelay: 0.5
  - type: AnimatedEmotes
    tweakState: mouse-tweaking-0
  - type: SolutionManager
    solutions:
    - SolutionMouseBites
  - type: MeleeChemicalInjector
    transferAmount: 1
    solution: melee
  - type: Stamina
    baseCritThreshold: 20
    animationThreshold: 10
  - type: Crawler
  - type: NPCRetaliation
    attackMemoryLength: 5 # stop caring fast if you don't keep hitting
  - type: GroupRetaliation
    range: 5 # slightly lower for mice
  - type: CollectiveMind
    defaultChannel: Mousemind
    channels:
    - Mousemind
  - type: FaxSlip
    slipChance: 0.3
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTypeTrigger
        damageType: Blunt
        damage: 100
      behaviors:
      - !type:GibBehavior
        deleteGibs: true
        recursive: false
  - type: ActionGrant
    actions:
    - ActionMouseCall
  - type: MobCallSource
    whitelist:
      tags:
      - Mouse
  - type: MobCallable
  - type: XenoCompatible # to let egg sack surgeries work nicely...
  - type: MobSpam # no 500 dead mice lagging the server
  - type: LanguageSpeaker
    speaks:
    - Mouse
    understands:
    - Mouse
    - TauCetiBasic
  - type: GhostRole
    prob: 0.3 # not guaranteed anymore
  - type: MeleeWeapon
    altDisarm: false # Sorry mouse shove lovers.
    damage:
      types:
        Slash: 1
  - type: Bloodstream
    smokeImmune: true # prevent server lagging mouse farms
  - !Remove type: ReplacementAccent

