- type: entity
  id: BulletDisabler
  components:
  - &disabler_fixtures
    type: Fixtures
    fixtures:
      projectile:
        mask:
        - !Remove Impassable
        - !Remove BulletImpassable
  - type: StaminaDamageOnCollide
    damage: 22

- type: entity
  id: BulletDisablerPractice
  components:
  - *disabler_fixtures

- type: entity
  id: BulletDisablerSmg
  components:
  - *disabler_fixtures
  - type: StaminaDamageOnCollide
    damage: 13

- type: entity
  id: EnergyCrossbowBolt
  components:
  - type: Projectile
    damage:
      types: !Clear
        Ballistic: 2
