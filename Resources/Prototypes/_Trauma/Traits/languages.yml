# TODO: A trait that removes your secondary language so that players have options besides taking foreigner

- type: trait
  id: Calcic
  name: language-Calcic-name # The other language traits have identical name and desc anyway, so why bother copy-pasting locale?
  description: language-Calcic-desc
  category: LanguageTraits
  cost: 2
  blacklist:
    components:
      - BorgChassis
  components:
  - type: LanguageSpeaker
  languagesSpoken:
    - Calcic
  languagesUnderstood:
    - Calcic

