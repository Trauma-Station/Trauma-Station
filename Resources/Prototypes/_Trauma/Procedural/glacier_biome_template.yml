# The world of Glacier (WIP)
- type: biomeTemplate
  id: Glacier
  layers:
  - !type:BiomeMetaLayer
    template: SnowGlacier
    threshold: -0.5
    noise:
      frequency: 0.003
      noiseType: OpenSimplex2
      fractalType: FBm
      octaves: 2
      lacunarity: 2

# A basic snowy biome with trees, but without lava
# Some fauna, here and there and possibly small ruins
- type: biomeTemplate
  id: SnowGlacier
  layers:
  # Sparse vegetation
  - !type:BiomeDecalLayer
    allowedTiles:
    - FloorSnow
    divisions: 2
    threshold: -0.50
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 1
    decals:
    - grasssnowa1
    - grasssnowa2
    - grasssnowa3
    - grasssnowb1
    - grasssnowb2
    - grasssnowb3
    - grasssnowc1
    - grasssnowc2
    - grasssnowc3
  # Dense, bland grass
  - !type:BiomeDecalLayer
    allowedTiles:
    - FloorSnow
    divisions: 1
    threshold: -0.35
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 0.2
      fractalType: FBm
      octaves: 5
      lacunarity: 2
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
    decals:
    - grasssnow
    - grasssnow01
    - grasssnow02
    - grasssnow03
    - grasssnow04
    - grasssnow05
    - grasssnow06
    - grasssnow07
    - grasssnow08
    - grasssnow09
    - grasssnow10
    - grasssnow11
    - grasssnow12
    - grasssnow13
  # Little bit of coloured grass
  - !type:BiomeDecalLayer
    allowedTiles:
    - FloorSnow
    divisions: 1
    threshold: -0.0
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 1
      fractalType: None
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
    decals:
    - bushsnowa1
    - bushsnowa2
    - bushsnowa3
    - bushsnowb3
    - bushsnowb2
    - bushsnowb3
  - !type:BiomeEntityLayer
    threshold: 0.5
    noise:
      seed: 0
      noiseType: OpenSimplex2
      fractalType: FBm
      frequency: 2
    allowedTiles:
    - FloorSnow
    entities:
    - FloraTreeSnow
  # Rock formations
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorSnow
    threshold: -0.30
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 0.05
      lacunarity: 2
      fractalType: FBm
      octaves: 5
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
    entities:
    - WallRockSnow
  - !type:BiomeDummyLayer
    id: Loot
  - !type:BiomeTileLayer
    threshold: -0.7
    tile: FloorSnow
    noise:
      seed: 0
      frequency: 0.02
      fractalType: None
