- type: entity
  name: Devil's Pitchfork
  parent: [BaseItem, BaseMagicalContraband]
  id: DevilPitchfork
  description: A Devil's pitchfork.
  components:
  - type: EmbeddableProjectile
    offset: -0.15,0.0
  - type: ThrowingAngle
    angle: 225
  - type: LandAtCursor
  - type: Tag
    tags:
    - Spear
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.08,-0.06
          - -0.06,-0.08
          - 0.40,0.30
          - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sharp
  - type: Sprite
    sprite: _Trauma/Devil/spear.rsi
    layers:
    - state: pitchfork1
  - type: MeleeWeapon
    animationRotation: -135 # WWDP
    wideAnimationRotation: -135
    damage:
      types:
        Piercing: 12
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 25
        Heat: 5
  - type: Item
    size: Ginormous
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: SolutionContainerManager
    solutions:
      melee:
        maxVol: 5
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 10
  - type: UseDelay
  - type: ThrowableBlocked
  - type: DevilPitchfork

- type: entity
  name: Devil's Pitchfork
  parent: DevilPitchfork
  id: GreaterDevilPitchfork
  description: A Devil's pitchfork.
  components:
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 24
        Heat: 10