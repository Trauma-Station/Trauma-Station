- type: htnCompound
  id: ArrestWantedNearbyCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickNearbyTargetOperator
            targetKey: Target
            targetMoveKey: TargetCoordinates
            criminalStatus: SecurityIconHostile
            targetFoundSound: !type:SoundCollectionSpecifier
              collection: Ed209TargetFound

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            targetKey: TargetCoordinates
            pathfindInPlanning: false
            removeKeyOnFinish: false

        - !type:HTNCompoundTask
          task: ArrestTargetCompound

- type: htnCompound
  id: ArrestTargetCompound
  branches:
    - preconditions:
        - !type:TargetStunnedPrecondition
          stunned: true
          targetKey: Target
        - !type:TargetKeyExistsPrecondition
          key: HandcuffItem
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:ForceHandcuffOperator
            targetKey: Target
            handcuffKey: HandcuffItem
            targetArrestedSoundKey: TargetArrestedSound
        - !type:HTNPrimitiveTask
          operator: !type:SendRadioOperator
            message: securitron-target-arrested
            radioChannel: Security
            key: Target

    - preconditions:
        - !type:TargetStunnedPrecondition
          stunned: true
          targetKey: Target
        - !type:TargetKeyExistsPrecondition
          key: HandcuffItem
          invert: true
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:SpawnHandcuffOperator
            handcuffKey: HandcuffItem
            handcuffPrototype: Handcuffs

    - preconditions:
        - !type:TargetStunnedPrecondition
          stunned: false
          targetKey: Target
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:MeleeOperator
            targetKey: Target
