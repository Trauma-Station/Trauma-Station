- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseBloodCultRule
  components:
  - type: GameRule
    minPlayers: 30
  - type: BloodCultRule
    # TODO: base it off map areas with a habitable blacklist for maints and stuff
    areaPool:
    - AreaAiCore
    - AreaBar
    - AreaBotany
    - AreaBridge
    - AreaBrig
    - AreaCargoBay
    - AreaChem
    - AreaEngineering
    - AreaKitchen
    - AreaMedical
    - AreaPrison
    - AreaSecurity
    - AreaScience
  - type: AntagObjectives
    objectives:
    - KillTargetCultObjective
    - SummonNarSieCultObjective
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: BloodCultLeader
    - !type:LinearAntagCount
      proto: BloodCultist
      range:
        min: 1
        max: 3
      playerRatio: 15
  - type: DynamicRuleCost
    cost: 150

- type: entity
  parent: [ BaseBloodCultRule, BaseRoundstartAntagRule ]
  id: BloodCult

- type: entity
  parent: BaseBloodCultRule
  id: BloodCultMidround
  components:
  - type: AntagSelection
    selectionTime: RuleStarted
