- type: entity
  abstract: true
  parent: BaseBloodContraband
  id: BaseCultBlood
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Trauma/BloodCult/Entities/Runes/regular.rsi
  - type: Fixtures
    fixtures:
      rune:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        hard: false
        mask:
        - ItemMask
        layer:
        - SlipLayer
  - type: Physics
  - type: Clickable
  - type: InteractionOutline
  - type: Appearance
  - type: CultRuneDrawing # runes can be erased with a bible/dagger regardless of being finished

- type: entity
  abstract: true
  parent: BaseCultBlood
  id: BaseCultRune
  description: An intricate, eldritch smearing and carving of blood. Who knows what it could be for?
  components:
  - type: CultRune
  - type: BloodCultExamine
  # Spraying runes with holy water erases them, too cheese to have it for unfinished
  - type: Reactive
    reactions:
    - reagents: [ Holywater ]
      methods: [ Touch ]
      effects:
      - !type:Delete

# Unfinished

- type: entity
  parent: BaseCultBlood
  id: CultRuneUnfinishedRegular
  name: blood ring
  description: "A sizeable smearing of blood, it definitely isn't red crayon."
  components:
  - type: Sprite
    state: unfinished

- type: entity
  parent: BaseCultBlood
  id: CultRuneUnfinishedLarge
  name: large blood ring
  description: "A huge smearing of blood in a circle, it's distinctly evil and unnatural."
  components:
  - type: Sprite
    sprite: _Trauma/BloodCult/Entities/Runes/large.rsi
    state: unfinished

# Finished runes

- type: entity
  parent: BaseCultRune
  id: CultRuneOffering
  name: rune of offering
  components:
  - type: Sprite
    state: offering
  - type: CultRune
    invokePhrase: "Mah'weyh pleggh at e'ntrath!"
  - type: CultRuneOffering
  - type: BloodCultExamine
    text: "Offers a noncultist above it to Nar'Sie, either converting them or sacrificing them."

- type: entity
  parent: BaseCultRune
  id: CultRuneEmpower
  name: rune of empower
  components:
  - type: Sprite
    state: strength
  - type: CultRune
    invokePhrase: "Qu'laris ver'don, thal'sorin mik'thar!"
  - type: CultRuneEmpower
  - type: BloodCultExamine
    text: "Allows cultists to prepare greater amounts of blood magic at far less of a cost."

- type: entity
  parent: BaseCultRune
  id: CultRuneTeleport
  name: rune of teleportation
  components:
  - type: Sprite
    state: teleport
  - type: CultRune
    invokePhrase: "Sas'so c'arta forbici!"
  - type: CultRuneTeleport
  - type: UserInterface
    interfaces:
      enum.WizardTeleportUiKey.Key:
        type: WizardTeleportBoundUserInterface
      enum.NameSelectorUiKey.Key:
        type: NameSelectorBUI
  - type: BloodCultExamine
    text: "Warps everything above it to another chosen teleport rune."

- type: entity
  parent: BaseCultRune
  id: CultRuneRevive
  name: rune of rejuvenation
  components:
  - type: Sprite
    state: revive
  - type: CultRune
    invokePhrase: "Pasnar val'keriam usinar. Savrae ines amutan. Yam'toth remium il'tarat!"
  - type: CultRuneRevive
  - type: BloodCultExamine
    text: |
      Requires a dead, mindless, or inactive cultist placed upon the rune.
      For each three bodies sacrificed to the dark patron, one body will be mended and their mind awoken.

- type: entity
  parent: BaseCultRune
  id: CultRuneBarrier
  name: rune of barrier
  components:
  - type: Sprite
    state: barrier
  - type: CultRune
    invokePhrase: "Khari'd! Eske'te tannin!"
    runeActivationRange: 1.5
    activationDamage:
      types:
        Slash: 5
  - type: CultEffectRune
    effects:
    - !type:SpawnEntity
      entity: BloodCultBarrier
    - !type:Delete # single use rune for obvious reasons (it gets blocked by the barrier)
  - type: BloodCultExamine
    text: "Makes a temporary invisible wall to block passage. Single use."

- type: entity
  parent: BaseCultRune
  id: CultRuneSummoning
  name: rune of summoning
  components:
  - type: Sprite
    state: summon
  - type: CultRune
    requiredInvokers: 2
    invokePhrase: "N'ath reth sh'yro eth d'rekkathnor!"
  - type: CultRuneSummon
  - type: UserInterface
    interfaces:
      enum.WizardTeleportUiKey.Key:
        type: WizardTeleportBoundUserInterface
  - type: BloodCultExamine
    text: "Summons a single cultist to the rune. Requires 2 invokers."

- type: entity
  parent: BaseCultRune
  id: CultRuneBloodBoil
  name: rune of boiling blood
  components:
  - type: Sprite
    state: blood_boil
  - type: CultRune
    invokePhrase: "N'Dedo ol'btoh!"
    requiredInvokers: 3
    activationDamage:
      types:
        Slash: 35
  - type: CultRuneBloodBoil
    effects:
    - !type:Flammable
      multiplier: 1
    - !type:Ignite
  - type: BloodCultExamine
    text: "Boils the blood of non-believers who can see the rune, rapidly dealing extreme amounts of damage. Requires 3 invokers."

- type: entity
  parent: BaseCultRune
  id: CultRuneApocalypse
  name: rune of apocalypse
  components:
  - type: Sprite
    sprite: _Trauma/BloodCult/Entities/Runes/large.rsi
    layers:
    - state: apocalypse
      map: [ "enum.ApocalypseRuneVisuals.Layer" ]
  - type: CultRune
    requiredInvokers: 3
    invokePhrase: "Ta'gh fara'qha fel d'amar det!"
    activationDamage:
      types:
        Slash: 35
  - type: CultRuneApocalypse
  - type: GenericVisualizer
    visuals:
      enum.ApocalypseRuneVisuals.Used:
        enum.ApocalypseRuneVisuals.Layer:
          True: { color: "#696969" }
          False: { color: "#ffffff" }
  - type: BloodCultExamine
    text: "A harbinger of the end times. Grows in strength with the cult's desperation - but at the risk of... side effects."

- type: entity
  parent: BaseCultRune
  id: CultRuneDimensionalRending
  name: rune of dimensional rending
  components:
  - type: Sprite
    sprite: _Trauma/BloodCult/Entities/Runes/large.rsi
    layers:
    - state: rending
      map: [ "enum.RendingRuneVisuals.Layer" ]
  - type: CultRune
    requiredInvokers: 10
    invokeChatType: Speak
    invokePhrase: "TOK-LYR RQA-NAP G'OLT-ULOFT!!!"
  - type: CultRuneRending
  - type: GenericVisualizer
    visuals:
      enum.RendingRuneVisuals.Active:
        enum.RendingRuneVisuals.Layer:
          True: { state: "rending_animated" }
          False: { state: "rending"}
  - type: BloodCultExamine
    text: "Tears apart dimensional barriers, calling forth the Geometer. Requires 9 invokers."
