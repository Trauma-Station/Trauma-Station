        enum.ConstructVisualsState.Sprite:
          True: { state: make_wraith_cult }
          False: { state: wraith }
        enum.ConstructVisualsState.Glow:
          True: { visible: false }
          False: { visible: true }
  - type: ActionGrant
    actions:
    - ActionWraithJaunt
    - ActionWraithSummonTeleportRune
  - type: AlwaysTakeHoly
