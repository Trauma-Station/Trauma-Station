- type: entity
  parent: [ BaseItem, BaseBloodContraband ]
  id: ShuttleCurse
  name: cursed orb
  description: You peer within this smokey orb and glimpse terrible fates befalling the emergency escape shuttle.
  components:
  - type: Sprite
    sprite: _Trauma/BloodCult/Entities/Items/shuttle_curse.rsi
    state: icon
  - type: CultItem
  - type: ShuttleCurse

- type: entity
  parent: [ WhetstoneBase, BaseBloodContraband ]
  id: WhetstoneCult
  name: eldritch whetstone
  description: A block, empowered by dark magic. Sharp weapons will be enhanced when used on the stone.
  components:
  - type: Sprite
    sprite: _Trauma/BloodCult/Entities/Items/whetstone_cult.rsi
    layers:
    - state: icon
  - type: Item
    storedRotation: -90
  - type: CultItem
  - type: CustomDurabilityModifier
    maxDurabilityStateModifiers:
      Reinforced: 4, 1.3 # Either +4 damage or +30% damage, whichever is less

- type: entity
  parent: [ BaseItem, BaseBloodContraband ]
  id: VeilShifter
  name: veil shifter
  description: This relic instantly teleports you, and anything you're pulling, forward by a moderate distance.
  components:
  - type: Sprite
    sprite: _Trauma/BloodCult/Entities/Items/veil_shifter.rsi
    layers:
    - state: icon
      map: [ "base" ]
  - type: CultItem
  - type: VeilShifter
  - type: LimitedCharges
    maxCharges: 3
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.LimitedChargesState.HasCharges:
        base:
          True: { state: icon }
          False: { state: icon_off }

- type: entity
  parent: [ BaseItem, BaseBloodContraband ]
  id: ShadowShackles
  name: shadow shackles
  description: Shackles that bind the wrists with sinister magic.
  components:
  - type: Item
    size: Small
    storedRotation: 90
  - type: Handcuff
    breakoutTime: 5
    breakOnRemove: true
    cuffedRSI: Objects/Misc/cablecuffs.rsi
    bodyIconState: body-overlay
    color: black
  - type: Sprite
    sprite: _Trauma/BloodCult/actions.rsi
    state: cuff

- type: entity
  parent: [ BaseShield, BaseBloodContraband ]
  id: MirrorShieldCult
  name: mirror shield
  description: An infamous shield used by Nar'Sien sects to confuse and disorient their enemies.
  components:
  - type: Sprite
    sprite: _Trauma/BloodCult/Entities/Items/mirror_shield.rsi
    state: icon
  - type: Item
    sprite: _Trauma/BloodCult/Entities/Items/mirror_shield.rsi
    heldPrefix: mirror
    size: Ginormous
  - type: CultItem
  - type: Parry
    reflectExhaustionCost: 0.15
    reflects:
    - Energy
  - type: Blocking
    passiveBlockModifier:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Ballistic: 0.8
        Heat: 0.8
    activeBlockModifier:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Ballistic: 0.8
        Heat: 0.8
      flatReductions:
        Blunt: 1
        Slash: 1
        Piercing: 1
        Ballistic: 1
        Heat: 1
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
  - type: IllusionOnParry
  - type: IllusionSpawner
    chance: 0.2
    ignoreSameFactionTargets: true
    factionWhitelist:
    - BloodCult
    components:
    - type: NPCRetaliation
      attackMemoryLength: 10
    - type: GroupRetaliation
      range: 8
    - type: NpcFactionMember
      factions:
      - BloodCult
