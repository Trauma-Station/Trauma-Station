- type: entity
  parent: [ BaseSword, BaseBloodContraband ]
  id: EldritchLongsword
  name: eldritch longsword
  description: A sword humming with unholy energy. It glows with a dim red light.
  components:
  - type: Sprite
    sprite: _Trauma/BloodCult/Entities/Items/Weapons/cult_blade.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    range: 1.65
    damage:
      types:
        Slash: 20
    heavyStaminaCost: 10
    angle: 90
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    size: Huge
  - type: Clothing
    # TODO: sprite...
    slots:
    - back
    - suitStorage
  - type: DisarmMalus
  - type: CultItem
  - type: PointLight
    color: Red
    radius: 2
    softness: 1

- type: entity
  parent: [ BaseItem, SolutionSpear, BaseBloodContraband ]
  id: BloodSpear
  name: blood spear
  description: A sickening spear composed entirely of crystallized blood.
  components:
  - type: Sprite
    sprite: _Trauma/BloodCult/Entities/Items/Weapons/cult_spear.rsi
    state: icon
  - type: EmbeddableProjectile
    offset: -0.15,0.0
  - type: ThrowingAngle
    angle: 225
  - type: LandAtCursor
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.08,-0.06
          - -0.06,-0.08
          - 0.40,0.30
          - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sharp
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Piercing: 30
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    range: 2
    attackRate: 0.7
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 30
  - type: Item
    sprite: _Trauma/BloodCult/Entities/Items/Weapons/cult_spear.rsi
    storedRotation: 44
    size: Huge
    shape:
    - 0,0,5,0
  - type: Clothing
    slots:
    - back
    - suitStorage
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 10
  - type: UseDelay
  - type: DisarmMalus
  - type: CultItem
  - type: WeaponClass
    class: Polearm
  - type: RecallableItem
    actionId: ActionBloodSpearRecall
    userWhitelist:
      components:
      - BloodCultist
  - type: TriggerOnThrowDoHit
  - type: EmitSoundOnTrigger
    sound:
      collection: GlassBreak
    positional: true
    predicted: false
  - type: DeleteOnTrigger
  - type: GenericTriggerCondition
    checkUser: true
    condition: !type:AllConditions
      conditions:
      - !type:ProtectedByNullRodCondition
        inverted: true
      - !type:WhitelistCondition
        whitelist:
          components:
          - MobState
        blacklist:
          components:
          - BloodCultMember
  - type: EntityEffectOnTrigger
    targetUser: true
    effects:
    - !type:ModifyParalysis
      time: 4

- type: entity
  parent: [ BaseItem, BaseBloodContraband ]
  id: BloodOrb
  name: blood orb
  description: A solid orb of crystalized blood, likely taken unwillingly. The orb can be used to transfer vitae between the faithful.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Trauma/BloodCult/Entities/Items/summoning_orb.rsi
    state: icon
  - type: PointLight
    enabled: true
    radius: 2
    energy: 1
    color: Red
  - type: BloodOrb

- type: entity
  parent: [ ArcaneBarrage, BaseBloodContraband ]
  id: BloodBoltBarrage
  name: blood bolt barrage
  description: A crackling orb of blood-red energy, straining for the chance to kill. Simply point at the target, and let it loose.
  components:
  - type: Sprite
    sprite: _Trauma/BloodCult/Entities/Items/arcane_barrage.rsi
    state: icon
  - type: PointLight
    color: Red
  - type: BasicEntityAmmoProvider
    proto: BloodBoltProjectile
    capacity: 25
  - type: Gun
    fireRate: 2
    soundGunshot:
      path: /Audio/_Goobstation/Wizard/wand_teleport.ogg

- type: entity
  parent: [ BaseItem, BaseBloodContraband ]
  id: BloodRitesAura
  name: blood rite aura
  description: Absorbs blood from anything you touch. Touching cultists and constructs can heal them. Use in-hand to cast an advanced rite.
  components:
  - type: Sprite
    sprite: _Trauma/BloodCult/Entities/Items/rites.rsi
    state: icon
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 0
    resetOnHandSelected: false
    canWideSwing: false
    canMiss: false
    canBeParried: false
  - type: Unremoveable
  - type: DeleteOnDropAttempt
  - type: TouchSpell # Handles healing cultists/constructs
    deleteOnInvoke: false
    canUseOnSelf: true
    speech: blood-cult-action-blood-rites
    sound:
      path: /Audio/_Trauma/BloodCult/rites.ogg
      params:
        volume: -3
    targetWhitelist:
      components:
      - BloodCultMember
  - type: BloodRitesAura
    crafts:
      BloodOrb: 50
      BloodSpear: 300
      BloodBoltBarrage: 500
      # TODO: blood beam
  - type: UserInterface
    interfaces:
      enum.BloodRitesUiKey.Key:
        type: BloodRitesBUI
  - type: ActivatableUI
    key: enum.BloodRitesUiKey.Key
    inHandsOnly: true
    requireActiveHand: false
  - type: PointLight
    enabled: true
    radius: 2
    energy: 1
    color: Red
  - type: UseDelay
    delay: 0.5

- type: entity
  parent: [ BaseItem, BaseBloodContraband ]
  id: StunningAura
  name: stunning aura
  description: Will knock down and mute a victim on contact. Strike them with a cult weapon to complete the invocation, stunning them and extending the mute.
  components:
  - type: Sprite
    sprite: _Trauma/BloodCult/Entities/Items/disintegrate.rsi
    state: icon
  - type: Unremoveable
  - type: DeleteOnDropAttempt
  - type: TouchSpell
    speech: blood-cult-action-stun
    targetBlacklist:
      components:
      - BloodCultMember
    targetWhitelist:
      components:
      - MobState
  - type: BlockContextMenu
    whitelist:
      components:
      - MobState
  - type: TouchSpellEffects
    conditions:
    - !type:WhitelistCondition
      blacklist:
        components:
        - Stunned
    effects:
    - !type:IfElse
      # Borgs get hardstunned, other mobs are knocked down and marked
      condition: !type:WhitelistCondition
        whitelist:
          components:
          - BorgChassis
      trueEffects:
      - !type:ModifyParalysis
        time: 16
      falseEffects:
      - !type:TakeStaminaDamage
        amount: 40
        immediate: true
      - !type:ModifyKnockdown
        drop: true
        time: 5
      - !type:ModifyStatusEffect
        effectProto: StatusEffectMuted
        time: 16
      - !type:AddComponents
        replaceExisting: true
        components:
        - type: BloodCultCombatMark
      - !type:RelayUser
        effects:
        - !type:ChatMessage
          channel: Server
          message: "Stun mark applied! Stab them with a dagger, sword or blood spear to stun them fully!"
          color: red
    - !type:SpawnEntity
      entity: SanguineFlashEffect
  - type: MeleeWeapon
    clickAttackWhitelist:
      components:
      - MobState
    resetOnHandSelected: false
    canWideSwing: false
    canMiss: false
    canBeParried: false
    damage:
      types:
        Heat: 0
  - type: PointLight
    enabled: true
    radius: 2
    energy: 1
    color: Red
