- type: entity
  parent: [ BaseStructure, BaseBloodContraband ]
  id: BloodCultBarrier
  name: cult barrier
  description: An eldritch cultist barrier.
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    layers:
    - sprite: _Trauma/BloodCult/Entities/Structures/barrier.rsi
      state: barrier
      shader: unshaded
  - type: Appearance
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 75
        mask:
        - MachineMask
        layer:
        - WallLayer
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PointLight
    radius: 3
    color: red
  - type: BloodCultExamine
    text: "Can be dispelled by using a ritual dagger."
  - type: BloodCultDispel
    text: "You tap the barrier with your dagger and it vanishes."
  - type: Airtight
    noAirWhenFullyAirBlocked: false

- type: entity
  parent: [ WallForce, BaseBloodContraband ]
  id: WallForceCult
  name: glowing wall
  description: An unholy shield that blocks all attacks.
  components:
  - type: Sprite
    sprite: _Trauma/BloodCult/Entities/Structures/cult_shield.rsi
    layers:
    - state: icon
  - type: Icon
    sprite: _Trauma/BloodCult/Entities/Structures/cult_shield.rsi
    state: icon
