- type: entity
  parent: [ BaseStructure, BaseMagicalContraband ]
  id: CultPylon
  name: cult pylon
  description: A floating crystal that slowly heals those faithful to Nar'Sie.
  components:
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      pylonFix:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.3,0.1,0.3"
        density: 190
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
  - type: Sprite
    noRot: true
    sprite: _Trauma/BloodCult/Entities/Structures/pylon.rsi
    layers:
    - state: icon_off
      map: [ "enum.PylonVisuals.Layer" ]
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Glass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 2
  - type: Appearance
  - type: Pylon
    healing:
      types:
        Blunt: -10
        Slash: -10
        Piercing: -10
        Heat: -10
        Cold: -10
        Shock: -10
        Caustic: -10
        Poison: -10
        Radiation: -10
        Asphyxiation: -10
        Bloodloss: -10
        Cellular: -5
    damageOnInteract:
      types:
        Heat: 5
  - type: PointLight
    color: "#FF0000"
    radius: 2
    energy: 2
    enabled: true
  - type: GenericVisualizer
    visuals:
      enum.PylonVisuals.Activated:
        enum.PylonVisuals.Layer:
          True: { state: "icon" }
          False: { state: "icon_off" }
  - type: Construction
    graph: CultPylon
    node: pylon
