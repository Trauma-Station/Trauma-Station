# Cloak of Darkness
- type: entity
  parent: BaseVampireAction
  id: ActionCloakDarkness
  name: Cloak of Darkness
  description: Cloak of Darkness
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: _Trauma/Vampires/actions.rsi
      state: vampire_cloak
  - type: InstantAction
    event: !type:EffectToggleActionEvent
  - type: ToggleEffectAction
    onToggleConditions:
    - !type:OnFireCondition # We must not be on fire for this ability to activate
      inverted: true
    onToggle:
    - !type:PopupMessage
      type: Local
      messages:
      - You start getting consumed!
    - !type:ModifyStatusEffect
      effectProto: CloakOfDarknessStatusEffect
      time: null
      type: Add
    offToggle:
    - !type:PopupMessage
      type: Local
      messages:
      - You stop getting consumed!
    - !type:ModifyStatusEffect
      effectProto: CloakOfDarknessStatusEffect
      time: null
      type: Remove
  - type: Tag
    tags:
    - CloakOfDarkness

# Shadow Snare
- type: entity
  parent: BaseVampireAction
  id: ActionShadowSnare
  name: Shadow Snare
  description: Shadow Snare
  components:
  - type: Action
    # useDelay: 20
    icon:
      sprite: _Trauma/Vampires/actions.rsi
      state: shadow_snare
  - type: TargetAction
    range: 10
  - type: WorldTargetAction
    event: !type:WorldSpawnSpellEvent
      prototypes:
      - id: ShadowSnare

# Shadow Anchor
