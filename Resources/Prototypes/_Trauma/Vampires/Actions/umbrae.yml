# Dark Passage
- type: entity
  parent: [BaseVampireAction, ActionBlink]
  id: ActionDarkPassage
  name: DarkPassage
  description: DarkPassage
  components:
  - type: Action
    useDelay: 1
    raiseOnAction: false
    icon:
      sprite: _Trauma/Vampires/actions.rsi
      state: dark_passage

# Extinguish
- type: entity
  parent: BaseVampireAction
  id: ActionExtinguish
  name: Extinguish
  description: Extinguish
  components:
  - type: Action
    # useDelay: 20
    icon:
      sprite: _Trauma/Vampires/actions.rsi
      state: vampire_extinguish
  - type: InstantAction
    event: !type:EffectInstantActionEvent
  - type: EffectAction
    effects:
    - !type:RelayNearby
      compName: PointLight
      range: 10
      effect: !type:NestedEffect
        proto: Extinguish


# Shadow Boxing
- type: entity
  parent: BaseVampireAction
  id: ActionShadowBoxing
  name: Shadow Boxing
  description: Shadow Boxing
  components:
  - type: Action
    # useDelay: 20
    icon:
      sprite: _Trauma/Vampires/actions.rsi
      state: shadow_boxing
  - type: TargetAction
    range: 2
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - Body
    event: !type:ShadowBoxingActionEvent
  - type: ActionShadowBoxing
    update: 0.5
    targetEffects:
    - !type:HealthChange
      damage:
        types:
          Blunt: 3
          Slash: 3
          Piercing: 2
    - !type:SpawnEntity
      entity: WeaponArcPunch

# Eternal Darkness
- type: entity
  parent: BaseVampireAction
  id: ActionEternalDarkness
  name: Eternal Darkness
  description: Eternal Darkness
  components:
  - type: Action
    # useDelay: 20
    icon:
      sprite: _Trauma/Vampires/actions.rsi
      state: eternal_darkness
  - type: InstantAction
    event: !type:EffectToggleActionEvent
  - type: ToggleEffectAction
    onToggleConditions: # we must have at least 10 usable blood, ensures we don't attach the effect 4noraisin
    - !type:HasVampireBlood
      amount: 10
    onToggle:
    - !type:PopupMessage # TODO: Play music
      type: Local
      messages:
      - The darkness begins!
    - !type:ModifyStatusEffect
      effectProto: EternalDarknessStatusEffect
      time: null
      type: Add
    offToggle:
    - !type:ModifyStatusEffect
      effectProto: EternalDarknessStatusEffect
      time: null
      type: Remove
    - !type:PopupMessage
      type: Local
      messages:
      - The darkness stops...
