# Rejuv Garg
- type: entity
  parent: BaseRejuvAction
  id: ActionVampGargRejuv
  name: Rejuvenate
  description: Heals you
  components:
  - type: EffectAction
    effects:
    - !type:NestedEffect
      proto: VampireRejuvGarg

- type: entity
  parent: BaseRejuvAction
  id: ActionVampGargRejuvII
  name: Rejuvenate
  description: Heals you
  components:
  - type: EffectAction
    effects:
    - !type:NestedEffect
      proto: VampireRejuvGarg

# Blood Swell I and II
- type: entity
  parent: BaseVampireAction
  id: ActionBloodSwell
  name: Blood Swell
  description: For 30 seconds, reduces incoming brute by 60%, stamina and burn damage by 50%, and halves all stun times. Guns are unusable for the duration.
  components:
  - type: Action
    icon:
      sprite: _Goobstation/Objects/Specific/Fishing/fishing_lure.rsi
      state: icon
  - type: InstantAction
    event: !type:EffectInstantActionEvent
  - type: EffectAction
    effects:
    - !type:ModifyStatusEffect
      effectProto: BloodSwellStatusEffect
      time: 30

- type: entity
  parent: ActionBloodSwell
  id: ActionBloodSwellII
  name: Blood Swell II
  description: For 30 seconds, identical resistance buffs to Blood Swell I, user's melee damage is increased by 10. Guns are unusable for the duration.
  components:
  - type: EffectAction
    effects:
    - !type:ModifyStatusEffect
      effectProto: BloodSwellStatusEffectII
      time: 30

# Blood Rush
- type: entity
  parent: BaseVampireAction
  id: ActionBloodRush
  name: Blood Rush
  description: For 10 seconds, doubles movement speed. Instantly stands you up, removes any legcuffs and clears knockdowns.
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _Goobstation/Objects/Specific/Fishing/fishing_lure.rsi
      state: icon
  - type: InstantAction
    event: !type:EffectInstantActionEvent
  - type: EffectAction
    effects:
    - !type:ModifyStatusEffect
      effectProto: StatusEffectBloodRush
      time: 10
      type: Add
    - !type:SetStanding
      force: true
    - !type:RemoveComponents
      components:
      - type: KnockedDown # ModifyKnockdown bugs out
    - !type:Uncuff

# Gargantuan Stomp
- type: entity
  parent: BaseVampireAction
  id: ActionGargStomp
  name: Stomp
  description: You stomp the ground, sending out a shockwave that knocks people back.
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _Goobstation/Objects/Specific/Fishing/fishing_lure.rsi
      state: icon
  - type: InstantAction
    event: !type:EffectInstantActionEvent
  - type: EffectAction
    effects:
    - !type:RelayNearby
      compName: StatusEffects
      range: 5
      effect: !type:NestedEffect
        proto: GargantuaStomp

# Overwhelming Force
- type: entity
  parent: BaseVampireAction
  id: ActionOverwhelmingForce
  name: Overwhelming Force
  description: When activated, automatically and instantly pry open doors you don't have access to. This will not work on bolted or welded doors. Also prevents you from being pushed or pulled.
  components:
  - type: Action
    useDelay: 2
    icon:
      sprite: _EinsteinEngines/Shadowling/shadowling_abilities.rsi
      state: enthrall
  - type: InstantAction
    event: !type:EffectToggleActionEvent
  - type: ToggleEffectAction
    onToggle:
    - !type:AddComponents
      components:
      - type: Prying
        pryPowered: true
        speedModifier: 100
      - type: VampirePrying
      # bloodToRemove: 5
    - !type:ModifyStatusEffect
      effectProto: StatusEffectOverwhelmingForce
      time: null
      type: Add
    offToggle:
    - !type:RemoveComponents
      components:
      - type: Prying
      - type: VampirePrying
    - !type:ModifyStatusEffect
      effectProto: StatusEffectOverwhelmingForce
      time: null # TODO: I forgor to test this. Next time
      type: Remove

# Demonic Hand
- type: entity
  parent: BaseVampireAction
  id: ActionDemonicHand
  name: Demonic Hand
  description: Send out a Demonic Hand that grabs and pulls/pushes a target depending on your intent. Harm mode pulls, otherwise it pushes.
  components:
  - type: Action
    # useDelay: 2
    raiseOnAction: false
    raiseOnUser: true
    icon:
      sprite: _Goobstation/Objects/Specific/Fishing/fishing_lure.rsi
      state: icon
  - type: TargetAction
    range: 65
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:ProjectileSpellEvent
      prototype: ProjectileDemonicHand

# Charge
- type: entity
  parent: BaseVampireAction
  id: ActionGargCharge
  name: Charge
  description: Click to charge. Stuns, damages, and knocks back mobs on impact. Completely destroys walls. Also deals 200 damage to mechs and knocks them back.
  components:
  - type: Action
    # useDelay: 2
    icon:
      sprite: _Goobstation/Objects/Specific/Fishing/fishing_lure.rsi
      state: icon
  - type: InstantAction
    event: !type:EffectInstantActionEvent
  - type: EffectAction
    effects:
    - !type:AddComponents
      components:
      - type: GargantuaCharging
        impactEffects:
        # Wall Logic
        - !type:HealthChange
          conditions:
          - !type:WhitelistCondition
            whitelist:
              tags:
              - Wall
          damage:
            types:
              Structural: 500
        # Body Logic
        - !type:NestedEffect
          conditions:
          - !type:WhitelistCondition
            whitelist:
              components:
              - Body
          proto: ChargeMob
        # Mech Logic
        - !type:HealthChange
          conditions:
          - !type:WhitelistCondition
            whitelist:
              components:
              - Mech
          damage:
            types:
              Blunt: 200
        # Generic Logic
        - !type:ThrowRandomly
    - !type:ThrowAtFacingDirection

- type: entity
  parent: BaseVampireAction
  id: ActionDesecratedDuel
  name: Desecrated Duel
  description: Duel.
  components:
  - type: Action
    # useDelay: 2
    icon:
      sprite: _Goobstation/Objects/Specific/Fishing/fishing_lure.rsi
      state: icon
  - type: TargetAction
    range: 10
  - type: EntityTargetAction
    event: !type:ArenaTargetActionEvent
  - type: ActionDesecratedDuel # Throws us at the target and clears the arena based on conditions.
  - type: ActionArena # Makes the arena. Can be re-used for other actions
    delay: 0.5 # So we have time to get thrown there
    wallProto: WallHierophantArena # TODO: Change it to the vamp walls from paradise
  - type: EffectAction
    onPerformed: true
    effects:
    - !type:ModifyStatusEffect
      effectProto: StatusEffectVampireGladiator
      time: null # Will be removed manually by code when the arena stops existing
      type: Add
