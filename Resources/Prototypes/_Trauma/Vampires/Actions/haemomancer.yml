# Blood Eruption
- type: entity
  parent: BaseVampireAction
  id: ActionBloodEruption
  name: Blood Eruption
  description: Blood Eruption
  components:
  - type: Action
    # useDelay: 20
    icon:
      sprite: _Goobstation/Objects/Specific/Fishing/fishing_lure.rsi
      state: icon
  - type: InstantAction
    event: !type:EffectInstantActionEvent
  - type: EffectAction
    effects:
    - !type:RelayNearby
      compName: Puddle
      range: 4
      effect: !type:NestedEffect
        proto: BloodEruption

# Blood Bringer Rite
- type: entity
  parent: BaseVampireAction
  id: ActionBloodBringersRite
  name: The Blood Bringer's Rite
  description: The Blood Bringer's Rite
  components:
  - type: Action
    # useDelay: 20
    icon:
      sprite: _Goobstation/Objects/Specific/Fishing/fishing_lure.rsi
      state: icon
  - type: InstantAction
    event: !type:EffectToggleActionEvent
  - type: ToggleEffectAction
    onToggleConditions: # we must have at least 10 usable blood, ensures we don't attach the component 4noraisin
    - !type:HasVampireBlood
      amount: 10
    onToggle:
    - !type:PopupMessage # TODO: Play music
      type: Local
      messages:
      - The rite begins!
    - !type:ModifyStatusEffect
      effectProto: BloodBringerRiteStatusEffect
      time: null
      type: Add
    - !type:AddComponents
      components:
      - type: ActiveBloodLeecher
        userEffects:
        - !type:EvenHealthChange
          damage:
            Brute: -5
            Burn: -5
        targetEffects:
        - !type:ModifyBloodLevel
          amount: -10
        - !type:EvenHealthChange
          damage:
            Brute: 5
    offToggle:
    - !type:RemoveComponents
      components:
      - type: ActiveBloodLeecher
    - !type:ModifyStatusEffect
      effectProto: BloodBringerRiteStatusEffect
      time: null
      type: Remove
    - !type:PopupMessage
      type: Local
      messages:
      - The rite stops...
