# All actions in here are the base actions of the vampire, when they start.
#
# TODO: Implement ConsumeCharges
#
# Therefore, this file does not include class-specific actions.
#
# Abstract Actions
- type: entity
  parent: BaseAction
  id: BaseVampireAction
  components:
  - type: Action
    raiseOnAction: true
    itemIconStyle: BigAction

- type: entity
  parent: BaseVampireAction
  id: BaseRejuvAction
  components:
  - type: Action
    useDelay: 20
    icon:
      sprite: _Goobstation/Objects/Specific/Fishing/fishing_lure.rsi
      state: icon
    checkCanInteract: false
  - type: InstantAction
    event: !type:EffectInstantActionEvent

# Rejuv
- type: entity
  parent: BaseRejuvAction
  id: ActionVampRejuvenateI
  name: Rejuvenate I
  description: Heals you
  components:
  - type: EffectAction
    effects:
    - !type:NestedEffect
      proto: VampireRejuvI

- type: entity
  parent: BaseRejuvAction
  id: ActionVampRejuvenateII
  name: Rejuvenate II
  components:
  - type: EffectAction
    effects:
    - !type:NestedEffect
      proto: VampireRejuvII

# Glare
- type: entity
  parent: BaseVampireAction
  id: ActionVampireGlare
  name: Glare
  components:
  - type: Action
    useDelay: 2
    icon:
      sprite: _Goobstation/Objects/Specific/Fishing/fishing_lure.rsi
      state: icon
  - type: LimitedCharges
    maxCharges: 2
  - type: AutoRecharge
    rechargeDuration: 30
  - type: InstantAction
    event: !type:VampireGlareEvent
      frontEffects:
      - !type:TakeStaminaDamage
        amount: 70
      - !type:ModifyKnockdown
        time: 12
      - !type:GenericStatusEffect
        key: Muted
        component: Muted
        time: 8
        type: Add
      - !type:Flash
        slowTo: 1
        maxRange: 0.5
        duration: 1
      sideEffects:
      - !type:TakeStaminaDamage
        amount: 40
      - !type:ModifyKnockdown
        time: 5
      - !type:ModifyStatusEffect
        effectProto: StatusEffectScrambled
        time: 8
      behindEffects:
      - !type:TakeStaminaDamage
        amount: 40
      - !type:ModifyStatusEffect
        effectProto: StatusEffectScrambled
        time: 8

- type: entity
  parent: BaseVampireAction
  id: ActionChooseSpecialization
  name: Choose Specialization
  description: Choose Specialization
  components:
  - type: InstantAction
    event: !type:OpenClassSelectorUiEvent
  - type: UserInterface
    interfaces:
      enum.MobClassUiKey.Key:
        type: MobClassSelectorBui
  - type: ActionMobClass
