# Mass Hysteria
- type: entity # TODO: test with different clients
  parent: BaseVampireAction
  id: ActionMassHysteria
  name: Mass Hysteria
  description: Mass Hysteria
  components:
  - type: Action
    # useDelay: 2
    icon:
      sprite: _Goobstation/Objects/Specific/Fishing/fishing_lure.rsi
      state: icon
  - type: InstantAction
    event: !type:EffectInstantActionEvent
  - type: EffectAction
    effects:
    - !type:RelayNearby
      compName: StatusEffects
      range: 8
      effect: !type:NestedEffect
        conditions:
