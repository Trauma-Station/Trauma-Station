# Enthrall
- type: entity
  parent: BaseVampireAction
  id: ActionDanEnthrall
  name: Enthrall
  components:
  - type: Action
    raiseOnAction: false
    raiseOnUser: true # this action requires VampireThrallsComponent which is stored in the body
    icon:
      sprite: _Goobstation/Objects/Specific/Fishing/fishing_lure.rsi
      state: icon
  - type: TargetAction
    range: 2
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    blacklist:
      components:
      - Mindshielded  # parity?
      - BibleUser     # makes sense
      - VampireThrall # cant thrall other thralls or already thralled
      - Vampire       # makes sense
      tags:
      - VimPilot      # no thralling monkeys
    event: !type:DanEnthrallActionEvent
  - type: DoAfterArgs
    delay: 2 # TODO: 15
    breakOnMove: true

# Pacify
- type: entity
  parent: BaseVampireAction
  id: ActionPacify
  name: Pacify
  description: Pacify
  components:
  - type: Action
    # useDelay: 2
    icon:
      sprite: _Goobstation/Objects/Specific/Fishing/fishing_lure.rsi
      state: icon
  - type: TargetAction
    range: 7
    checkCanAccess: false
  - type: EntityTargetAction
    event: !type:EffectTargetActionEvent
  - type: EffectAction
    effects:
    - !type:GenericStatusEffect # TODO: use new status effects when its ported from upstream
      key: Pacified
      component: Pacified
      time: 40
    - !type:PopupMessage
      messages:
      - You pacify them
      type: Local
      visualType: Large

