# Deploy Decoy
- type: entity
  parent: BaseVampireAction
  id: ActionDeployDecoy
  name: Deploy Decoy
  description: Deploy Decoy
  components:
  - type: Action
    # useDelay: 2
    icon:
      sprite: _Goobstation/Objects/Specific/Fishing/fishing_lure.rsi
      state: icon
  - type: InstantAction
    event: !type:EffectInstantActionEvent
  - type: EffectAction
    effects:
    - !type:ModifyStatusEffect
      effectProto: ForcedStealthStatusEffect # its 0 by default
      time: 6
