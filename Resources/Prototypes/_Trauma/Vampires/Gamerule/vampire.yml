- type: entity
  parent: BaseGameRule
  id: Vampire
  components:
  - type: VampireRule
  - type: GameRule
    minPlayers: 20
  - type: AntagPlayerEffects
    effects:
    - !type:NestedEffect
      proto: HereticSkills
    - !type:ChangeFaction
      newFaction: VampireFaction
    - !type:AdjustAlert            # Shows usable and total blood to the vampire via a popup
      alertType: BloodLevel
    - !type:ModifyStatusEffect     # This handles starlight interactions
      effectProto: VampireSpaceStatusEffect
      time: null
    - !type:RelayOrgan             # Vampires can only drink blood, can't eat foods
      category: Stomach
      effects:
      - !type:SetMetabolizerType
        metabolizerTypes:
        - Vampire
      - !type:SetStomachDigestable
        specialDigestible:
          tags:
          - Pill
          - Crayon
          - Paper
  - type: AntagObjectives
    objectives:
    - VampireBloodObjective
    - VampireSurviveObjective
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    agentName: roles-antag-vampire-name
    definitions:
    - prefRoles: [ Vampire ]
      max: 4
      playerRatio: 20
      mindRoles:
      - MindRoleVampire
      briefing:
        text: vampire-role-briefing
        color: "#650000"
        sound: /Audio/_Trauma/Vampires/vampalert.ogg
      components:
      - type: Vampire               # Holds total and usable blood.
      - type: VampireBloodsucking   # Allows the vampire to drain blood from others.
      - type: VampireAbilities      # Grants abilities to the vampire.
      - type: MobClass              # Allows vampire to specialize in a different class.
        belongsTo: Vampire
      - type: Nullification         # Restricts use of abilities when it reaches 120
      - type: ZombieImmune          # So there's no first day chud making issue about it
      - type: AreaDetector          # Detects when you enter/exit areas
      - type: EffectsOnAreaDetect   # Runs effects when you enter/exit a specific area
        areas:
        - AreaChapel
        effectsOnEnter:
        - !type:ModifyStatusEffect
          effectProto: VampireChapelStatusEffect
          time: null
          type: Add
        effectsOnExit:
        - !type:ModifyStatusEffect
          effectProto: VampireChapelStatusEffect
          time: null
          type: Remove

- type: gamePreset
  id: Vampires
  alias:
  - vampz
  - bloodsuckers
  name: vampire-preset-title
  description: vampire-preset-description
  showInVote: false
  rules:
  - BasicRoundstartVariation
  - BasicStationEventScheduler
  - BasicAntagEventScheduler
  - ModerateAntagEventScheduler
  - MeteorSwarmScheduler
  - SpaceTrafficControlEventScheduler
  - SubGamemodesRule
  - Vampire
  - CalmTraitor
