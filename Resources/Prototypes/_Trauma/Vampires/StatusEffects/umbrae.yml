- type: entity
  parent: MobStatusEffectBase
  id: CloakOfDarknessStatsuEffect # Could run this with entity effects, but since it's a toggle, this is more optimized
  name: cloak of darkness
  components:
  - type: StatusEffectAlert
    alert: CloakOfDarkness
  - type: MovementModStatusEffect
    sprintSpeedModifier: 1.5
    walkSpeedModifier: 1.5
  - type: DarknessStealthStatusEffect
    triggerAt: 0.9
    visibility: 0.5
  - type: DamageModifierStatusEffect
    modifiers:
      coefficients:
        Heat: 1.1
        Shock: 1.1
  - type: RemoveOnIgniteStatusEffect
    effectProto: CloakOfDarknessStatsuEffect
  - type: StatusEffectEffectsApply
    effectsOnApply:
    - !type:AddComponents
      components:
      - type: LightDetection
      - type: Stealth
    effectsOnRemoval:
    - !type:RemoveComponents
      components:
      - type: LightDetection
      - type: Stealth
    - !type:ChangeEffectToggleAction # ensures we don't start in offToggle state
      action: ActionCloakDarkness

- type: entity
  parent: MobStatusEffectBase
  id: EternalDarknessStatusEffect
  name: eternal darkness
  components:
  - type: StatusEffectEffectsApply
    effectsOnApply:
    - !type:AddComponents
      components:
      - type: PointLight
        radius: 8
        energy: 10
        color: "#A020F0"
    effectsOnRemoval:
    - !type:ChangeEffectToggleAction # change it to false by default when its removed due to no blood
    - !type:RemoveComponents
      components:
      - type: PointLight
  - type: StatusEffectEffects
    updateDelay: 1
    effects:
    # Removal on death
    - !type:ModifyStatusEffect
      conditions:
      - !type:MobStateCondition
        mobstate: Alive
        inverted: true
      effectProto: EternalDarknessStatusEffect
      type: Remove

    # Notification on no blood
    - !type:PopupMessage
      conditions:
      - !type:HasVampireBlood
        amount: 1
        inverted: true
      type: Local
      visualType: Large
      messages:
      - Your darkness is weak!

    # Effect itself
    - !type:NestedEffect
      conditions:
      - !type:HasVampireBlood
        amount: 1
        inverted: true
      proto: EternalDarkness

- type: entity
  parent: MobStatusEffectDebuff
  id: EternalDarknessProjectileStatusEffect
  name: eternal darkness projectile
  components:
  - type: ProjectileModifyStatusEffect
    modifier: 0.5
    laser: true
