# This file holds all the base scriptures
#
# Each scripture has a different purpose:
# "Action" scriptures give you an action when you recite them,
# while "Structure" scriptures give you the hologram to build a structure
#
# Some scriptures are unlocked by default, while others require unlock conditions.
# All scriptures require a power cost to recite.
#
# To make a new scripture, inherit from one of the base scriptures, and
# make your scripture entity so it can appear on the Clockwork Slab UI.
#
# After that's done, the result entity (action, structure etc) can be made in a different yaml
# and the scripture will produce that entity when recited.
#
# You can find example scriptures by looking at the Scriptures folder

# A basic scripture
- type: entity
  id: BaseScripture
  abstract: true
  components:
  - type: Scripture

# A basic scripture that supports tiers
#
# The tiers are ordered by the order of definition. So put easiest tiers first, and hardest tiers last.
# Don't define RecitalEffects in ScriptureTier if you are gonna use ScriptureTier
- type: entity
  id: BaseTierScripture
  parent: BaseScripture
  abstract: true
  components:
  - type: Scripture
  - type: ScriptureTier
