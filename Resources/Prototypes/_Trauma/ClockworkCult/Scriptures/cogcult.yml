# TODO: For actions, check how many of the same type we can have! (new entity effect conditions)
# TODO: Add support for local playsoundeffect
- type: entity
  id: DummyScripture
  parent: BaseScripture
  name: Dummy Scripture
  description: This is a dummy.
  components:
  - type: Scripture
    powerCost: 0
    recitalEffects:
    - !type:AddActions
      actions:
      - KindleActionT1
    - !type:Chat
      message: Divinity, show them your light!
  - type: DoAfterArgs
    delay: 7

- type: entity
  id: DummyScripture2
  parent: BaseTierScripture
  name: Dummy Scripture 2
  description: This is a tier dummy.
  components:
  - type: Scripture
    powerCost: 0
  - type: ScriptureTier
    tiers:
    - id: T1
      description: Gives you the ability to blink
      recitalEffects:
      - !type:AddActions
        actions:
        - ActionBlink
    - id: T2
      description: Gives you the ability to whisper
      recitalEffects:
      - !type:AddActions
        actions:
        - DemonicWhisperAction
      locked: true
  - type: DoAfterArgs
    delay: 5
