- type: entity
  parent: LockerElectricalSupplies
  id: LockerElectricalSuppliesFilledShuttle
  suffix: Shuttle
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: FillElectricalSuppliesShuttle

- type: entityTable
  id: FillElectricalSuppliesShuttle
  table: !type:AllSelector
    children:
    - id: SyndicateShuttleConsoleCircuitboard
    - id: ToolboxElectricalFilled
      prob: 0.7
    - id: FirelockElectronics
      prob: 0.05
    - id: APCElectronics
      prob: 0.1
    - !type:GroupSelector
      prob: 0.5
      children:
      - id: CableApcStack
        weight: 5
      - id: CableMVStack
      - id: CableHVStack
        weight: 0.5
