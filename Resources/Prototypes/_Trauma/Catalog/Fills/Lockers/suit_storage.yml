- type: entity
  parent: SuitStorageBase
  id: SuitStorageQM
  suffix: Quartermaster
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: FillQuartermasterHardsuit
  - type: AccessReader
    access: [["Quartermaster"]]

