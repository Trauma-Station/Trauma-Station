# extreme
- type: entityTable
  id: ExtremeSideJobRewards
  table: !type:GroupSelector
    children:
    - id: Telecrystal15
      weight: 2 # 2/3 of the time you get straight TC (but less value)
    - !type:NestedSelector
      tableId: ExtremeSideJobRewardsItems

- type: entityTable
  id: ExtremeSideJobRewardsItems
  table: !type:GroupSelector
    children:
    - id: AdvancedCombatMedipen
    - id: WeaponRevolverPythonAP
    - id: ClothingHandsGlovesGuerrilla
    - !type:NestedSelector
      tableId: AnyRiggedGloves
    - id: ExperimentalSyndicateTeleporter
    - id: SupermatterGrenade
    - id: AccessBreaker
    - id: Emag
    - id: ToolboxElectricalTurretFilled

# put rigged gloves in their own table so you arent 4x more likely to get them
- type: entityTable
  id: AnyRiggedGloves
  table: !type:GroupSelector
    children:
    - id: ClothingHandsGlovesBoxingRiggedRed
    - id: ClothingHandsGlovesBoxingRiggedGreen
    - id: ClothingHandsGlovesBoxingRiggedYellow
    - id: ClothingHandsGlovesBoxingRiggedBlue
