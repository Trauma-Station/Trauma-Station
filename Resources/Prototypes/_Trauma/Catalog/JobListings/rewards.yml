# minor
- type: entityTable
  id: MinorSideJobRewards
  table: !type:GroupSelector
    children:
    - id: Telecrystal7
      weight: 2 # 2/3 of the time you get straight TC (but less value)
    - !type:NestedSelector
      tableId: MinorSideJobRewardsItems

- type: entityTable
  id: MinorSideJobRewardsItems
  table: !type:GroupSelector
    children:
    - id: LubeGrenade
    - id: FoodBoxPizzaBomb
    - id: DeathRattleImplanter
    - id: ExGrenade
    - id: HypopenBox
    - id: MedkitCombatFilled
    - id: CombatMedipen
    - id: SyndicateBombFake
    - id: ToolboxSyndicateFilled
    - id: SyndicateJawsOfLife
    - id: CameraBug
    - id: FreedomImplanter
    - id: EmpImplanter
    - id: VoiceMaskImplanter
    - id: ClothingShoesChameleonNoSlips
    - id: ClothingShoesBootsMagSyndie

# major
