- type: job
  id: Paramedic
  access:
  - External
  guides:
  - MedicalDoctor
  - Medicine
  special:
  - !type:OrganChipsSpecial
    chips:
    - SkillChipDoctor
    - SkillChipEducation
    - SkillChipSurgeon
  - !type:AddComponentSpecial
    components:
    - type: CPRTraining
      reviveChance: 0.6 # better at chest compressions
      inhaleChance: 0.9 # very good at mouth to mouth res.
