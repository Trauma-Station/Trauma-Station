# Medical
- type: job
  id: ERTMedical
  access:
  - NanotrasenRepresentative
  special:
  - !type:OrganChipsSpecial
    chips:
    - SkillChipERT

- type: startingGear
  id: ERTMedicalGear
  equipment:
    outerClothing: ClothingOuterArmourDurathread

- type: startingGear
  id: ERTMedicalGearEVA
  equipment:
    neck: ExecutiveIDCard
    belt: ClothingBeltSecurityWebbingFilledMedical
    eyes: ClothingEyesGlassesMedSec
  storage:
    back: !Clear
    - ClothingEyesGlassesChemical
    - ChemistryBottleOmnizine
    - MedkitAdvancedFilled
    - CentCommHypo
    - JugOxandrolone
    - JugSalicylicAcid
    - ParamedHypo
    - CartridgeAtropine
    - CartridgeAtropine
    belt: !Remove

- type: startingGear
  id: ERTMedicalGearArmed
  equipment:
    suitstorage: WeaponLaserCannon
    pocket2: WeaponLaserSidearm
  storage:
    # Parented from ERTMedicalGearEVA
    back: !Remove
    belt: !Remove

