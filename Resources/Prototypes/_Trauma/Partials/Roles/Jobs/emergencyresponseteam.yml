- type: job
  id: ERTLeader
  access:
  - NanotrasenRepresentative
  special:
  - !type:OrganChipsSpecial
    chips:
    - SkillChipERT

- type: startingGear
  id: ERTLeaderGear
  equipment:
    outerClothing: ClothingOuterArmourDurathread

- type: startingGear
  id: ERTLeaderGearEVA
  equipment:
    neck: ExecutiveIDCard
    pocket2: WeaponLaserSidearm
  storage:
    back:
    - !Remove PhoneInstrument

- type: startingGear
  id: ERTLeaderGearArmed
  equipment:
    pocket2: !Remove # No disabler

# Chaplain
- type: job
  id: ERTChaplain
  access:
  - NanotrasenRepresentative
  special:
  - !type:AddComponentSpecial
    components:
    - type: CurseImmune
  - !type:OrganChipsSpecial
    chips:
    - SkillChipERT

- type: startingGear
  id: ERTChaplainGear
  equipment:
    neck: ExecutiveIDCard
    outerClothing: ClothingOuterHoodieChaplain
    pocket2: ArmamentsBeacon

- type: startingGear
  id: ERTChaplainGearEVA
  equipment:
    neck: ExecutiveIDCard
  storage:
    belt:
    - !Remove Bible
    - !Remove WeaponPistolMk58
    - !Remove MagazinePistol
    - ChaplainUndeterminedBible
    - Nullrod
    - WeaponLaserSidearm

