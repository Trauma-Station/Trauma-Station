

# Derelict Medical borg
- type: entity
  id: PlayerMedicalBorgDerelict
  components:
  - type: ContainerFill
    containers:
      borg_module: # no lollypop module because it only has 7 slots
          - BorgModuleSurgery
          - BorgModuleLollypop

