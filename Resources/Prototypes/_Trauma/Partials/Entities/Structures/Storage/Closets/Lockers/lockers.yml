- type: entity
  id: LockerBase
  abstract: true
  components:
  - type: LockSignalControl
  - type: DeviceLinkSink
    ports:
    - Lock
    - Unlock
    - Toggle

# Command .. ish

- type: entity
  id: LockerHeadOfSecurity
  components:
  - type: AntiTamper
    broadcastChannel: Security # joever

- type: entity
  id: LockerWarden
  components:
  - type: AntiTamper
    broadcastChannel: Security

# Auto convert head lockers to department safes
- type: entity
  id: LockerChiefMedicalOfficer
  name: medical safe
  components:
  - type: AntiTamper
    broadcastChannel: Medical
  - type: !Remove EntityStorageVisuals
  - type: AccessReader
    access: !Clear [["Medical"]]

- type: entity
  id: LockerResearchDirector
  name: research safe
  components:
  - type: AntiTamper
    broadcastChannel: Science
  - type: !Remove EntityStorageVisuals
  - type: AccessReader
    access: !Clear [["Research"]]

- type: entity
  id: LockerChiefEngineer
  name: engineering safe
  components:
  - type: AntiTamper
    broadcastChannel: Engineering
  - type: !Remove EntityStorageVisuals
  - type: AccessReader
    access: !Clear [["Engineering"]]

- type: entity
  id: LockerQuarterMaster
  name: cargo safe
  components:
  - type: AntiTamper
    broadcastChannel: Supply
  - type: !Remove EntityStorageVisuals
  - type: AccessReader
    access: !Clear [["Cargo"]]

- type: entity
  id: LockerRepresentative
  components:
  - type: AntiTamper
    broadcastChannel: CentCom

- type: entity
  id: LockerNanorep
  components:
  - type: AntiTamper
    broadcastChannel: CentCom

- type: entity
  id: LockerClown
  components:
  - type: AntiTamper
    broadcastChannel: Service # poor poor clown

- type: entity
  id: LockerSyndicatePersonal
  components:
  - type: AntiTamper
    broadcastChannel: Syndicate # funny

# Normal

- type: entity
  id: GunSafeBaseSecure
  components:
  - type: Damageable
    damageModifierSet: StructuralMetallicStrong
  - type: Injurable
    damageContainer: StructuralInorganic

- type: entity
  id: LockerFreezerBase
  components:
  - type: ExplosionResistance
    damageCoefficient: 0.01 # from 0.5
