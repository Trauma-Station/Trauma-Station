- type: entity
  id: GasCanister
  components:
  - type: AutomationSlots
    slots:
    - !type:AutomatedItemSlot
      input: AutomationSlotGasTank
      output: AutomationSlotGasTank
      slotId: tank_slot
    - !type:AutomatedPorts
      sinks:
      - Open
      - Close
      - Toggle
  - type: CosmicTransmutable
    transmuteTo: CosmicVacuousSpire
    requiresEmpowerment: true