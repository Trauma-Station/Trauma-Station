- type: entity
  id: BaseSign
  abstract: true
  components:
  - type: CosmicCorruptible
    convertTo: CosmicSign

- type: entity
  id: BaseSignDirectional
  abstract: true
  components:
  - type: CosmicCorruptible
    convertTo: CosmicSignDirectional

# Every single warning sign individually because they don't have a common parent. Ugh.
- type: entity
  id: SignCorrosives
  components: &components
  - type: CosmicCorruptible
    convertTo: CosmicSignWarning

- type: entity
  id: SignCryogenics
  components: *components

