- type: entity
  id: BaseAnomaly
  components:
  - type: Anomaly
    minPointsPerSecond: 15
    maxPointsPerSecond: 90
    growingPointMultiplier: 2
    minPulseLength: 90
    maxPulseLength: 200

- type: entity
  id: AnomalyLiquid
  components:
  - type: Solution
    id: anomaly
    solution:
      maxVol: 3000
  - type: EntitySpawnAnomaly
    entries: !Clear
    - settings:
        spawnOnSuperCritical: true
        minAmount: 5
        maxAmount: 10
        minRange: 3
        maxRange: 12
      spawns:
      - ReagentSlimeSpawner
  - type: PuddleCreateAnomaly
    maxPuddleSize: 300
    superCriticalPuddleSize: 2000
  - type: InjectionAnomaly
    solution: anomaly
    injectRadius: 6
    maxSolutionInjection: 30
    superCriticalInjectRadius: 15
  - type: ReagentProducerAnomaly
    maxReagentProducing: 4
    dangerousChemicals:
    - Cyanide
    - Genecide
    - NitricAcid
    - Heroin
    - Microplastics
    - Bungotoxin
    - WeldingFuel
    - ChloralHydrate
    - Allicin
    - Phenol
    - Burnite
    - Amatoxin
    - Fresium
    usefulChemicals:
    - Probital
    - Tirimol
    - Multiver
    - Immurin
    - Devirate
    - Probital
    - Mitotrophin
    - Monover
    - Ibuprofen
    - Formaldehyde
    - Morphine
    funChemicals:
    - CatDrugs
    - MouseBites
    - Copium
    - Nostalgia
    - Profanol

- type: entity
  id: AnomalyBluespace
  components:
  - type: BluespaceAnomaly
    maxShuffleRadius: 15 # How far it can teleport you from scaling with stability
    maxPortalRadius: 30
    minPortalRadius: 15

