- type: entity
  id: BaseCrowbar
  components:
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/crowbar_pickup.ogg
      params:
        volume: -2
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Items/crowbar_drop.ogg
      params:
        volume: -2
  - type: UseDelay # For insta prying
    delay: 1
  - type: Tweezers
    speed: 0.55
  - type: SurgeryTool
    startSound: /Audio/Items/crowbar.ogg
  - type: Tag
    tags:
    - DroneUsable