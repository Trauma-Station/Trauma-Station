    useDelay: stunbaton
  - type: UseDelayBlockMelee
    delays:
    - stunbaton
  - type: PhysicalComposition
    materialComposition:
      Steel: 50
      Plastic: 25
  - type: MeleeWeapon
    angle: 0 # git gud
  - type: StaminaDamageOnHit
