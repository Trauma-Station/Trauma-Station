- type: entity
  parent: [ BaseItem, BasePistolWhip ]
  id: BaseWeaponRevolver
  abstract: true
  components:
  - type: WeaponClass
    class: Pistol
  - type: Gun
    fireRate: 2
  - type: EmitSoundOnPickup
    sound:
      collection: RevolversPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: RevolversDrop
  - type: EmitSoundOnLand
    sound:
      collection: RevolversDrop

- type: entity
  id: WeaponRevolverDeckard
  components:
  - type: Gun
    fireRate: 2.5

- type: entity
  id: WeaponRevolverMateba
  components:
  - type: Gun
    fireRate: 4
  - type: RevolverAmmoProvider
    whitelist:
      tags:
      - CartridgeMagnum
      - SpeedLoaderMagnum
    proto: CartridgeMagnumAP
    capacity: 7
    chambers: [ True, True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null, null ]
    soundEject:
      path: /Audio/Weapons/Guns/MagOut/revolver_magout.ogg
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/revolver_magin.ogg

- type: entity
  id: WeaponRevolverPython
  components:
  - type: Gun
    fireRate: 2
