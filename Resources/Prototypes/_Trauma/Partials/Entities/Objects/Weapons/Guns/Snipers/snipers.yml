- type: entity
  name: BaseWeaponSniper
  parent: BaseItem
  id: BaseWeaponSniperNoAmmo # this has no ammo provider, moved that to BaseWeaponSniper
  description: A rooty tooty point and shooty.
  abstract: true
  components:
  - type: EmitSoundOnPickup
    sound:
      collection: SnipersPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: SnipersDrop
  - type: EmitSoundOnLand
    sound:
      collection: SnipersDrop
  - type: AltFireMelee
    attackType: Heavy
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 12
    angle: 0
    wideAnimationRotation: 90 # -90 if it takes bayonets (hits with muzzle) 90 if not (hits with butt)
    soundHit:
      collection: MetalThud
  - type: WeaponClass
    class: Sniper
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Item
    size: Large
  - type: Clothing
    sprite: Objects/Weapons/Guns/Snipers/bolt_gun_wood.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: Gun
    fireRate: 0.75
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/sniper.ogg
  - type: StaticPrice
    price: 500

- type: entity
  id: WeaponSniperHristov
  parent: [BaseWeaponSniperMagazine, BaseGunWieldable, BaseSyndicateContraband] #  added Magazine
  components:
  - type: Gun
    resetOnHandSelected: false # quickscope pro
  - type: CustomSpriteAmmoCounter
    loadedAmmoSprite: Interface/ItemStatus/Sniper_Cartriges/not_spent.png
    spentAmmoSprite: Interface/ItemStatus/Sniper_Cartriges/spent.png
  - !Remove type: BallisticAmmoProvider
  - type: SpeedModifiedOnWield
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: EyeCursorOffset
    maxOffset: 8
    pvsIncrease: 0.8
  - type: MeleeWeapon
    wideAnimationRotation: 45 # the sprite is diagonal so the animation must be too

- type: entity
  abstract: true
  parent: BaseWeaponSniperNoAmmo
  id: BaseWeaponSniper
  components: !Clear
  - type: BallisticAmmoProvider
    autoCycle: false
    capacity: 10
    proto: CartridgeLightRifle
    whitelist:
      tags:
      - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
