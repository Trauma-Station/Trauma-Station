- type: entity
  id: WeaponSniperHristov
  parent: [BaseWeaponSniperMagazine, BaseGunWieldable, BaseSyndicateContraband] #  added Magazine
  components:
  - type: Gun
    resetOnHandSelected: false # quickscope pro
  - type: CustomSpriteAmmoCounter
    loadedAmmoSprite: Interface/ItemStatus/Sniper_Cartriges/not_spent.png
    spentAmmoSprite: Interface/ItemStatus/Sniper_Cartriges/spent.png
  - !Remove type: BallisticAmmoProvider
  - !Clear type: SpeedModifiedOnWield
    walkModifier: 0.8
    sprintModifier: 0.8
  - !Clear type: EyeCursorOffset
    maxOffset: 8
    pvsIncrease: 0.8
  - type: MeleeWeapon
    wideAnimationRotation: 45 # the sprite is diagonal so the animation must be too
