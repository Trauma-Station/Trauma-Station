- type: entity
  abstract: true
  parent: BaseStockHit
  id: BaseWeaponBatteryNoAmmoCounter
  components:
  - type: EmitSoundOnPickup
    sound:
      collection: LasersPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: LasersDrop
  - type: EmitSoundOnLand
    sound:
      collection: LasersDrop
  - type: Cautery
    speed: 0.9
  - type: SurgeryTool
    endSound:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: AlwaysHot
  - type: BatteryDrinkerSource
    maxAmount: 180 # you probably don't want to drain your entire gun charging in battle
  - type: WeaponClass
    class: Laser

- type: entity
  abstract: true
  parent:
  - !Index:0 BasePistolWhip
  id: BaseWeaponPowerCellSmall

- type: entity
  abstract: true
  parent: BaseStockHit
  id: BaseWeaponPowerCell
  components:
  - type: Cautery
    speed: 0.9
  - type: SurgeryTool
    endSound:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: AlwaysHot
