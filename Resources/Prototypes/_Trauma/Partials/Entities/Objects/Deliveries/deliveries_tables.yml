- type: entityTable
  id: RandomDeliveryBasic # More letters less packages
  table: !type:GroupSelector
    children: !Clear
    - !type:NestedSelector
      tableId: RandomDeliveryLetterBasic
      weight: 0.85
    - !type:NestedSelector
      tableId: RandomDeliveryPackageBasic
      weight: 0.15

- type: entityTable
