    - !type:NestedSelector
      tableId: LetterCommonEntityTable
      weight: 0.3
    - !type:NestedSelector
      tableId: LetterUncommonEntityTable
      weight: 0.6
    - !type:NestedSelector
      tableId: LetterRareEntityTable
      weight: 0.1

