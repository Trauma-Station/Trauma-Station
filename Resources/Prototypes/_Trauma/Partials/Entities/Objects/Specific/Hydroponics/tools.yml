- type: entity
  id: HydroponicsToolClippers
  components:
  - type: Retractor # Same as wirecutters
    speed: 0.35
  - type: Hemostat
    speed: 0.6
  - type: SurgeryTool
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/retractor1.ogg
    endSound:
      path: /Audio/_Shitmed/Medical/Surgery/retractor2.ogg
  - type: Tag
    tags:
    - HydroponicsToolClippers # for plantbot construction
  - type: Tool
    qualities:
    - Cutting
    useSound:
      path: /Audio/Items/wirecutter.ogg

- type: entity
  id: HydroponicsToolScythe
  components:
  - type: WeaponClass
    class: Tool
  - type: CosmicTransmutable
    transmuteTo: ScytheCosmicCult # Is in fact a scythe
  - type: Item
    shape:
    - 0,0,1,0
    - 0,1,0,2
    storedOffset: -5,-5
    storedRotation: -45

- type: entity
  id: HydroponicsToolHatchet
  components:
  - type: WeaponClass
    class: Tool
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 1,1,1,1
    storedOffset: 10,0
  - type: Sharp
  - type: BoneSaw
    speed: 0.35
  - type: SurgeryTool
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/saw.ogg
  - type: CosmicTransmutable
    transmuteTo: ScytheCosmicCult

- type: entity
  id: PlantBag
  components:
  - type: RelayInteractionStorage
    whitelist:
      components:
      - ProduceMaterialExtractor
  - type: AntiRottingContainer
