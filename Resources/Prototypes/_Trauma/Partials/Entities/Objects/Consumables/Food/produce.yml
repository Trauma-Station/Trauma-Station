- type: entity
  id: DeathNettle
  components:
  - type: Item
    shape:
    - 0,1,0,2
    - 1,0,1,1
    storedRotation: 90
  - type: MeleeWeapon
    damage:
      types:
        Caustic: 1 # was 8 Heat 8 Caustic
  - type: !Remove Destructible # replaced by durability

- type: entity
  id: FoodBanana
  components:
  - type: EntityEffectOnEaten
    effects:
    - !type:AddComponents
      components:
      - type: EggFertilizer
        specialReplacement: MobChickClown
    entityWhitelist:
    - MobWhiteRooster
  - type: Healing # Bananas heal clown car
    damageContainers:
    - ClowncarDamageContainer
    damage:
      types:
        Blunt: -50
        Slash: -50
        Piercing: -50
        Ballistic: -50
        Heat: -10
        Shock: -10
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"

