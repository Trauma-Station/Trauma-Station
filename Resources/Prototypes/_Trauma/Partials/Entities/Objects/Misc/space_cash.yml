- type: entity
  id: BaseSpaceCash
  components:
  - !type:Remove Cash # dont want this to be inherited, moved to separate SpaceCash prototype
  - type: Currency
    price:
      Spesos: 1
  - type: Flammable # it's about sending a message
    fireSpread: true
    alwaysCombustible: true
    firestackFade: 0 # keeps burning since high hp
    damage:
      types:
        Heat: 0.5 # burns long
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: fire
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      # doesn't spawn anything for probably obvious reasons
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Edible
    solution: food
    delay: 1
    forceFeedDelay: 1
  - type: FlavorProfile
    flavors:
    - paper
  - type: BadFood
  - type: Solution
    id: food
    solution:
      maxVol: 1
      reagents:
      - ReagentId: Fiber
        Quantity: 1
  - type: Tag
    tags:
    - Paper # Moth food

- type: material
  id: Credit
  name: stack-credit
