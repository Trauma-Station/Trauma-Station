- type: entity
  parent:
  - AppearanceRatKing
  id: MobRatKing
  components:
  - type: VentCrawler
  - type: Targeting
  - type: RatKing
    molesAmmoniaPerDomain: 300
  - type: PassiveDamage
    allowedStates:
    - Alive
    damage:
      types:
        Poison: -0.5
        Blunt: -0.1
        Slash: -0.1
        Piercing: -0.1
        Heat: -0.1
        Cold: -0.1
        Shock: -0.1
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Mouse
    understands:
    - TauCetiBasic
    - Mouse

- type: entity
  parent:
  - !Index:-1 MobNightVision
  id: MobRatServant
  components:
  - type: Penetratable
    penetrateDamage: 5
  - type: VentCrawler
  - type: LanguageSpeaker
    speaks:
    - Mouse
    understands:
    - Mouse
    - TauCetiBasic
  - type: Bloodstream
    bloodReferenceSolution: # he is very small
      reagents:
      - ReagentId: Blood
        Quantity: 10
  - type: MobThresholds
    thresholds: !type:Clear
      0: Alive
      15: Dead # instead of crit at 15 dead at 30
  - type: Destructible
    thresholds: !Clear
    - trigger: !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:GibBehavior
        deleteGibs: true # no lag pls
        recursive: false
      - !type:SpawnGasBehavior
        gasMixture:
          moles:
            Ammonia: 25
