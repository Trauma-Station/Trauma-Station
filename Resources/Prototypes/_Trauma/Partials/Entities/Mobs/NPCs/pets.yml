- type: entity
  id: MobCorgiIan
  components:
  - type: IanAdventureTarget

- type: entity
  id: MobCorgiMouse
  components:
  - type: NPCRetaliation
    attackMemoryLength: 0 # dementia

- type: entity
  id: MobCorgiIanPup
  components:
  - type: IanAdventureTarget

- type: entity
  id: MobCatRuntime
  name: Aves
  description: The cat who walks by himself.
  components:
  - type: HTN
    rootTask:
      task: RuminantHostileCompound

- type: entity
  id: MobMcGriff
  components:
  - type: NPCRetaliation
  - type: HTN
    rootTask:
      task: RuminantHostileCompound
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Slash: 10

- type: entity
  id: MobFoxRenault
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTypeTrigger
        damageType: Blunt
        damage: 400
      behaviors:
      - !type:GibBehavior
      - !type:SpawnEntitiesBehavior
        spawn:
          Telecrystal1:
            min: 25
            max: 40
    - trigger: !type:DamageTypeTrigger
        damageType: Radiation
        damage: 15
      behaviors:
      - !type:PopupBehavior
        popup: mouth-taste-metal
        popupType: LargeCaution
        targetOnly: true
    - trigger: !type:DamageTypeTrigger
        damageType: Radiation
        damage: 40
      behaviors:
      - !type:VomitBehavior
  - type: StaticPrice
    price: 32500

- type: entity
  id: MobHamsterHamlet
  components:
  # hamlet is unique so higher chance to actually get faxed
  - type: FaxSlip
    slipChance: 0.5

- type: entity
  id: MobSpiderShiva
  components:
  - type: SolutionManager
    solutions:
    - SolutionShivaSpider
  - type: MeleeChemicalInjector
    transferAmount: 2
    solution: melee
  - type: Spider
    spawnsWebsAsNonPlayer: false

- type: entity
  id: MobSlimesPet
  components:
  - type: NPCRetaliation
  - type: HTN
    rootTask:
      task: RuminantHostileCompound
