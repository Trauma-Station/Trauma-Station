- type: explosion
  id: Default
  damagePerIntensity:
    types:
      Slash: 5
    woundTypeOverrides: &woundoverrides
      Heat: Burns
      Blunt: Fracture
      Slash: Laceration
      Piercing: Puncture
  tileBreakIntensity: !Clear [ 0, 10, 30 ]
  tileBreakRerollReduction: 20

