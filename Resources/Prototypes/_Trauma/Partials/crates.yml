- type: entity
  id: CrateGeneric
  components:
  - type: RequireProjectileTarget
  - type: Tag
    tags:
    - Crate

- type: entity
  parent: [ CrateBaseWeldable, AntiTamperLowPriority ] # adding anti tamper
  id: CrateBaseSecure
  components:
  - type: LockSignalControl
  - type: DeviceLinkSink
    ports:
    - Lock
    - Unlock
    - Toggle

- type: entity
  id: CrateWeaponSecure
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Damageable
    damageModifierSet: StrongCrates
  - type: Injurable
    damageContainer: StructuralInorganic

# Lockboxes

- type: entity
  id: CrateBaseLockBox
  components:
  - type: AntiRottingContainer # needed for plant bounties and it costs money so
  - type: RadioMicrophone
    broadcastChannel: Common
    listenRange: 0
    toggleOnInteract: false
    enabled: true

- type: entity
  id: CrateLockBoxEngineering
  components:
  - type: RadioMicrophone
    broadcastChannel: Engineering

- type: entity
  id: CrateLockBoxMedical
  components:
  - type: RadioMicrophone
    broadcastChannel: Medical

- type: entity
  id: CrateLockBoxScience
  components:
  - type: RadioMicrophone
    broadcastChannel: Science

- type: entity
  id: CrateLockBoxSecurity
  components:
  - type: RadioMicrophone
    broadcastChannel: Security

- type: entity
  id: CrateLockBoxService
  components:
  - type: RadioMicrophone
    broadcastChannel: Service

# Other

- type: entity
  id: CrateCoffin
  components:
  - type: VampireLair
  - type: EffectsOnContainer
    inserted:
    - !type:ModifyStatusEffect
      effectProto: VampireCoffinStatusEffect
      time: null
    removed:
    - !type:ModifyStatusEffect
      effectProto: VampireCoffinStatusEffect
      time: null
      type: Remove
