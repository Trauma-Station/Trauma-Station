- type: entity
  id: AppearanceArachnid
  components:
  - type: InitialBody
    organs:
      Wings: OrganArachnidAppendages

- type: entity
  id: MobArachnid
  components:
  - type: Butcherable
    spawned:
    - id: MaterialBones1 # Trauma - Bones on butchering humanoids
      amount: 3
  - type: Bloodstream
    bloodReferenceSolution:
      reagents: !Clear
      - ReagentId: CopperBlood
        Quantity: 300 # was 600
  - !Remove type: DamageVisuals

- type: entity
  id: OrganArachnidEyes
