

- type: entity
  id: MobDwarf
  components:
  - type: Mutatable
    dormant:
    - MutationDwarfism # not activated by default it would be too silly
    - MutationRockEater # non parity but peak
  - type: ScaleVisuals # remove the scale as the mutation will do it instead
    scale: 1, 1
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 300

- type: entity
  parent: [ OrganHumanTorso, OrganDwarfAppearance ]
  id: OrganDwarfTorso
  components:
  # it doesnt use a base dwarf external prototype :)
  - &woundable_visuals
    type: WoundableVisuals
    displacement: Dwarfism

- type: entity
  id: OrganDwarfHead
  components:
  - *woundable_visuals

