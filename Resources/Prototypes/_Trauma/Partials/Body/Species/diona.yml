- type: entity
  id: AppearanceDiona
  components:
  - type: InitialBody
    organs:
      Tongue: OrganDionaTongue

- type: entity
  id: MobDiona
  components:
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - RootSpeak
    understands:
    - TauCetiBasic
    - RootSpeak
  - type: FoliageIgnoringVision
  - type: Viewcone
    baseConeAngle: 360
  - type: Butcherable
    spawned:
    - id: MaterialWoodPlank1 # "bones"
      amount: 3
  - !Remove type: DamageVisuals
  - type: Bloodstream
    bloodReferenceSolution:
      reagents: !Clear
      - ReagentId: Sap
        Quantity: 300 # was 600

- type: entity
  id: OrganDionaTorso
  components:
  - type: BodyPart
    # removed Heart, Kidneys and Liver slots its a plant
    slots: !Clear
    # parts
    - Head
    - ArmLeft
    - ArmRight
    - LegLeft
    - LegRight
    # organs
    - Appendix
    - Lungs
    - Stomach

- type: entity
  id: OrganDionaEyes
  components:
  - type: StaticPrice
    price: 3000

- type: entity
  id: OrganDionaLungs
