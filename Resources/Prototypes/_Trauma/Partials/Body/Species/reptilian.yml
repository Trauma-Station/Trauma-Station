- type: entity
  id: AppearanceReptilian
  components:
  - type: Inventory
    speciesId: reptilian
    femaleDisplacements:
      shoes:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/Reptilian/displacement.rsi
            state: shoes
    displacements:
      shoes:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/Reptilian/displacement.rsi
            state: shoes
      jumpsuit:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/Reptilian/displacement.rsi
            state: jumpsuit
  - type: InitialBody
    organs:
      Tail: OrganReptilianTail

- type: entity
  id: MobReptilian
  components:
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Draconic
    understands:
    - TauCetiBasic
    - Draconic
  - type: Mutatable
    dormant:
    - MutationFireBreath
    - MutationMonkified # return to kobold
  - type: Puller
    needsHands: true # controlled by tail
  - type: Butcherable
    spawned:
    - id: MaterialBones1 # Bones on butchering humanoids
      amount: 3
  - !Remove type: Wagging #  moved to tail onAdd

- type: entity
  id: OrganReptilianLegLeft
  components:
