- type: markingsGroup
  id: Moth
  limits: !Clear
    enum.HumanoidVisualLayers.WingsBehind:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Hair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Wings: # ITS NOT A FUCKING TAIL
      limit: 1
      required: true
      default: [ MothWingsDefault ]
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ MothAntennasDefault ]
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false

- type: entity
  id: AppearanceMoth
  components:
  - type: InitialBody
    organs:
      Wings: OrganMothWings

- type: entity
  id: MobMoth
  components:
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Moffic
    understands:
    - TauCetiBasic
    - Moffic
  - type: Bloodstream
    bloodReferenceSolution:
      reagents: !Clear
      - ReagentId: InsectBlood
        Quantity: 300 # was 600
  - !Remove type: DamageVisuals # Shitmed
  - !Remove type: MovementSpeedModifier # moved to wings
  - type: Flammable
    damage:
      types: !Clear
        Heat: 0.75 # was 2.5 - 0.3x multiplier to compensate for limb damage

- type: entity
  parent: !Clear [ OrganBaseTorsoSexed, OrganBaseTorsoWinged, OrganMothExternal ] # Winged torso
  id: OrganMothTorso

- type: entity
  parent: !Clear [ OrganBaseHeadBald, OrganMothExternal ] # bald
  id: OrganMothHead

- type: entity
  id: OrganMothEyes
  components:
  - type: StaticPrice
    price: 3000

- type: entity
  id: OrganMothTongue
  components:
  - type: StaticPrice
    price: 1000

- type: entity
  id: OrganMothLungs
  components:
  - type: StaticPrice
    price: 4000

- type: entity
  id: OrganMothHeart
  components:
  - type: StaticPrice
    price: 4000

- type: entity
  id: OrganMothStomach
  components:
