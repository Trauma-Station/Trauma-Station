- type: entity
  id: AppearanceMoth
  components:
  - type: InitialBody
    organs:
      Wings: OrganMothWings

- type: entity
  id: MobMoth
  components:
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Moffic
    understands:
    - TauCetiBasic
    - Moffic
  - type: Bloodstream
    bloodReferenceSolution:
      reagents: !Clear
      - ReagentId: InsectBlood
        Quantity: 300 # was 600
  - !Remove type: DamageVisuals # Shitmed
  - !Remove type: MovementSpeedModifier # moved to wings
  - type: Flammable
    damage:
      types: !Clear
        Heat: 0.75 # was 2.5 - 0.3x multiplier to compensate for limb damage

- type: entity
  id: OrganMothEyes
  components:
