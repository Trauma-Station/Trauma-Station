- type: entity
  parent: OrganBase
  id: OrganBaseParent
  components:
  # This is very likely fucked
  - !Remove type: DetachableOrgan

- type: entity
  parent: OrganBaseExternal
  id: OrganBaseChildExternal

- type: entity
