- type: entity
  parent: !Clear
  - BaseKnowledgeContainer # Brain stores knowledge for mobs
  - OrganBase
  - OrganBaseChildInternal
  id: OrganBaseBrain
  components:
  - type: InternalChildOrgan
    intCap: 28
    integrity: 28
    integrityThresholds:
      Normal: 28
      Damaged: 16
      Destroyed: 0
  - type: ChildOrgan
    parents: [ Head ]
  - type: OrganChipContainer
    limit: 3
  - type: ContainerContainer
    containers:
      knowledge: !type:Container
      organ_chips: !type:Container

- type: entity
  id: OrganBaseEyes
  components:
  - type: ChildOrgan
    parents: [ Head ]
  - type: Eyes
  - type: InternalChildOrgan
    # Synced with BlindableComponent values
    intCap: 9
    integrity: 9
    integrityThresholds:
      Normal: 9
      Damaged: 6
      Destroyed: 0

- type: entity
  id: OrganBaseTongue
  components:
  - type: ChildOrgan
