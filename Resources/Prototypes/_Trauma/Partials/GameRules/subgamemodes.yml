# SPDX-License-Identifier: AGPL-3.0-or-later

- type: entity
  id: Thief
  components:
  - !Remove type: AntagRandomObjectives
  - type: AntagSelection
    antags: !Clear
    - !type:LinearAntagCount
      proto: Thief
      playerRatio: 15 # was 20
      range:
        min: 1
        max: 3

- type: entity
  parent: !Clear [BaseGameRule] # moved roundstart stuff to ChangelingRuleRoundstart
  id: BaseChangelingRule
  components:
  - type: AntagPlayerEffects
    effects:
    - !type:NestedEffect
      proto: ChangelingSkills
  - type: AntagObjectives
    objectives:
    - ChangelingSurviveObjective
    - ChangelingStealDNAObjective
    - ChangelingAbsorbObjective
    - EscapeIdentityObjective
  - type: AntagSelection
    selectionTime: RuleStarted # instead of pre spawn
    lateJoinAdditional: false
    antags: !Clear []
  - type: AntagRandomObjectives
    sets: !Clear
    - groups: ChangelingObjectiveGroups
    maxDifficulty: 5 # was 8
