- type: entity
  parent: VendingMachine
  id: VendingMachineMiningDrobe
  name: MiningDrobe
  description: A highly advanced vending machine for buying mining related clothing for free. Please do not mine Bitcoin with it.
  components:
  - type: VendingMachine
    pack: MiningDrobeInventory
  - type: DatasetVocalizer
    dataset: MiningDrobeAds
  - type: SpeakOnUIClosed
    pack: GenericVendGoodbyes
  - type: Sprite
    sprite: _Lavaland/Structures/VendingMachines/minerdrobe.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b89e2a"
  - type: AccessReader
    access: [["Salvage"]]

- type: localizedDataset
  id: MiningDrobeAds
  values:
    prefix: advertisement-miningdrobe-
    count: 3

- type: vendingMachineInventory
  id: MiningDrobeInventory
  contrabandInventory:
    FoodBoxDonkpocketCarp: 1
    ClothingUniformJumpsuitMilitarySalvageSpecialist: 1
    SalvageExpeditionsComputerCircuitboard: 0 # It is actually impossible to get this wihout changing variables and it only exists to taunt salvs
    UndeterminedWeaponSalvageSpecialist: 1 # This goes normally unused for some reason. Maybe because it is just the current weapon selector without crushers
