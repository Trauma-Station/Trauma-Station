- type: reagent
  id: StrawberryIce
  metabolisms: !Clear
    Bloodstream:
      metabolismRate: 1.0
      effects:
      # OD
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: StrawberryIce
          min: 30
        damage:
          types:
            Cellular: 1.5
            Poison: 1.5
      # Bad effect
      - !type:HealthChange
        damage:
          types:
            Cellular: 0.15
      - !type:AdjustReagent # TODO: MAKE THIS USE METABOLITES INSTEAD!!!
        reagent: Hydroxysomnolene
        amount: 0.5

      # Main effects
      - !type:MovementSpeedModifier
        walkSpeedModifier: 1.50
        sprintSpeedModifier: 1.50
      - !type:ModifyStatusEffect
        effectProto: StatusEffectDesoxyStamina # You are on Ice. You keep going.
        time: 10
      - !type:ModifyStatusEffect
        effectProto: StatusEffectAdrenaline
        time: 10
      - !type:ModifyStatusEffect
        effectProto: StatusEffectPainNumbness
        time: 10
      - !type:ModifyStatusEffect
        effectProto: StatusEffectDrowsiness
        time: null
        type: Remove
      - !type:ResetNarcolepsy
        conditions:
        - !type:ReagentCondition
          reagent: StrawberryIce
          min: 10
      - !type:ModifyStatusEffect
        effectProto: StatusEffectSeeingRainbow
        time: 10
      # Side effects
      - !type:GenericStatusEffect
        key: Stutter
        component: StutteringAccent
      - !type:Jitter

- type: reagent
  id: Hydroxysomnolene
  metabolisms: !Clear
    Bloodstream: # TODO: Make this metabolize as a metabolite!
      metabolismRate: 0.05
      effects:
      # Slow
      - !type:MovementSpeedModifier
        conditions:
        - !type:ReagentCondition
          reagent: StrawberryIce
          max: 0.1
        walkSpeedModifier: 0.65
        sprintSpeedModifier: 0.65

      # Sleepy
      - !type:ModifyStatusEffect
        conditions:
        - !type:ReagentCondition
          reagent: StrawberryIce
          max: 0.1
        effectProto: StatusEffectDrowsiness
        time: 2
        type: Add

      # Needs more strawberry Ice!
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: StrawberryIce
          max: 0.1
        - !type:ReagentCondition # so the heart attack popups are visible
          reagent: Hydroxysomnolene
          max: 30
        type: Local
        visualType: MediumCaution
        messages:
        - hydroxysomnolene-effect-flavor
        - hydroxysomnolene-effect-another-hit
        - hydroxysomnolene-effect-sluggish
        probability: 0.15

      # Withdrawal hits fully
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: StrawberryIce
          max: 0.1
        - !type:ReagentCondition
          reagent: Hydroxysomnolene
          min: 15
        damage:
          types:
            Poison: 0.3

      # Gives warning of full withdrawal
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: StrawberryIce
          max: 0.1
        - !type:ReagentCondition
          reagent: Hydroxysomnolene
          min: 15
        - !type:ReagentCondition # so the heart attack popups are visible
          reagent: Hydroxysomnolene
          max: 30
        type: Local
        visualType: LargeCaution
        messages:
        - hydroxysomnolene-effect-numb
        probability: 0.05

      # Heart stops from withdrawal
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: StrawberryIce
          max: 0.1
        - !type:ReagentCondition
          reagent: Hydroxysomnolene
          min: 30
        damage:
          types:
            Asphyxiation: 15

      # Gives warning of heart attack, time to inject more
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: StrawberryIce
          max: 0.1
        - !type:ReagentCondition
          reagent: Hydroxysomnolene
          min: 30
        type: Local
        visualType: LargeCaution
        messages:
        - hydroxysomnolene-effect-heart-attack
        probability: 0.5
