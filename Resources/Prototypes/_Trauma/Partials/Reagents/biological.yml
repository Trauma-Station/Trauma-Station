- type: reagent
  id: Slime
  metabolisms:
    Digestion:
      # Delicious!
      effects: !Clear
      - !type:Satiate
        satiationType: Hunger
        factor: 0.1
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Slime ]
          inverted: true
      - !type:ModifyBloodLevel
        amount: 0.5 # drawing 15u removes 5% blood level from a slimeperson, this will add 5% when injecting 15u
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Slime ]
