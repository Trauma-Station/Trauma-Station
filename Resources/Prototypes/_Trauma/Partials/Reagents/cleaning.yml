- type: reagent
  id: Bleach
  metabolisms:
    Digestion:
      metabolites:
        Bleach: 1 # drinking bleach is NOT safe
      effects:
      - !type:DiseaseProgressChange
        affectedType: Parasite
        progressModifier: -0.15
      - !type:Emote # extra fun when drank
        emote: Scream
        probability: 0.3
