# Disabilities

- type: entity
  parent: BaseMutation
  id: MutationClumsiness
  name: Clumsiness
  description: A genome that inhibits certain brain functions, causing the holder to appear clumsy. Honk!
  components:
  - type: Mutation
    instability: -40
  - type: ComponentMutation
    added:
    - type: Clumsy
      gunShootFailDamage:
        types: # literally just copied semi random values a chud picked
          Blunt: 5
          Piercing: 4
        groups:
          Burn: 3

- type: entity
  parent: BaseFreeMutation
  id: MutationTourettes
  name: Tourette's Syndrome
  description: A chronic twitch that forces the user to scream bad words.
  components:
  - type: RandomTrigger
    # TODO: make this be affected by synchronizer chromosome
    prob: 0.05
  - type: EffectOnTriggerMutation
    effects:
    - !type:WeightedRandomEffect
      conditions:
      - !type:MobStateCondition
        mobstate: Alive
      children:
      - weight: 1
        effect: !type:Emote
          emote: Twitch
      - weight: 2
        effect: !type:Speak
          id: TourettesSwearing

- type: entity
  parent: BaseMutation
  id: MutationDeafness
  name: Deafness
  description: The holder of this genome is completely deaf.
  components:
  - type: Mutation
    instability: -40
  - type: ComponentMutation
    added:
    - type: Deaf
      permanent: true

- type: entity
  parent: BaseMutation
  id: MutationMonkified
  name: Monkified
  description: A strange genome, believed to be what differentiates monkeys from humans.
  components:
  - type: Mutation
    instability: -40 # mmmonky
    locked: true # specific to monkeys (active) and humans (dormant)
  - type: PolymorphMutation
    prototype: MutationMonkey

