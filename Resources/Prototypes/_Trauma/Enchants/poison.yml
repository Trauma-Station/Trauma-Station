- type: entity
  parent: BaseEnchant
  id: EnchantPoison
  name: Poison
  components:
  - type: Enchant
    maxLevel: 1
    whitelist:
      components:
      - MeleeWeapon
    blacklist:
      components:
      - Solution
  - type: ComponentsEnchant
    added:
