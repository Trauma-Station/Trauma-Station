- type: entity
  parent: BaseEnchant
  id: CurseClumsy
  name: The Clowns Curse
  components:
  - type: Enchant
    maxLevel: 1
    whitelist:
      components:
      - Clothing
      - Armor
  - type: ComponentsEnchant
    added:
    - type: SpeechFontOverride
      font: LDFComicSans
    - type: ClothingGrantComponent
      component:
      # TODO: make it a clothing comp
      - type: PermanentStatusEffects
        statusEffects:
        - StatusEffectClumsyCurse
      - type: SleepEmitSound
        snore: /Audio/Voice/Misc/silly_snore.ogg
        interval: 10
