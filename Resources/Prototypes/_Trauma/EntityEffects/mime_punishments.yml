# Effect ran on mimes when they break vow
- type: entityEffect
  id: MimePunishments
  effects:
  - !type:WeightedRandomEffect
    probability: 0.25 # 75% chance of nothing happening
    children:
    - effect: !type:AddComponents
        guidebookText: entity-effect-guidebook-add-accents
        components:
        - type: OhioAccent
    - effect: !type:AddComponents
        guidebookText: entity-effect-guidebook-add-accents
        components:
        - type: BackwardsAccent
        - type: DementiaAccent
    - effect: !type:AddComponents
        guidebookText: entity-effect-guidebook-add-accents
        components:
        - type: VulgarAccent
        - type: BoganAccent
    - effect: !type:AddComponents
        guidebookText: entity-effect-guidebook-add-accents
        components:
        - type: VulgarAccent
        - type: RussianAccent
        - type: BackwardsAccent
        - type: OhioAccent

# This makes it so destroying a Chistmas Tree marks you with a kill sign
- type: entityEffect
  id: KillSign
  effects:
  - !type:AddComponents
    components:
    - type: KillSign
