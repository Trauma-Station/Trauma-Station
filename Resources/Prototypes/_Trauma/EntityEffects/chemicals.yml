- type: entityEffect
  id: BluespaceMelange
  effects:
  - !type:HealthChange
    damage:
      types:
        Poison: 3
  - !type:ModifyStatusEffect
    effectProto: StatusEffectSeeingRainbow
    type: Add
    time: 5
  - !type:ModifyStatusEffect
    effectProto: StatusEffectAdrenaline
    time: 1
  - !type:TakeStaminaDamage
    amount: -5
    immediate: true
  - !type:PlaySoundEffect
      sound:
        path: /Audio/Effects/teleport_departure.ogg
  - !type:RandomTeleport
    radius:
      min: 1.0
      max: 3.0
  - !type:PlaySoundEffect
      sound:
        path: /Audio/Effects/teleport_arrival.ogg
