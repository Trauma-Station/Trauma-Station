- type: entityEffect
  id: HeartAttack
  conditions:
  - !type:HasOrgan
    organCategory: Heart # need a heart to have a heart attack
  effects:
  - !type:PopupMessage
    visualType: LargeCaution
    messages:
    - entity-effect-popup-heart-stops
  - !type:RelayOrgans
    whitelist:
      components:
      - Heart
    effects:
    - !type:Gib
  - !type:ModifyStatusEffect
    effectProto: StatusEffectHeartAttack
    time: 10 # for drama, rather than running around for a minute before dying randomly
