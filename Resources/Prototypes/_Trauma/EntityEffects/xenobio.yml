# Shared extract reaction effects

- type: entityEffect
  id: XenobioExtractBase
  effects:
  - !type:RemoveComponents
    guidebookText: entity-effect-guidebook-remove-reactive
    components:
    - type: Reactive # prevent double dipping if it somehow reacts again in the same tick
  - !type:PlaySoundEffect
    sound: /Audio/Effects/Chemistry/bubbles.ogg

- type: entityEffect
  id: XenobioExtractDelete
  effects:
  - &base
    !type:NestedEffect
    proto: XenobioExtractBase
  - !type:Delete
    queued: true # needs to still exist for most effects to work properly

- type: entityEffect
  id: XenobioExtractEvil
  effects:
  - &delete
    !type:NestedEffect
    proto: XenobioExtractDelete
  - &evil_popup
    !type:PopupMessage
    type: Pvs
    messages: [ "xeno-extract-reaction-evil" ]

- type: entityEffect
  id: XenobioExtractEvilBase
  effects:
  - *base
  - *evil_popup

- type: entityEffect
  id: XenobioExtractFail
  effects:
  - *delete
  - &fail_popup
    !type:PopupMessage
    type: Pvs
    messages: [ "xeno-extract-reaction-fail" ]

- type: entityEffect
  id: XenobioExtractFailBase
  effects:
  - *base
  - *fail_popup

- type: entityEffect
  id: XenobioExtractReaction
  effects:
  - *delete
  - &reaction_popup
    !type:PopupMessage
    type: Pvs
    messages: [ "xeno-extract-reaction" ]

- type: entityEffect
  id: XenobioExtractReactionBase
  effects:
  - *base
  - *reaction_popup

- type: entityEffect
  id: XenobioExtractReagent
  effects:
  - *base
  - !type:AddTag
    tag: Trash
    guidebookText: entity-effect-guidebook-add-trash-tag
  - !type:PopupMessage
    type: Pvs
    messages: [ "xeno-extract-reaction-reagent" ]

# Specific effects

- type: entityEffect
  id: Ignite5
  effects:
  - !type:Flammable
    multiplier: 5
  - !type:Ignite
