- type: entityEffect
  id: MutationSeizure
  effects:
  - !type:PopupMessage
    type: Pvs
    visualType: LargeCaution
    messages:
    - entity-effect-popup-seizure
  - !type:Jitter
    amplitude: 20
    time: 29
  - !type:ModifyStatusEffect
    effectProto: StatusEffectForcedSleeping
    time: 20

- type: entityEffect
  id: MutationCough
  effects:
  - !type:Emote
    emote: Cough
    showInChat: true
  - !type:DropItems
  # TODO: throw the mob backwards with power chromosome, range 6 or something

- type: entityEffect
  id: MutationParanoia
  effects:
  - !type:Emote
    emote: Scream
    showInChat: true
  # TODO: 25% chance to start hallucinating for 40s

- type: entityEffect
  id: MutationFierySweat
  effects:
  - !type:Flammable
    multiplier: 2 # TODO: make power chromosome increase this
  - !type:Ignite

- type: entityEffect
  id: MutationAcidicFleshBubble
  effects:
  - !type:RelayMutated
    effect: !type:PopupMessage
      messages:
      - entity-effect-popup-acidic-flesh-bubbles
  - !type:StartUseDelay

- type: entityEffect
  id: MutationAcidicFleshPop
  effects:
  - !type:PopupMessage
    type: Pvs
    visualType: MediumCaution
    messages:
    - entity-effect-popup-acidic-flesh-pops
  - !type:HealthChange
    ignoreResistances: false # having lab coats etc help is decent for gameplay, doesnt make much sense though
    useTargeting: false # picks a random limb instead of applying damage everywhere evenly
    damage:
      types:
        Caustic: 15 # TODO: random scale
  # TODO: play sear sound

# Spastic

- type: entityEffect
  id: MutationSpasms
  effects:
  - !type:WeightedRandomEffect
    children:
    - effect: !type:NestedEffect
        proto: SpasmMove
    - effect: !type:NestedEffect
        conditions:
        - !type:HoldingItemCondition
        proto: SpasmAttackSelf
    - effect: !type:NestedEffect
        proto: SpasmPunchSelf
    - effect: !type:NestedEffect
        proto: SpasmAttackOthers
    - effect: !type:NestedEffect
        conditions:
        - !type:HoldingItemCondition
        proto: SpasmThrow

- type: entityEffect
  id: SpasmMove
  effects:
  - !type:PopupMessage
    messages:
    - entity-effect-popup-spasm-leg
  # TODO

- type: entityEffect
  id: SpasmAttackSelf
  effects:
  - !type:PopupMessage
    messages:
    - entity-effect-popup-spasm-fingers
  - !type:AttackSelf

- type: entityEffect
  id: SpasmPunchSelf
  effects:
  - !type:PopupMessage
    messages:
    - entity-effect-popup-spasm-arm
  - !type:AttackSelf
    useHeld: false

- type: entityEffect
  id: SpasmAttackOthers
  effects:
  - !type:PopupMessage
    messages:
    - entity-effect-popup-spasm-arm
  - !type:AttackOthers
  # TODO: attack in a random direction, using 7m range for a gun

- type: entityEffect
  id: SpasmThrow
  effects:
  - !type:PopupMessage
    messages:
    - entity-effect-popup-spasm-arm
  - !type:ThrowRandomItem

# Two Left Feet

- type: entityEffect
  id: MutationFeetTrip
  effects:
  - !type:PopupMessage
    visualType: SmallCaution
    messages:
    - entity-effect-popup-feet-trip
  - !type:Knockdown
    time: 3

# H.A.R.S.

- type: entityEffect
  id: MutationRemoveHead
  effects:
  - !type:RelayBodyParts
    guidebookText: entity-effect-guidebook-add-brain-slot-chest
    partType: Chest
    effects:
    - !type:AddOrganSlot
      slot: brain
    - !type:AddOrganSlot
      slot: eyes
  - !type:MoveOrgan
    slot: brain
    src: Head
    dest: Chest
  - !type:MoveOrgan
    slot: eyes
    src: Head
    dest: Chest
  - !type:RelayBodyParts
    guidebookText: entity-effect-guidebook-gib-head
    partType: Head
    effects:
    - !type:DetachPart
    - !type:Gib
  - !type:RelayBodyParts
    guidebookText: entity-effect-guidebook-remove-head-slot
    partType: Chest
    effects:
    - !type:RemovePartSlot # no cheesing it by attaching a new head
      slot: head
  - !type:SetStanding # Debrained gets added for a moment which downs them, undo that
  - !type:PopupMessage
    type: Pvs
    visualType: Medium
    messages:
    - entity-effect-popup-head-removed

- type: entityEffect
  id: MutationAddHead
  effects:
  - !type:RelayBodyParts
    guidebookText: entity-effect-guidebook-add-head-slot
    partType: Chest
    effects:
    - !type:AddPartSlot
      slot: head
      partType: Head
      symmetry: None
    - !type:RegeneratePart
      slot: head
  - !type:RelayBodyParts
    guidebookText: entity-effect-guidebook-damage-head
    partType: Head
    effects:
    - !type:HealthChange
      damage:
        types:
          Blunt: 50
  - !type:MoveOrgan
    slot: brain
    src: Chest
    dest: Head
  - !type:MoveOrgan
    slot: eyes
    src: Chest
    dest: Head
  - !type:RelayBodyParts
    guidebookText: entity-effect-guidebook-remove-brain-slot-chest
    partType: Chest
    effects:
    - !type:RemoveOrganSlot
      slot: brain
    - !type:RemoveOrganSlot
      slot: eyes
  - !type:SetStanding # Debrained gets added for a moment which downs them, undo that
  - !type:PopupMessage
    type: Pvs
    visualType: Medium
    messages:
    - entity-effect-popup-head-regrown
