- type: entity
  parent: BaseAction
  id: ActionCombustion
  name: Combustion
  description: Instantly ignite a target, applying maximum fire stacks.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 15
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/fireball.ogg
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: spell_default
  - type: TargetAction
    range: 10
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:CombustionSpellEvent

- type: entity
  parent: BaseAction
  id: ActionBloodBoil
  name: Blood Boil
  description: Boil the target's blood.
  components:
  - type: Action
    useDelay: 15
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/fireball.ogg
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: spell_default
  - type: TargetAction
    range: 10
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:BloodBoilSpellEvent
