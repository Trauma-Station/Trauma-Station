# lob corp magic bullet at home player version, shoot really fucking slow adds burn stacks on melee
# todo: maybe reloading as a verb?
- type: entity
  name: Magic Bullet
  parent: [BaseItem, BaseGunWieldable, BaseSecurityScienceContraband]
  id: IdGearMagicBullet
  suffix: I.D. Gear
  description: I.D. Gear extracted from AER-1821. Just as the Devil said, the bullets will puncture anything you please. Forever.
  components:
  - type: WeaponClass
    class: Rifle
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Lever/chester_icon_48x.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Guns/Lever/chester.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Gun
    fireRate: 0.25
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Trauma/Aer/magicBulletSound.ogg
  - type: Item
    sprite: _Goobstation/Objects/Weapons/Guns/Lever/chester.rsi
    size: Large
    shape:
    - 0,0,4,1
  - type: BasicEntityAmmoProvider
    proto: BulletIdMagicBullet
    capacity: 7
    count: 7
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 33.3
    rechargeSound:
      path: /Audio/Weapons/Guns/Cock/batrifle_cock.ogg
  - type: AmmoCounter
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: AltFireMelee
    attackType: Heavy
  - type: IgniteOnMeleeHit
    fireStacks: 0.5
  - type: MeleeWeapon
    damage:
      types:
       Blunt: 12
    angle: 0
    wideAnimationRotation: 90
    soundHit:
      collection: MetalThud
  - type: EmitSoundOnPickup
    sound:
      collection: RiflesPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: RiflesDrop
  - type: EmitSoundOnLand
    sound:
      collection: RiflesDrop

# bullet shot by the Freischütz rifle
- type: entity
  categories: [ HideSpawnMenu ]
  parent: BaseBulletKinetic
  id: BulletAerMagicBullet
  name: bullet devilish
  components:
  - type: Sprite
    sprite: /Textures/_Trauma/Mobs/Aer/magicBullet.rsi
    layers:
    - state: arcane_barrage
  - type: Projectile
    damage:
      types:
        Ion: 80
        Asphyxiation: 80
        Structural: 120
    penetrationThreshold: 2500
  - type: Ammo
    muzzleFlash: MuzzleFlashEffectOmnilaser
  - type: AntiWallBang

# I.D. Gear version of Freischütz rifle bullets
- type: entity
  categories: [ HideSpawnMenu ]
  parent: BulletAerMagicBullet
  id: BulletIdMagicBullet
  name: bullet devilish
  components:
  - type: Projectile
    damage:
      types:
        Ion: 40
        Asphyxiation: 40
        Structural: 60

# Aer Version of the rifle shoot at double the fire rat and has a more robust buttstock whack
# TO DO add pen functionality to the rifle?
- type: entity
  name: Freischütz
  parent: IdGearMagicBullet
  id: AerMagicBullet
  suffix: Aer Unremovable
  description: This magical bullet can truly hit anyone, just like you say...
  components:
  - type: Gun
    fireRate: 0.5
  - type: BasicEntityAmmoProvider
    proto: BulletAerMagicBullet
    capacity: 7
    count: 1
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 66.6
  - type: Unremoveable
    deleteOnDrop: true
  - type: MeleeWeapon
    damage:
      types:
       Blunt: 12
       Structural: 50
  - type: IgniteOnMeleeHit
    fireStacks: 1

# aer-1821 version of devil contract no soul stealing, keep only gun related positive clauses
