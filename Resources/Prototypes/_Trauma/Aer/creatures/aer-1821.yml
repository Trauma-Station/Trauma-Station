#pipe case for lack of pipe devil deal, resized medal case with pipe and engraved flippo and tobacco
- type: entity
  id: PipeCase
  parent: [ BaseStorageItem, BaseBagOpenClose ]
  name: pipe case
  description: A case for holding your pipe and tobacco when you are not smoking.
  components:
  - type: Sprite
    sprite: Objects/Storage/medalcase.rsi
    layers:
    - state: closed
      map: ["closeLayer"]
    - state: open
      map: ["openLayer"]
  - type: Appearance
  - type: Item
    sprite: Objects/Storage/medalcase.rsi
    size: Normal
  - type: Storage
    grid:
    - 0,0,1,1
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: SmokingPipeFilledTobacco
        - id: FlippoEngravedLighter
        - id: GroundTobacco
          amount: 2

# action for summoning 1821 contracts
- type: entity
  parent: BaseAction
  id: ActionCreateContractAer
  name: Summon contract
  description: Creates a contract in AER-1821's hand.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 600
    itemIconStyle: NoItem
  - type: Sprite
    sprite: /Textures/_Trauma/Mobs/Aer/aerMarksmanContract.rsi
    layers:
    - state: contract-written
  - type: InstantAction
    event: !type:CreateContractEventAer {}

# aer-1821 freischutz at home mostly copypasted from demon stuff or stuff stolen from base humanoids, has two hand to wield it's rifle
- type: entity
  parent: [MobSpaceBasic, MobCombat, InventoryBase]
  id: AerMarksman
  name: AER-1821
  description: AER-1821 wears the tattered remains of its previous life... not that anyone can recognize it. In place of a face, all that's left is a mass of twisting shadows, with piercing blue eyes within. Is it a devil? A man? Would you know?
  components:
  - type: Sprite
    sprite: _Trauma/Mobs/Aer/aerMarksman.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Eldritch
  - type: PassiveDamage
    allowedStates:
    - Alive
    damage:
      types:
        Heat: -1
        Blunt: -1
        Piercing: -1
        Slash: -1
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Sulfur
        Quantity: 300
  - type: Crawler
  - type: Inventory
    templateId: demon
  - type: Hands
    hands:
      hand_left:
        location: Left
      hand_right:
        location: Right
    sortedHands:
    - hand_right
    - hand_left
  - type: HandsFill
    hands:
      hand_left: AerMagicBullet
      hand_right: null
  - type: ComplexInteraction
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
  - type: FootstepModifier
  - type: Physics
    bodyType: KinematicController
  - type: MobThresholds
    thresholds:
      0: Alive
      200: SoftCrit
      250: Critical
      300: Dead
  - type: ZombieImmune
  - type: Puller
    needsHands: true
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: Targeting
  - type: HTN
    rootTask:
      task: SimpleRangedHostileCompound
    blackboard:
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: AerMarksman
  - type: ActionGrant
    actions:
    - ActionCreateContractAer
  - type: AnomalousEntity
    researchPerSecond: 100
    researchOnBehaviour: 5000
    idGear: IdGearMagicBullet
  - type: GhostRole
    name: AER-1821
    description: acquire souls, shoot the d-class trying to game your contracts
    rules: ghost-role-information-freeagent-rules
    mindRoles:
    - MindRoleGhostRoleFreeAgent
    raffle:
      settings: default

- type: entity
  parent: BaseAerObjective
  id: AerMarksmanContractObjective
  components:
  - type: Objective
    icon:
      sprite: /Textures/_Trauma/Mobs/Aer/aerMarksmanContract.rsi
      state: contract-written
  - type: NumberObjective
    min: 5
    max: 7
    title: objective-condition-contract-title
    description: objective-condition-contract-description
  - type: SignContractCondition

- type: entity
  parent: BaseAerObjective
  name: Take Commisions
  description:  Convince people to request your services.
  id: AerMarksmanLarpObjective
  components:
  - type: Objective
    icon:
      sprite: /Textures/_Trauma/Mobs/Aer/aerMarksmanContract.rsi
      state: contract-written
      issuer: Self
    difficulty: 1
  - type: RoleplayObjective