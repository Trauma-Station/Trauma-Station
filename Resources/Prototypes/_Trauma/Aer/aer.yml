# Aer sensor machine that must be used in containment chamber it analyses a linked anomalous entity in range
- type: entity
  id: MachineAERContainmentSensor
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  name: AER Analysis Sensor
  description: A sensor able to examine an abnormal entity to produce usable research data.
  components:
  - type: Sprite
    drawdepth: FloorObjects
    sprite: _Trauma/Structures/Aer/aerSensor.rsi
    layers:
    - state: gsensor1
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Transform
    noRot: false
  - type: Physics
    canCollide: false
  - type: AnomalousEntityContainment
  - type: ResearchClient
  - type: ActivatableUI
    key: enum.ResearchClientUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface
  - type: PointLight
    radius: 1.2
    energy: 2
    color: "#fca3c0"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Machine
    board: AerSensorCircuitboard

# Aer sensor board
- type: entity
  parent: BaseMachineCircuitboard
  id: AerSensorCircuitboard
  name: AER Analysis sensor board
  description: A machine printed circuit board for an AER Analysis Sensor.
  components:
    - type: Sprite
      state: science
    - type: MachineBoard
      prototype: MachineAERContainmentSensor
      stackRequirements:
        Manipulator: 1
        Cable: 1
        PlasmaGlass: 5

# super shitty base i need ideas on what to make base
- type: entity
  abstract: true
  parent: [ MobSpaceBasic, MobCombat ]
  id: BaseAer
  name: AER-123
  description: It came from hell.
  components:
  - type: KnowledgeHolder
  - type: KnowledgeContainer # no skills lol
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavPry: !type:Bool
        true
      NavSmash: !type:Bool
        true
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 4.5
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
  - type: FootstepModifier
  - type: Physics
    bodyType: KinematicController
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Dead
  - type: PassiveDamage
