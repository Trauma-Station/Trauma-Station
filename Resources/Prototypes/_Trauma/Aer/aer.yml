  - type: Puller
    needsHands: false
  - type: GhostRole
    name: ghost-role-information-demon-name
    description: ghost-role-information-demon-desc
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleGhostRoleSoloAntagonist
    raffle:
      settings: short
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
  - type: GhostTakeoverAvailable
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: Targeting
  - type: WarpPoint
  - type: AnomalousEntity
    researchPerSecond: 1000
    contained: false
  - type: AerMobActive

