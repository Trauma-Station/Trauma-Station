- type: entity
  name: Magic Bullet
  parent: [BaseItem, BaseGunWieldable, BaseSecurityScienceContraband]
  id: IdGearMagicBullet
  suffix: I.D. Gear
  description: I.D. Gear extracted from AER-169, capabable of shooting bullets that can penetrate multiple targets.
  components:
  - type: WeaponClass
    class: Rifle
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Lever/chester_icon_48x.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Guns/Lever/chester.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Gun
    fireRate: 0.25
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Trauma/Aer/magicBulletSound.ogg
  - type: Item
    sprite: _Goobstation/Objects/Weapons/Guns/Lever/chester.rsi
    size: Large
    shape:
    - 0,0,4,1
  - type: BasicEntityAmmoProvider
    proto: BulletIdMagicBullet
    capacity: 7
    count: 7
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 4.5
    rechargeSound:
      path: /Audio/Weapons/Guns/Cock/batrifle_cock.ogg
  - type: AmmoCounter
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: AltFireMelee
    attackType: Heavy
  - type: IgniteOnMeleeHit
    fireStacks: 0.5
  - type: MeleeWeapon
    damage:
      types:
       Blunt: 12
    angle: 0
    wideAnimationRotation: 90
    soundHit:
      collection: MetalThud
  - type: EmitSoundOnPickup
    sound:
      collection: RiflesPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: RiflesDrop
  - type: EmitSoundOnLand
    sound:
      collection: RiflesDrop

