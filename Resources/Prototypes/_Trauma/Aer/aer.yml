# action for summoning 169 contracts
- type: entity
  parent: BaseAction
  id: ActionCreateContractAer
  name: Summon contract
  description: Creates a contract in AER-169's hand.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: NoItem
    icon:
      sprite: /Textures/_Trauma/Mobs/Aer/freischutzContract.rsi
      state: contract-written
  - type: InstantAction
    event: !type:CreateContractEventAer {}

