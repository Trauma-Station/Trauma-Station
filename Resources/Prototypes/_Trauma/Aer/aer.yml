- type: reagent
  id: Gloom
  name: Gloom
  group: Special
  desc: reagent-desc-laughter
  physicalDesc: reagent-physical-desc-funny
  flavor: funny
  color: "#4d8bff"
  worksOnTheDead: true
  metabolisms:
    Bloodstream:
      effects:
      - !type:Emote
        emote: Crying
        showInGuidebook: true
        showInChat: true
        force: true
        probability: 0.3
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "laughter-effect-control-laughter" ]
        probability: 0.2