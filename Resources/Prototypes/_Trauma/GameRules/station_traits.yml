- type: entity
  parent: BaseGameRule
  id: BananiumShipmentRule
  components:
  - type: PlayerEffectsRule
    jobs: [ Clown ]
    effects:
    - !type:SpawnInsideSlot
      slot: back
      entity: MaterialBananium5
    - !type:SpawnInsideSlot
      slot: back
      entity: PillCanisterPotassiumIodide # yeah... gonna need that

- type: entity
  parent: BaseGameRule
  id: UniqueAIRule
  components:
  - type: PlayerEffectsRule
    jobs: [ StationAi ]
    effects:
    - !type:RandomizeLawset
      lawsets:
      # no crazy antag/malf laws, just interesting ones
      - CommandmentsLawset
      - PaladinLawset
      - LiveLetLiveLaws
      - EfficiencyLawset
      - RobocopLawset
      - GameMasterLawset
      - PainterLawset
      - NutimovLawset
      - HelpimovLawset

- type: entity
  parent: BaseGameRule
  id: FreeScarvesRule
  components:
  - type: PlayerEffectsRule
    effects:
    - !type:EquipEntityTable
      slot: neck
      table: !type:NestedSelector
        tableId: RandomScarf
      silent: true

- type: entity
  parent: BaseGameRule
  id: LuckyWinnerRule
  components:
  - type: RandomEffectsRule
    minTime: 6m
    maxTime: 12m
    effects:
    - !type:StationAreaEffects
      areaComp: LuckyWinnerTarget
      effects:
      - !type:SpawnEntity
        entity: SpawnSupplyLuckyWinner

- type: entityEffect
  id: AAAAA
  effects:
  - !type:StationAreaEffects
    areaComp: LuckyWinnerTarget
    effects:
    - !type:PopupMessage
      messages: [ "HI BAR" ]
      type: Pvs
