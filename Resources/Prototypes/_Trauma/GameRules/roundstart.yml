# i love this dogshit system nobody has improved for 2 years :)
- type: entity
  parent: BaseGameRule
  id: SubGamemodesRuleNoHeretic
  components:
  - type: SubGamemodes
    rules:
    - id: Thief
      prob: 0.5
    - id: Devil
      prob: 0.02
    - id: ShadowlingRoundstart
      prob: 0.02
    - id: WraithRoundstart
      prob: 0.02

- type: entity
  parent: BaseGameRule
  id: InsurgencyRuleRandom
  components:
  - type: GameRule
    minPlayers: 5
  - type: NestedRule
    rules: !type:GroupSelector
      children:
      - id: InsurgencyShipVariantTide
        weight: 30
      - id: InsurgencyShipVariantInsurgents
        weight: 70

- type: entity
  parent: BaseGameRule
  id: InsurgencyRule # for antag smite
  components:
  - type: RuleGrids
  - type: LoadMapRule
    gridPath: /Maps/_Trauma/Shuttles/insurgents.yml
  - type: AntagLoadProfileRule
    speciesOverride: Human
    speciesOverrideBlacklist:
    - Plasmaman # instantly dies
  - type: AntagObjectives
    objectives:
    - InsurgentEscapeObjective
    #- InsurgentAllSurviveObjective # TODO
  - type: InsurgencyRule
  - type: AntagSelection
    agentName: insurgent-round-end-agent-name
    antags:
    - !type:FixedAntagCount
      proto: Insurgent

- type: entity
  abstract: true
  parent: [ InsurgencyRule, BaseRoundstartAntagRule ]
  id: BaseInsurgencyRule
  components:
  - type: AntagSelection
    antags:
    - !type:LinearAntagCount
      proto: Insurgent
      range:
        min: 1
        max: 4
      playerRatio: 10

- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseSpyRule
  components:
  - type: AntagPlayerEffects
    effects:
    - !type:NestedEffect
      proto: TraitorSkills
  - type: SpyRule
  - type: Store
    categories:
    - UplinkWeaponry
    - UplinkExplosives
    - UplinkWearables
    - UplinkChemicals
    - UplinkDeception
    - UplinkDisruption
    - UplinkImplants
    - UplinkAllies
    currencyWhitelist:
    - Telecrystal
    balance:
      Telecrystal: 0
  - type: GameRule
    minPlayers: 15
  - type: AntagSelection
    agentName: spy-round-end-agent-name
  # Get 3 random rp objectives and 1 real objective
  - type: AntagObjectives
    objectives:
    - SpyRandomObjective
    - SpyRandomObjective
    - SpyRandomObjective
  - type: AntagRandomObjectives
    maxDifficulty: 10
    sets:
    - groups: SpyObjectiveGroups
      maxPicks: 1

- type: entity
  parent: [ BaseSpyRule, BaseRoundstartAntagRule ]
  id: SpyRuleRoundstart
  components:
  - type: AntagSelection
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      playerRatio: 7
      proto: Spy
      range:
        min: 2 # At least some competition
        max: 8

- type: entity
  parent: BaseSpyRule
  id: SpyRule
  components:
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: Spy

# Insurgents

- type: entity
  parent: BaseInsurgencyRule
  id: InsurgencyShipVariantInsurgents
  components:
  - type: LoadMapRule
    gridPath: /Maps/_Trauma/Shuttles/insurgents.yml

- type: entity
  parent: BaseInsurgencyRule
  id: InsurgencyShipVariantTide
  components:
  - type: LoadMapRule
    gridPath: /Maps/_Trauma/Shuttles/tide_insurgents.yml

- type: entity
  parent: BaseGameRule
  id: SubTraitorRandom
  components:
  - type: SubGamemodes
    rules:
    - id: SubTraitor
      prob: 0.2

- type: entity
  parent: [ BaseShadowlingRule, BaseRoundstartAntagRule ]
  id: ShadowlingGamemode
  components:
  - type: GameRule
    minPlayers: 30
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: Shadowling

- type: entity
  parent: TraitorReinforcement
  id: TraitorReinforcementNukeOps
  components:
  - type: AntagPlayerEffects
    effects:
    - !type:NestedEffect
      proto: InstallHypoportNukie
    - !type:InstallOrganChip
      chip: SkillChipNukie

- type: entity
  parent: BaseGameRule
  id: SpectatorStatistics
  components:
  - type: ObserverStatisticRule

- type: entity
  parent: BaseChangelingRule
  id: ChangelingRule
  components:
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: Changeling

- type: entity
  parent: [ BaseChangelingRule, BaseRoundstartAntagRule ]
  id: ChangelingRuleRoundstart
  components:
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      proto: Changeling
      playerRatio: 12
      range:
        min: 1
        max: 4
