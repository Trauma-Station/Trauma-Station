# i love this dogshit system nobody has improved for 2 years :)
- type: entity
  parent: BaseGameRule
  id: SubGamemodesRuleNoHeretic
  components:
  - type: SubGamemodes
    rules:
    - id: SubSpies
      prob: 0.3
    - id: Devil
      prob: 0.02
    - id: ShadowlingRoundstart
      prob: 0.02
    - id: WraithRoundstart
      prob: 0.02

- type: entity
  parent: BaseGameRule
  id: SubGamemodesRuleNoSpy
  components:
  - type: SubGamemodes
    rules:
    - id: SubHeretic
      prob: 0.2
    - id: Devil
      prob: 0.02
    - id: ShadowlingRoundstart
      prob: 0.02
    - id: WraithRoundstart
      prob: 0.1
    - id: Demonologist
      prob: 0.2

- type: entity
  parent: BaseGameRule
  id: Insurgency
  components:
  - type: GameRule
    minPlayers: 5
  - type: NestedRule
    rules: !type:GroupSelector
      children:
      - id: InsurgencyShipVariantTide
        weight: 30
      - id: InsurgencyShipVariantInsurgents
        weight: 70

- type: entity
  abstract: true
  parent: BaseRoundstartAntagRule
  id: BaseInsurgencyRule
  components:
  - type: RuleGrids
  - type: LoadMapRule
    gridPath: /Maps/_Trauma/Shuttles/insurgents.yml
  - type: AntagObjectives
    objectives:
    - InsurgentEscapeObjective
    #- InsurgentAllSurviveObjective # TODO
  - type: AntagLoadProfileRule
    speciesOverride: Human
    speciesOverrideBlacklist:
    - Plasmaman # instantly dies
  - type: InsurgencyRule
  - type: AntagSelection
    agentName: insurgent-round-end-agent-name
    antags:
    - !type:LinearAntagCount
      proto: Insurgent
      range:
        min: 1
        max: 4
      playerRatio: 10

- type: entity
  parent: BaseRoundstartAntagRule
  id: Spies
  components:
  - type: AntagPlayerEffects
    effects:
    - !type:NestedEffect
      proto: TraitorSkills
  - type: SpyRule
  - type: Store
    categories:
    - UplinkWeaponry
    - UplinkExplosives
    - UplinkWearables
    - UplinkChemicals
    - UplinkDeception
    - UplinkDisruption
    - UplinkImplants
    - UplinkAllies
    currencyWhitelist:
    - Telecrystal
    balance:
      Telecrystal: 0
  - type: GameRule
    minPlayers: 5
  - type: AntagSelection
    agentName: spy-round-end-agent-name
    lateJoinAdditional: true
    antags:
    - !type:LinearAntagCount
      playerRatio: 6
      proto: Spy
      range:
        min: 1
        max: 8
  # Get 3 random rp objectives and 1 real objective
  - type: AntagObjectives
    objectives:
    - SpyRandomObjective
    - SpyRandomObjective
    - SpyRandomObjective
  - type: AntagRandomObjectives
    maxDifficulty: 10
    sets:
    - groups: SpyObjectiveGroups
      maxPicks: 1

- type: entity
  parent: BaseInsurgencyRule
  id: InsurgencyShipVariantInsurgents
  components:
  - type: LoadMapRule
    gridPath: /Maps/_Trauma/Shuttles/insurgents.yml

- type: entity
  parent: BaseInsurgencyRule
  id: InsurgencyShipVariantTide
  components:
  - type: LoadMapRule
    gridPath: /Maps/_Trauma/Shuttles/tide_insurgents.yml

- type: entity
  parent: BaseGameRule
  id: SubTraitorRandom
  components:
  - type: SubGamemodes
    rules:
    - id: SubTraitor
      prob: 0.2

- type: entity
  parent: [ BaseShadowlingRule, BaseRoundstartAntagRule ]
  id: ShadowlingGamemode
  components:
  - type: GameRule
    minPlayers: 30
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: Shadowling

- type: entity
  parent: TraitorReinforcement
  id: TraitorReinforcementNukeOps
  components:
  - type: AntagPlayerEffects
    effects:
    - !type:NestedEffect
      proto: InstallHypoportNukie
    - !type:InstallOrganChip
      chip: SkillChipNukie

- type: entity
  parent: BaseGameRule
  id: SpectatorStatistics
  components:
  - type: ObserverStatisticRule

- type: entity
  parent: BaseGameRule
  id: Demonologist
  components:
  - type: DemonologistRule # TODO
  - type: GameRule
    minPlayers: 20
  - type: AntagSelection
    agentName: demonologist-round-end-agent-name
    antags:
    - !type:FixedAntagCount
      proto: Demonologist
  - type: AntagPlayerEffects
    effects:
    - !type:NestedEffect
      proto: WizardSkills
    - !type:ChangeFaction
      newFaction: VampireFaction # TODO: demonologist faction and put under control demons inside it
  - type: AntagObjectives
    objectives: # TODO
    - VampireBloodObjective
    - VampireSurviveObjective
    - VampireBloodsuckObjective
  - type: LoadMapRule
    mapPath: /Maps/_Goobstation/Nonstations/wizden.yml # TODO
  - type: RuleGrids
  - type: AntagLoadProfileRule # Fuck non-humans
    speciesOverride: Human
    alwaysUseSpeciesOverride: true
