# TODO: actually have them migrating.
# 1. spawn them far away in space
# 2. pick a random area to set as the target
# 3. custom htn to go to that target unless theres something to bite
# after that add it as a regular random event
- type: entity
  parent: BaseGameRule
  id: CarpMigrationRule
  components:
  - type: StationEvent
    duration: 1
    weight: 1
  - type: CarpMigrationRule
  - type: SpaceSpawnRule
  - type: AntagSpawner
    prototype: MobCarpDragon
  - type: AntagSelection
    selectionTime: PostPlayerSpawn
    definitions:
    - min: 2
      max: 3
      pickPlayer: false

- type: entity
  parent: BaseGameRule
  id: RadiationStormRule
  components:
  - type: StationEvent
    weight: 0.5
    startAnnouncement: station-event-radiation-storm-announcement
    minimumPlayers: 25
    recorrenceDelay: 20
    maxOccurences: 3
    duration: 1
  - type: MapEffectsRule
    effects:
    - !type:ModifyStatusEffect
      effectProto: WeatherSchedulerRadStorm # removes itself when done

- type: entity
  id: RatmaSpawn
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-vent-creatures-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    minimumPlayers: 30
    weight: 3
    duration: 5
    reoccurrenceDelay: 30
  - type: VentHordeRule
    table:
      id: MobRatma
      amount: 1, 1

- type: entity
  id: WailingHorseSpawn
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-vent-creatures-start-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    minimumPlayers: 30
    weight: 3
    duration: 5
    reoccurrenceDelay: 30
  - type: VentHordeRule
    table:
      id: MobWailingHorse
      amount: 1, 1
