# Basic should be ~30s of doafters
- type: constructionGraph
  id: RevParts
  graph:
  - node: start
    edges:
    - to: unfinished
      steps:
      - material: Steel
        amount: 5
        doAfter: 5
  - node: unfinished
    entity: RevUnfinishedComponent
    edges:
    - to: gear
      steps:
      - tool: Hammering
        doAfter: 1
      - tool: Welding
        doAfter: 1
      - tool: Cutting
        doAfter: 1
      - tool: Hammering
        doAfter: 1
      - tool: Welding
        doAfter: 1
      - tool: Anchoring
        doAfter: 1
    - to: bolt
      steps:
      - tool: Cutting
        doAfter: 1
      - tool: Hammering
        doAfter: 1
      - tool: Cutting
        doAfter: 1
      - tool: Hammering
        doAfter: 1
      - tool: Welding
        doAfter: 1
      - tool: Anchoring
        doAfter: 1
    - to: nut
      steps:
      - tool: Screwing
        doAfter: 1
      - tool: Anchoring
        doAfter: 1
      - tool: Hammering
        doAfter: 1
      - tool: Cutting
        doAfter: 1
      - tool: Hammering
        doAfter: 1
      - tool: Anchoring
        doAfter: 1
  - node: gear
    entity: RevGear5
  - node: bolt
    entity: RevBolt5
  - node: nut
    entity: RevNut5
