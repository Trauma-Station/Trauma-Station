      - tag: HandleSmall
        doAfter: 10
        name: construction-graph-tag-smallhandle
        icon:
          sprite: _Trauma/Objects/Specific/forging.rsi
          state: handlesmall

  - node: handle
    entity: KnifeCraftStart
    edges:


    - to: knifebrass
      steps:
      - tag: KnifeBladeBrass
        doAfter: 3

    - to: knifesteel
      steps:
      - tag: KnifeBladeSteel
        doAfter: 3

    - to: knifeplasteel
      steps:
