        doAfter: 3

    - to: combatknifeplasteel
      steps:
      - tag: CombatKnifeBladePlasteel
        doAfter: 3


    - to: cleaverbrass
      steps:
      - tag: CleaverBladeBrass
        doAfter: 3

    - to: cleaversteel
      steps:
      - tag: CleaverBladeSteel
        doAfter: 3

    - to: cleaverplasteel
      steps:
      - tag: CleaverBladePlasteel
        doAfter: 3


    - to: kukribrass
      steps:
      - tag: KukriBladeBrass
        doAfter: 3

    - to: kukristeel
      steps:
      - tag: KukriBladeSteel
        doAfter: 3

    - to: kukriplasteel
