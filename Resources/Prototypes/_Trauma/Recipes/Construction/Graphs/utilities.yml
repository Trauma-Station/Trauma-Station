- type: constructionGraph
  id: SignalScreen
  graph:
  - node: start
    edges:
    - to: signal screen
      steps:
      - material: Steel
        amount: 2
        doAfter: 2
      - material: Cable
        amount: 3
        doAfter: 1
      - material: Glass
        amount: 4
        doAfter: 1
  - node: signal screen
    entity: SignalScreen
    edges:
    - to: start
      steps:
      - tool: Prying
        doAfter: 1
      - tool: Cutting
        doAfter: 1
      - tool: Screwing
        doAfter: 2
      completed:
      - !type:GivePrototype
        prototype: SheetSteel1
        amount: 2
      - !type:GivePrototype
        prototype: CableApcStack1
        amount: 3
      - !type:GivePrototype
        prototype: SheetGlass1
        amount: 4
      - !type:DeleteEntity
