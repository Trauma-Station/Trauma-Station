# Science

- type: randomLoadout
  id: RandomLoadoutScience
  weights:
    Geneticist: 1
    ResearchAssistantCasual: 1
    ResearchAssistantSack: 1
    ResearchAssistantNetwork: 1
    Scientist: 1
    ScientistAnomaly: 0.7
    ScientistBeret: 1
    ScientistCoffee: 1
    Roboticist: 1

- type: loadoutArchetype
  id: Geneticist
  slots:
    head: { chance: 0.25, items: { ClothingHeadBandGrey: 1 } }
    eyes: { chance: 0.5, items: { ClothingEyesGlasses: 1 } }
    jumpsuit: { items: { ClothingUniformJumpsuitGenetics: 1 } }
    outerClothing: { items: { ClothingOuterCoatLabGene: 1 } }
    back: { chance: 0.5, items: { ClothingBackpackGenetics: 1, ClothingBackpackScience: 1, ClothingBackpackSatchelScience: 1 } }
    shoes: { items: { ClothingShoesColorBlue: 2, ClothingShoesColorWhite: 1 } }
    pocket1: { items: { HandheldGeneticsScanner: 1 } }
    pocket2: { chance: 0.3, items: { Ointment: 1, Gauze: 1 } }
    gloves: { chance: 0.7, items: { ClothingHandsGlovesNitrile: 1, ClothingHandsGlovesLatex: 1 } }
    ears: &scienceHeadset { chance: 0.6, items: { ClothingHeadsetScience: 1 } }

- type: loadoutArchetype
  id: ResearchAssistantCasual
  slots:
    head: { chance: 0.15, items: { ClothingHeadHatPurplesoft: 1, ClothingHeadBandGrey: 1 } }
    eyes: { chance: 0.9, items: { ClothingEyesGlasses: 1 } }
    neck: { items: { ClothingNeckTieSci: 1 } }
    jumpsuit: { items: { ClothingUniformJumpsuitCasualPurple: 1 } }
    back: { chance: 0.3, items: { ClothingBackpackScience: 1 } }
    shoes: { items: { ClothingShoesColorBlack: 2, ClothingShoesColorPurple: 1, ClothingShoesColorWhite: 1 } }
    pocket1: { chance: 0.4, items: { LuxuryPen: 1, BookRandomStory: 1, FoodSnackChips: 1 } }
    gloves: { chance: 0.15, items: { ClothingHandsGlovesNitrile: 1 } }
    ears: *scienceHeadset

