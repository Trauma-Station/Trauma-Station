- type: randomLoadout
  id: RandomLoadoutCargo
  weights:
    CargoTech: 1.5
    CargoDrunk: 1
    CargoInsurgent: 0.6
    CargoPizza: 1
    CargoBoritos: 0.8
    CargoWinter: 0.7
    CargoMinimal: 1
    SalvageSpecialist: 1
    SalvageShovel: 0.8
    SalvagePKA: 0.3
    SalvageFlatcap: 0.8
    SalvageSnack: 0.6

- type: loadoutArchetype
  id: CargoTech
  slots:
    head: { chance: 0.8, items: { ClothingHeadHatCargosoft: 1 } }
    eyes: { chance: 0.15, items: { ClothingEyesGlasses: 1, ClothingEyesGlassesCheapSunglasses: 1 } }
    jumpsuit: { items: { ClothingUniformJumpsuitCargo: 1 } }
    outerClothing: { chance: 0.7, items: { ClothingOuterWinterCargo: 1 } }
    back: { chance: 0.7, items: { ClothingBackpackSatchelCargo: 2, ClothingBackpackDuffelCargo: 1 } }
    shoes: { items: { ClothingShoesBootsWinterCargo: 1, ClothingShoesColorBlack: 1, ClothingShoesColorBrown: 1 } }
    belt: { chance: 0.25, items: { ClothingBeltUtility: 1 } }
    pocket1: { chance: 0.5, items: { AppraisalTool: 1, FoodSnackChips: 1, DrinkColaCan: 1 } }
    pocket2: { chance: 0.2, items: { SurvivalKnife: 1, FlashlightLantern: 1 } }
    gloves: { chance: 0.3, items: { ClothingHandsGlovesColorBlack: 1, ClothingHandsGlovesLeather: 1 } }
    ears: &cargoHeadset { chance: 0.6, items: { ClothingHeadsetCargo: 1 } }

