- type: antag
  id: Demonologist
  name: roles-antag-demonologist-name
  antagonist: true
  setPreference: true
  objective: roles-antag-demonologist-description
  guides: [ Demonologist ]
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 5h
  - !type:SpeciesRequirement
    inverted: true
    species:
    - Plasmaman
    - Decapoid

- type: antagSpecifier
  parent: RestrictedAntag
  id: Demonologist
  prefRoles: [ Demonologist ]
  blacklist:
    components:
    - AntagImmune
    - BibleUser
  mindRoles: [ DemonologistMindRole ]
  briefing:
    text: demonologist-role-greeting
    color: "#990000"
    sound: /Audio/_Trauma/Demonologist/demonologist.ogg
  startingGear: DemonologistStartingGear
  components:
  - type: CollectiveMind
    defaultChannel: Demonmind
    channels:
    - Demonmind
  - type: LanguageSpeaker
    speaks:
    - TauCetiBasic
    - Eldritch
    understands:
    - TauCetiBasic
    - Eldritch

- type: startingGear
  id: DemonologistStartingGear
  equipment: # Placeholder # TODO
    jumpsuit: ClothingUniformJumpsuitColorBlack
    back: ClothingBackpack
    head: ClothingHeadHelmetCult
    neck: BedsheetCult
    outerClothing: ClothingOuterRobesDemonologist
    shoes: ClothingShoesCult
    id: PassengerPDA
    ears: ClothingHeadsetService
  storage:
    back:
    - BloodVialFull # 1
    - BloodVialFull # 2
    - BloodVialFull # 3
    - BloodEnchanter
    - RitualDagger
    - MagicInkIndothine
    - MagicInkAsimel
    - MagicInkHithine
    - EnchantingScrollEmpty # 1
    - EnchantingScrollEmpty # 2
    - EnchantingScrollEmpty # 3

- type: antagSmite
  id: Demonologist
  antag: Demonologist
  rule: Demonologist
  ruleComp: DemonologistRule # TODO
  icon:
    sprite: _Trauma/Objects/Enchanting/book.rsi
    state: icon
