# Greytide Time
- type: loadoutEffectGroup
  id: GreyTider
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: job-name-dclass
      time: 10h # silly reward for people who play passenger a lot

# Head of Greytide (for grey mantle)
- type: loadoutEffectGroup
  id: MasterGrey
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: job-name-dclass
      time: 20h # fun mantle for the most experienced greytiders

# Face
- type: loadout
  id: PassengerFace
  effects:
  - !type:GroupLoadoutEffect
    proto: GreyTider
  equipment:
    mask: ClothingMaskGas

# Neck
- type: loadout
  id: Mantle
  equipment:
    neck: ClothingNeckMantle
  effects:
  - !type:GroupLoadoutEffect
    proto: MasterGrey

- type: startingGear
  id: Mantle
  equipment:
    neck: ClothingNeckMantle

# Back
- type: loadout
  id: CommonBackpack
  equipment:
    back: ClothingBackpack

- type: loadout
  id: CommonSatchel
  equipment:
    back: ClothingBackpackSatchel

- type: loadout
  id: CommonDuffel
  equipment:
    back: ClothingBackpackDuffel

# Gloves
- type: loadout
  id: PassengerGloves
  effects:
  - !type:GroupLoadoutEffect
    proto: GreyTider
  equipment:
    gloves: ClothingHandsGlovesFingerlessInsulated

# Outerclothing
- type: loadout
  id: PassengerWintercoat
  equipment:
    outerClothing: ClothingOuterWinterCoat

# Shoes
