- type: loadout
  id: PrisonerJumpsuit
  equipment:
    jumpsuit: ClothingUniformJumpsuitPrisoner

- type: loadout
  id: PrisonerJumpskirt
  equipment:
    jumpsuit: ClothingUniformJumpskirtPrisoner

- type: loadout
  id: OrangeShoes
  equipment:
    shoes: ClothingShoesColorOrange

- type: loadout
  id: OrangeWintercoat
  equipment:
    outerClothing: ClothingOuterWinterColorOrange

- type: loadout
  id: ExPopElectropack
  equipment:
    back: ClothingBackpackElectropack

- type: loadout
  id: ExPopBackpack

- type: loadout
  id: ExPopSatchel

- type: loadout
  id: ExPopDuffel

- type: loadout
  id: ExPopMessenger

# Greytide Time
- type: loadoutEffectGroup
  id: ExPopGreyTider
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobExPop
      time: 20h

# Face
- type: loadout
  id: ExPopMask
  effects:
  - !type:GroupLoadoutEffect
    proto: ExPopGreyTider
  equipment:
    mask: ClothingMaskGas

#Gloves
- type: loadout
  id: ExPopGloves
  effects:
  - !type:GroupLoadoutEffect
    proto: ExPopGreyTider
  equipment:
    gloves: ClothingHandsGlovesColorGray

# Head of Greytide (for grey mantle)
- type: loadoutEffectGroup
  id: ExPopMasterGrey
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobExPop
      time: 40h

# Neck
- type: loadout
  id: ExPopMantle
  effects:
  - !type:GroupLoadoutEffect
    proto: ExPopMasterGrey
  equipment:
    neck: ClothingNeckMantle

# Plasmaman
- type: loadout
  id: ExPopEnvirosuit
  equipment:
    jumpsuit: ClothingUniformEnvirosuitPrisoner
  effects:
  - &SLE_Plasmaman !type:SpeciesLoadoutEffect
    species:
    - Plasmaman

- type: loadout
  id: ExPopEnvirohelm
  equipment:
    head: ClothingHeadEnvirohelmPrisoner
  effects:
  - *SLE_Plasmaman
