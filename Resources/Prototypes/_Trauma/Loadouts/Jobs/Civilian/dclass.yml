- type: loadout
  id: PrisonerJumpsuit
  equipment:
    jumpsuit: ClothingUniformJumpsuitPrisoner

- type: loadout
  id: PrisonerJumpskirt
  equipment:
    jumpsuit: ClothingUniformJumpskirtPrisoner

- type: loadout
  id: OrangeShoes
  equipment:
    shoes: ClothingShoesColorOrange

- type: loadout
  id: OrangeWintercoat
  equipment:
    outerClothing: ClothingOuterWinterColorOrange

- type: loadout
  id: ExpopElectropack
  equipment:
    back: ClothingBackpackElectropack

- type: loadout
  id: ExpopBackpack

- type: loadout
  id: ExpopSatchel

- type: loadout
  id: ExpopDuffel

- type: loadout
  id: ExpopMessenger

# Greytide Time
- type: loadoutEffectGroup
  id: ExpopGreyTider
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobExpop
      time: 20h

# Face
- type: loadout
  id: ExpopMask
  effects:
  - !type:GroupLoadoutEffect
    proto: ExpopGreyTider
  equipment:
    mask: ClothingMaskGas

#Gloves
- type: loadout
  id: ExpopGloves
  effects:
  - !type:GroupLoadoutEffect
    proto: ExpopGreyTider
  equipment:
    gloves: ClothingHandsGlovesColorGray

# Head of Greytide (for grey mantle)
- type: loadoutEffectGroup
  id: ExpopMasterGrey
  effects:
  - !type:JobRequirementLoadoutEffect
    requirement:
      !type:RoleTimeRequirement
      role: JobExpop
      time: 40h

# Neck
- type: loadout
  id: ExpopMantle
  effects:
  - !type:GroupLoadoutEffect
    proto: ExpopMasterGrey
  equipment:
    neck: ClothingNeckMantle

# Plasmaman
- type: loadout
  id: ExpopEnvirosuit
  equipment:
    jumpsuit: ClothingUniformEnvirosuitPrisoner
  effects:
  - &SLE_Plasmaman !type:SpeciesLoadoutEffect
    species:
    - Plasmaman

- type: loadout
  id: ExpopEnvirohelm
  equipment:
    head: ClothingHeadEnvirohelmPrisoner
  effects:
  - *SLE_Plasmaman
