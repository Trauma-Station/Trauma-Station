- type: entity
  abstract: true
  parent: BaseAction
  id: BaseXenomorphAction
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: Sprite
    sprite: _White/Interface/Actions/xenomorph.rsi

# Combat action
- type: entity
  parent: [ BaseXenomorphAction, ActionCombatModeToggle ]
  id: ActionCombatModeToggleXenomorph
  components:
  - type: Sprite
    layers:
    - state: help
      map: [ "enum.ActionVisuals.Icon" ]
    - state: harm
      visible: false
      map: [ "enum.ActionVisuals.IconToggled" ]

# Thermal action
- type: entity
  parent: [ BaseXenomorphAction, ToggleThermalVision ]
  id: ToggleThermalVisionXenomorph
  components:
  - type: Sprite
    layers:
    - state: vision_off
      map: [ "enum.ActionVisuals.Icon" ]
    - state: vision_on
      visible: false
      map: [ "enum.ActionVisuals.IconToggled" ]

# Evolution actions
- type: entity
  parent: BaseXenomorphAction
  id: ActionEvolution
  name: Evolve
  description: Evolve into a higher xenomorph caste.
  components:
  - type: Action
    checkCanInteract: false
    useDelay: 0
  - type: Sprite
    layers:
    - state: evolve
  - type: InstantAction
    event: !type:EvolutionsActionEvent

- type: entity
  parent: ActionEvolution
  id: ActionEvolutionPraetorian
  name: Evolve to praetorian (500)
  description: Evolve into the main defender of the hive.
  components:
  - type: Sprite
    layers:
    - state: evolve_praetorian
  - type: PlasmaCostAction
    plasmaCost: 500 # TODO: make this automatically suffix the actions

- type: entity
  parent: ActionEvolutionPraetorian
  id: ActionEvolutionQueen
  name: Evolve to queen (500)
  description: Produce an internal egg sac capable of spawning children. Only one queen can exist at a time.
  components:
  - type: Sprite
    layers:
    - state: evolve_queen

# Structures actions
- type: entity
  parent: BaseXenomorphAction
  id: ActionSpawnResinWeedNode
  name: Plant weeds (50)
  description: Plants some xenomorph weeds.
  components:
  - type: Action
    useDelay: 2
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_weeds.rsi
    layers:
    - state: constructionnode
  - type: InstantAction
    event: !type:SpawnTileEntityActionEvent
      entity: ResinWeedNode
      blockedCollisionMask:
      - SlipLayer
      blockedCollisionLayer:
      - Impassable
      - MidImpassable
      - LowImpassable
  - type: PlasmaCostAction
    plasmaCost: 50

- type: entity
  parent: BaseXenomorphAction
  id: ActionSpawnXenomorphEgg
  name: Lay egg (75)
  description: Lay an egg to produce facehuggers to impregnate prey with.
  components:
  - type: Action
    checkCanInteract: false
    useDelay: 2
  - type: Sprite
    layers:
    - state: egg
  - type: InstantAction
    event: !type:SpawnTileEntityActionEvent
      entity: XenomorphEgg
      blockedCollisionMask:
      - TableMask
      blockedCollisionLayer:
      - TableLayer
      - BulletImpassable
  - type: PlasmaCostAction
    plasmaCost: 75

# TODO: delete it
- type: entity
  parent: BaseXenomorphAction
  id: ActionSpawnWallResin
  name: Build a resin wall (50)
  description: Secrete tough malleable resin.
  components:
  - type: Action
    useDelay: 2
  - type: Sprite
    sprite: _RMC14/Structures/Xenos/xeno_resin_wall.rsi
    layers:
    - state: resin
  - type: TargetAction
    range: 2
  - type: WorldTargetAction
    event: !type:PlaceTileEntityEvent
      entity: WallResin
      length: 2 # Goobstation
      blockedCollisionMask:
      - FullTileMask
      blockedCollisionLayer:
      - WallLayer
  - type: PlasmaCostAction
    immediate: false
    plasmaCost: 50

- type: entity
  parent: ActionSpawnWallResin
  id: ActionSpawnResinDoor
  name: Build a resin door (75)
  components:
  - type: Sprite
    layers:
    - state: resin
  - type: WorldTargetAction
    event: !type:PlaceTileEntityEvent
      entity: ResinDoor
      length: 2
      blockedCollisionMask:
      - TableMask
      blockedCollisionLayer:
      - TableLayer
      - BulletImpassable
  - type: PlasmaCostAction
    plasmaCost: 75

# TODO: delete it
- type: entity
  parent: ActionSpawnWallResin
  id: ActionSpawnResinNest
  name: Build a resin nest (50)
  components:
  - type: Sprite
    sprite: _White/Structures/Windows/resin_membrane.rsi
    layers:
    - state: full
  - type: Action
    useDelay: 1
  - type: WorldTargetAction
    event: !type:PlaceTileEntityEvent
      entity: ResinNest
      length: 2
      blockedCollisionMask:
      - TableMask
      blockedCollisionLayer:
      - TableLayer
      - BulletImpassable
  - type: PlasmaCostAction
    plasmaCost: 50

# Tail lash action
- type: entity
  parent: BaseXenomorphAction
  id: ActionTailLash
  name: Tail lash
  description: Hit your opponent with your tail.
  components:
  - type: Action
    useDelay: 11
  - type: Sprite
    layers:
    - state: tail_attack
  - type: TargetAction
    range: 10
  - type: WorldTargetAction
    event: !type:TailLashActionEvent

- type: entity
  parent: BaseXenomorphAction
  id: ActionAcid
  name: Corrosive acid (100)
  description: Drench an object in acid, destroying it over time.
  components:
  - type: Action
    useDelay: 11
  - type: Sprite
    layers:
    - state: acid
  - type: TargetAction
    interactOnMiss: false
    range: 2
    targetingIndicator: true
    checkCanAccess: true
  - type: EntityTargetAction
    event: !type:AcidActionEvent
  - type: PlasmaCostAction
    plasmaCost: 100

# Jump action
- type: entity
  parent: BaseXenomorphAction
  id: ActionJumpXenomorph
  name: Jump
  description: Stun your enemies with a quick jump.
  components:
  - type: Action
    priority: 0
    useDelay: 3
  - type: Sprite
    layers:
    - state: leap_off
      map: [ "enum.ActionVisuals.Icon" ]
    - state: leap_on
      visible: false
      map: [ "enum.ActionVisuals.IconToggled" ]
  - type: TargetAction
    range: 15
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:JumpActionEvent

# Transfer plasma action
- type: entity
  parent: BaseXenomorphAction
  id: ActionTransferPlasma
  name: Transfer plasma (50)
  description: Passes plasma to your friend.
  components:
  - type: Action
    priority: 0
    raiseOnUser: true # TODO: make plasma vessel use body properly
  - type: Sprite
    layers:
    - state: plasma_transfer_off
      map: [ "enum.ActionVisuals.Icon" ]
    - state: plasma_transfer_on
      visible: false
      map: [ "enum.ActionVisuals.IconToggled" ]
  - type: TargetAction
    interactOnMiss: false
    range: 2
  - type: EntityTargetAction
    event: !type:TransferPlasmaActionEvent

# Promotion action
- type: entity
  parent: BaseXenomorphAction
  id: ActionXenomorphPromotion
  name: Promote to Praetorian (500)
  description: Directly promote a xenomorph to Praetorian status.
  components:
  - type: Action
    itemIconStyle: BigAction
    useDelay: 5
  - type: Sprite
    layers:
    - state: promote
  - type: TargetAction
    checkCanAccess: true
    range: 2
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      requireAll: true
      components:
      - Xenomorph
    event: !type:PromotionActionEvent
  - type: PlasmaCostAction
    plasmaCost: 500

# Toggleable acid spit action
- type: entity
  parent: BaseXenomorphAction
  id: ActionAcidSpit
  name: Acid spit (20)
  description: Toggle the ability to spit neurotoxin. When enabled, use (M2) to shoot.
  components:
  - type: Action
    useDelay: 1
  - type: Sprite
    layers:
    - state: acid # TODO: custom sprite...
  - type: InstantAction
    event: !type:ToggleAcidSpitEvent

# Facehugger leap action
- type: entity
  parent: BaseXenomorphAction
  id: ActionFaceHuggerLeap
  name: Leap
  description: Leap onto a target's face to attach yourself.
  components:
  - type: Action
    priority: 0
    useDelay: 5
  - type: Sprite
    layers:
    - state: leap_off
      map: [ "enum.ActionVisuals.Icon" ]
    - state: leap_on
      visible: false
      map: [ "enum.ActionVisuals.IconToggled" ]
  - type: TargetAction
    range: 15
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:FaceHuggerLeapActionEvent

# Queen roar action
- type: entity
  parent: BaseXenomorphAction
  id: ActionQueenroar
  name: Roar
  description: Roar loudly to stun all enemies around you.
  components:
  - type: Sprite
    layers:
    - state: screech
  - type: Action
    useDelay: 60
    priority: 5
  - type: InstantAction
    event: !type:QueenRoarActionEvent
