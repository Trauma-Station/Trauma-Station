# This was written by Atakku over the span of three commits; latest version was Ronstation Commit 3e48a3f.
# I replaced the survival box with the engineering equivalent and added an engineering extended nitrogen tank for species inclusiveness.
# Adds a couple speed loaders as well for the weapon of the loadout utilizing this.
- type: entity
  id: ClothingBackpackSatchelHoldingCentcomFormalFilled
  parent: ClothingBackpackSatchelHolding
  suffix: Filled, Centcom Formal, Admeme
  components:
  - type: StorageFill
    contents:
      - id: ToolDebug
      - id: WelderExperimental
      - id: RCDExperimental
      - id: Multitool
      - id: BoxSurvivalSlotsEngineering # Slot based box used by actual roles.
      - id: ExtendedEmergencyNitrogenTankFilled
      - id: ExtendedEmergencyPlasmaTankFilled
      - id: TelescopicBaton
      - id: SpeedLoaderMagnum
      - id: SpeedLoaderMagnum
      - id: SkillChipNukie # Ironically the most down-to-earth in terms of value, for an all-rounder character that could assist any department.
      - id: MedkitCombatFilled
      - id: MedkitCombatPurpleFilled

