# A ready-to-go loadout for an ERT engineer to be used with an existing character. More roles can be added as well.
- type: startingGear
  id: ERTEngineerAdmemeGearEVA
  equipment:
    jumpsuit: ClothingUniformJumpsuitERTEngineer
    back: ClothingModsuitERTEngineerFilled
    shoes: ClothingShoesBootsMagAdv
    mask: ClothingMaskGasERT
    eyes: ClothingEyesGlassesMedDiag
    gloves: ClothingHandsGlovesCombat
    outerClothing: ClothingOuterHardsuitERTEngineer
    id: ERTEngineerPDA
    ears: ClothingHeadsetAltCentCom
    belt: ClothingBeltChiefEngineerFilled
    pocket1: WeaponPlasmaCutter # Style points.
    pocket2: FlashlightSeclite
  inhand:
    - MindShieldImplanter
    - DeathRattleImplanterCentcomm
# Ready-to-go loadout for an ERT leader. Inspired by the Chester lever action shotgun we found
- type: startingGear
  id: ERTLeaderAdmemeChesterEVA
  equipment:
    jumpsuit: ClothingUniformJumpsuitERTLeader
    back: ClothingModsuitERTLeaderChesterFilled
    shoes: ClothingShoesBootsMagAdv
    mask: ClothingMaskGasERT
    eyes: ClothingEyesGlassesCentCommNoThermal
    gloves: ClothingHandsGlovesCombat
    outerClothing: ClothingOuterHardsuitERTLeader
    neck: ExecutiveIDCard # This is effectively an access breaker. Keep that in mind when making custom loadouts with it.
    id: ERTLeaderPDA
    ears: ClothingHeadsetAltCentCom
    belt: ClothingBeltAssaultFilled
    pocket1: Flare
    pocket2: FlashlightSeclite
    suitstorage: WeaponLeverChester # This gun is interesting and feels fitting for the leader.
  inhand:
    - MindShieldImplanter
    - DeathRattleImplanterCentcomm
