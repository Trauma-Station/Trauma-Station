- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceDecapoid
  name: Decapoid appearance
  components:
  - type: Inventory
    templateId: decapoid
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Decapoid/displacement.rsi
            state: jumpsuit
      outerClothing:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Decapoid/displacement.rsi
            state: jumpsuit
      head: # don't need mask, those are fine
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Decapoid/displacement.rsi
            state: jumpsuit # todo: custom? (accomodate gills?) - edit: no
      gloves:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Decapoid/displacement.rsi
            state: gloves
      neck:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Decapoid/displacement.rsi
            state: neck
  - type: InitialBody
    organs:
      Torso: TorsoDecapoid
      Head: HeadDecapoid
      ArmRight: RightArmDecapoid
      ArmLeft: LeftArmDecapoid
      HandRight: RightHandDecapoid
      HandLeft: LeftHandDecapoid
      LegRight: RightLegDecapoid
      LegLeft: LeftLegDecapoid
      FootRight: RightFootDecapoid
      FootLeft: LeftFootDecapoid
      Lungs: OrganDecapoidLungs
      Brain: OrganHumanBrain # Rest are human parts. Because.
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Decapoid

- type: entity
  parent: 
  - AppearanceDecapoid
  - BaseSpeciesMobOrganic
  id: BaseMobDecapoid
  abstract: true
  name: Urist McCrab
  components:
  - type: Barotrauma
    damage:
      types:
        blunt: 0 # immune to space
  - type: Absorbable
  - type: Hunger # removed thirst
  - type: Icon
    sprite: _Impstation/Mobs/Species/Decapoid/parts.rsi
    state: full
  - type: Loadout
    prototypes:
      - StartingGearDecapoidClaw
  - type: SpeechRequiresEquipment
    equipment:
      mask:
        tags:
          - Vaporizer
          - SGD
    failMessage: decapoid-cant-speak
  - type: Respirator
    damage:
      types:
        Asphyxiation: 2
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: Body
    prototype: Decapoid
    requiredLegs: 2
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepDecapoid
  - type: Butcherable # No bones. No I didn't forget go fuck yourself.
    butcheringType: Spike
    spawned:
    - id: FoodMeatCrab # maybe custom someday. as-is, it's fine
      amount: 3
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 210 # they're a little heavier than everyone else.
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Decapoid
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Impstation/Mobs/Effects/decapoid_brute_damage.rsi # todo: make this cover the legs.
        color: "#162581"
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
      Acidic:  [ Touch ]
  - type: Vocal
    sounds:
      Male: UnisexDecapoid
      Female: UnisexDecapoid
      Unsexed: UnisexDecapoid # male and female sounds have to 1) exist and 2) come first, otherwise urists will spawn without emote sounds 66% of the time, because this game is poorly programmed
  - type: MovementSpeedModifier
    baseSprintSpeed: 3.5
    baseWalkSpeed: 1.5
    weightlessAcceleration: 1.5 # move more easily in space
    weightlessFrictionNoInput: 2 # more control over movement in space
    weightlessModifier: 1
  - type: Temperature
    heatDamageThreshold: 380 # slightly more vulnerable to heat
    coldDamageThreshold: 0 # immune to space
    currentTemperature: 310
    specificHeat: 42
    coldDamage:
      types:
        Cold : 0 # immune to space
    heatDamage:
      types:
        Heat : 1
  - type: TemperatureSpeed
    thresholds:
      293: 1.0
      280: 1.0
      260: 1.0
  - type: Clumsy
    clumsyDamage:
      types:
        Blunt: 5
    clumsySound:
      path: /Audio/_Impstation/Effects/Clumsy/crab_snap.ogg # the game gets really touchy about having that initial forward slash.
    clumsyHypo: false # these variables were created for this purpose and have been upstreamed
    clumsyVaulting: false
    clumsyDefib: false
    gunFailedMessage: gun-clumsy-decapoid # The gun slips out of your claws!
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: CopperBlood # real life crustaceans are in the same clade as spiders and share a blood type
        Quantity: 300
  - type: Puller
    needsHands: false # they drag with the claw, or their back legs
    applySpeedModifier: false # they're strong as fuck. also i made this variable just for them.
  - type: Inventory
    templateId: decapoid
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Decapoid/displacement.rsi
            state: jumpsuit
      outerClothing:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Decapoid/displacement.rsi
            state: jumpsuit
      head: # don't need mask, those are fine
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Decapoid/displacement.rsi
            state: jumpsuit # todo: custom? (accomodate gills?) - edit: no
      gloves:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Decapoid/displacement.rsi
            state: gloves
      neck:
        sizeMaps:
          32:
            sprite: _Impstation/Mobs/Species/Decapoid/displacement.rsi
            state: neck
  - type: Speech
    speechSounds: Decapoid
  - type: TypingIndicator
    proto: robot # todo: custom
  - type: HumanoidProfile
    species: Decapoid
    hideLayersOnEquip:
    - Hair
    - Snout

- type: entity # have to do this because otherwise decapoids would not display as having their vaporizer in the customization menu.
  save: false
  id: BaseMobDecapoidInternals
  parent: BaseMobDecapoid
  suffix: SpawnsWithInternals
  components:
  - type: Loadout
    prototypes:
      - StartingGearDecapoidVaporizer


