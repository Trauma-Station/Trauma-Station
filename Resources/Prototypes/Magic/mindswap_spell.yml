- type: entity
  parent: BaseEntitySpellAction
  id: ActionMindSwap
  name: Mind Swap
  description: Exchange bodies with another person!
  components:
  # <Trauma>
  - type: Magic
    requiresSpeech: true
    school: Transmutation
  - type: ActionUpgrade
    effectedLevels:
      2: ActionMindSwapII
      3: ActionMindSwapIII
  # </Trauma>
  - type: Action
    raiseOnUser: true # Goobstation
    useDelay: 180
    #sound: !type:SoundPathSpecifier # Goob - event plays the sound
    #  path: /Audio/Magic/staff_animation.ogg
  - type: Sprite
    # <Trauma> - replaced icon
    sprite: _Goobstation/Wizard/actions.rsi
    layers:
    - state: mindswap
    # </Trauma>
  - type: EntityTargetAction
    whitelist:
      components:
      # <Trauma>
      - Body
      - MindContainer
      # </Trauma>
      - MobState
      - PAI # intended to mindswap pAIs and AIs
      - StationAiCore
    event: !type:MindSwapSpellEvent
      # <Trauma>
      sound:
        path: /Audio/_Goobstation/Wizard/mandswap.ogg # ESL lmao
      performerStunDuration: 5
      targetStunDuration: 5
      # </Trauma>
  - type: SpeakOnAction
    sentence: action-speech-spell-mind-swap
