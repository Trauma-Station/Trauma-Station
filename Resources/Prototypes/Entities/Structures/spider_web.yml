- type: entity
  abstract: true
  id: SpiderWebBase
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  # <Trauma>
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: 1
  - type: HideableFoliage
  # </Trauma>
  - type: PlacementReplacement
    key: web
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Weapons/slash.ogg"
  - type: Sprite
    sprite: Structures/floor_web.rsi
    drawdepth: Overdoors # Trauma
  - type: Appearance
  - type: Clickable
  - type: Transform
    anchored: true
  - type: Physics
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
  - type: Flammable
    fireSpread: true
    damage:
      types:
        Heat: 5
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
  - type: SpiderWebObject
  - type: IconSmooth
    key: web
    additionalKeys:
    - walls
    base: web_
  - type: Construction
    graph: CobwebsGraph
    node: start

- type: entity
  id: SpiderWeb
  parent: SpiderWebBase
  name: spider web
  description: It's stringy and sticky.
  components:
  - type: Sprite
    color: "#ffffffdd"
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        density: 7
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - MidImpassable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      # - !type:SpawnEntitiesBehavior # Trauma, Lag prevention, todo, add way to get silk without webs
      #   spawn:
      #     MaterialWebSilk:
      #       min: 0
      #       max: 1
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.35 # Trauma, was 5
    sprintSpeedModifier: 0.35 # Trauma, was 5
    ignoreWhitelist:
      components:
      - IgnoreSpiderWeb

- type: entity
  id: SpiderWebClown
  parent: [SolutionFood, SolutionVeryTiny, SpiderWebBase]
  name: clown spider web
  description: It's stringy and slippy.
  components:
  - type: Sprite
    color: "#ffa3fc"
  - type: Slippery
  - type: StepTrigger
    intersectRatio: 0.2
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        density: 7
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        layer:
        - MidImpassable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Edible
    delay: 2
  - type: Solution
    solution:
      reagents:
      - ReagentId: Sugar
        Quantity: 2.5
      - ReagentId: Honk
        Quantity: 2.5
      - ReagentId: SpaceLube
        Quantity: 2.5
