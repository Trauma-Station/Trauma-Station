- type: entity
  parent: [SolutionTank, SolutionHuge]
  id: SinkEmpty
  name: sink
  description: The faucets have been tightened to the maximum possible torque but are still known to drip.
  suffix: Empty
  placement:
    mode: SnapgridCenter
  components:
  # <Trauma>
  - type: PlumbingDevice
  - type: PipeColorVisuals
  - type: FluidSink
  - type: NodeContainer
    nodes:
      faucet:
        !type:PlumbingNode
        nodeGroupID: Fluid
        pipeDirection: North
      drain:
        !type:PlumbingNode
        nodeGroupID: Fluid
        maxVolume: 100
        pipeDirection: South
  - type: Transform
    anchored: true
  - type: Anchorable
  # </Trauma>
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Structures/Furniture/sink.rsi
    layers:
      - state: sink_stem
      - map: [ "enum.SolutionContainerLayers.Fill" ]
        state: sink-fill-1
        visible: false
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: sink-fill-
    solutionName: drain # Trauma - Plumbing
  - type: SolutionManager
    solutions:
  # <Trauma>
    - SolutionSinkInlet 
    - SolutionSinkOutlet
  # </Trauma>
  - type: DrainableSolution
    solution: faucet # Trauma - Plumbing
  - type: RefillableSolution
    solution: drain # Trauma - Plumbing
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 80
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 40
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
  - type: AmbientSound
    enabled: false
    volume: -8
    range: 8
    sound:
      path: /Audio/Ambience/Objects/drain.ogg


- type: entity
  parent: SinkEmpty
  id: Sink
  suffix: Water

- type: entity
  parent: Sink
  id: SinkWide
  name: wide sink
  components:
    - type: Sprite
      sprite: Structures/Furniture/sink.rsi
      layers:
        - state: sink_wide
        - map: [ "enum.SolutionContainerLayers.Fill" ]
          state: sink_wide-fill-1
          visible: false
    - type: SolutionContainerVisuals
      maxFillLevels: 1
      fillBaseName: sink_wide-fill-
      solutionName: drainBuffer

#Stemless Sink

- type: entity
  name: sink
  id: SinkStemless
  parent: SinkEmpty
  components:
  - type: Sprite
    sprite: Structures/Furniture/sink.rsi
    layers:
      - state: sink
      - map: [ "enum.SolutionContainerLayers.Fill" ]
        state: sink-fill-1
        visible: false

- type: entity
  name: sink
  id: SinkStemlessWater
  parent: SinkStemless
  suffix: Water
