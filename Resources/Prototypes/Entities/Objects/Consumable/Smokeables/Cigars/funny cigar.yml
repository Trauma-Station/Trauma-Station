- type: entity
  id: CigarFunny
  parent: BaseCigar
  name: funny cigar
  description: "custom made cigar for fashionable clowns"
  components:
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigars/Cigar-funny.rsi
    state: unlit-icon
  - type: Tag
    tags:
      - Cigar
      - Trash
  - type: Clothing
    sprite: Objects/Consumable/Smokeables/Cigars/Cigar-funny.rsi
    slots: [ mask ]
    equippedPrefix: unlit
  - type: Item
    size: Tiny
    sprite: Objects/Consumable/Smokeables/Cigars/Cigar-funny.rsi
    heldPrefix: unlit

- type: entity
  id: CigarSpent
  parent: Cigar
  suffix: spent
  components:
  - type: Sprite
    state: burnt-icon
  - type: Smokable
    state: Burnt
  - type: Tag
    tags:
      - Cigar
      - Trash
      - Burnt
