- type: entity
  parent: [ ClothingOuterBaseLargeFireproof, AllowSuitStorageClothing ]
  id: ClothingOuterSuitFire
  name: fire suit
  description: A suit that helps protect against hazardous temperatures.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/fire.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/fire.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.04
  - type: Armor
    coverage:
    - Torso
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    - Wings
    traumaDeductions: # having a suit on saves your limbs
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
    modifiers:
      coefficients:
        Slash: 0.9
        Heat: 0.5
        Cold: 0.8
  - type: ClothingSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: HeldSpeedModifier
  - type: GroupExamine
  - type: ProtectedFromStepTriggers
    slots: WITHOUT_POCKET

- type: entity
  parent: [ TemperatureProtectionGreat, ClothingOuterEVASuitBase, AllowSuitStorageClothing, BaseEngineeringContraband ] # Trauma - Made it contraband
  id: ClothingOuterSuitAtmosFire
  name: atmos fire suit
  description: An expensive firesuit that protects against even the most deadly of station fires. Designed to protect even if the wearer is set aflame.
  components:
  # <Trauma>
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  # </Trauma>
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/atmos_firesuit.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/atmos_firesuit.rsi
  - type: FireProtection
    reduction: 1 # Trauma - was 0.8, 1.25x for limb coverage
  - type: Armor
    coverage:
    - Torso
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    - Wings
    traumaDeductions: # having a suit on saves your limbs
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
    modifiers:
      coefficients:
        # <Trauma>
        Blunt: 0.85
        Slash: 0.85 # was 0.9
        Heat: 0.6 # was 0.8
        Cold: 0.8
        Piercing: 0.85
        # </Trauma>
  - type: GroupExamine
  - type: Tag
    tags:
    - CorgiWearable
    - WhitelistChameleon

- type: entity
  parent: [ ClothingOuterBaseLarge, GeigerCounterClothing, AllowSuitStorageClothing, ClothingOuterBaseToggleable ]
  id: ClothingOuterSuitRad
  name: radiation suit
  description: "A suit that protects against radiation. The label reads, 'Made with lead. Please do not consume insulation.'"
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/rad.rsi
  - type: Armor
    coverage:
    - Torso
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    - Wings
    modifiers:
      coefficients:
        Heat: 0.85
        Radiation: 0.01
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/rad.rsi
  - type: GroupExamine
  - type: ToggleableClothing
    clothingPrototypes: # Trauma - changed to dictionary for modsuits
      head: ClothingHeadHatHoodRad
    verbText: toggle-clothing-verb-hood
  - type: ProtectedFromStepTriggers
    slots: WITHOUT_POCKET

- type: entity
  parent: [ ClothingOuterBaseLargeInsulated, AllowSuitStorageClothing, BaseToggleClothing, BaseHighlyIllegalContraband ]
  id: ClothingOuterSuitSpaceNinja
  name: space ninja suit
  description: This black technologically advanced, cybernetically-enhanced suit provides many abilities like invisibility or teleportation.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/spaceninja.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/spaceninja.rsi
  # hardsuit stuff
  - type: PressureProtection
    highPressureMultiplier: 0.6
    lowPressureMultiplier: 1000
  - type: Armor
    coverage:
    - Torso
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    - Wings
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.8
        Heat: 0.8
  # phase cloak
  - type: ToggleClothing
    action: ActionTogglePhaseCloak
    disableOnUnequip: true
  - type: ComponentToggler
    parent: true
    components:
    - type: Stealth
      # <Trauma>
      hadOutline: true
      thermalsImmune: true
      # </Trauma>
      minVisibility: 0.1
      lastVisibility: 0.1
      shimmerFrequency: 0.05
  - type: PowerCellDraw
    drawRate: 3.6 # 100 seconds on the default cell # Goob edit
  - type: ToggleCellDraw
  # throwing star ability
  - type: ItemCreator
    action: ActionCreateThrowingStar
    charge: 14.4
    spawnedPrototype: ThrowingStarNinja
    noPowerPopup: ninja-no-power
  # core ninja suit stuff
  - type: NinjaSuit
    empCharge: 300 # Trauma
  - type: EmpResistance
    strengthMultiplier: 0
  - type: UseDelay
    delay: 5 # disable time
  - type: PowerCellSlot
    cellSlotId: cell_slot
    # throwing in a recharger would bypass glove charging mechanic
    fitsInCharger: false
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmall
        disableEject: true
        whitelist:
          tags:
            - PowerCell

