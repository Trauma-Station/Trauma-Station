- type: entity
  id: CosmicStairs
  parent: RMCStairs
  description: Somewhat unnvering, yet stll as great as any other stairs.
  components:
  - type: Sprite
    sprite: _DV/CosmicCult/Tileset/stairs.rsi
    state: stair_full
  - type: CosmicCorruptible
    convertTo: null # prevent repeated corrupting
