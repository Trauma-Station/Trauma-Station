  parent: CosmicStairs
  suffix: Right
  components:
  - type: Sprite
    state: stair_right_cap

- type: entity
  id: CosmicStairsSolo
  parent: CosmicStairs
  suffix: Solo
  components:
  - type: Sprite
    state: stair_solo

- type: entity
  id: CosmicStairsCorner
  parent: CosmicStairs
  suffix: Corner
  components:
  - type: Sprite
    state: stair_corner
