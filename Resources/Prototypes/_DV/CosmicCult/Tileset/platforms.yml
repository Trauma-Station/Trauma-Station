- type: entity
  abstract: true
  id: CosmicPlatformBase
  parent: CMPlatformBase
  description: A raised surface. This one looks even more wrong than others.
  components:
  - type: Sprite
    sprite: _DV/CosmicCult/Tileset/platforms.rsi
    drawdepth: HighFloorObjects
  - type: CosmicCorruptible
    convertTo: null # prevent repeated corrupting
  - type: CosmicCultExamine
    cultistText: cosmic-examine-text-forthecult

- type: entity
  parent: CosmicPlatformBase
  id: CosmicPlatform
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.36"
        density: 1500
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Sprite
    state: platform
  - type: Climbable

- type: entity
  parent: CosmicPlatformBase
  id: CosmicPlatformCorner
  components:
