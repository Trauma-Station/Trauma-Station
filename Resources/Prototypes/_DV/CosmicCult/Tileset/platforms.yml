      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,-0.36"
        density: 1500
        mask:
        - TableMask
        layer:
        - TableLayer
      fix2:
        shape:
          !type:PhysShapeAabb
          bounds: "0.36,-0.36,0.49,0.49"
        density: 1500
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Sprite
