- type: entity
  parent: FloorTileItemBase
  id: FloorTileItemCosmicCorruption
  name: malign tile
  components:
  - type: Sprite
    sprite: _DV/CosmicCult/Objects/tile.rsi
    state: tile
  - type: FloorTile
    outputs:
    - FloorCosmicCorruption
  - type: Stack
    stackType: FloorTileCosmicCorruption

- type: stack
  parent: BaseTileStack
  id: FloorTileCosmicCorruption
  name: stack-malign-tile
  spawn: FloorTileItemCosmicCorruption

- type: tile
  abstract: true
  id: FloorCosmicBase
  name: tiles-cosmiccult-floor-malign
  baseTurf: Plating
  isSubfloor: false
  deconstructTools: [ Prying ]
  footstepSounds:
    collection: FootstepCosmic
  itemDrop: FloorTileItemCosmicCorruption
  heatCapacity: 10000
  edgeSpritePriority: 1
  edgeSprites:
    SouthEast: _DV/CosmicCult/Tileset/cosmicfloor/tile_edge_single.png
    NorthEast: _DV/CosmicCult/Tileset/cosmicfloor/tile_edge_single.png
    NorthWest: _DV/CosmicCult/Tileset/cosmicfloor/tile_edge_single.png
    SouthWest: _DV/CosmicCult/Tileset/cosmicfloor/tile_edge_single.png
    South: _DV/CosmicCult/Tileset/cosmicfloor/tile_edge_double.png
    East: _DV/CosmicCult/Tileset/cosmicfloor/tile_edge_double.png
    North: _DV/CosmicCult/Tileset/cosmicfloor/tile_edge_double.png
    West: _DV/CosmicCult/Tileset/cosmicfloor/tile_edge_double.png

