- type: entity
  id: CosmicVacuousSpire
  parent: [ BaseStructureDynamic, BaseCosmicContraband ]
  name: vacuous spire
  description: Its surface shifts and moves strangely, despite no visible power source...
  components:
  - type: AnchorOnlyOnStation # No more lavaland entropy farm
  - type: AtmosDevice
    joinSystem: true
  - type: CosmicSpire
  - type: CosmicCultExamine
    cultistText: cosmic-examine-text-forthecult
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.375,0.25,0.4"
        density: 200
        mask:
        - LargeMobMask
        layer:
        - WallLayer
  - type: Sprite
    sprite: _DV/CosmicCult/Tileset/cosmicspire.rsi
    offset: 0, 0.5
    layers:
      - state: base-disabled
        map: ["base"]
      - state: overlay
        map: ["vfx"]
        shader: unshaded
        visible: false
    drawdepth: Mobs
    noRot: true
  - type: GenericVisualizer
    visuals:
      enum.SpireVisuals.Status:
        base:
          On: {state: base-enabled}
          Off: {state: base-disabled}
        vfx:
          On: {visible: True}
          Off: {visible: False}
  - type: Appearance
  - type: AmbientSound
    enabled: false
    volume: -5
    range: 12
    sound:
      path: /Audio/_DV/CosmicCult/spire_draining.ogg
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: RCDDeconstructable
    deconstructable: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
  - type: PointLight
    radius: 2
    energy: 1.6
    enabled: false
    castShadows: false
    color: "#42a4ae"
