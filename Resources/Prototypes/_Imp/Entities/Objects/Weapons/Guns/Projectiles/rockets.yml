- type: entity
  parent: BaseBulletTrigger
  id: BulletBazookaExp
  name: rocket
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Projectiles/bazooka.rsi
    layers:
    - state: explosiveproj
  - type: Projectile
    damage:
      types:
        Blunt: 25
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 30
    intensitySlope: 3
    totalIntensity: 300
    maxTileBreak: 1
  - type: PointLight
    radius: 3.5
    color: orange
    energy: 0.5

- type: entity
  parent: BaseBullet
  id: BulletBazookaCon
  name: rocket
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Projectiles/bazooka.rsi
    layers:
    - state: concussionproj
  - type: Projectile
    damage:
      types:
        Piercing: 0
        Blunt: 125
        Structural: 300
    penetrationThreshold: 200
    penetrationDamageTypeRequirement:
    - Structural
    soundHit:
      path: /Audio/Weapons/genhit3.ogg
  - type: StaminaDamageOnCollide
    damage: 300
  - type: PointLight
    radius: 3.5
    color: orange
    energy: 0.5

- type: entity
  parent: BaseBulletTrigger
  id: BulletBazookaIncendiary
  name: rocket
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Projectiles/bazooka.rsi
    layers:
    - state: incendiaryproj
  - type: Projectile
    damage:
      types:
        Blunt: 10
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: FireBomb
    totalIntensity: 400
    intensitySlope: 2.5
    maxIntensity: 200
    canCreateVacuum: false
  - type: PointLight
    radius: 3.5
    color: orange
    energy: 0.5
