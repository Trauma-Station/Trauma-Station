- type: entity
  parent: [ BaseItem, BaseSyndicateContraband, SolutionAmmo ]
  id: EchionCanister
  name: Echion Canister
  description: A special, disposable containment device designed for quickly refueling Echion plasma weapons.
  components:
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Ammunition/Magazine/Special/echioncanister.rsi
    layers:
      - state: canister
        map: ["enum.GunVisualLayers.Base"]
      - state: canister-1
        map: ["enum.SolutionContainerLayers.Fill"]
        shader: unshaded
  - type: Appearance
  - type: Item
    size: Small
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: canister-
  - type: ExaminableSolution
    solution: ammo
  - type: SolutionItemStatus
    solution: ammo
  - type: ReagentTank
    tankType: Fuel
    fuelWhitelist:
      tags:
        - EchionGun
    fuelBlacklist:
      tags:
        - WeldingTool
  - type: Solution
    solution:
      maxVol: 75
      reagents:
      - ReagentId: Echion
        Quantity: 75
  - type: DrainableSolution
    solution: ammo
