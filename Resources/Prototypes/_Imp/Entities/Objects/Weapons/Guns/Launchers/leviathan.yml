- type: entity
  name: Leviathan
  parent: [ BaseWeaponLauncher, BaseGunWieldable, BaseSyndicateContraband ]
  id: WeaponLauncherBazooka
  description: A symbol of hubris, arrogance, and an overwhelming lust for destruction. Uses rockets.
  components:
  - type: WeaponClass
    class: Heavy # Yeah fuck it is
  - type: Sprite
    sprite: _Impstation/Objects/Weapons/Guns/Launchers/leviathan.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-unshaded-1
        map: ["enum.GunVisualLayers.MagUnshaded"]
        shader: unshaded
  - type: Clothing
    sprite: _Impstation/Objects/Weapons/Guns/Launchers/leviathan.rsi
  - type: HeldSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: GunRequiresWield
  - type: Gun
    fireRate: 0.3
    soundGunshot:
      path: /Audio/_Impstation/Weapons/Guns/Gunshots/leviathan.ogg
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - CartridgeBazooka
    proto: CartridgeBazookaExp
    capacity: 1
    soundInsert:
      path: /Audio/_Impstation/Weapons/Guns/Cock/beecharge.ogg
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  - type: MeleeWeapon
    range: 1
    attackRate: 0.5
    damage:
      types:
        Blunt: 20
    soundHit:
      path: /Audio/Effects/hit_kick.ogg
    soundSwing:
      path: /Audio/Weapons/punchmiss.ogg
    resetOnHandSelected: false
  - type: AltFireMelee
    attackType: Heavy
  - type: StaminaDamageOnHit
    damage: 100 # If you're unarmored it just straight up knocks you out
  - type: MeleeRequiresWield
  - type: MeleeThrowOnHit
    distance: 0.5
    speed: 5
