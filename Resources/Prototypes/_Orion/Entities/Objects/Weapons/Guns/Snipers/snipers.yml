- type: entity
  parent: [ BaseMajorContraband, BaseWeaponRifle ]
  id: WeaponRifleSR127
  name: SR-127 Bauer bolt action rifle
  description: The Bauer SR-127 is the standard issue bolt action rifle used by the United Earth Gov. Known for its long range accuracy and use by marksmen despite its age and lack of IFF. It has an irremovable scope. Uses .60 anti-material magazines.
  components:
  - type: Sprite
    sprite: _Orion/Objects/Weapons/Guns/Snipers/snl177/big.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Orion/Objects/Weapons/Guns/Snipers/snl177/tiny.rsi
  - type: Item
    sprite: _Orion/Objects/Weapons/Guns/Snipers/snl177/tiny.rsi
  - type: GunWieldBonus
    minAngle: -23
    maxAngle: -43
  - type: Gun
    fireRate: 1.5
    cameraRecoilScalar: 5
    minAngle: 24
    maxAngle: 45
    soundGunshot:
      collection: 50bmgShot
    soundEmpty:
      path: /Audio/_Orion/Weapons/Guns/Rifles/rifle_empty.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/_Orion/Weapons/Guns/Snipers/tl-127_bolt.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        startingItem: MagazineRifleSR50
        insertSound: /Audio/_Orion/Weapons/Guns/Rifles/762_reload.ogg
        ejectSound: /Audio/_Orion/Weapons/Guns/Rifles/m28_unload.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineAntiMaterielRifle
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: GunRequiresWield
  - type: SpeedModifiedOnWield
    walkModifier: 0.7
    sprintModifier: 0.5
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 5
    pvsIncrease: 0.5
  - type: UseDelay
    delay: 1
  - type: UseDelayBlockShoot

- type: entity
  parent: [ BaseSecurityContraband, BaseWeaponRifle ]
  id: WeaponRifleDragunov
  name: Dragunov
  description: A semiautomatic sniper rifle, famed for its marksmanship, and is built from the ground up for it.
  components:
  - type: Sprite
    sprite: _Orion/Objects/Weapons/Guns/Snipers/dragunov/big.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Orion/Objects/Weapons/Guns/Snipers/dragunov/tiny.rsi
  - type: Item
    sprite: _Orion/Objects/Weapons/Guns/Snipers/dragunov/tiny.rsi
  - type: GunWieldBonus
    minAngle: -23
    maxAngle: -44
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    minAngle: 24
    maxAngle: 45
    cameraRecoilScalar: 3
    fireRate: 3
    soundGunshot:
      path: /Audio/_Orion/Weapons/Guns/Snipers/svd.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/_Orion/Weapons/Guns/Snipers/svd_cocked.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        startingItem: MagazineRifle762Sniper
        insertSound: /Audio/_Orion/Weapons/Guns/Snipers/svd_reload.ogg
        ejectSound: /Audio/_Orion/Weapons/Guns/Snipers/svd_unload.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineRifle762Sniper
      gun_chamber:
        startingItem: CartridgeRifle762
        priority: 1
        whitelist:
          tags:
            - CartridgeRifle762
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

- type: entity
  name: flintlock pistol
  parent: [BaseItem, BaseMajorContraband]
  id: WeaponPistolFlintlockBitrunning
  description: A pirate's companion. Yarrr! Loads one round of .45 Magnum.
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
    storedRotation: 0
  - type: Sprite
    sprite: Objects/Weapons/Guns/Snipers/flintlock.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: Objects/Weapons/Guns/Snipers/flintlock.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: StaticPrice
    price: 0
  - type: BasicEntityAmmoProvider
    proto: CartridgeMagnum
    capacity: 1
    count: 1
  - type: Gun
    fireRate: 0.30
    useKey: false
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot: /Audio/Weapons/Guns/Gunshots/sniper.ogg
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.30
    rechargeSound:
      path: /Audio/Weapons/Guns/Cock/sf_rifle_cock.ogg
      params:
        volume: -100
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: EmitSoundOnPickup
    sound:
      collection: SnipersPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: SnipersDrop
  - type: EmitSoundOnLand
    sound:
      collection: SnipersDrop
  - type: MeleeWeapon
    damage:
      types:
       Blunt: 12
    angle: 0
    wideAnimationRotation: 90
    soundHit:
      collection: MetalThud
