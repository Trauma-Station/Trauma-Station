- type: entity
  id: StorePresetUplink
  abstract: true
  components:
  - type: Store
    name: store-preset-name-uplink
    categories:
    - UplinkWeaponry
    - UplinkAmmo
    - UplinkExplosives
    - UplinkChemicals
    - UplinkDeception
    - UplinkDisruption
    - UplinkImplants
    - UplinkAllies
    - UplinkSkills # Trauma
    - UplinkWearables
    - UplinkJob
    - UplinkPointless
    - UplinkObjective
    currencyWhitelist:
    - Telecrystal
    balance:
      Telecrystal: 0
    expectedFaction:
    - Syndicate

- type: entity
  id: StorePresetSpellbook
  abstract: true
  components:
  - type: Store
    name: store-preset-name-spellbook
    categories:
    - SpellbookOffensive    #Fireball, Rod Form
    - SpellbookDefensive    #Magic Missile, Wall of Force
    - SpellbookUtility      #Body Swap, Lich, Teleport, Knock, Polymorph
    - SpellbookEquipment    #Battlemage Robes, Staff of Locker
    - SpellbookEvents       #Summon Weapons, Summon Ghosts
    - SpellbookSummons      #Goobstation
    - SpellbookSpecial      #Goobstation
    - SpellbookBundles      #Goobstation
    currencyWhitelist:
    - WizCoin
    expectedFaction:
    - Wizard

- type: entity
  id: StorePresetChangeling
  abstract: true
  components:
  - type: Store
    name: store-preset-name-changeling
    categories:
    - ChangelingAbilities
    currencyWhitelist:
    - ChangelingDNA

- type: entity
  parent: StorePresetUplink
  id: StorePresetRemoteUplink
  categories: [ HideSpawnMenu ]
  components:
  - type: RingerAccessUplink
  # <Trauma> - job listings
  - type: JobListings
    maximumSideJobs: 4
    maximumAcceptedSideJobs: 2
    sideJobsPerLevel: 2
    prioritySideJobOffers: # priority exists so kill is actually picked when it is outnumbered 7 to 1 by steal objectives
    # major - kill
    - KillSideJob
    sideJobOffers:
    # minor - bug
    - BugAreaSideJobCmo
    - BugAreaSideJobCE
    - BugAreaSideJobHop
    - BugAreaSideJobHos
    - BugAreaSideJobRd
    - BugAreaSideJobQm
    # major - steal
    - CMOHyposprayStealSideJob
    - RDHardsuitStealSideJob
    - HandTeleporterStealSideJob
    - MagbootsStealSideJob
    - ClipboardStealSideJob
    - CaptainJetpackStealSideJob
    - CaptainGunStealSideJob
    # extreme - kill head (no need to put this in priority because it is only extreme sidejob)
    - KillHeadSideJob
    # final - battlecruiser
    - BattlecruiserSideJob
    reputationLevels: # minor mission gives 100, major mission gives 200, extreme mission gives 500 and final mission gives 10000
    - 100 # 1 minor
    - 500 # 1 minor + 2 majors
    - 1000 # 1 minor + 2 majors + 1 extreme
    - 10000 # 1 final
    refreshWaitDuration: 600 # 10 minutes
  # </Trauma>
