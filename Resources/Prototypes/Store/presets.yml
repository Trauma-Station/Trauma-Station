- type: entity
  id: StorePresetUplink
  abstract: true
  components:
  - type: Store
    name: store-preset-name-uplink
    categories:
    - UplinkWeaponry
    - UplinkAmmo
    - UplinkExplosives
    - UplinkChemicals
    - UplinkDeception
    - UplinkDisruption
    - UplinkImplants
    - UplinkAllies
    - UplinkWearables
    - UplinkJob
    - UplinkPointless
    - UplinkObjective
    currencyWhitelist:
    - Telecrystal
    balance:
      Telecrystal: 0
    expectedFaction:
    - Syndicate

- type: entity
  id: StorePresetSpellbook
  abstract: true
  components:
  - type: Store
    name: store-preset-name-spellbook
    categories:
    - SpellbookOffensive    #Fireball, Rod Form
    - SpellbookDefensive    #Magic Missile, Wall of Force
    - SpellbookUtility      #Body Swap, Lich, Teleport, Knock, Polymorph
    - SpellbookEquipment    #Battlemage Robes, Staff of Locker
    - SpellbookEvents       #Summon Weapons, Summon Ghosts
    - SpellbookSummons      #Goobstation
    - SpellbookSpecial      #Goobstation
    - SpellbookBundles      #Goobstation
    currencyWhitelist:
    - WizCoin
    expectedFaction:
    - Wizard

- type: entity
  id: StorePresetChangeling
  abstract: true
  components:
  - type: Store
    name: store-preset-name-changeling
    categories:
    - ChangelingAbilities
    currencyWhitelist:
    - ChangelingDNA

- type: entity
  parent: StorePresetUplink
  id: StorePresetRemoteUplink
  categories: [ HideSpawnMenu ]
  components:
  - type: RingerAccessUplink
  # <Trauma> - job listings
  - type: JobListings
    maximumSideJobs: 4
    maximumAcceptedSideJobs: 2
    mediumSideJobOffers:
    - CMOHyposprayStealSideJob
    - RDHardsuitStealSideJob
    - HandTeleporterStealSideJob
    - MagbootsStealSideJob
    - ClipboardStealSideJob
    - KnuckleDustersStealSideJob
    - CorgiMeatStealSideJob
    - CaptainJetpackStealSideJob
    - CaptainGunStealSideJob
    # minor mission gives 100, major mission gives 200, extreme mission gives 500 and final mission gives 10000
    reputationLevels:
    - 100 # 1 minor
    - 500 # 1 minor + 2 majors
    - 1000 # 1 minor + 2 majors + 1 extreme
    - 10000 # 1 final
  # </Trauma>
