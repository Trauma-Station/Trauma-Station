## Base

- type: entity
  abstract: true
  parent: OrganBase
  id: OrganBaseExternal
  components:
  - type: Sprite
    overrideDir: North
  - type: ThrowingAngle # We add this so that throwing things doesn't make them freak the fuck out by automatically deciding directions.
    angle: 90
  - type: Bone
  - type: BodyPart
  - type: CoveredPart # for explosion damage and per-limb coverage
  - type: Woundable
    # numbers for an arm/leg since they're the most common and a reasonable default for strange parts
    integrity: 120
    integrityCap: 120
    thresholds:
      Minor: 100
      Moderate: 75
      Severe: 38
      Critical: 15
      Mangled: 0
  - type: WoundableVisuals
    thresholds: [ 100, 70, 50, 30, 20, 10 ]
    damageGroupSprites:
      Brute: _Shitmed/Mobs/Effects/brute_damage.rsi
      Burn: _Shitmed/Mobs/Effects/burn_damage.rsi
  - type: Appearance
  - type: ContainerContainer
    containers:
      Wounds: !type:Container

- type: entity
  abstract: true
  parent: OrganBase
  id: OrganBaseFleshy # not bone or metal
  components:
  - type: SurgeryTool
    startSound:
      path: /Audio/_Shitmed/Medical/Surgery/organ1.ogg
    endSound:
      path: /Audio/_Shitmed/Medical/Surgery/organ2.ogg
  - type: Edible
  - type: BadFood
  - type: Extractable
    grindableSolutionName: food
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10
  - type: Solution
    id: food
    solution:
      reagents:
      - ReagentId: UncookedAnimalProteins
        Quantity: 12
      - ReagentId: Fat
        Quantity: 3

- type: entity
  abstract: true
  parent: OrganBase
  id: OrganBaseSugary # yum
  components:
  - type: Damageable
    damageModifierSet: Gingerbread
  - type: Edible
  # good food for mouse, no BadFood
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Sugar
        Quantity: 15
  - type: Solution
    id: food
    solution:
      reagents:
      - ReagentId: Sugar
        Quantity: 12
      - ReagentId: Nutriment
        Quantity: 3

## Parts

- type: entity
  abstract: true
  parent: OrganBaseExternal
  id: OrganBaseLimb
  components:
  - type: ChildOrgan
    parents: [ Torso ]
  - type: WoundableVisuals
    bleedingOverlay: _Shitmed/Mobs/Effects/bleeding_damage.rsi
  - type: Limb

- type: entity
  abstract: true
  parent: OrganBaseLimb
  id: OrganBaseArm
  components:
  - type: BodyPart
    partType: Arm
  - type: Arm

- type: entity
  abstract: true
  parent: OrganBaseLimb
  id: OrganBaseLeg
  components:
  - type: BodyPart
    partType: Leg
  - type: Leg

- type: entity
  abstract: true
  parent: OrganBaseExternal
  id: OrganBaseHand
  components:
  - type: BodyPart
    partType: Hand
    slots: []

- type: entity
  abstract: true
  parent: OrganBaseExternal
  id: OrganBaseFoot
  components:
  - type: BodyPart
    partType: Foot
    slots: []

- type: entity
  abstract: true
  parent: OrganBaseHead
  id: OrganBaseHeadBald # no hair or facial hair..
  components:
  - type: VisualOrganMarkings
    markingData:
      layers:
      - Head
      - Face
      - Snout
      - SnoutCover
      - HeadSide
      - HeadTop

- type: entity
  abstract: true
  parent: OrganBaseTorso
  id: OrganBaseTorsoAnimalTailed
  components:
  - type: BodyPart
    slots:
    # Parts
    - Tail
    # Organs
    - Heart
    - Lungs
    - Stomach
    - Liver
    - Kidneys

- type: entity
  abstract: true
  parent: OrganBaseExternal
  id: OrganBaseTail
  name: tail
  components:
  - type: Sprite
    state: tail
  - type: Organ
    category: Tail
  - type: ChildOrgan
    parents: [ Torso ]
  - type: BodyPart
    partType: Tail
    slots: []
  - type: VisualOrgan
    layer: enum.HumanoidVisualLayers.Tail
    data:
      state: tail
  - type: VisualOrganMarkings
    markingData:
      layers:
      - Tail
