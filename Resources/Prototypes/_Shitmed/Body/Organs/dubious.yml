# SPDX-License-Identifier: AGPL-3.0-or-later

# Abductor glands
# chicken is best

- type: entity
  abstract: true
  id: OrganDubiousBase
  parent: [ OrganBaseHeart, OrganHumanMetabolizer, BaseMajorContraband ]
  name: mysterious gland
  description: Suspicious alien gland, replaces the heart.
  components:
  - type: Sprite
    sprite: _Shitmed/Mobs/Species/Misc/Dubious/organs.rsi
    layers:
    - state: health
  - type: AbductorOrgan

- type: entity
  parent: OrganDubiousBase
  id: OrganDubiousHealth
  suffix: Healing
  description: Suspicious alien gland, replaces the heart. This one radiates a peaceful glow.
  components:
  - type: Sprite
    layers:
    - state: health
  - type: OrganComponents
    onAdd:
    - type: PassiveDamage
      allowedStates:
      - Alive
      - SoftCrit
      - Critical # for mobs that dont have softcrit
      damage:
        types:
          Blunt: -0.15
          Slash: -0.15
          Ballistic: -0.15
          Piercing: -0.15
          Heat: -0.12
          Cold: -0.12
          Shock: -0.12
          Caustic: -0.04
          Asphyxiation: -0.10
          Bloodloss: -0.10
          Poison: -0.07
          Radiation: -0.07
          Cellular: -0.14

- type: entity
  parent: OrganDubiousBase
  id: OrganDubiousAA
  suffix: All Access
  description: Suspicious alien gland, replaces the heart. It seems like this one is constantly sparking.
  components:
  - type: Sprite
    layers:
    - state: emp
  - type: OrganComponents
    onAdd:
    - type: Access
      enabled: true
      groups:
      - AllAccess

- type: entity
  parent: OrganDubiousBase
  id: OrganDubiousShock
  suffix: Shocking
  description: Suspicious alien gland, replaces the heart. It seems volatile.
  components:
  - type: Sprite
    layers:
    - state: emp
  - type: OrganComponents
    onAdd:
    - type: Insulated
    - type: LightningArcShooter
      arcDepth: 2
      maxLightningArc: 6
      shootMinInterval: 180
      shootMaxInterval: 240
      shootRange: 7
      lightningPrototype: Lightning

- type: entity
  parent: OrganDubiousBase
  id: OrganDubiousInvisible
  suffix: Invisible
  description: Suspicious alien gland, replaces the heart. It seems to perfectly blend into the environment.
  components:
  - type: Sprite
    layers:
    - state: species
  - type: OrganComponents
    onAdd:
    - type: Stealth
      enabledOnDeath: false
      maxVisibility: 1.2
    - type: StealthOnMove
      passiveVisibilityRate: -0.25
      movementVisibilityRate: 0.25

- type: entity
  parent: OrganDubiousBase
  id: OrganDubiousGoliath
  suffix: Goliath
  description: Suspicious alien gland, replaces the heart. It’s made up of countless writhing tendrils.
  components:
  - type: Sprite
    layers:
    - state: species
  - type: OrganComponents
    onAdd:
    - type: GoliathTentacle

- type: entity
  parent: OrganDubiousBase
  id: OrganDubiousSpaceAdaptation
  suffix: Space
  description: Suspicious alien gland, replaces the heart. It doesn’t seem to beat.
  components:
  - type: Sprite
    layers:
    - state: species
  - type: OrganComponents
    onAdd:
    - type: BreathingImmunity # TODO: make this a status effect
  - type: OrganStatusEffects
    statusEffects:
    - StatusEffectPressureImmunityOrgan

- type: entity
  parent: OrganDubiousBase
  id: OrganDubiousArtifact
  suffix: Artifact
  description: Suspicious alien gland, replaces the heart. It seems to constantly be shifting.
  components:
  - type: Sprite
    layers:
    - state: mindshock
  - type: OrganComponents
    onAdd:
    - type: XenoArtifact
  - type: RandomOrganEffects
    effects:
    - !type:ActivateArtifact

- type: entity
  parent: OrganDubiousBase
  id: OrganDubiousScrambleDna
  suffix: DNA Scrambler
  description: Suspicious alien gland, replaces the heart. This one looks as if it’s constantly changing.
  components:
  - type: Sprite
    layers:
    - state: species
  - type: RandomOrganEffects
    effects:
    - !type:ScrambleDna

- type: entity
  parent: OrganDubiousBase
  id: OrganDubiousScrambleLocation
  description: Suspicious alien gland, replaces the heart. This one seems unstable.
  suffix: Teleport
  components:
  - type: Sprite
    layers:
    - state: vent
  - type: RandomOrganEffects
    effects:
    - !type:RandomTeleport

- type: entity
  parent: OrganDubiousBase
  id: OrganDubiousSpiderEggs
  suffix: Spiders
  description: Suspicious alien gland, replaces the heart. This one seems to be spewing eggs.
  components:
  - type: Sprite
    layers:
    - state: spider
  - type: RandomOrganEffects
    minActivationTime: 120
    maxActivationTime: 360
    effects:
    - !type:SpawnEntity
      entity: EggSpiderFertilized

- type: entity
  parent: OrganDubiousBase
  id: OrganDubiousSlimeEggs
  suffix: Slimes
  description: Suspicious alien gland, replaces the heart. This one seems to have something sloshing around inside.
  components:
  - type: Sprite
    layers:
    - state: slime
  - type: RandomOrganEffects
    minActivationTime: 120
    maxActivationTime: 360
    effects:
    - !type:SpawnFriendly
      entity: MobAdultSlimesBlueAngry

- type: entity
  parent: OrganDubiousBase
  id: OrganDubiousEMP
  suffix: EMP
  description: Suspicious alien gland, replaces the heart. This one looks shockingly normal.
  components:
  - type: Sprite
    layers:
    - state: emp
  - type: RandomOrganEffects
    effects:
    - !type:SpawnAttached
      entity: AdminInstantEffectEMP7

- type: entity
  parent: OrganDubiousBase
  id: OrganDubiousGravityWell
  suffix: Gravity
  description: Suspicious alien gland, replaces the heart. This one seems to be ignoring the laws of nature.
  components:
  - type: Sprite
    layers:
    - state: emp
  - type: RandomOrganEffects
    effects:
    - !type:SpawnAttached
      entity: AdminInstantEffectGravityWell

- type: entity
  parent: OrganDubiousBase
  id: OrganDubiousFlash
  suffix: Flash
  description: Suspicious alien gland, replaces the heart. This one appears bio-luminescent.
  components:
  - type: Sprite
    layers:
    - state: emp
  - type: RandomOrganEffects
    effects:
    - !type:SpawnAttached
      entity: AdminInstantEffectFlash

- type: entity
  parent: OrganDubiousBase
  id: OrganDubiousSmoke
  suffix: Smoke
  description: Suspicious alien gland, replaces the heart. This one seems to have smoke seeping out.
  components:
  - type: Sprite
    layers:
    - state: emp
  - type: RandomOrganEffects
    minActivationTime: 20
    maxActivationTime: 120
    effects:
    - !type:SpawnAttached
      entity: AdminInstantEffectSmoke30

- type: entity
  parent: OrganDubiousBase
  id: OrganDubiousGas
  suffix: Gases
  description: Suspicious alien gland, replaces the heart. This one seems to have some sort of gas leaking out.
  components:
  - type: Sprite
    layers:
    - state: viral
  - type: RandomOrganEffects
    effects:
    - !type:ExpelGas

- type: entity
  parent: OrganDubiousBase
  id: OrganDubiousSteptriggerImmune
  suffix: Noslip
  description: Suspicious alien gland, replaces the heart. This one seems to not even be touching the environment.
  components:
  - type: Sprite
    layers:
    - state: viral
  - type: OrganComponents
    onAdd:
    - type: StepTriggerImmune
      whitelist:
        types:
        - Shard
        - Landmine
        - Mousetrap
        - Lava
        - Chasm
        - SlipTile
        - SlipEntity
        - ContrabandDetector
        - Caltrop

- type: entity
  parent: OrganDubiousBase
  id: OrganDubiousVentcrawler
  suffix: Ventcrawl
  description: Suspicious alien gland, replaces the heart. This one seems to expand and contract.
  components:
  - type: Sprite
    layers:
    - state: vent
  - type: OrganComponents
    onAdd:
    - type: VentCrawler
      allowInventory: false

- type: entity
  parent: OrganDubiousBase
  id: OrganDubiousRepairable
  suffix: Repairable
  description: Suspicious alien gland, replaces the heart. This one seems to be infused with a metallic structure.
  components:
  - type: Sprite
    layers:
    - state: species
  - type: OrganComponents
    onAdd:
    - type: Repairable
      fuelCost: 5
      doAfterDelay: 3
      damage:
        types:
          Blunt: -10
          Piercing: -10
          Slash: -10
          Ballistic: -10
