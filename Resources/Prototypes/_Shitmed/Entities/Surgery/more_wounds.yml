# Slash

- type: entity
  id: MinorBreakage
  parent: WoundBase
  name: minor slash
  components:
  - type: Wound
    damageType: Slash
    woundType: External
    canBeHealed: false
    textString: minor-breakage
    alwaysShowInInspects: true
    minSeverity: 0.1
    maxSeverity: 25
  - type: BleedInflicter
    severityThreshold: 5
    scalingSpeed: 0.5

- type: entity
  id: OpenLaceration
  parent: WoundBase
  name: open laceration
  components:
  - type: Wound
    damageType: Slash
    woundType: External
    scarWound: SlashScar
    canBeHealed: false
    textString: open-laceration
    alwaysShowInInspects: true
  - type: BleedInflicter
    severityThreshold: 2
    scalingSpeed: 1.5

- type: entity
  id: WeepingAvulsion
  parent: WoundBase
  name: weeping avulsion
  components:
  - type: Wound
    damageType: Slash
    woundType: External
    woundVisibility: Always
    scarWound: SlashScar
    selfHealMultiplier: 0
    mangleSeverity: Severe
    canBeHealed: false # Only heals via tend wounds surgery
    textString: weeping-avulsion
    alwaysShowInInspects: true
    minSeverity: 1
    maxSeverity: 500
  - type: TraumaInflicter
    severityThreshold: 5
    allowArmourDeduction:
    - Dismemberment
    - OrganDamage
    - BoneDamage
    - VeinsDamage
    allowedTraumas:
    - Dismemberment
    - OrganDamage
    - BoneDamage
    - VeinsDamage
    traumasChances:
      Dismemberment: 0.5
      OrganDamage: 0.5
      BoneDamage: 0.5
      VeinsDamage: 0.5
  - type: BleedInflicter
    scalingSpeed: 4
  - type: SpillOrgans

