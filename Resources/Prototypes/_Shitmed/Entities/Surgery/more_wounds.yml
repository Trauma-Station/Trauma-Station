# Brute

- type: entity
  id: JointDislocation
  name: joint dislocation
  parent: WoundBase
  components:
  - type: Wound
    damageType: Blunt
    woundType: Internal
    woundVisibility: AdvancedScanner
    canBeHealed: false
    textString: join-dislocation
    alwaysShowInInspects: true
    minSeverity: 0.5
    maxSeverity: 25
  - type: TraumaInflicter
    severityThreshold: 10
    allowedTraumas:
    - BoneDamage
    traumasChances:
      BoneDamage: 0.5
      VeinsDamage: 0.2

- type: entity
  id: HairlineFracture
  name: hairline fracture
  parent: WoundBase
  components:
  - type: Wound
    damageType: Blunt
    woundType: Internal
    woundVisibility: AdvancedScanner
    minSeverity: 25
    maxSeverity: 30
  - type: TraumaInflicter
    severityThreshold: 20
    allowedTraumas:
    - BoneDamage
    traumasChances:
      BoneDamage: 1.0

- type: entity
  id: CompoundFracture
  name: compound fracture
  parent: WoundBase
  components:
  - type: Wound
    damageType: Blunt
    woundType: External
    woundVisibility: Always
    scarWound: BoneScar
    canBeHealed: false
    textString: compound-fracture
    alwaysShowInInspects: true
    minSeverity: 30
    maxSeverity: 250
  - type: TraumaInflicter
    severityThreshold: 5
    allowedTraumas:
    - BoneDamage
    - VeinsDamage
    traumasChances:
      BoneDamage: 1.0
      VeinsDamage: 0.3
  - type: BleedInflicter
    severityThreshold: 2
    scalingSpeed: 2.0

