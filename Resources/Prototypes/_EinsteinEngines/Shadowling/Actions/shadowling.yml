# All Abilities

- type: entity
  abstract: true
  parent: BaseAction
  id: BaseShadowlingAction
  components:
  - type: Sprite
    sprite: _EinsteinEngines/Shadowling/shadowling_abilities.rsi
  - type: Action
    itemIconStyle: NoItem

# Pre-Hatch

- type: entity
  parent: BaseShadowlingAction
  id: ActionHatch
  name: Hatch
  description: Engages the hatching progress, there is no going back after this and you will be vulnrable for a while.
  components:
  - type: Sprite
    layers:
    - state: engage_hatch
  - type: InstantAction
    event: !type:HatchEvent
  - type: ConfirmableAction
    popup: sling-hatch-engage-popup

# Post-Hatch
- type: entity
  parent: BaseShadowlingAction
  id: ActionEnthrall
  name: Enthrall
  description: Shatters their will, forging a thrall, not strong enough to affect mindshielded individuals or enslaved AI.
  components:
  - type: Sprite
    layers:
    - state: enthrall
  - type: TargetAction
    range: 0.5
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:EnthrallEvent

- type: entity
  parent: BaseShadowlingAction
  id: ActionGlare
  name: Glare
  description: A dark glare that stuns, silences, and slows a single target.
  components:
  - type: Sprite
    layers:
    - state: glare
  - type: Action
    useDelay: 30
  - type: TargetAction
    interactOnMiss: false
    range: 10
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:GlareEvent

- type: entity
  parent: BaseShadowlingAction
  id: ActionVeil
  name: Veil
  description: A pulse of darkness that destroys electrical lights in a large area.
  components:
  - type: Sprite
    layers:
    - state: veil
  - type: Action
    itemIconStyle: NoItem
    useDelay: 30
    checkCanInteract: false
    checkConsciousness: false
  - type: InstantAction
    event: !type:VeilEvent

- type: entity
  parent: BaseShadowlingAction
  id: ActionRapidRehatch
  name: Rapid Re-Hatch
  description: Shed your broken flesh, and rise whole once more.
  components:
  - type: Sprite
    layers:
    - state: rehatch
  - type: Action
    useDelay: 60
  - type: InstantAction
    event: !type:RapidRehatchEvent

- type: entity
  parent: BaseShadowlingAction
  id: ActionShadowWalk
  name: Shadow Walk
  description: Step into the void, moving unseen and unhindered.
  components:
  - type: Sprite
    layers:
    - state: shadow_walk
  - type: Action
    useDelay: 45
  - type: InstantAction
    event: !type:ShadowWalkEvent

- type: entity
  parent: BaseShadowlingAction
  id: ActionIcyVeins
  name: Icy Veins
  description: Disarms and freezes nearby creatures in an area around you.
  components:
  - type: Sprite
    layers:
    - state: icy_veins
  - type: Action
    itemIconStyle: NoItem
    useDelay: 50
  - type: InstantAction
    event: !type:IcyVeinsEvent

- type: entity
  parent: BaseShadowlingAction
  id: ActionDestroyEngines
  name: Destroy Engines
  description: Destroy the engines of the evacuation shuttle. Delays the shuttle by 10 minutes.
  components:
  - type: Sprite
    layers:
    - state: destroy_engines
  - type: InstantAction
    event: !type:DestroyEnginesEvent

- type: entity
  parent: BaseShadowlingAction
  id: ActionCollectiveMind
  name: Collective Mind
  description: Harvest the minds of your Thralls, and gain various abilities.
  components:
  - type: Sprite
    layers:
    - state: collective_mind
  - type: InstantAction
    event: !type:CollectiveMindEvent

# Thrall Required Actions

- type: entity
  parent: BaseShadowlingAction
  id: ActionBlindnessSmoke
  name: Blindness Smoke
  description: Heal your kind, and blind anyone who dares enter your mist.
  components:
  - type: Sprite
    layers:
    - state: blindness_smoke
  - type: Action
    useDelay: 60
  - type: InstantAction
    event: !type:BlindnessSmokeEvent

- type: entity
  parent: BaseShadowlingAction
  id: ActionNullCharge
  name: Null Charge
  description: Stand near an APC and overload it with a surge of nullifying force.
  components:
  - type: Sprite
    layers:
    - state: null_charge
  - type: Action
    useDelay: 60
  - type: InstantAction
    event: !type:NullChargeEvent

- type: entity
  parent: BaseShadowlingAction
  id: ActionSonicScreech
  name: Sonic Screech
  description: Release a violent scream that disorients all who hear it.
  components:
  - type: Sprite
    layers:
    - state: sonic_screech
  - type: Action
    useDelay: 30
  - type: InstantAction
    event: !type:SonicScreechEvent

- type: entity
  parent: BaseShadowlingAction
  id: ActionBlackRecuperation
  name: Black Recuperation
  description: Bring back a dead Thrall to life, or empower a living one. You'll reduce your resistance to light by using it.
  components:
  - type: Sprite
    layers:
    - state: black_recuperation
  - type: TargetAction
    range: 1
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:BlackRecuperationEvent

- type: entity
  parent: BaseShadowlingAction
  id: ActionEmpoweredEnthrall
  name: Empowered Enthrall
  description: Shatters their will, forging a Thrall. Faster and stronger, enough to bypass mindshields.
  components:
  - type: Sprite
    layers:
    - state: emp_enthrall
  - type: TargetAction
    range: 1
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:EmpoweredEnthrallEvent

- type: entity
  parent: BaseShadowlingAction
  id: ActionNoxImperii
  name: Nox Imperii
  description: Become immune to that which you fear the most. Light.
  components:
  - type: Sprite
    layers:
    - state: nox_imperii
  - type: InstantAction
    event: !type:NoxImperiiEvent

# Ascension Abilities

- type: entity
  parent: BaseShadowlingAction
  id: ActionAscendance
  name: Ascendance
  description: Forge your ascension egg and walk the path of a god, your thralls will need to defend the egg for a long time; be prepared.
  components:
  - type: Sprite
    layers:
    - state: ascendance
  - type: InstantAction
    event: !type:AscendanceEvent

- type: entity
  parent: BaseShadowlingAction
  id: ActionAnnihilate
  name: Annihilate
  description: Blow them to bits of flesh.
  components:
  - type: Sprite
    layers:
    - state: annihilate
  - type: Action
    useDelay: 1
  - type: TargetAction
    range: 12
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:AnnihilateEvent

- type: entity
  parent: BaseShadowlingAction
  id: ActionHypnosis
  name: Hypnosis
  description: Make anyone a Thrall, at a moment's notice.
  components:
  - type: Sprite
    layers:
    - state: enthrall
  - type: Action
    useDelay: 1
  - type: TargetAction
    range: 12
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:HypnosisEvent

- type: entity
  parent: BaseShadowlingAction
  id: ActionPlaneShift
  name: Plane Shift
  description: Phase through anything, whenever you desire.
  components:
  - type: Sprite
    layers:
    - state: shadow_walk
  - type: Action
    useDelay: 2
  - type: InstantAction
    event: !type:TogglePlaneShiftEvent

- type: entity
  parent: BaseShadowlingAction
  id: ActionLightningStorm
  name: Lightning Storm
  description: Spawn a ball of wrath, electrocuting everyone near you.
  components:
  - type: Sprite
    layers:
    - state: lightning_storm
  - type: Action
    useDelay: 30
  - type: InstantAction
    event: !type:LightningStormEvent

- type: entity
  parent: BaseShadowlingAction
  id: ActionAscendantBroadcast
  name: Ascendant Broadcast
  description: Send a very hard to miss message to everyone.
  components:
  - type: Sprite
    layers:
    - state: broadcast
  - type: InstantAction
    event: !type:AscendantBroadcastEvent
