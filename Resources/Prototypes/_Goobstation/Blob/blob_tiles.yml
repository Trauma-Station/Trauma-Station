- type: entity
  parent: BaseBlob
  id: StrongBlobTile
  name: Strong Blob Tile
  description: A reinforced version of the regular tile. It does not allow air to pass through and protects against brute damage.
  categories: [ HideSpawnMenu ]
  components:
  - type: Airtight
  - type: BlobTile
    tile: Strong
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Sprite
    sprite: _Goobstation/Blob/Mobs/blob.rsi
    drawdepth: BlobTiles
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: blob_shield
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: blob_glow
      #shader: unshaded

- type: entity
  parent: BaseBlob
  id: ReflectiveBlobTile
  name: Blob Reflective Tile
  description: It reflects lasers, but does not protect against brute damage as well.
  categories: [ HideSpawnMenu ]
  components:
  - type: Airtight
  - type: BlobTile
    tile: Reflective
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Damageable
    damageModifierSet: BlobReflective
  - type: Injurable
    damageContainer: Blob
  - type: Reflect
    reflectProb: 1
    spread: 20
    reflects:
    - Energy
  - type: Sprite
    sprite: _Goobstation/Blob/Mobs/blob.rsi
    drawdepth: BlobTiles
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: blob_shield
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: blob_glow
      shader: unshaded
