- type: entity
  parent: MarkerBase
  id: SpawnPointGhostBlob
  name: Blob spawner
  suffix: DEBUG, Ghost Role Spawner
  categories: [DoNotMap]
  components:
  - type: GhostRoleMobSpawner
    prototype: CoreBlobTile
  - type: GhostRole
    name: ghost-role-information-blob-name
    description: ghost-role-information-blob-description
    rules: You are an antagonist, destroy the station!
    mindRoles:
    - MindRoleGhostRoleSoloAntagonist
    raffle:
      settings: default
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green
    - sprite: _Goobstation/Blob/Mobs/blob.rsi
      state: blob_nuke_overlay

- type: entity
  parent: BaseBlob
  id: CoreBlobTile
  name: Core Blob
  description: The most important organ of the blob. By destroying the core, the infection will cease.
  components:
  - type: TemperatureDamage
    heatDamage:
      types:
        Heat: 5
    coldDamage: {}
    coldDamageThreshold: 0
  - type: Flammable
    fireSpread: true
    damage:
      types:
        Heat: 1
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: BlobTile
    tile: Core
  - type: BlobCore
    actionPrototypes:
    - ActionSwapBlobChem
    - ActionTeleportBlobToCore
    - ActionCreateBlobFactory
    - ActionCreateBlobResource
    - ActionCreateBlobNode
    - ActionCreateBlobbernaut
    - ActionSplitBlobCore
    - ActionSwapBlobCore
    - ActionDowngradeBlob
  - type: BlobNode
  - type: BlobResource
    pointsPerPulsed: 5
  - type: Sprite
    sprite: _Goobstation/Blob/Mobs/blob.rsi
    drawdepth: BlobTiles
    layers:
      - map: [ "enum.DamageStateVisualLayers.Base" ]
        state: blob_core
      - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
        state: blob_core_glow
#        shader: unshaded
      - state: blob_core_overlay
  - type: WarpPoint
    location: location-blob-core
  - type: GhostRole
    prob: 1
    name: ghost-role-information-blob-name
    description: ghost-role-information-blob-description
    rules: You are an antagonist, destroy the station!
    mindRoles:
    - MindRoleGhostRoleSoloAntagonist
    reregister: false
    raffle:
      settings: default
  - type: GhostTakeoverAvailable

