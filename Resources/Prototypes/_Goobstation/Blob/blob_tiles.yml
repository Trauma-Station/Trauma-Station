- type: entity
  parent: BaseBlob
  id: FactoryBlobTile
  name: Blob Factory
  description: Spawns Blob Drops and Blobbernauts over time.
  categories: [ HideSpawnMenu ]
  components:
  - type: TemperatureDamage
    heatDamage:
      types:
        Heat: 5
    coldDamage: {}
    coldDamageThreshold: 0
  - type: Flammable
    fireSpread: true
    damage:
      types:
        Heat: 1
  - type: BlobTile
    tile: Factory
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: BlobFactory
    accumulateToSpawn: 10
  - type: Sprite
    sprite: _Goobstation/Blob/Mobs/blob.rsi
    drawdepth: BlobTiles
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: blob_special
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: blob_glow_special
      #shader: unshaded

