- type: antag
  id: SlaughterDemon
  name: roles-antag-slaughter-demon-name
  antagonist: true
  objective: roles-antag-slaughter-demon-objective

- type: antag
  id: LaughterDemon
  name: ghost-role-information-laughter-demon-name
  antagonist: true
  objective: ghost-role-information-laughter-demon-description

- type: antagSpecifier
  id: SlaughterDemon
  spawnerPrototype: SpawnPointGhostSlaughterDemon
  allowNonHumans: true
  briefing:
    text: slaughter-role-greeting
    color: Red
    sound: /Audio/_Goobstation/SlaughterDemon/briefing.ogg
  components:
  - type: RandomMetadata
    nameSegments:
    - NamesSlaughterTitle
    - NamesSlaughter
    nameFormat: name-format-slaughter
  mindRoles: [ MindRoleSlaughterDemon ]

- type: antagSpecifier
  parent: SlaughterDemon
  id: SlaughterDemonMidround
  briefing:
    text: slaughter-role-greeting
    color: Red
    sound: /Audio/Misc/narsie_rises.ogg

- type: antagSpecifier
  id: LaughterDemon
  spawnerPrototype: SpawnPointGhostLaughterDemon
  allowNonHumans: true
  briefing:
    text: laughter-role-greeting
    color: Pink
    sound: /Audio/_Goobstation/Vehicle/Clowncar/clowncar_fart.ogg
  components:
  - type: RandomMetadata
    nameSegments:
    - NamesLaughterTitle
    - NamesSlaughter
    nameFormat: name-format-slaughter
  mindRoles: [ MindRoleSlaughterDemon ]

- type: antagSmite
  id: SlaughterDemon
  antag: SlaughterDemon
  rule: SlaughterDemonRule
  ruleComp: SlaughterDemonRule
  icon:
    sprite: _Goobstation/SlaughterDemon/demon.rsi
    state: daemon

- type: antagSmite
  id: LaughterDemon
  antag: LaughterDemon
  rule: LaughterDemonRule
  ruleComp: LaughterDemonRule
  icon:
    sprite: _Goobstation/SlaughterDemon/demon.rsi
    state: bowmon
