- type: entity
  parent: BlueTomatoPlants
  id: BluespaceTomatoPlants
  name: bluespace tomato plant
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Hydroponics/bluespace_tomato.rsi
  - type: PlantData
    name: seeds-bluespace-tomato-name
    mutationPrototypes: []
    packetPrototype: BlueTomatoSeeds
    productPrototypes: [ FoodBluespaceTomato ]
  - type: PlantGrowth
    waterConsumption: 0.5
    nutrientConsumption: 0.6
  - type: PlantChemicals
    chemicals:
      Nutriment:
        min: 1
        max: 3
        potencyDivisor: 20
      Singulo:
        min: 1
        max: 10
        potencyDivisor: 10
