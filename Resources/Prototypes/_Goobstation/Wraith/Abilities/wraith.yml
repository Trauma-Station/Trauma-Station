- type: entity
  id: WraithAbilities
  name: Wraith Abilities
  categories: [ HideSpawnMenu ]
  components:
  - type: Haunt
  - type: BloodWriting
  - type: Decay
  - type: DarkWhisper
  - type: AbsorbCorpse
    damage: # damage they take when they eat a corpse with forma
      types:
        Slash: 25
        Blunt: 25
  - type: DemonicWhisper
  - type: PossessObject
  - type: SpookMark
  - type: WraithCommand
    blacklist:
      components:
      - MobState
      - Body
      - Edible
      - EntityStorage
      - Solution
      - ReagentDispenser
      tags:
      - ChemDispensable
    searchRange: 7
    stunDuration: 1 # reduced stun duration from 5 to 1
  - type: Evolve
    corpsesRequired: 4
    availableEvolutions:
    - prototype: MobWraithHarbinger
    - prototype: MobWraithPlague
  # - prototype: MobWraithTrickster
  - type: ActionGrant
    actions:
    - ActionDarkWhisper
    - ActionAbsorbCorpse
    - ActionPossessObject
    - ActionDecay
    - ActionCommand
   # - ActionAnimateObject
    - ActionWhisper
    - ActionBloodWriting
    - ActionSpook
    - ActionToggleGhosts
    - ActionToggleLighting

- type: entity
  id: HarbingerAbilities
  name: Harbinger Abilities
  parent: WraithAbilities
  categories: [ HideSpawnMenu ]
  components:
  - type: SummonVoidCreature
  - type: MakeRevenant
    passiveRevenantDamage:
      types:
        Caustic: 1
  - type: RaiseSkeleton
  - type: SummonPortal
  - type: ActionGrant
    actions:
    - ActionRaiseSkeleton
    - ActionSummonVoidPortal
    - ActionMakeRevenant

- type: entity
  id: PlaguebringerAbilities
  name: Plaguebringer Abilities
  parent: WraithAbilities
  categories: [ HideSpawnMenu ]
  components:
  - type: SummonPlagueRat
  - type: SummonRotHulk
    searchRadius: 9
  - type: Defile
    reagents:
      BuzzochloricBees: 10
      Bleach: 10
      Ash: 10
      Vomit: 10
      Toxin: 10
  - type: ActionGrant
    actions:
    - ActionCurseBlindness
    - ActionCurseWeakness
    - ActionCurseBlood
    - ActionCurseRot
    - ActionCurseDeath
    - ActionDefile
    - ActionSummonPlagueRat
    - ActionSummonRotHulk
