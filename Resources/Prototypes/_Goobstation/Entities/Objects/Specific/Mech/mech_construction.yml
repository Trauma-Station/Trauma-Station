# Ripley MK-II

- type: entity
  id: BaseRipleyMKIIPart
  parent: BaseMechPart
  abstract: true
  components:
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Goobstation/Objects/Specific/Mech/ripleymkii_construction.rsi

- type: entity
  parent: BaseRipleyMKIIPart
  id: RipleyMKIIHarness
  name: ripley MK-II harness
  description: The core of the Ripley MK-II.
  components:
  - type: Appearance
  - type: ItemMapper
    mapLayers:
      ripleymkii_upgrade_kit+o:
        whitelist:
          tags:
          - RipleyMKIIUpgradeKit
      ripleymkii_l_arm+o:
        whitelist:
          tags:
          - RipleyLArm
      ripleymkii_r_arm+o:
        whitelist:
          tags:
          - RipleyRArm
      ripleymkii_l_leg+o:
        whitelist:
          tags:
          - RipleyLLeg
      ripleymkii_r_leg+o:
        whitelist:
          tags:
          - RipleyRLeg
    sprite: _Goobstation/Objects/Specific/Mech/ripleymkii_construction.rsi
  - type: ContainerContainer
    containers:
      mech-assembly-container: !type:Container
      battery-container: !type:Container
  - type: PartAssembly
    containerId: mech-assembly-container
    parts:
      RipleyMkIIChassis:
      - RipleyMKIIUpgradeKit
      - RipleyLArm
      - RipleyRArm
      - RipleyLLeg
      - RipleyRLeg
  - type: Sprite
    state: ripleymkii_harness+o
    noRot: true
  - type: Construction
    graph: RipleyMKII
    node: start
    defaultTarget: ripleymkii

- type: entity
  id: RipleyMKIIChassis
  parent: BaseRipleyMKIIPart
  name: ripley MK-II chassis
  description: An in-progress construction of the Ripley MK-II mech.
  components:
  - type: Appearance
  - type: ContainerContainer
    containers:
      battery-container: !type:Container
  - type: MechAssemblyVisuals
    statePrefix: ripleymkii
  - type: Sprite
    noRot: true
    state: ripleymkii0
  - type: Construction
    graph: RipleyMKII
    node: start
    defaultTarget: ripleymkii

# Durand

- type: entity
  id: BaseDurandPart
  parent: BaseMechPart
  abstract: true
  components:
  - type: Sprite
    drawdepth: Items
    noRot: false
    sprite: _Goobstation/Objects/Specific/Mech/durand_construction.rsi

- type: entity
  id: BaseDurandPartItem
  parent: BaseDurandPart
  abstract: true
  components:
  - type: Item
    size: Ginormous

- type: entity
  parent: BaseDurandPart
  id: DurandHarness
  name: durand harness
  description: The core of the Durand.
  components:
  - type: Appearance
  - type: ItemMapper
    mapLayers:
      durand_head+o:
        whitelist:
          tags:
          - DurandHead
      durand_l_arm+o:
        whitelist:
          tags:
          - DurandLArm
      durand_r_arm+o:
        whitelist:
          tags:
          - DurandRArm
      durand_l_leg+o:
        whitelist:
          tags:
          - DurandLLeg
      durand_r_leg+o:
        whitelist:
          tags:
          - DurandRLeg
    sprite: _Goobstation/Objects/Specific/Mech/durand_construction.rsi
  - type: ContainerContainer
    containers:
      mech-assembly-container: !type:Container
      battery-container: !type:Container
  - type: PartAssembly
    containerId: mech-assembly-container
    parts:
      DurandChassis:
      - DurandHead
      - DurandLArm
      - DurandRArm
      - DurandLLeg
      - DurandRLeg
  - type: Sprite
    state: durand_harness+o
    noRot: true
  - type: Construction
    graph: Durand
    node: start
    defaultTarget: durand

- type: entity
  parent: BaseDurandPartItem
  id: DurandHead
  name: durand head
  description: The head of the Durand. It belongs on the chassis of the mech.
  components:
