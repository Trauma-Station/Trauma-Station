- type: entity
  parent: Bible
  name: Quaran
  description: "Inshallah."
  id: BibleQuaran
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Chapel/allah.rsi
  - type: Item
    sprite: _Goobstation/Objects/Specific/Chapel/allah.rsi

- type: entity
  parent: Bible
  name: Tanakh
  description: "Choose life, that you and your offspring may live."
  id: BibleTanakh
  components:
  - type: Sprite
    sprite: _Goobstation/Wizard/Objects/scroll.rsi
    layers:
    - state: scroll2
  - type: Item
    sprite: _Goobstation/Wizard/Objects/scroll.rsi
    size: Small
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    damage:
      types:
        Blunt: 3

- type: entity
  parent: Bible
  name: clockwork slab
  description: A strange metal tablet. A clock in the center turns around and around.
  id: BibleSlabClockwork
  components:
  - type: Sprite
    sprite: _ShitChap/Objects/clockwork_slab.rsi
  - type: Item
    sprite: _ShitChap/Objects/clockwork_slab.rsi

- type: entity
  parent: [ BaseItem, BaseSetSelector ]
  id: ChaplainUndeterminedBible
  name: bluespace scripture beacon
  description: Though I walk through the valley of the shadow of death I will fear no evil, for you are with me.
  components:
  - type: Sprite
    sprite: _ShitChap/Objects/scripturebeacon.rsi
    state: icon
  - type: SetSelector
    possibleSets:
    - BibleSet
    - QuaranSet
    - TanakhSet
    - ClockworkSet
    maxSelectedSets: 1

- type: selectableSet
  id: BibleSet
  name: The Holy Bible
  description: Sever any tie, but the ties that bind me to your service and to your heart.
  sprite:
    sprite: Objects/Specific/Chapel/bible.rsi
    state: icon
  content:
  - Bible

- type: selectableSet
  id: QuaranSet
  name: The Quaran
  description: Then which of your Lord’s favours will you ˹humans and jinn˺ both deny?
  sprite:
    sprite: _Goobstation/Objects/Specific/Chapel/allah.rsi
    state: icon
  content:
  - BibleQuaran

- type: selectableSet
  id: TanakhSet
  name: The Tanakh Scrolls
  description: As you teach, you learn.
  sprite:
    sprite: _Goobstation/Wizard/Objects/scroll.rsi
    state: scroll2
  content:
  - BibleTanakh

- type: selectableSet
  id: ClockworkSet
  name: The Clockwork Slab
  description: A link between you and the Celestial Derelict. It contains information, recites scripture, and is your most vital tool as a Servant.
  sprite:
    sprite: _ShitChap/Objects/clockwork_slab.rsi
    state: icon
  content:
  - BibleSlabClockwork
