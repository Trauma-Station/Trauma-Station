# Base

- type: entity
  abstract: true
  id: BaseChristmasLights
  name: christmas lights
  description: Some white Christmas lights.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Christmas/lights.rsi
  - type: PointLight
    color: "#f9f375"
    radius: 3
    energy: 4
    lightMask: Sparkle

- type: entity
  parent: BaseChristmasLights
  id: BaseChristmasLightsRed
  description: Some red Christmas lights.
  components:
  - type: PointLight
    color: "#fc8d8d"

- type: entity
  parent: BaseChristmasLights
  id: BaseChristmasLightsBlue
  description: Some blue Christmas lights.
  components:
  - type: PointLight
    color: "#61accf"

# White

- type: entity
  parent: BaseChristmasLights
  id: ChristmasLightsWhite1
  components:
  - type: Sprite
    layers:
    - state: base1
    - state: lights1

