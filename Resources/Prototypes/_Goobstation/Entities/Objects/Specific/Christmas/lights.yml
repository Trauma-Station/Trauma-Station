# I couldn't figure out how randomsprite works so this mess was created!!!
# Also pointlight masks were probably created by yakub or some shit to fuck with people holy god
# Pointlight masks were coded in hell and sent up to us ong
- type: entity
  id: SpawnerChristmasLightsWhite
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: green
      - sprite: _Goobstation/Objects/Specific/Christmas/lights.rsi
        state: base1
  - type: RandomSpawner
    offset: 0.0
    prototypes:
    - ChristmasLightsWhite1
    - ChristmasLightsWhite2
    - ChristmasLightsWhite3
    - ChristmasLightsWhite4
    - ChristmasLightsWhite5
    - ChristmasLightsWhite6

- type: entity
  id: SpawnerChristmasLightsRed
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: green
      - sprite: _Goobstation/Objects/Specific/Christmas/lights.rsi
        state: base1
        color: "#ff7878"
  - type: RandomSpawner
    offset: 0.0
    prototypes:
    - ChristmasLightsRed1
    - ChristmasLightsRed2
    - ChristmasLightsRed3
    - ChristmasLightsRed4
    - ChristmasLightsRed5
    - ChristmasLightsRed6

- type: entity
  id: SpawnerChristmasLightsBlue
