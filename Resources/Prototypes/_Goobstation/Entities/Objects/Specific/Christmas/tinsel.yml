# I couldn't figure out how randomsprite works so this mess was created!!!
- type: entity
  id: SpawnerChristmasTinselWhite
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: green
      - sprite: _Goobstation/Objects/Specific/Christmas/tinsel.rsi
        state: base1
  - type: RandomSpawner
    offset: 0.0
    prototypes:
    - ChristmasTinselWhite1
    - ChristmasTinselWhite2
    - ChristmasTinselWhite3
    - ChristmasTinselWhite4
    - ChristmasTinselWhite5
    - ChristmasTinselWhite6

- type: entity
  id: SpawnerChristmasTinselRed
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: green
      - sprite: _Goobstation/Objects/Specific/Christmas/tinsel.rsi
        state: base1
        color: "#ff7878"
  - type: RandomSpawner
    offset: 0.0
    prototypes:
    - ChristmasTinselRed1
    - ChristmasTinselRed2
    - ChristmasTinselRed3
    - ChristmasTinselRed4
    - ChristmasTinselRed5
    - ChristmasTinselRed6

- type: entity
  id: SpawnerChristmasTinselBlue
  parent: MarkerBase
  components:
