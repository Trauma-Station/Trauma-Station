    - ChristmasTinselBlue1
    - ChristmasTinselBlue2
    - ChristmasTinselBlue3
    - ChristmasTinselBlue4
    - ChristmasTinselBlue5
    - ChristmasTinselBlue6

# Base

- type: entity
  abstract: true
  id: BaseChristmasTinsel
  name: tinsel
  description: Some white tinsel. It's a bit sparkly.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Christmas/tinsel.rsi
  - type: PointLight
    color: "#f9f375"
    radius: 3
    energy: 4
    lightMask: Sparkle

- type: entity
  abstract: true
  parent: BaseChristmasTinsel
  id: BaseChristmasTinselRed
  description: Some red tinsel. It's a bit sparkly.

- type: entity
  abstract: true
  parent: BaseChristmasTinsel
  id: BaseChristmasTinselBlue
  description: Some blue tinsel. It's a bit sparkly.
  components:
  - type: PointLight
    color: "#61accf"

