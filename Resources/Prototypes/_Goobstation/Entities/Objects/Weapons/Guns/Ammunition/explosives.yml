- type: entity
  id: GrenadeMPAPERS
  name: MP-APERS shell (40mm)
  parent: BaseGrenade
  components:
  - type: CartridgeAmmo
    proto: HighCaliberPelletGrenadeSpread
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: apers
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: apers

- type: entity
  id: GrenadeTeargas
  name: tear gas shell (40mm)
  parent: BaseGrenade
  components:
  - type: CartridgeAmmo
    proto: BulletGrenadeTeargas
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: teargas
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: teargas
  - type: Tag
    tags:
     - Grenade
     - NonLethalGrenade

- type: entity
  parent: [BaseItem, BaseCommandContraband]
  id: CartridgeRocketSingularityBuster
  name: rocket-propelled anti-singularity grenade
  description: A warhead containing a large amount of anti-particles. Upon hitting a singularity, the anti-particles are released, decomposing the singularity. Warranty void if the rocket hits anything besides a singularity or tesla.
  components:
  - type: Item
    size: Small
  - type: CartridgeAmmo
    proto: BulletSingularityBusterRocket
    deleteOnSpawn: true
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Projectiles/buster.rsi
    state: buster
  - type: Tag
    tags:
    - CartridgeRocket
