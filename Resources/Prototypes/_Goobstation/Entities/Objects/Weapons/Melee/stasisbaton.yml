# SPDX-License-Identifier: AGPL-3.0-or-later

- type: entity
  parent: Stunbaton
  id: StasisBaton
  name: futuristic stunbaton
  description: An advanced security baton for shutting down interfering tiders
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Melee/stasisbaton.rsi
  - type: StaminaDamageOnHitRequiresCharge
    requiredCharge: 10
  - type: ItemToggleRequiresCharge
    requiredCharge: 10
  - type: ItemToggle
    soundActivate: &sound
      path: /Audio/Weapons/eblademiss.ogg
      params:
        variation: 0.250
    soundDeactivate: *sound
    soundFailToActivate: *sound
  - type: StaminaDamageOnHit
    damage: 75
    sound: /Audio/Weapons/egloves.ogg
  - type: Item
    size: Small
  - type: BatterySelfRecharger
    autoRechargeRate: 5
