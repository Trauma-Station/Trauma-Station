- type: entity
  parent: [BaseItem, BaseSecurityContraband]
  id: PolymerBaton
  name: polymer baton
  description: A lightweight, durable baton made from advanced polymers. Delivers less-than-lethal force for compliance and control.
  components:
  - type: WeaponClass
    class: NonLethal
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Melee/polybaton.rsi
    state: icon
    scale: 0.9, 0.9
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Melee/polybaton.rsi
    quickEquip: false
    slots:
      - belt
  - type: MeleeWeapon
    animationRotation: -180
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 12
    soundHit:
      path: /Audio/_Goobstation/Weapons/Baton/woodhit.ogg
  - type: StaminaDamageOnHit
    damage: 15
  - type: MeleeThrowOnHit
    distance: 1
    speed: 5
  - type: Item
    size: Normal
    storedRotation: 45
    shape:
    - 0,0,2,0
  - type: Tag
    tags:
    - SecBeltEquip
  - type: KnowledgeGrantOnWear
    blocked:
      MartialArtCorporateJudo: true

- type: entity
  parent: [BaseItem, BaseSecurityContraband]
  id: SpearTelescopic
  name: telescopic spear
  description: A compact, throwable spear with a retractable shaft. Designed for both melee and ranged use.
  components:
  - type: WeaponClass
    class: Polearm
  - type: Item
    size: Normal
    storedRotation: 45
    heldPrefix: off
    shape:
      - 0,0,3,0
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Melee/telespear.rsi
    layers:
      - state: icon-off
        map: [ "enum.ItemToggleVisuals.Layer" ]
  - type: Clothing
    sprite: _Goobstation/Objects/Weapons/Melee/telespear.rsi
    slots:
      - Back
      - suitStorage
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
            - -0.08,-0.06
            - -0.06,-0.08
            - 0.40,0.30
            - 0.30,0.40
        density: 20
        mask:
          - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: EmbeddableProjectile # This is goofy, but I can't make it toggleable because it tries
    offset: -0.15,0.0 # to unstick from owned entity on component shutdown and drops out of hand
  - type: LandAtCursor
  - type: ThrowingAngle
    angle: 225
  - type: ItemToggle
    onActivate: false
    wieldToggle: false
    soundActivate:
      path: /Audio/Weapons/telescopicon.ogg
    soundDeactivate:
      path: /Audio/Weapons/telescopicoff.ogg
  - type: ComponentToggler
    components:
      - type: Sharp
      - type: Tool
        qualities:
        - Slicing
      - type: DisarmMalus
        malus: 0.6
      - type: Wieldable
        unwieldOnUse: false
        applyNewPrefixOnShutdown: true
        newPrefixOnShutdown: off
      - type: DamageOtherOnHit
        damage:
          types:
            Piercing: 36
  - type: ItemToggleSize
    activatedSize: Ginormous
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/bladeslice.ogg
    activatedDamage:
      types:
        Piercing: 18
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 10
  - type: MeleeWeapon
    canWideSwing: false
    range: 2.2
    animationRotation: -135
    attackRate: 0.8
    damage:
      types:
        Piercing: 10
    soundHit:
      collection: MetalThud
  - type: Appearance
  - type: ItemToggleVisuals
  - type: GenericVisualizer
    visuals:
      enum.ItemToggleVisuals.State:
        enum.ItemToggleVisuals.Layer:
          True: { state: icon }
          False: { state: icon-off }
  - type: Tag
    tags:
    - SecBeltEquip
    - Spear
