- type: entity
  parent: StorageBin
  id: Constructor
  name: constructor
  description: The machine putting assistants out of a job, it can build anything using supplied materials.
  components:
  # Appearance
  - type: Sprite
    sprite: _Goobstation/Structures/Machines/constructor.rsi
  # Physics
  - type: Transform
    noRot: false
  - type: Rotatable
    rotateWhileAnchored: true
  # Construction
  - type: Machine
    board: ConstructorCircuitboard
  # UI
  - type: ActivatableUI
    key: enum.ConstructorUiKey.Key
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.ConstructorUiKey.Key:
        type: ConstructorBUI
  # Constructor
  - type: Constructor
  - type: DoAfter
  - type: StartableMachine
  - type: DeviceLinkSink
    ports:
    - Start
    - AutoStart
  - type: DeviceLinkSource
    ports:
    - Started
    - Completed
    - Failed
  # Power
  - type: ApcPowerReceiver
    powerLoad: 1000
  # <Trauma>
  - type: KnowledgeGrant
    skills:
      ConstructionSimpleHandmade: 100
      ConstructionAdvancedHandmade: 100
      ConstructionSurvivalWeaponsHandmade: 100
      ConstructionSurvivalWeaponsHandmadeAdvanced: 100
      ConstructionTechnological: 100
      ConstructionMaterials: 100
      ConstructionDoors: 100
      ConstructionAirlocks: 100
      ConstructionToys: 100
      ConstructionBots: 100
      ConstructionSimpleFurniture: 100
      ConstructionFurniture: 100
      ConstructionInfrastructure: 100
      ConstructionElectronics: 100
      ConstructionWalls: 100
      ConstructionAdvancedWalls: 100
      ConstructionScience: 100
      ConstructionWindows: 100
      ConstructionAdvancedWindows: 100
      ConstructionSmokeables: 100
      ConstructionRevolutionary: 100
  # </Trauma>