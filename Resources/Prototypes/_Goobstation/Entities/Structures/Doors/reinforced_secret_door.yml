- type: entity
  abstract: true
  parent: BaseSecretDoor
  id: BaseReinforcedSecretDoor
  name: reinforced wall # No meta
  suffix: secret door
  description: Keeps the air in and the greytide out.
  components:
  - type: Sprite
    sprite: _Trauma/Structures/Doors/reinforced_secret_door.rsi

- type: entity
  parent: BaseSecretDoorAssembly
  id: ReinforcedSecretDoorAssembly
  name: reinforced secret door assembly
  components:
  - type: Sprite
    sprite: _Trauma/Structures/Doors/reinforced_secret_door.rsi
  - type: Construction
    graph: ReinforcedSecretDoor
    node: assembly

- type: entity
  id: ReinforcedSecretDoor
  name: reinforced wall
  parent: BaseReinforcedSecretDoor
  components:
  - type: Construction
    graph: ReinforcedSecretDoor
    node: ReinforcedSecretDoor
    containers:
    - battery-container
