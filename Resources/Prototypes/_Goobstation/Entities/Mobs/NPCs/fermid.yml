- type: entity
  abstract: true
  parent: [ AppearanceSpaceAnimal, SimpleSpaceMobBase, BaseSlicingRefinable, MobNightVision ]
  id: MobFermidBase
  name: fermid
  description: Extremely hostile asteroid-dwelling bugs. Best to avoid them wherever possible.
  components:
  - type: VentCrawler
  - type: Sprite
    drawdepth: Mobs
    sprite: /Textures/_Goobstation/Mobs/Animals/Fermids/fermid.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: fermid_small
  - type: MobThresholds
    thresholds:
      0: Alive
      40: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: fermid_small
      Dead:
        Base: fermid_small_dead
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: NpcFactionMember
    factions:
      - SimpleHostile
  - type: ToolRefinable
    refineResult:
    - id: FoodMeatSpider
      amount: 2
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: InsectBlood
        Quantity: 50
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.1
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed : 4
    baseSprintSpeed : 4
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 3
        Poison: 3
  - type: Solution
    id: melee
    solution:
      reagents:
      - ReagentId: SulfuricAcid
        Quantity: 80
  - type: MeleeChemicalInjector
    solution: melee
    transferAmount: 2
  - type: NoSlip
  - type: Speech
    speechVerb: Arachnid
    speechSounds: Arachnid
    allowedEmotes: ['Click', 'Chitter']
  - type: TypingIndicator
    proto: spider
  - type: Fauna

- type: entity
  name: fermid
  id: MobFermidSmall
  parent: MobFermidBase

