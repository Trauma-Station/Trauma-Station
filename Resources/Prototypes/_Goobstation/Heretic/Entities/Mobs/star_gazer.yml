- type: entity
  parent:
  - BaseMob
  - MobCombat
  - FlyingMobBase
  - MobNightVision
  id: MobStarGazer
  name: star gazer
  description: A creature that has been tasked to watch over the stars.
  components:
  - type: Sprite
    sprite: _Goobstation/Heretic/star_gazer.rsi
    layers:
    - state: star_gazer
      offset: 0, 1
  - type: ActionGrant
    actions:
    - ActionHereticCosmicExpansion
    - ActionHereticStarBlast
    - ActionStarGaze
    - ActionStarGazerSeekMaster
  - type: MeleeWeapon
    range: 4
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
    altDisarm: false
    angle: 0
    animation: WeaponArcHereticCosmic
    attackRate: 1
    canWideSwing: false
    damage:
      types:
        Slash: 10
        Piercing: 10
        Structural: 100
      armorPenetration: 0.2
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 1000
        mask:
        - MobMask
  - type: MovementIgnoreGravity
  - type: Speech
  - type: TypingIndicator
  - type: NoSlip
  - type: Grammar
    attributes:
      gender: male
  - type: GhostTakeoverAvailable
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghostrole-stargazer-name
    description: ghostrole-stargazer-desc
    rules: ghostrole-ghoul-rules
    mindRoles:
    - MindRoleGhostRoleFamiliar
    raffle:
      settings: short
  - type: CollectiveMind
    defaultChannel: MansusLink
    channels:
    - MansusLink
  - type: FactionException
  - type: NpcFactionMember
    factions:
    - Heretic
  - type: StatusIcon
    bounds: -0.5,-0.5,0.5,0.5
  - type: Insulated
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: FlashImmunity
    showInExamine: false
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavSmash: !type:Bool
        true
  - type: Targeting
  - type: Eye
    drawFov: false
  - type: ContentEye
    maxZoom: 1.5, 1.5
    targetZoom: 1.5, 1.5
  - type: LanguageSpeaker
    speaks: []
    understands: []
  - type: UniversalLanguageSpeaker
  - type: TowerOfBabel
  - type: CosmicTrail
    strength: 10
  - type: PointLight
    color: "#dcaa5b"
    radius: 5
    softness: 1
  - type: Puller
    needsHands: false
  - type: StarGazer
  - type: ContinuousBeamGun
    userCanFire: false
    beamScale: 2
    minMaxLaserRange: 4, 14
    laserSpeed: 0.1
    laserThickness: 0.9
    beamTime: 10
    beamSound:
      path: /Audio/_Goobstation/Heretic/stargazer/beam_loop_one.ogg
    damage:
      types:
        Heat: 10
        Structural: 50
    data:
      id: stargaze
      startSprite: { sprite: /Textures/_Goobstation/Heretic/Effects/effects96x96.rsi, state: start1 }
      sprite: { sprite: /Textures/_Goobstation/Heretic/Effects/effects.rsi, state: beam1 }
      endSprite: { sprite: /Textures/_Goobstation/Heretic/Effects/effects.rsi, state: end1 }
      scale: 2, 2
      shouldCollide: false
  - type: WarpPoint
    follow: true
    location: location-star-gazer
  - type: SupermatterImmune
  - type: EventHorizonIgnore
  - type: SpacetimeSpellbladeEnchantment # It's not a spellblade, trust
    effect: EffectCosmicSlash
  - type: HealingAura
    componentHealMultipliers:
      CosmosPassive: 1
  - type: Tag
    tags:
    - CannotSuicide
  - type: Viewcone
    baseConeAngle: 360
  - type: NightVision
    lightingColor: white
