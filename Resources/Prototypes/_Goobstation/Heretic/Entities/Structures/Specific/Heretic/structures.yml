- type: entity
  parent: BaseStructureWall
  id: WallHereticArenaBase
  suffix: indestructible
  abstract: true
  components:
  - type: Occluder
  - type: RustRequiresPathStage
    pathStage: 11 # Can't rust
  - type: Penetratable
    penetrateDamage: 1000
    damagePenalty: 0.8
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: RadiationBlocker
    resistance: 10
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 4000

- type: entity
  parent: WallHereticArenaBase
  id: WallHereticArena
  name: rose stone wall
  suffix: indestructible
  components:
  - type: Sprite
    sprite: _Goobstation/Heretic/Structures/rose_stone_wall.rsi
    layers:
    - state: rose_stone_1
      map: [ "base" ]
  - type: RandomSprite
    available:
    - base:
        rose_stone_1: ""
        rose_stone_2: ""
        rose_stone_3: ""
        rose_stone_4: ""
        rose_stone_5: ""
        rose_stone_6: ""
        rose_stone_7: ""
        rose_stone_8: ""
  - type: Appearance
  - type: Icon
    sprite: _Goobstation/Heretic/Structures/rose_stone_wall.rsi
    state: rose_stone_1

- type: entity
  parent: WallHereticArenaBase
  id: WallHereticArenaOuter
  name: eldritch wall
  description: A wall penning in the sheep amongst the wolves. It glows with malevolent energy - prodding it is likely unwise.
  suffix: indestructible
  components:
  - type: Sprite
    sprite: _Goobstation/Heretic/Structures/eldritch_forcewall.rsi
    state: eldritch_forcewall
  - type: Icon
    sprite: _Goobstation/Heretic/Structures/eldritch_forcewall.rsi
    state: eldritch_forcewall
  - type: BladeArenaOuterWall
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        - GhostImpassable
        layer:
        - WallLayer
        density: 4000

- type: entity
  parent: PlastitaniumWindowBase
  id: WindowHereticArena
  name: stone window
  suffix: indestructible
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _Goobstation/Heretic/Structures/stone_window_pane.rsi
    state: stone_window_pane
  - type: Icon
    sprite: _Goobstation/Heretic/Structures/stone_window_pane.rsi
    state: stone_window_pane
  - type: Airtight
  - type: ExaminableDamage
    messages: null
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
        density: 4000

- type: entity
  id: HereticArena
  name: arena
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: TimedDespawn
    lifetime: 60
  - type: BladeArena
  - type: Tag
    tags:
    - HideContextMenu
