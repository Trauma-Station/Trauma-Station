- type: entityEffect
  id: HereticBladeGraspEffect
  conditions:
  - !type:WhitelistCondition
    whitelist:
      components:
      - MobState
  - !type:BackstabCondition
  effects:
  - !type:ModifyParalysis
    time: 1.5
  - !type:HealthChange
    damage:
      types:
        Slash: 10
    targetPart: Chest

- type: entityEffect
  id: HereticRustGraspCatwalkEffect
  conditions:
  - !type:WhitelistCondition
    whitelist:
      tags:
      - CatWalk
  effects:
  - !type:Delete
  - !type:EffectsRitualEffect
    applyOn: Grasp
    effects:
    - !type:ResetRustGraspDelayEffect
      multiplier: 0.15
  - !type:SetBlackboardValuesRitualEffect
    values:
      InvokeGrasp: false
      ApplyGraspDefaultEffects: false
      ApplyGraspMark: false

- type: entityEffect
  id: HereticRustGraspWallEffect
  conditions:
  - !type:WhitelistCondition
    whitelist:
      tags:
      - Wall
  - !type:TryMakeRustWallCondition
  effects:
  - !type:ResetRustGraspDelayEffect
  - !type:SetBlackboardValuesRitualEffect
    values:
      InvokeGrasp: false
      ApplyGraspDefaultEffects: false
      ApplyGraspMark: false

- type: entityEffect
  id: HereticFleshGraspEffect
  conditions:
  - !type:WhitelistCondition
    blacklist:
      components:
      - Ghoul
      - BorgChassis
  - !type:MobStateCondition
    mobstate: Alive
    inverted: true
  effects:
  - !type:GhoulifyEffect
    health: 50
  - !type:SetBlackboardValuesRitualEffect
    values:
      ApplyGraspDefaultEffects: false
      ApplyGraspMark: false

- type: entityEffect
  id: HereticLockGraspUnlockEffect
  effects:
  - !type:PopupMessage
    messages:
    - heretic-lock-unlocked
  - !type:PlaySoundEffect
    sound:
      path: /Audio/_Goobstation/Heretic/hereticknock.ogg
  - !type:SetBlackboardValuesRitualEffect
    conditions:
    - !type:HereticMinStageCondition
      minStage: 7
    values:
      InvokeGrasp: false
      ApplyGraspDefaultEffects: false
      ApplyGraspMark: false

- type: entityEffect
  id: HereticLockGraspMechEffect
  effects:
  - !type:EjectMechPilot
    paralyzeDuration: 5
  - !type:NestedRitualEffect
    proto: HereticLockGraspUnlockEffect

- type: entityEffect
  id: HereticLockGraspDoorEffect
  effects:
  - !type:SetBoltsDown
  - !type:OpenDoor
  - !type:NestedRitualEffect
    conditions:
    - !type:WhitelistCondition
      blacklist:
        components:
        - Mech
    proto: HereticLockGraspUnlockEffect

- type: entityEffect
  id: HereticLockGraspAccessReaderEffect
  conditions:
  - !type:WhitelistCondition
    blacklist:
      components:
      - MobState
  effects:
  - !type:ClearAccesses
  - !type:NestedRitualEffect
    conditions:
    - !type:WhitelistCondition
      blacklist:
        components:
        - Mech
        - Door
    proto: HereticLockGraspUnlockEffect

- type: entityEffect
  id: HereticMarkAsh
  effects:
  - !type:TakeStaminaDamage
    amount: 6
    immediate: true
  - !type:HealthChange
    damage:
      types:
        Heat: 3
    targetPart: Vital

- type: entityEffect
  id: HereticMarkBlade
  effects:
  - !type:AddUserProtectiveBlade

- type: entityEffect
  id: HereticMarkFlesh
  effects:
  - !type:CreateFleshMimic

- type: entityEffect
  id: HereticMarkLock
  effects:
  - !type:ModifyStatusEffect
    effectProto: LockMarkedStatusEffect
    time: 20

- type: entityEffect
  id: HereticMarkRust
  effects:
  - !type:Vomit
  - !type:ModifyKnockdown
    time: 20

- type: entityEffect
  id: HereticMarkVoid
  effects:
  - !type:VoidCurse
    stacks: 3

- type: entityEffect
  id: HereticMarkCosmos
  effects:
  - !type:TriggerCosmicMark
  - !type:ModifyParalysis
    time: 2
