  - type: HereticRitual
    cancelLoc: heretic-ritual-fail-sacrifice
    conditions:
    - !type:LookupCondition
      outputKey: Look
    - !type:FilterCondition
      inputKey: Look
      outputKey: Humanoid
      whitelist:
        components:
        - HumanoidAppearance
    - !type:FilterMobStateCondition
      inputKey: Humanoid
      outputKey: Dead
