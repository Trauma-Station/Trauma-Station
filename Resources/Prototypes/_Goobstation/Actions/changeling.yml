    requireAbsorbed: 1

- type: entity
  parent: BaseChangelingAction
  id: ActionShriekDissonant
  name: Dissonant Shriek
  description: Emit an EMP blast, with just your voice. Costs 30 chemicals.
  components:
  - type: Action
    useDelay: 10
