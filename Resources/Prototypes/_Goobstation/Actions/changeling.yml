    chemicalCost: 45
    useOnFire: true
    useInLesserForm: true
    requireAbsorbed: 1

- type: entity
  parent: BaseChangelingAction
  id: ActionShriekResonant
  name: Resonant Shriek
  description: Disorient people and break lights, with just your voice. Costs 30 chemicals.
