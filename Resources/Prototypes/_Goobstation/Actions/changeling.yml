# utility
- type: entity
  parent: BaseChangelingAction
  id: ActionAnatomicPanacea
  name: Anatomic Panacea
  description: Cure yourself of diseases, disabilities, radiation, toxins, drunkedness and brain damage. Costs 30 chemicals.
  components:
  - type: Action
    useDelay: 20
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - state: anatomic_panacea
  - type: InstantAction
    event: !type:ActionAnatomicPanaceaEvent
  - type: ChangelingAction
    chemicalCost: 30
    useInLesserForm: true

- type: entity
  parent: BaseChangelingAction
  id: ActionAugmentedEyesight
  name: Augmented Eyesight
  description: Toggle thermal vision.
  components:
  - type: Action
    useDelay: 1
    checkCanInteract: false
  - type: Sprite
    layers:
    - state: augmented_eyesight
  - type: InstantAction
    event: !type:ToggleThermalVisionEvent

- type: entity
  parent: BaseChangelingAction
  id: ActionBiodegrade
  name: Biodegrade
  description: Vomit a caustic substance onto any restraints, or someone's face. Costs 30 chemicals.
  components:
  - type: Action
    useDelay: 5
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - state: biodegrade
  - type: InstantAction
    event: !type:ActionBiodegradeEvent
  - type: ChangelingAction
    chemicalCost: 30
    useOnFire: true

- type: entity
  parent: BaseChangelingAction
  id: ActionChameleonSkin
  name: Chameleon Skin
  description: Slowly blend in with the environment. Costs 25 chemicals.
  components:
  - type: Action
    useDelay: 1
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - state: chameleon_skin
  - type: InstantAction
    event: !type:ActionChameleonSkinEvent
  - type: ChangelingAction
    chemicalCost: 20

- type: entity
  parent: BaseChangelingAction
  id: ActionVoidAdapt
  name: Toggle Void Adaption
  description: Adapt to the harsh environment of space, removing the need for oxygen or a suit. Cost free.
  components:
  - type: Action
    useDelay: 1
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - state: void_adaptation
  - type: InstantAction
    event: !type:ActionVoidAdaptEvent
      addedComponents:
      - type: SpecialBreathingImmunity
      - type: SpecialLowTempImmunity
      statusEffects:
      - StatusEffectPressureImmunityLing
  - type: ChangelingAction
    chemicalCost: 0
    useInLesserForm: true
    requireAbsorbed: 2

- type: entity
  parent: BaseChangelingAction
  id: ActionAdrenalineReserves
  name: Adrenaline Reserves
  description: Release powerful adrenaline from your glands. Costs 30 chemicals.
  components:
  - type: Action
    useDelay: 5
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - state: epinephrine_overdose
  - type: InstantAction
    event: !type:ActionAdrenalineReservesEvent
  - type: ChangelingAction
    chemicalCost: 30
    useInLesserForm: true
    useOnFire: true

- type: entity
  parent: BaseChangelingAction
  id: ActionFleshmend
  name: Fleshmend
  description: Rapidly heal yourself. Costs 35 chemicals.
  components:
  - type: Action
    useDelay: 15 #it lasts 10 seconds
    checkCanInteract: false
    checkConsciousness: false
    raiseOnAction: true
  - type: Sprite
    layers:
    - state: fleshmend
  - type: InstantAction
    event: !type:EffectInstantActionEvent
  - type: EffectAction
    effects:
    - !type:ModifyStatusEffect
      effectProto: StatusEffectFleshmend
      time: 10
    - !type:PopupMessage
      messages:
      - changeling-fleshmend
  - type: ChangelingAction
    chemicalCost: 35
    useInLesserForm: true

- type: entity
  parent: BaseChangelingAction
  id: ActionLastResort
  name: Last Resort
  description: Abandon your current body and escape in the form of a headslug. Costs 20 chemicals.
  components:
  - type: Action
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - state: last_resort
  - type: ConfirmableAction
    popup: changeling-lastresort-activate
  - type: InstantAction
    event: !type:ActionLastResortEvent
  - type: ChangelingAction
    chemicalCost: 20
    useInLesserForm: true
    useOnFire: true
    requireAbsorbed: 2

- type: entity
  parent: BaseChangelingAction
  id: ActionToggleLesserForm
  name: Lesser Form
  description: Abandon your current form and transform into a monkey. Costs 20 chemicals.
  components:
  - type: Action
    useDelay: 5
    checkCanInteract: false
  - type: Sprite
    layers:
    - state: lesser_form
  - type: InstantAction
    event: !type:ActionLesserFormEvent
  - type: ChangelingAction
    chemicalCost: 20

- type: entity
  parent: BaseChangelingAction
  id: ActionHivemindAccess
  name: Hivemind Access
  description: Tune your chemical receptors for hivemind communication.
  components:
  - type: Action
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - state: hivemind_access
  - type: InstantAction
    event: !type:ActionHivemindAccessEvent
  - type: ChangelingAction
    chemicalCost: 0
    useOnFire: true
    useInLesserForm: true

- type: entity
  parent: BaseChangelingAction
  id: ActionAbsorbBiomatter
  name: Absorb Biomatter
  description: Absorb a food item to regain some chemicals.
  components:
  - type: Sprite
    layers:
    - state: absorb_biomatter
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Edible
    blacklist:
      components:
      - Openable # most drinks use this and idc to write specific logic for edible type
    canTargetSelf: false
    event: !type:AbsorbBiomatterEvent
  - type: ChangelingAction
    chemicalCost: 0
    useInLesserForm: true
    useInLastResort: true
