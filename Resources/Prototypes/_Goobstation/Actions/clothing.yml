- type: entity
  parent: BaseAction
  id: ActionClothingSeal
  name: Seal clothing
  description: Seals your current clothing.
  categories: [ HideSpawnMenu ]
  components:
  - type: ConfirmableAction
    confirmDelay: 0
    primeTime: 2
  - type: Action
    checkCanInteract: true
    checkConsciousness: true
    itemIconStyle: NoItem
  - type: Sprite
    sprite: _Goobstation/Actions/modsuit.rsi
    layers:
    - state: activate
      map: [ "enum.ActionVisuals.Icon" ]
    - state: activate-ready
      visible: false
      map: [ "enum.ActionVisuals.IconToggled" ]
  - type: InstantAction
    event: !type:SealClothingEvent

- type: entity
  parent: BaseAction
  id: ActionActivateProjector
  name: Toggle Clone
  description: Generates or dissipates your connected gemini.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    checkCanInteract: false
    checkConsciousness: true
    itemIconStyle: NoItem
  - type: Sprite
    sprite: Mobs/Silicon/station_ai.rsi
    layers:
    - state: default
  - type: InstantAction
    event: !type:CloneProjectorActivatedEvent

- type: entity
  parent: BaseAction
  id: ActionHailer
  name: Hail
  description: Audibly hail nearby crew, useful for giving quick orders.
  components:
  - type: Action
  - type: Sprite
    sprite: Clothing/Mask/gassecurity.rsi
    layers:
    - state: icon
  - type: InstantAction
    event: !type:HailerActionEvent
