- type: entity
  parent: BaseAction
  id: ActionDevourLootbug
  name: "[color=red]Devour[/color]"
  description: Consume various materials to insides of your body.
  components:
  - type: Sprite
    sprite: Interface/Actions/devour.rsi
    layers:
    - state: icon
      map: [ "enum.ActionVisuals.Icon" ]
    - state: icon-on
      visible: false
      map: [ "enum.ActionVisuals.IconToggled" ]
  - type: Action
    itemIconStyle: BigAction
    priority: 1
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    event: !type:DevourActionEvent
    canTargetSelf: false
    whitelist:
      tags:
      - RodMetal
      - Ingot
      - Metal
      - Steel
      - Ore
      - Telecrystal
