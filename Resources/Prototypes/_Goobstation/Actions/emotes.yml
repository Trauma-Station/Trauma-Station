- type: emote
  id: Flip
  name: chat-emote-name-flip
  icon: _Goobstation/Interface/Emotes/flip.png
  chatMessages: ["chat-emote-msg-flip"]
  chatTriggers:
  - flip
  - flips
  - flips.
  - flips!
  - does a flip
  - does a flip.
  - does a flip!
  conditions:
  - !type:HasStatusEffectCondition
    effectProto: BlockVomitEmotesStatusEffect
    inverted: true
  effectsOnEmote:
  - !type:AccumulateCounterStatusEffect
    status: EmoteVomitCounterStatusEffect
    updateTime: 1
  - !type:IfElse
    condition: !type:CheckCounterStatusEffectCondition
      status: EmoteVomitCounterStatusEffect
      max: 5
    trueEffects:
    - !type:RaiseNetworkEvents
      events:
      - !type:AnimationFlipEmoteEvent
    falseEffects:
    - !type:ModifyStatusEffect
      effectProto: BlockVomitEmotesStatusEffect
      time: 10
    - !type:Vomit

