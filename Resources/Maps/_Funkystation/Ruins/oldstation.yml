    - type: Paper
      content: >-
        Artificial Program's report to surviving crewmembers.


        Crew were placed into cryostasis 10 March, 2474.


        Crew were awoken from cryostasis 01 January, 1970.


        SIGNIFICANT EVENTS OF NOTE

        1: The primary radiation detectors were taken offline after ERR years due to power failure, secondary radiation detectors showed no residual radiation on station. Deduction, primarily detector was malfunctioning and was producing a radiation signal when there was none.


        2: A data burst from a nearby Nanotrasen Space Station was received, this data burst contained research data that has been uploaded to our RnD labs.


        3: Unknown invasion force has occupied Theta station.


        4: Automatic IFF protection engaged due to unknown force. All stations present have been permanently masked to avoid further damages.


        5: Detected overflow error in timekeeping operation. Assume all dates other than 10 March, 2474 to be invalid.
