name: Close webedit PRs

on:
  pull_request_target:
    types: [ opened ]

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
    - name: Close webedits
      id: check
      uses: actions/github-script@v9
      with:
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const base = context.payload.pull_request.base.sha;
          const head = context.payload.pull_request.head.sha;
          const pr_number = context.payload.pull_request.number;

          const { data: comparison } = await github.rest.repos.compareCommits({
            owner,
            repo,
            base,
            head,
          });

          const commits = comparison.commits;

          if (commits.length === 0) {
            return;
          }

          let allWebEdit = true;

          for (const commit of commits) {
            const name = commit.commit.committer?.name;
            core.info(`commit ${commit.sha.substring(0, 7)} by "${name}"`);

            if (name !== "GitHub") {
              core.info("Not a webedit, skipping!");
              return;
            }
          }

          await github.rest.issues.createComment({
            owner: owner,
            repo: repo,
            issue_number: pr_number,
            body: "This PR has been automatically closed for being a webedit.\nUse a git client and read [Git for the SS14 Developer](https://docs.spacestation14.com/en/general-development/setup/git-for-the-ss14-developer.html) or ask for help."
          });

          await github.rest.pulls.update({
            owner: owner,
            repo: repo,
            pull_number: pr_number,
            state: "closed"
          });
